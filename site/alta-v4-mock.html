<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AL-TA v4.0 模擬試験</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* レイアウト: 試験問題冊子（左）＋マークシート型の解答状況（右）。結果は採点票の体裁。 */
:root{
  --paper:#ECEFF3; --sheet:#FFFFFF; --ink:#17202B; --muted:#5A6574; --line:#D2D9E1;
  --accent:#1D4F91; --accent-soft:#E1E9F5; --accent-ink:#FFFFFF;
  --flag:#A35F00; --flag-soft:#FAEED8;
  --good:#1F6F47; --good-soft:#DFF0E6; --bad:#B42318; --bad-soft:#FBE3E0;
  --f-display:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F141B; --sheet:#171E28; --ink:#E4E9EF; --muted:#98A4B3; --line:#2B3644;
    --accent:#86AEE6; --accent-soft:#1D2B3F; --accent-ink:#0F141B;
    --flag:#E2A94B; --flag-soft:#33281A;
    --good:#62C08F; --good-soft:#15291F; --bad:#F2857B; --bad-soft:#36191A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F141B; --sheet:#171E28; --ink:#E4E9EF; --muted:#98A4B3; --line:#2B3644;
  --accent:#86AEE6; --accent-soft:#1D2B3F; --accent-ink:#0F141B;
  --flag:#E2A94B; --flag-soft:#33281A;
  --good:#62C08F; --good-soft:#15291F; --bad:#F2857B; --bad-soft:#36191A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;line-height:1.4;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;min-height:56px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.brand b{font-family:var(--f-display);font-size:16px}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.04em}
.bar .spacer{flex:1}
.timer{display:flex;align-items:baseline;gap:8px;padding:4px 12px;border:1px solid var(--line);border-radius:var(--r)}
.timer small{font-size:11px;color:var(--muted);letter-spacing:.06em}
.timer .mono{font-size:20px;font-weight:600}
.timer.warn{border-color:var(--bad);color:var(--bad)}
.prog{font-size:13px;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--sheet);cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent}
.btn.flagged{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{border-color:var(--bad);color:var(--bad)}

/* start */
.start{padding-block:32px 56px;display:grid;gap:24px}
.cover{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:28px clamp(18px,4vw,40px);display:grid;gap:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.cover h1{font-size:clamp(24px,4vw,34px)}
.cover p{margin:0;max-width:65ch;color:var(--muted)}
.specs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.specs div{padding:14px 16px;border-right:1px solid var(--line);display:grid;gap:2px}
.specs div:last-child{border-right:0}
.specs dt{font-size:12px;color:var(--muted);letter-spacing:.06em}
.specs dd{margin:0;font-family:var(--f-mono);font-size:22px;font-weight:600}
.specs dd small{font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--muted);margin-left:4px}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px clamp(16px,3vw,28px);display:grid;gap:14px;align-content:start}
.panel h2{font-size:18px}
.tblwrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--accent-soft);font-weight:700;white-space:nowrap}
.tbl td.c,.tbl th.c{text-align:center}
.tbl .mono{font-size:13px}
.choice{display:grid;gap:10px}
.choice label{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.choice label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input{margin-top:6px;accent-color:var(--accent)}
.choice b{display:block}
.choice span{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:12.5px;color:var(--muted);margin:0}
.resume{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;border:1px dashed var(--accent);border-radius:var(--r);background:var(--accent-soft)}
.resume p{margin:0;flex:1;min-width:200px}

/* exam */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;padding-block:24px 56px;align-items:start}
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:24px clamp(16px,3.5vw,36px);display:grid;gap:18px;min-width:0}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qno{font-family:var(--f-display);font-size:22px;font-weight:700}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;font-size:12px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.pts{border-color:var(--accent);color:var(--accent);font-weight:700}
.chip.lo{font-family:var(--f-mono)}
.chip.flagc{border-color:var(--flag);color:var(--flag);background:var(--flag-soft)}
.stem{display:grid;gap:12px;min-width:0}
.stem p{margin:0}
.stem .box{border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;background:var(--paper)}
.stem .box p+p{margin-top:4px}
.stem ul,.stem ol{margin:0;padding-left:1.4em}
.ask{font-weight:700}
.pick2{display:inline-block;margin-left:6px;padding:0 6px;border:1px solid var(--ink);font-size:12px;border-radius:3px}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;background:var(--sheet);text-align:left;width:100%}
.opt:hover{border-color:var(--accent)}
.bubble{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .bubble{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .bubble{border-color:var(--good);color:var(--good)}
.opt.sel.right .bubble{background:var(--good);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bubble{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt[disabled]{cursor:default}
.opt .t{min-width:0}
.hint{font-size:13px;color:var(--flag);margin:0;min-height:1.4em}
.nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px}
.nav .row{gap:8px}
.explain{border-top:2px solid var(--ink);padding-top:16px;display:grid;gap:12px}
.verdict{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700}
.verdict.ok{color:var(--good)} .verdict.ng{color:var(--bad)}
.explain p{margin:0}
.why{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.why li{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px}
.why li b{font-family:var(--f-mono);color:var(--muted)}
.why li.ok b{color:var(--good)}

/* answer sheet */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.sheet h3{font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.sheet h3 span{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-weight:500}
.cells{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cell{position:relative;height:38px;border:1px solid var(--line);border-radius:4px;background:var(--sheet);font-family:var(--f-mono);font-size:13px;cursor:pointer;display:grid;place-items:center}
.cell.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.cell.flg::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.cell.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.cell.ng{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.legend i.a{background:var(--accent-soft);border-color:var(--accent)}
.legend i.f{background:var(--flag);border-color:var(--flag);border-radius:50%}
.sheet .btn{width:100%}

/* confirm */
.confirm{border:1px solid var(--bad);background:var(--bad-soft);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.confirm p{margin:0;font-size:14px}

/* result */
.result{padding-block:28px 64px;display:grid;gap:24px}
.scorecard{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:28px clamp(18px,4vw,40px);display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.score{display:grid;gap:4px;justify-items:start}
.score .big{font-family:var(--f-mono);font-size:clamp(44px,8vw,64px);font-weight:600;line-height:1}
.score .big small{font-size:.4em;color:var(--muted);font-weight:500}
.stamp{display:inline-block;padding:4px 14px;border:2px solid currentColor;border-radius:4px;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.2em;transform:rotate(-4deg);margin-top:8px}
.stamp.pass{color:var(--good)} .stamp.fail{color:var(--bad)}
.meter{display:grid;gap:8px}
.track{position:relative;height:14px;background:var(--paper);border:1px solid var(--line);border-radius:7px;overflow:visible}
.fill{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--accent)}
.cut{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.cutlbl{position:absolute;top:-26px;transform:translateX(-50%);font-size:11.5px;white-space:nowrap;color:var(--ink)}
.facts{display:flex;gap:8px 20px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.facts b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.bars{display:grid;gap:12px}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:4px 12px;align-items:center}
.barrow .lbl{font-size:13.5px;min-width:0}
.barrow .num{font-family:var(--f-mono);font-size:13px;text-align:right;grid-row:span 2}
.barrow .track{height:10px;grid-column:1}
.barrow .fill.low{background:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.review{display:grid;gap:10px}
.ritem{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
.ritem summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px}
.ritem summary::-webkit-details-marker{display:none}
.mk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px}
.mk.ok{background:var(--good-soft);color:var(--good)} .mk.ng{background:var(--bad-soft);color:var(--bad)}
.ritem .rno{font-family:var(--f-mono);font-weight:600}
.ritem .rtitle{font-size:13.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .rbody{padding:4px clamp(14px,3vw,28px) 22px;display:grid;gap:16px;border-top:1px solid var(--line);padding-top:18px}

@media (max-width:860px){
  .exam{grid-template-columns:minmax(0,1fr)}
  .sheet{position:static}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:620px){
  .specs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .specs div:nth-child(2){border-right:0}
  .specs div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .scorecard{grid-template-columns:minmax(0,1fr)}
  .ritem summary{grid-template-columns:auto auto minmax(0,1fr)}
  .ritem summary .chip{display:none}
  .timer .mono{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="bar">
  <div class="wrap">
    <div class="brand"><b>AL-TA v4.0 模擬試験</b><span>JSTQB Advanced Level テストアナリスト</span></div>
    <div class="spacer"></div>
    <div id="hdr" class="row"></div>
  </div>
</header>
<main id="main" class="wrap"></main>

<script>
const KEY = 'alta-v4-mock-1';
const CH = {
  1: '第1章 テストプロセスにおけるテストアナリストのタスク',
  2: '第2章 リスクベースドテストにおけるテストアナリストのタスク',
  3: '第3章 テスト分析とテスト設計',
  4: '第4章 品質特性のテスト',
  5: '第5章 ソフトウェア欠陥予防'
};
const L = ['a','b','c','d','e'];

/* ---------------- 問題データ（45問 / 78点） ---------------- */
const Q = [
/* ===== 第1章 ===== */
{lo:'TA-1.1.1',k:2,pts:1,
stem:`<p>あるプロジェクトでは、インクリメンタル開発モデルを採用し、フィーチャーを小さなインクリメントに分割して順次リリースしている。</p>
<p class="ask">このプロジェクトにおけるテストアナリスト（TA）の関与として、最も適切なものはどれか。</p>`,
opts:[
 'SDLCの初期フェーズではテスト計画の支援に集中し、全インクリメントのテストベースが揃ってからテスト分析をまとめて開始する。',
 'インクリメントは互いに独立して開発されるため、リグレッションテストは不要であり、新規フィーチャーのテストだけに集中する。',
 '各インクリメントで同じテスト活動を行いながら、新規・変更フィーチャーに焦点を当て、リグレッションのリスクの高まりに備えてリファクタリングとリグレッションテストスイートの組み立てに特に注意を払う。',
 'テスト設計とテスト実装は、すべてのインクリメントの開発が完了した後に、システム全体に対して一度だけ行う。'],
ans:[2],
exp:`インクリメンタル開発モデルでは、TAは各インクリメントに対して同じ活動（テスト分析・設計・実装・実行・テストマネジメント支援）を行い、新規または変更フィーチャーに焦点を置く。リグレッションのリスクが高まるため、リファクタリングとリグレッションテストスイートの組み立てに特に注意を払う（1.1.1項）。`,
why:['シーケンシャル開発モデルにおける関与の説明。','逆。インクリメントを重ねるほどリグレッションのリスクは高まる。','正解。','インクリメントごとに活動を行うのがインクリメンタル開発モデルの特徴。']},

{lo:'TA-1.2.1',k:2,pts:1,
stem:`<p class="ask">TAがテスト分析の一環として行うタスクとして、最も適切なものはどれか。</p>`,
opts:[
 'テストベースを評価して欠陥を識別し、テスト可能性を評定してプロダクトオーナーに早期にフィードバックする。また、スコープ内の各テストアイテムのテスト条件を定義し、優先順位を付ける。',
 'テストプロシジャーとテストスクリプトを、実行順序に影響する制約と依存関係を考慮してテストスイートにまとめる。',
 'スモークテストを設計・実行し、テスト環境が完全にセットアップされ、テスト実行の準備が整っていることを検証する。',
 '不合格となった自動テストを手動で再実行し、自動テストが偽陽性結果を出していないことを確認する。'],
ans:[0],
exp:`テスト分析では、TAはテストベースを評価して欠陥の識別とテスト可能性の評定を行い、プロダクトオーナーに早期にフィードバックする。さらにテスト条件を定義して優先順位を付け、テストベースへのトレーサビリティを持たせる（1.2.1項）。`,
why:['正解。','テスト実装のタスク（1.2.3項）。','テスト実装のタスク（1.2.3項）。','テスト実行におけるテスト結果評価のタスク（1.2.4項）。']},

{lo:'TA-1.2.4',k:2,pts:1,pick:2,
stem:`<p>夜間に実行した自動リグレッションテストで12件が不合格となった。</p>
<p class="ask">翌朝、TAがテスト実行の一環として行うテスト結果の評価タスクとして、シラバスに記述されているものはどれか。<span class="pick2">2つ選べ</span></p>`,
opts:[
 '不合格の原因となった自動テストスクリプトのコードを修正し、テスト自動化フレームワークを再設計する。',
 '不合格となった自動テストを手動で再実行し、自動テストが偽陽性結果を出していないことを確認する。',
 'テスト計画書の終了基準を改訂し、不合格件数の許容上限を引き上げる。',
 '不合格が特定の機能領域に集中していれば欠陥クラスターとして認識し、その部分により多くのテストが必要であることを示す。',
 'テスト環境要件の忠実度を再定義し、テスト環境の構成要素を用意する責任者を決める。'],
ans:[1,3],
exp:`テスト実行においてTAが行うテスト結果の評価には、欠陥クラスターの認識、不合格となった自動テストの手動再実行による偽陽性の確認、追加テストの提案、新たなリスクの識別、テスト設計・実装やリグレッションテストスイートの改善提案などがある（1.2.4項）。`,
why:['自動テストスクリプトの故障分析や修正は、開発担当者、TAE、TTAの仕事である場合が多い。','正解。','終了基準の定義・改訂はテストマネジメントの役割。','正解。','テスト環境要件の定義はテスト設計中のタスク（1.3.3項）であり、テスト結果の評価ではない。']},

{lo:'TA-1.3.1',k:2,pts:1,
stem:`<p class="ask">ハイレベルテストケースとローレベルテストケースに関する記述として、正しいものはどれか。</p>`,
opts:[
 'ハイレベルテストケースは、具体的な事前条件、入力データ、期待結果を含むため、誰が実行しても同じ結果を再現できる。',
 'ハイレベルテストケースからローレベルテストケースへの移行は、具体的な値を記入するだけの作業であり、テスト設計中に必ず完了させなければならない。',
 'ハイレベルテストケースは抽象的であるため、関連するすべてのテスト条件をカバーしていることを確認する用途には適さない。',
 '1つのハイレベルテストケースは1つ以上のローレベルテストケースで実装でき、テストケースをハイレベルのままにして、具体的な情報をテスト実行中にTAが決定することもある。'],
ans:[3],
exp:`ハイレベルテストケースは1つ以上のローレベルテストケースで実装できる。ハイレベルのままにしてテスト実行中に具体化することもある（例：セッションベースドテストのテストチャーター）（1.3.1項）。`,
why:['具体的な情報を含むのはローレベルテストケース。','移行は「概念的なものから技術的なものへのステップ」でもあり、特に具体的なテストデータが必要な場合はテスト実装へ先送りすることが多い。','逆。ハイレベルテストケースは、関連するすべてのテスト条件をカバーしていることの確認に適している。','正解。']},

{lo:'TA-1.3.2',k:2,pts:1,
stem:`<p>レビュー中のテストケースは次のとおりである。</p>
<div class="box"><p><b>TC-087　送金限度額のチェック</b></p><p>手順：会員でログインし、適切な金額を入力して［送金］を押す。</p><p>期待結果：必要に応じて、いくつかのエラーメッセージが表示される。</p></div>
<p class="ask">このテストケースが最も満たしていない品質基準はどれか。</p>`,
opts:['簡潔性','明確性','一貫性','必要性'],
ans:[1],
exp:`明確性：偽陰性・偽陽性を避けるため、テストケースの解釈は一つだけであるべきで、「適切な」「必要に応じて」「いくつかの」といった曖昧な表現は避ける（1.3.2項）。TC-087はまさにこれらの表現を含む。`,
why:['簡潔性はテストケースの粒度がテストベースやテスト条件と整合しているかの基準。','正解。','一貫性は言語・書式・構造をテストケース間でそろえることに関する基準。','タイトルで「送金限度額のチェック」という目的は示されており、必要性が主な問題ではない。']},

{lo:'TA-1.3.4',k:2,pts:1,
stem:`<p>ある保険会社は、20年以上稼働してきた保険料計算システムを新しいプラットフォームで再実装している。新システムは旧システムと同じ計算仕様を満たす必要があり、旧システムは移行完了まで並行稼働している。計算ロジックは複雑で、期待結果を人手で計算するのは高コストである。</p>
<p class="ask">このテストオラクル問題に対する解決策として、最も適切なものはどれか。</p>`,
opts:['人間オラクル','メタモルフィックテスト','疑似オラクル','プロパティベースのテスト'],
ans:[2],
exp:`疑似オラクルとは、テスト対象と同じ仕様を満たす、独自に開発されたシステムのこと（例：レガシーシステム、テスト対象の簡易版）（1.3.4項）。同じ仕様を満たす旧システムが利用できるため、最も適している。`,
why:['人間オラクルはコストがかかり、問題文の「人手で計算するのは高コスト」という状況に合わない。','有効な解決策の一つだが、同じ仕様を満たす旧システムがあるこの状況では疑似オラクルが最も直接的。','正解。','プロパティを定義して入出力の関係を検証する方法。同一仕様の既存システムを使う状況の説明ではない。']},

{lo:'TA-1.3.5',k:2,pts:1,
stem:`<p class="ask">テストデータ要件に関する記述として、正しいものはどれか。</p>`,
opts:[
 '合成データはばらつきをコントロールできるが、実世界のデータでのみ発生する特定の欠陥を見落とす可能性がある。',
 '匿名化データとは、個人情報を人工的な識別子に置き換えたデータである。',
 '本番データは実世界を反映し、ばらつきも十分に大きいため、外れ値の検証には常に本番データを使うべきである。',
 'テスト実行の手間を省くため、ローレベルテストケースにはテストデータを直接ハードコードすることが推奨される。'],
ans:[0],
exp:`本番データは実世界を反映するがばらつきに乏しい可能性がある。合成データはばらつきをコントロールできるが、実世界のデータでのみ発生する特定の欠陥を見落とす可能性がある（1.3.5項）。`,
why:['正解。','それは仮名化データ。匿名化データは個人を識別できる情報を削除したもの。','本番データはばらつきに乏しい可能性がある。','保守性の観点からハードコードは避け、テストロジックとテストデータを分離すべき。']},

{lo:'TA-1.3.6',k:3,pts:2,
stem:`<p>図書館システムの次のユーザーストーリーを分析している。</p>
<div class="box"><p>「会員として、貸出中の本を予約したい。そうすれば返却後に借りられる。」</p>
<p>AC1：貸出中の本を予約すると、予約番号が表示される。</p>
<p>AC2：予約数が上限（5冊）に達している会員は、新たに予約できない。</p></div>
<p class="ask">AC2を検証するキーワードテストケースを、ドメインレイヤーのキーワードで作成したい。最も適切なものはどれか。</p>`,
opts:[
 '1.［ログイン］ボタンをクリックする　2. テキストボックスに「B-123」を入力する　3.［予約］ボタンをクリックする　4. エラーダイアログを確認する',
 '1. 会員でログインする（会員ID=M-005）　2. 予約上限まで本を予約する（会員ID=M-005）　3. 本を予約する（書籍ID=B-123）　4. 予約拒否を確認する（理由=上限超過）',
 '1. 会員でログインする（会員ID=M-005）　2. 本を予約する（書籍ID=B-123）　3. 予約番号を確認する',
 '1. 予約上限テスト　2. 予約処理（B-123）　3. 結果'],
ans:[1],
exp:`ドメインレイヤーのキーワードはビジネス関連のアクションに対応し、アプリケーションドメインの用語を反映して、インターフェースの技術的詳細を抽象化する。キーワードは「動詞（＋名詞）」の命令形で、意味が一意であり、再利用可能であること。AC2には事前条件（上限まで予約済み）の設定と、検証キーワードによるアサーションが必要（1.3.6項）。`,
why:['UI操作を直接表すテストインターフェースレイヤーのキーワードであり、ドメインレイヤーではない。','正解。事前条件の設定、アクション、検証キーワードがそろっている。','AC1の検証であり、上限到達という事前条件も上限超過の検証もない。','動詞の命令形になっておらず意味が曖昧。検証キーワードも不明確。']},

/* ===== 第2章 ===== */
{lo:'TA-2.1.1',k:2,pts:1,
stem:`<p class="ask">プロダクトリスク分析におけるTAの貢献として、最も適切なものはどれか。</p>`,
opts:[
 'リスクベースドテストの方針を定め、どのリスクを受容するかを最終決定する。',
 'リスク識別は開発担当者とビジネス担当者が行い、TAはリスクアセスメントの結果を受け取ってテストケースに反映する。',
 'リスクレベルの見積もりでは技術的な発生可能性だけを評価し、金銭的・評判上の被害のようなビジネス上の影響は評価しない。',
 'リスクレベルがテスト対象に一様に分布していない場合は、テスト対象をテストアイテムに分解して個別にリスクを評価し、各リスクを軽減するテストレベル、テストタイプ、テスト技法、独立性レベル、徹底度を提案する。'],
ans:[3],
exp:`TAは、リスクレベルが一様でない場合にテスト対象をテストアイテム（コンポーネント、インターフェース、フィーチャーなど）に分解して個別に評価する。またプロダクトリスクアセスメントの一環として、各リスクを軽減する適切なテスト活動（テストレベル、テストタイプ、テスト技法、独立性、徹底度）を提案する（2.1節）。`,
why:['リスクベースドテストの方針を定めるのはテストマネージャー。','TAはふりかえり、リスクワークショップ、ブレーンストーミング、チェックリスト作成、インタビューなどでリスク識別にも貢献する。','TAは影響を受ける機能の使用頻度と深刻度、金銭的・環境的・評判上の被害なども見積もる。','正解。']},

{lo:'TA-2.2.1',k:4,pts:3,
stem:`<p>オンラインショップの自動リグレッションテストスイートを運用している。構成管理システムと連携したツールにより、各テストケースの実行中にアクティブになった構成アイテム（CI）が記録されている。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>テストケース</th><th>アクティブになったCI</th><th>前回の結果</th></tr></thead><tbody>
<tr><td class="mono">RT-01</td><td>ログイン、カート</td><td>合格</td></tr>
<tr><td class="mono">RT-02</td><td>カート、割引計算</td><td>合格</td></tr>
<tr><td class="mono">RT-03</td><td>決済、割引計算</td><td>合格</td></tr>
<tr><td class="mono">RT-04</td><td>商品検索</td><td>不合格（欠陥検出・修正済み）</td></tr>
<tr><td class="mono">RT-05</td><td>クーポン画面、カート</td><td>合格</td></tr>
<tr><td class="mono">RT-06</td><td>ログイン、決済</td><td>不合格（欠陥検出・修正済み）</td></tr>
</tbody></table></div>
<p>今回のリリースでは「割引計算」と「クーポン画面」のCIだけが変更された。テストサイクルが短いため、全件は実行できない。</p>
<p class="ask">シラバスで自動テストの選択に最も信頼できるとされる技法を適用した場合、選択するテストケースの集合はどれか。</p>`,
opts:['RT-02、RT-03、RT-05','RT-04、RT-06','RT-02、RT-05','RT-01、RT-02、RT-03、RT-05、RT-06'],
ans:[0],
exp:`自動テストを選択するための最も信頼できる技法は影響度分析である。ツールは各テストケースの実行中にアクティブになった構成アイテムを記録し、変更された構成アイテムと相互作用するリグレッションテストを選択する（2.2節）。「割引計算」はRT-02とRT-03で、「クーポン画面」はRT-05でアクティブになっている。`,
why:['正解。','前回欠陥を検出したテストを選ぶ履歴ベースドテストの考え方。今回の変更とは相互作用しない。','RT-03も「割引計算」と相互作用しているため漏れている。','RT-01とRT-06は変更されたCIと相互作用しておらず、範囲が過大。']},

{lo:'TA-2.2.1',k:4,pts:3,
stem:`<p>業務システムの全画面でUIフレームワークを刷新した（機能仕様の変更はない）。手動リグレッションテストスイートは900件あるが、割り当て期間は2日間で、実行できるのは約150件である。手動テストについては、テストケースと構成アイテムの対応は記録されていない。</p>
<p>今回のリグレッションテストの目的は、システム全体の機能を素早く概観し、主要な業務が引き続き機能することを確認することである。</p>
<p class="ask">リグレッションテストケースの選択技法として、最も適切なものはどれか。</p>`,
opts:[
 '影響度分析：変更された構成アイテムと相互作用するテストケースを選択する。',
 '履歴ベースドテスト：過去のテスト実行で欠陥を検出したテストケースを選択する。',
 '運用プロファイルに基づくテスト：テスト対象の使用パターンに基づき、頻繁に発生し重要な業務プロセスをカバーする使用パターンに優先順位を付けて選択する。',
 '要件トレーサビリティマトリクス：変更された要件に関連するテストケースと、その関連機能のテストケースを選択する。'],
ans:[2],
exp:`運用プロファイルに基づくテストでは、使用パターンに基づいてリグレッションテストケースを選択する。アプリケーションを大幅に変更する場合、システム全体の機能を素早く概観でき、テストが多くなりすぎる場合は頻繁に発生し重要な機能とビジネスプロセスをカバーする使用パターンに優先順位を付ける（2.2節）。`,
why:['変更は全画面に及ぶためほぼ全件が対象になり、絞り込めない。手動テストでは構成アイテムとの対応も記録されていない。','過去の欠陥検出実績は、全体の概観という目的に直結しない。','正解。','機能仕様（要件）は変更されていないため、この技法では選択の根拠が得られない。']},

/* ===== 第3章 ===== */
{lo:'TA-3.1.1',k:3,pts:2,
stem:`<p>アトラクションの利用可否は「<b>年齢 ≥ 12 AND 身長 &gt; 140</b>」で判定される（年齢は整数の歳、身長は整数のcm）。</p>
<p class="ask">この式で定義される「利用可」の同値パーティションに対し、簡易ドメインカバレッジを100%達成するテストデータ（年齢, 身長）の集合はどれか。</p>`,
opts:['(12, 150)、(11, 150)、(30, 140)、(30, 139)','(13, 150)、(11, 150)、(30, 141)、(30, 140)','(12, 150)、(11, 150)、(30, 141)、(30, 142)','(12, 150)、(11, 150)、(30, 141)、(30, 140)'],
ans:[3],
exp:`簡易ドメインカバレッジでは、＜、≤、＞、≥の各境界線にONポイント1つとOFFポイント1つが必要。閉じた境界線（年齢 ≥ 12）ではONポイントは境界線上の12、OFFポイントはパーティション外側で最も近い11。開いた境界線（身長 &gt; 140）ではONポイントはパーティション内側で最も近い141、OFFポイントは境界線上の140（3.1.1項）。`,
why:['開いた境界線で140をONポイントとして扱っている誤り。140はOFFポイント。','13は閉じた境界線上にないため、ONポイントではなくINポイント。','142はパーティション内側のINポイントであり、OFFポイントではない。','正解。']},

{lo:'TA-3.1.1',k:3,pts:2,
stem:`<p>ある同値パーティションが「<b>0 &lt; x AND x ≤ 100 AND y ≠ 5</b>」（x、yは整数）で定義されている。</p>
<p class="ask">信頼性の高いドメインカバレッジで必要なカバレッジアイテム数はいくつか。ただし、境界線ごとに独立して数え、異なる境界線の間でカバレッジアイテムを共有する最適化は行わないものとする。</p>`,
opts:['7','9','11','12'],
ans:[2],
exp:`信頼性の高いドメインカバレッジでは、＜、≤、＞、≥の境界線ごとにON・OFF・IN・OUTの4つ、≠の境界線ではOFFポイント1つと境界線の両側のONポイント2つが必要（3.1.1項）。0 &lt; x：4、x ≤ 100：4、y ≠ 5：3 で、合計11。`,
why:['簡易ドメインカバレッジの数（2＋2＋3）。','≠の境界線を誤って数えている。','正解。','≠の境界線にも4つ必要と誤解した数。']},

{lo:'TA-3.1.2',k:3,pts:2,
stem:`<p>Webアプリケーションの互換性確認のため、次のパラメーターにベースチョイスカバレッジを適用する（［ ］がベース値）。</p>
<div class="box"><p>OS：［Windows］、macOS、Linux</p><p>ブラウザー：［Chrome］、Firefox、Edge、Safari</p><p>表示言語：［日本語］、英語</p></div>
<p class="ask">パラメーター間の制約は考慮しないものとする。ベースチョイスカバレッジを100%達成するのに必要なカバレッジアイテムの数はいくつか。</p>`,
opts:['6','7','12','24'],
ans:[1],
exp:`ベースチョイスカバレッジでは、各パラメーターのベース値を組み合わせたベースカバレッジアイテム1つに加え、各パラメーターについてベース値をベース以外の各値で置き換えたアイテムを作る（3.1.2項）。1＋(3−1)＋(4−1)＋(2−1)＝7。`,
why:['ベースカバレッジアイテム自体を数え忘れている。','正解。','OS×ブラウザーの組み合わせ数であり、ベースチョイスの考え方ではない。','全組み合わせ（3×4×2）の数。']},

{lo:'TA-3.1.2',k:3,pts:2,
stem:`<p>決済画面のテストで、3つのパラメーターに対して次の4件のテストケースを設計した。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th></th><th>決済方法</th><th>配送</th><th>会員種別</th></tr></thead><tbody>
<tr><td class="mono">T1</td><td>カード</td><td>通常</td><td>一般</td></tr>
<tr><td class="mono">T2</td><td>カード</td><td>速達</td><td>プレミアム</td></tr>
<tr><td class="mono">T3</td><td>コンビニ</td><td>通常</td><td>プレミアム</td></tr>
<tr><td class="mono">T4</td><td>コンビニ</td><td>速達</td><td>プレミアム</td></tr>
</tbody></table></div>
<p class="ask">T1〜T3は変更せず、T4だけを変更してペアワイズカバレッジ100%を達成したい。T4をどう変更すべきか。</p>`,
opts:['コンビニ／速達／一般','コンビニ／通常／一般','カード／速達／一般','変更は不要（すでにペアワイズカバレッジ100%を達成している）'],
ans:[0],
exp:`現状では（コンビニ, 一般）と（速達, 一般）のペアがカバーされていない。T4を「コンビニ／速達／一般」にすると、この2つのペアをカバーし、T4だけがカバーしていた（コンビニ, 速達）も維持できる。（コンビニ, プレミアム）はT3、（速達, プレミアム）はT2でカバー済み（3.1.2項）。`,
why:['正解。','（コンビニ, 速達）が失われ、（速達, 一般）もカバーされない。','（コンビニ, 速達）が失われ、（コンビニ, 一般）もカバーされない。','（コンビニ, 一般）と（速達, 一般）が未カバー。']},

{lo:'TA-3.1.3',k:2,pts:1,
stem:`<p class="ask">ランダムテストに関する記述として、正しいものはどれか。</p>`,
opts:[
 'ランダムテストには広く合意されたカバレッジ基準があるため、終了基準はカバレッジに基づいて定義すべきである。',
 '妥当性確認が目的の場合は運用プロファイルに基づく確率分布が推奨され、検証が目的の場合はバイアスを避けるため利用状況に依存しない分布が推奨される。',
 'ガイドなしランダムテストでは、これまでに選択した値に基づいて、確率分布を時間とともに調整する。',
 'ランダムテストはデータのセマンティクスを重視するため、データの意味に関わる欠陥の検出に特に優れている。'],
ans:[1],
exp:`妥当性確認の目的では運用プロファイルに基づく分布が推奨され、検証の目的ではバイアスを避けるため利用状況に依存しない分布であるべき（3.1.3項）。`,
why:['広く合意されたカバレッジ基準はなく、終了基準はテスト数やテスト時間などに基づくしかない。','正解。','それはガイドありランダムテスト（適応的ランダムテストなど）。ガイドなしでは分布は一定のまま。','逆。データセマンティクスの軽視と、データの意味に関わる欠陥の見逃しは制限として挙げられている。']},

{lo:'TA-3.2.1',k:2,pts:1,
stem:`<p>次のCRUDマトリクスが作成された。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>機能 ＼ エンティティ</th><th class="c">顧客</th><th class="c">注文</th></tr></thead><tbody>
<tr><td>顧客登録</td><td class="c mono">C</td><td class="c"></td></tr>
<tr><td>顧客情報変更</td><td class="c mono">R U</td><td class="c"></td></tr>
<tr><td>注文受付</td><td class="c mono">R</td><td class="c mono">C</td></tr>
<tr><td>注文照会</td><td class="c"></td><td class="c mono">R</td></tr>
<tr><td>注文変更</td><td class="c"></td><td class="c mono">R U</td></tr>
<tr><td>顧客退会</td><td class="c mono">D</td><td class="c"></td></tr>
</tbody></table></div>
<p class="ask">このマトリクスに基づくCRUDテストの説明として、正しいものはどれか。</p>`,
opts:[
 '一貫性テストは静的テストであり、各エンティティについてC・R・U・Dのすべての操作がマトリクス上に存在するかを確認する。',
 'CRUDカバレッジは、実行した機能の数をマトリクス上の機能の総数で割って測定する。この例では機能が6つなので、全機能を1回ずつ実行すれば100%となる。',
 '読み込み操作はC・U・D操作に暗黙的に含まれるため、CRUDテストではRを独立したカバレッジアイテムとして扱わない。',
 '完全性テストにより、「注文」エンティティに対するD（削除）操作が存在しないことが識別される。これは調査が必要な不正である。'],
ans:[3],
exp:`完全性テストは静的テストであり、すべての操作がすべてのエンティティに対して発生するかを検証する。ある操作が存在しないことは調査が必要な不正である。一貫性テストは動的テスト。CRUDカバレッジは実行した操作の数を、マトリクスの操作の総数（この例では9）で割って測定する（3.2.1項）。`,
why:['説明しているのは完全性テスト（静的）。一貫性テストは機能を統合してエンティティの一貫した使用を確認する動的テスト。','分母は機能数ではなく操作数（この例では9）。','逆。C・U・D操作に暗黙的にリンクされていることが多いR操作には特に注意を払うべき。','正解。']},

{lo:'TA-3.2.2',k:3,pts:2,
stem:`<p>ホテル予約システムの状態遷移を次の表に示す。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>遷移</th><th>遷移元</th><th>イベント</th><th>遷移先</th></tr></thead><tbody>
<tr><td class="mono">t1</td><td>仮予約</td><td>確定</td><td>確定済</td></tr>
<tr><td class="mono">t2</td><td>仮予約</td><td>期限切れ</td><td>取消</td></tr>
<tr><td class="mono">t3</td><td>確定済</td><td>変更</td><td>仮予約</td></tr>
<tr><td class="mono">t4</td><td>確定済</td><td>キャンセル</td><td>取消</td></tr>
<tr><td class="mono">t5</td><td>確定済</td><td>チェックイン</td><td>利用済</td></tr>
<tr><td class="mono">t6</td><td>確定済</td><td>確認メール再送</td><td>確定済</td></tr>
</tbody></table></div>
<p class="ask">1スイッチカバレッジを100%達成するのに必要なカバレッジアイテム（有効な1スイッチ）の数はいくつか。</p>`,
opts:['6','8','10','12'],
ans:[2],
exp:`1スイッチは、1つの状態における入出遷移のペア（2つの連続する有効な遷移）。状態ごとに「入る遷移数 × 出る遷移数」を合計する。仮予約：入1（t3）× 出2（t1, t2）＝2。確定済：入2（t1, t6）× 出4（t3, t4, t5, t6）＝8。取消・利用済は出る遷移がないため0。合計10（3.2.2項）。`,
why:['0スイッチ（有効遷移）カバレッジの数。','自己遷移t6を「確定済に入る遷移」に含め忘れた数。','正解。','誤り。']},

{lo:'TA-3.2.2',k:3,pts:2,
stem:`<p>文書管理システムの状態遷移は次のとおりである。</p>
<div class="box"><p>下書き →（提出）→ レビュー中</p><p>レビュー中 →（差戻し）→ 下書き</p><p>レビュー中 →（承認）→ 承認済</p><p>承認済 →（公開）→ 公開中</p><p>承認済 →（取り下げ）→ 下書き</p><p>公開中 →（改訂）→ 下書き</p></div>
<p class="ask">ラウンドトリップカバレッジを100%達成するテストの集合はどれか。</p>`,
opts:[
 '下書き→レビュー中→承認済→公開中→下書き',
 '下書き→レビュー中→下書き ／ 下書き→レビュー中→承認済→下書き ／ 下書き→レビュー中→承認済→公開中→下書き',
 '下書き→レビュー中→下書き ／ 下書き→レビュー中→承認済→公開中→下書き',
 '下書き→レビュー中→承認済→下書き ／ レビュー中→承認済→公開中→下書き→レビュー中'],
ans:[1],
exp:`ラウンドトリップとは、開始状態と終了状態が同じで、ループ内の他の状態が2回発生しないループ。このモデルには「下書き→レビュー中→下書き」「下書き→レビュー中→承認済→下書き」「下書き→レビュー中→承認済→公開中→下書き」の3つのラウンドトリップがある（3.2.2項）。`,
why:['3つのうち1つしかカバーしていない。','正解。','「下書き→レビュー中→承認済→下書き」が漏れている。','2つ目は最長ループの起点を変えただけで、「下書き→レビュー中→下書き」が漏れている。']},

{lo:'TA-3.2.3',k:3,pts:2,
stem:`<p>ユースケース「ネットスーパーで注文する」は次のとおりである。</p>
<div class="box">
<p><b>メインシナリオ</b>：1. 会員は商品をカートに入れる　2. 配送日時を選択する　3. 支払方法を選択する　4. 注文を確定する　5. システムは確認メールを送信する</p>
<p><b>拡張</b>：2a. 希望日時が満枠の場合、システムは空き日時を提示し、会員は別の日時を選択する（ステップ3へ）。　3a. ポイントで全額を支払う場合、カード情報の入力を省略する（ステップ4へ）。</p>
<p><b>例外</b>：3b. カード認証に3回失敗した場合、システムは注文を中止する。　4a. 確定時に在庫切れの場合、システムは注文を受け付けない。</p></div>
<p>これまでに、TC1（メインシナリオ）、TC2（拡張2a）、TC3（例外3b）を実行した。</p>
<p class="ask">シナリオベースのカバレッジはいくつか。</p>`,
opts:['40%','60%','75%','100%'],
ans:[1],
exp:`シナリオベースのカバレッジは、実行したシナリオ数を識別した全シナリオ数で割って測定する（3.2.3項）。識別したシナリオはメイン1、拡張2（2a, 3a）、例外2（3b, 4a）の計5。実行済みは3なので 3 ÷ 5 ＝ 60%。`,
why:['誤り。','正解。','シナリオを1つ数え漏らした値（3/4）。','メイン・拡張・例外の各タイプを1つずつ実行しただけで、すべてのシナリオはカバーしていない。']},

{lo:'TA-3.2.3',k:3,pts:2,
stem:`<p>注文のアクティビティ図に「商品をカートに追加する」ループがある。会員は0〜10回まで商品を追加でき、0回の場合は「お気に入りから注文」のフローに進む。</p>
<p class="ask">このループにシンプルループカバレッジを適用する場合、テストするループの反復回数の集合として最も適切なものはどれか。</p>`,
opts:['1回、5回、10回','0回、5回、10回','0回、1回、2回','0回、1回、5回、10回'],
ans:[3],
exp:`シンプルループカバレッジでは、各ループを0回（スキップ）、ちょうど1回、2回以上（典型的な反復回数）、および可能であれば最大反復回数で実行するテストが必要（3.2.3項）。`,
why:['0回（スキップ）が漏れている。','ちょうど1回が漏れている。','最大反復回数（10回）が漏れている。','正解。']},

{lo:'TA-3.3.1',k:3,pts:2,
stem:`<p>ECサイトには次のビジネスルールがある。</p>
<div class="box"><p>・会員である、または購入金額が5,000円以上であれば送料無料</p><p>・会員がクーポンを使用した場合は10%割引（非会員のクーポンは無効）</p></div>
<div class="tblwrap"><table class="tbl"><thead><tr><th></th><th class="c">R1</th><th class="c">R2</th><th class="c">R3</th><th class="c">R4</th><th class="c">R5</th><th class="c">R6</th><th class="c">R7</th><th class="c">R8</th></tr></thead><tbody>
<tr><th>C1 会員</th><td class="c">Y</td><td class="c">Y</td><td class="c">Y</td><td class="c">Y</td><td class="c">N</td><td class="c">N</td><td class="c">N</td><td class="c">N</td></tr>
<tr><th>C2 5,000円以上</th><td class="c">Y</td><td class="c">Y</td><td class="c">N</td><td class="c">N</td><td class="c">Y</td><td class="c">Y</td><td class="c">N</td><td class="c">N</td></tr>
<tr><th>C3 クーポン使用</th><td class="c">Y</td><td class="c">N</td><td class="c">Y</td><td class="c">N</td><td class="c">Y</td><td class="c">N</td><td class="c">Y</td><td class="c">N</td></tr>
<tr><th>A1 送料無料</th><td class="c">X</td><td class="c">X</td><td class="c">X</td><td class="c">X</td><td class="c">X</td><td class="c">X</td><td class="c">−</td><td class="c">−</td></tr>
<tr><th>A2 10%割引</th><td class="c">X</td><td class="c">−</td><td class="c">X</td><td class="c">−</td><td class="c">−</td><td class="c">−</td><td class="c">−</td><td class="c">−</td></tr>
</tbody></table></div>
<p class="ask">don't care演算子「-」を使ってルールをマージし、このデシジョンテーブルを最小化した。最小化したデシジョンテーブルのルール数はいくつか。</p>`,
opts:['3','4','5','6'],
ans:[1],
exp:`アクションが等価で、1つの条件だけが異なり、その条件の取りうる値をすべてカバーするルールをマージする（3.3.1項）。R1+R3 →（Y, -, Y）、R2+R4 →（Y, -, N）、R5+R6 →（N, Y, -）、R7+R8 →（N, N, -）の4ルールになる。「送料無料のみ」のR2・R4・R5・R6は1ルールにまとめるとR7・R8まで含んでしまうため、これ以上は減らせない。`,
why:['「送料無料のみ」のグループを1ルールにまとめることはできない。','正解。','マージ可能なルールが残っている。','マージ可能なルールが残っている。']},

{lo:'TA-3.3.1',k:3,pts:2,
stem:`<p>条件C1（値A／B／C）、C2（Y／N）、C3（Y／N）を持つ完全なデシジョンテーブル（12ルール）を、担当者が次のように最小化した（アクション部は省略）。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th></th><th class="c">R1</th><th class="c">R2</th><th class="c">R3</th><th class="c">R4</th><th class="c">R5</th></tr></thead><tbody>
<tr><th>C1</th><td class="c">A</td><td class="c">B</td><td class="c">B</td><td class="c">C</td><td class="c">-</td></tr>
<tr><th>C2</th><td class="c">-</td><td class="c">Y</td><td class="c">N</td><td class="c">-</td><td class="c">N</td></tr>
<tr><th>C3</th><td class="c">-</td><td class="c">-</td><td class="c">Y</td><td class="c">Y</td><td class="c">N</td></tr>
</tbody></table></div>
<p class="ask">チェックサムプロシジャーを適用した結果と、この表に関する記述として正しいものはどれか。</p>`,
opts:[
 'チェックサムは12で元の表と等しいため、最小化した表は元の表と等価である。',
 'チェックサムは11で元の表より小さいため、最小化した表は不完全である。',
 'チェックサムは12で元の表と等しいが、条件値の組み合わせ（A, N, N）には2つのルールが重複して適用され、（C, Y, N）にはどのルールも適用されない。',
 'チェックサムは13で元の表より大きいため、ルールの重複がある。'],
ans:[2],
exp:`各ルールのスコアは「-」ごとにその条件の値の数を掛けて求める。R1：2×2＝4、R2：2、R3：1、R4：2、R5：3（C1は3値）で合計12。元の表と等しいが、チェックサムが等しいだけでは等価性は保証されない（3.3.1項）。実際、（A, N, N）はR1とR5に重複し、（C, Y, N）はどのルールにも該当しないギャップである。`,
why:['チェックサムが等しいことは等価性を保証しない。','チェックサムの計算誤り（R5のスコアを2としている）。','正解。','チェックサムの計算誤り。']},

{lo:'TA-3.3.2',k:3,pts:2,
stem:`<p>ECサイトの商品検索機能にメタモルフィックテストを適用する。ソーステストケースは「キーワード『ノートPC』で検索し、結果としてN件の商品リストを得る」である。</p>
<p class="ask">メタモルフィック関係に基づくフォローアップテストケースと、その合格基準として最も適切なものはどれか。</p>`,
opts:[
 '『ノートPC』に絞り込み条件「価格 ≤ 100,000円」を追加して検索する。結果の各商品がソーステストケースの結果に含まれ、件数がN件以下であれば合格とする。',
 '『ノートPC』に絞り込み条件「価格 ≤ 100,000円」を追加して検索する。件数がN件より厳密に少なければ合格とする。',
 '『デスクトップPC』で検索する。結果にソーステストケースの商品が1件も含まれなければ合格とする。',
 '『ノートPC』で検索し、件数が仕様書に記載された期待件数と一致すれば合格とする。'],
ans:[0],
exp:`メタモルフィック関係（MR）は、入力の変更が期待結果にどう反映されるかを記述する。絞り込み条件の追加は「結果がソースの部分集合になる」というMRを満たすはずで、ソースとフォローアップを合わせて評価する（3.3.2項）。`,
why:['正解。','全商品が10万円以下なら件数は同じになりうるため、「厳密に少ない」は正しいMRではない。','両方のキーワードに該当する商品もありうるため、成り立つ関係ではない。','仕様書の期待値と比較する通常のテストオラクルであり、MRに基づいていない。']},

{lo:'TA-3.3.2',k:3,pts:2,
stem:`<p>AIを用いた中古マンション価格推定システムのテストでは、個々の物件の「正しい」推定価格がわからず、テストオラクル問題がある。</p>
<p class="ask">メタモルフィックテストの適用として、最も適切なものはどれか。</p>`,
opts:[
 '物件Xの推定価格を不動産鑑定士の評価額と比較し、±5%以内であれば合格とする。',
 'ランダムに生成した物件データを大量に入力し、システムがエラーなく推定価格を返すことを確認する。',
 '物件Xの推定価格をソーステストケースとし、他の属性は同一のまま築年数だけを増やした物件をフォローアップテストケースとする。両者を合わせて評価し、フォローアップの推定価格がソース以下であれば合格とする。',
 'ソーステストケースとフォローアップテストケースのそれぞれに期待結果を個別に定め、両方が期待結果と一致した場合に合格とする。'],
ans:[2],
exp:`MTはテストオラクル問題がある場合にも使える。期待結果を個別に評価できないため、ソーステストケースとフォローアップテストケースを合同で評価し、MRを満たせば合格とする。シラバスの例では「喫煙本数が増えれば予測死亡年齢が下がる」というMRが示されている（3.3.2項）。`,
why:['人間（専門家）の判断を使う方法であり、MTではない。','MRを用いないランダムテストによるロバスト性の確認。','正解。','オラクル問題がある状況では個別の期待結果は得られず、MTでは合同で評価する。']},

{lo:'TA-3.4.1',k:3,pts:2,
stem:`<p>サブスクリプション型ECサイトに「定期購入のスキップ」機能が追加された。過去のリリースでは、月末やうるう年をまたぐ請求日の計算で欠陥が繰り返し見つかっている。</p>
<p class="ask">セッションベースドテストのテストチャーターのミッションとして、最も適切なものはどれか。</p>`,
opts:[
 '定期購入機能のテストケースTC-101〜TC-180をすべて実行し、合格であることを確認する。',
 'システム全体を探索する／任意の方法を用いて／問題を発見するために',
 'スキップ機能を探索する／同値分割法と境界値分析を必ず用いて／すべての欠陥を発見するために',
 '定期購入のスキップ機能を探索する／月末・うるう年をまたぐ契約データと日付変更ツールを用いて／次回請求日の計算誤りを発見するために'],
ans:[3],
exp:`ミッションの軽量フォーマットは「[target]を探索する／[resources]を用いて／[information]を発見するために」。target＝何を探索するか、resources＝使うもの（テストデータ、ツールなど）、information＝発見したい情報の種類（3.4.1項）。`,
why:['テストチャーターは各セッションで実行するテストスイートを指定するものではない。','対象も使うものも発見したい情報も具体性がなく、既知のリスクに焦点が当たっていない。','技法を必須にするとTAの柔軟性を制約する。「すべての欠陥」も現実的な情報の種類ではない。','正解。']},

{lo:'TA-3.4.1',k:3,pts:2,pick:2,
stem:`<p>決済機能のテストセッションのテストチャーターを作成している。TAは次の情報を得た。</p>
<div class="box"><p>・前回のリリースでは、外部決済ゲートウェイとの間で、タイムアウト時の相互運用性の欠陥が見つかった。</p><p>・ビジネス上、同一注文に対して二重に課金することは絶対に許されない。</p></div>
<p class="ask">これらの情報をテストチャーターの追加情報として記載する方法として、最も適切なものはどれか。<span class="pick2">2つ選べ</span></p>`,
opts:[
 '履歴情報として、前回リリースで見つかった決済ゲートウェイとの相互運用性の欠陥を記載する。',
 'テストスコープとして、各セッションで実行するテストスイートの一覧を記載する。',
 '開始基準として、二重課金が発生しないことを記載する。',
 '制限として、同一注文に対して二重に課金してはならないことを記載する。',
 'テスト目的として、セッションで発見すべき欠陥の件数目標を記載する。'],
ans:[0,3],
exp:`テストチャーターの追加情報には、履歴情報（過去に発見された欠陥事項など）や、制限（プロダクトが絶対にやってはならないこと）が含まれる。制限を記載すると偽陽性結果を報告する可能性を低くできる（3.4.1項）。`,
why:['正解。','テストチャーターはテストスイートを指定しない。','開始基準はテストセッションを開始するために満たすべき事前条件であり、「プロダクトが絶対にやってはならないこと」ではない。','正解。','欠陥件数の目標はテストチャーターの追加情報として挙げられていない。']},

{lo:'TA-3.4.2',k:3,pts:2,
stem:`<p class="ask">会員登録フォームの経験ベースのテストを支援するチェックリストを準備している。チェックリスト項目として最も適切なものはどれか。</p>`,
opts:[
 '必須項目を未入力のまま［登録］を押したとき、該当する項目の近くにエラーメッセージが表示されるか。',
 '入力フォームは使いやすいか。',
 'フォームの仕様をすべて理解したうえで、すべての入力値の組み合わせをテストすること。',
 'パスワード欄の確認手順：①7文字を入力する　②［登録］を押す　③表示されたメッセージを記録する　④8文字を入力する……（以下、全手順を記述）'],
ans:[0],
exp:`チェックリスト項目は明確・具体的で曖昧さがなく、実行可能かつ測定可能で、「はい」「いいえ」「該当しない」で答えられる質問として作成する。チェックリストは包括的なハウツーガイドではなく、専門家のための迅速でシンプルなツールである（3.4.2項）。`,
why:['正解。','曖昧で測定できない。','質問形式でなく、実行可能でもない。','ハウツーガイドになっている。']},

{lo:'TA-3.4.2',k:3,pts:2,
stem:`<p>新しい商品検索機能の探索的テストを支援するチェックリストを準備することになった。チームには過去のリリースの欠陥データがある。</p>
<p class="ask">チェックリストを準備する進め方として、最も適切なものはどれか。</p>`,
opts:[
 '業界標準のチェックリストを入手してそのまま採用し、テストの一貫性を保つためにプロジェクト終了まで変更しない。',
 '欠陥ライブラリから項目を集め、テスト担当者が迷わないよう各項目を詳細な操作手順として記述し、包括的なハウツーガイドに仕上げる。',
 'まず範囲・目的・形式を決める。次に専門家への聞き取りや欠陥ライブラリ、過去の欠陥、リスクの分析から項目を集めて「はい／いいえ／該当しない」で答えられる質問にし、重要度やリスクレベルに基づいて優先度を付ける。最後に機能エリアなどで論理的にグループ化し、テストサイクルごとに教訓を反映して更新する。',
 '項目は自由記述で回答する形式とし、すべての項目を同じ優先度で扱う。'],
ans:[2],
exp:`シラバスのガイドライン：①範囲・目的・形式を決定する、②情報を収集して項目を定義し（質問形式）優先度を割り当てる、③論理的なグループに分類して構造化する。チェックリストは決して最終的なものではなく、継続的にレビューして洗練させる（3.4.2項）。`,
why:['テンプレートの利用は推奨されるが、テストアイテムに関連している場合に限る。また継続的な更新が必要。','ハウツーガイドではない。','正解。','項目は「はい／いいえ／該当しない」で答えられる質問にし、重要度・影響・リスクに基づいて優先度を付ける。']},

{lo:'TA-3.4.3',k:2,pts:1,
stem:`<p class="ask">クラウドテストの「制限」の例として、最も適切なものはどれか。</p>`,
opts:[
 'テスト担当者が、さまざまな地理的場所で、さまざまなデバイス、ブラウザー、ネットワーク条件を使用できる。',
 '多数の発見事項に重複や偽陽性が含まれ、それらをマネジメントしながら網羅的なテスト文書を確保することが難しい。',
 '短時間に多数のテストを実施する必要がある場合でも、容易にスケールできる。',
 'テスト担当者が実際のユーザーである場合があり、ユーザーエクスペリエンスや使用性に関する洞察が得られる。'],
ans:[1],
exp:`クラウドテストの制限には、テスト品質の不安定性、コミュニケーションの課題、セキュリティ、文書化と報告（重複や偽陽性を含む多数の発見事項のマネジメント）がある（3.4.3項）。`,
why:['利点（多様なテスト環境）。','正解。','利点（高い柔軟性）。','利点（実際のユーザー視点）。']},

{lo:'TA-3.5.1',k:4,pts:3,
stem:`<p>自動車保険の保険料見積もりWebサービスについて、次の2つのプロダクトリスクが識別された。</p>
<div class="box"><p><b>R1（高）</b>：年齢区分、運転歴、車種クラス、等級の組み合わせで割増・割引ルールが複雑に絡み合っており、ビジネスルールのロジックに誤りがあると誤った保険料が提示される。</p>
<p><b>R2（中）</b>：対応ブラウザー（4種）、OS（3種）、画面サイズ（3種）の組み合わせによって、見積もり画面のレイアウト崩れや入力不能が発生する。</p></div>
<p class="ask">各リスクを軽減するテスト技法の組み合わせとして、最も適切なものはどれか。</p>`,
opts:[
 'R1：ランダムテスト（ガイドなし）　R2：状態遷移テスト（0スイッチカバレッジ）',
 'R1：ドメインテスト（簡易ドメインカバレッジ）　R2：シナリオベースドテスト',
 'R1：状態遷移テスト（2スイッチカバレッジ）　R2：デシジョンテーブルテスト',
 'R1：デシジョンテーブルテスト（高リスクのため最小化を控え、完全なデシジョンテーブルの実行可能な列でカバレッジを測定）　R2：組み合わせテスト（ペアワイズカバレッジ）'],
ans:[3],
exp:`ルールに基づくテスト技法はロジックの欠陥の検出に向き、与信のようなビジネスルールにはデシジョンテーブルテストが適する。リスクが高い場合は最小化を控え、完全なデシジョンテーブルの実行可能な列でカバレッジを測定すべき（3.3.1項）。環境パラメーターの組み合わせには組み合わせテストが適する（3.1.2項、4.3節）（3.5.1項）。`,
why:['ランダムテストはデータセマンティクスを軽視し、複雑なルールの論理検証には不向き。R2は状態に依存する振る舞いではない。','R1の主な懸念は数値境界ではなくルールの組み合わせのロジック。R2はワークフローではなく環境の組み合わせ。','R1は状態に依存しないルールであり、状態遷移テストは不適切。','正解。']},

{lo:'TA-3.5.1',k:4,pts:3,
stem:`<p>イテレーティブ開発で健康管理アプリを開発している。次の2つのフィーチャーのテスト技法を選択する。</p>
<div class="box"><p><b>F1</b>：料理の写真からカロリーを推定するAI機能。推定値の「正解」はテストベースから導出できない。リスクは中。</p>
<p><b>F2</b>：管理者向けのお知らせ編集画面。リスクは低く、仕様書は簡素で、イテレーションのスケジュールは厳しい。</p></div>
<p class="ask">最も適切な組み合わせはどれか。</p>`,
opts:[
 'F1：メタモルフィックテスト（例：同じ料理を2人前に増やした写真では推定値が増える）　F2：チェックリストを活用した経験ベースのテスト',
 'F1：デシジョンテーブルテスト（完全なデシジョンテーブル）　F2：状態遷移テスト（2スイッチカバレッジ）',
 'F1：ドメインテスト（信頼性の高いドメインカバレッジ）　F2：組み合わせテスト（全組み合わせ）',
 'F1：経験ベースのテストのみ　F2：メタモルフィックテスト'],
ans:[0],
exp:`テストベースからテストオラクルを導出することが不可能または困難な場合は、メタモルフィックテストや経験ベースのテスト技法を適用できる。経験ベースのテストは、リスクレベルが低い場合、カバレッジの定義が難しい場合、スケジュールがタイトな場合に使用できる。イテレーティブ開発は軽量な技法に適している（3.5.1項）。`,
why:['正解。','F1は期待結果が導出できないため、ルールの期待アクションを定められない。F2に2スイッチは過剰（2スイッチ以上での100%は高リスクの場合に限って適切）。','F1は期待結果がないため境界の合否を判定できない。F2に全組み合わせは低リスク・短納期に見合わない。','F1に経験ベースも選択肢になりうるが、F2はオラクル問題もなく低リスク・短納期であり、MTを選ぶ理由がない。']},

{lo:'TA-3.5.2',k:2,pts:1,
stem:`<p class="ask">テスト設計を自動化する（テストモデルからテストウェアを自動生成する）際の「リスク」として、シラバスに挙げられているものはどれか。</p>`,
opts:[
 'テストモデルが唯一の情報源になるため、保守対象がテストモデルだけになる。',
 'Nスイッチカバレッジや組み合わせテストのような複雑なカバレッジ基準を適用できるようになる。',
 'テストモデルに示されていないテスト条件が見落とされる。',
 '生成されたテストケースが、モデル要素とテスト条件のリンクを継承する。'],
ans:[2],
exp:`テスト設計自動化のリスクには、モデルに示されていないテスト条件の見落とし、テストモデルの保守工数の過小評価、ステークホルダーがモデルを理解しにくいと感じること、テスト自動化の一般的なリスクがある（3.5.2項）。`,
why:['利点（メンテナンス工数の削減）。','利点（対応能力の拡張）。','正解。','利点（トレーサビリティの強化）。']},

/* ===== 第4章 ===== */
{lo:'TA-4.1.1',k:2,pts:1,
stem:`<p>経費精算システムのテストで、次の3つの発見事項があった。</p>
<div class="box"><p><b>X</b>：要件にある「通勤定期区間の交通費を自動控除する」機能が実装されていない。</p>
<p><b>Y</b>：外貨建て領収書の円換算で端数処理が誤っており、1円の差異が生じる。</p>
<p><b>Z</b>：申請に不要な入力項目が多く、領収書1枚ごとに複数画面を遷移する必要があり、精算業務という目的の達成を容易にしていない。</p></div>
<p class="ask">X、Y、Zに対応する機能適合性の副特性の組み合わせとして正しいものはどれか。</p>`,
opts:[
 'X：機能正確性　Y：機能完全性　Z：機能適切性',
 'X：機能完全性　Y：機能正確性　Z：機能適切性',
 'X：機能適切性　Y：機能正確性　Z：機能完全性',
 'X：機能完全性　Y：機能適切性　Z：機能正確性'],
ans:[1],
exp:`機能完全性：求められていることがすべて実装されているか。機能正確性：結果が正しい（正確、精密、一貫性がある）か。機能適切性：機能が指定されたタスクや目的の達成を容易にするか（4.1節）。`,
why:['XとYが逆。','正解。','XとZが逆。','YとZが逆。']},

{lo:'TA-4.2.1',k:2,pts:1,
stem:`<p class="ask">TAが使用性テストにどのように貢献できるかの説明として、最も適切なものはどれか。</p>`,
opts:[
 'ペルソナ、ユーザーグループ、運用プロファイルに従って使用性テストセッションのシナリオ設計に貢献し、一般的な使用性チェックリストをユーザーグループのニーズや使用コンテキストに合わせて調整する。',
 '使用性レビューは常にインスペクションとして実施しなければならないため、TAはインスペクションのモデレーターを務める。',
 'WCAGはA、AA、AAA、AAAAの4つの適合レベルを定義しており、TAはすべての製品に最上位レベルへの適合を求める。',
 'SUMIやWAMMIを用いて応答時間やスループットを計測し、使用性の合否を判定する。'],
ans:[0],
exp:`TAは、使用性レビューの基準をユーザーグループのニーズや使用コンテキストに合わせて調整し、使用性テストセッションのシナリオ設計に貢献し、アンケートの設計と回答の評価を支援できる（4.2節）。`,
why:['正解。','使用性レビューは非形式的レビューからインスペクションまでさまざま。','WCAGの適合レベルはA、AA、AAAの3つ。TAは使用コンテキストを解析し、求められる適合レベルを識別する。','SUMIやWAMMIはユーザー満足度を計測するアンケート。']},

{lo:'TA-4.3.1',k:2,pts:1,
stem:`<p class="ask">適応性テストおよびインストール性テストへのTAの貢献に関する記述として、正しいものはどれか。</p>`,
opts:[
 'インストール性テストは、インストール手順がエラーなく最後まで完了することを確認できれば十分である。',
 '拡張性と置換性のテストは、TAが主に責任を負う柔軟性テストの中心である。',
 '適応性テストでは、サポート対象のモバイルOSやブラウザーのバージョンなど意図する対象環境を識別し、環境パラメーターの組み合わせをカバーするために組み合わせテストを適用することが多い。',
 'インストール性テストでは、ユーザーが参照するインストール文書のレビューは対象外である。'],
ans:[2],
exp:`TAは意図する対象環境を識別し、環境の組み合わせをカバーするテストを設計して適応性テストを支援する。これにはさまざまな環境パラメーターの構成を表すテストデータが必要なため、組み合わせテストが適用されることが多い（4.3節）。`,
why:['インストール性テストは単にインストール手順が完了まで動くかをチェックするだけではない（アンインストール、更新、再設定、インストール後の動作なども含む）。','拡張性と置換性は技術的側面に関連し、PTやTTAのシラバスで扱われる。','正解。','インストールのしやすさのチェックには、インストール文書のレビューも含まれる。']},

{lo:'TA-4.4.1',k:2,pts:1,
stem:`<p>受注システムは、出荷指示データをAPI経由で外部の物流システムに送信する。送信時には、日付形式と商品コード体系の変換が行われる。相互作用の一部は仕様書に記載されていない。</p>
<p class="ask">相互運用性テストへのTAの貢献として、最も適切なものはどれか。</p>`,
opts:[
 '同じサーバー上で稼働する他のアプリケーションと干渉せずに、対象環境を共有できるかを検証する。',
 '相互運用性テストはホワイトボックステストであるため、TTAに任せ、TAは関与しない。',
 '機能テストのテストケースは相互運用性テストには再利用できないため、すべて新規に作成する。',
 'アーキテクチャーや設計文書から相互作用を把握してテスト条件を定義し、データ変換の検証を含めて、交換データの解釈・使用や通信フローをカバーする。'],
ans:[3],
exp:`相互運用性テストは通常ブラックボックスの機能テストであり、TAが責任を負う。情報交換がデータ変換を伴う場合は変換の検証を含めなければならない。すべての相互作用が文書化されているとは限らず、アーキテクチャーや設計文書から間接的に情報を得ることがある（4.4節）。`,
why:['共存性テストの説明であり、TTAシラバスで扱われる。','相互運用性テストは通常ブラックボックスの機能テストで、TAの責任。','機能テストや適応性テストのテストケースは相互運用性テストに再利用できる。','正解。']},

/* ===== 第5章 ===== */
{lo:'TA-5.1.1',k:2,pts:1,
stem:`<p class="ask">欠陥予防の有効性を評価するメトリクスに関する記述として、正しいものはどれか。</p>`,
opts:[
 'フェーズ内封じ込め有効性（PCE）は、後続フェーズで除去された欠陥の割合を測定し、値が高いほど後のフェーズに見逃された欠陥が多いことを示す。',
 '欠陥除去効率（DRE）はリリース前に除去された欠陥と欠陥の総数の比率である。高い値は欠陥予防の実践が優れていることを意味する場合があるが、予防と検出によって発見された欠陥を区別しない。',
 '欠陥予防の有効性は、欠陥予防活動に費やした工数の大きさによって評価する。',
 '欠陥予防はTAの専任の責任であり、その評価にテストマネージャーは関与しない。'],
ans:[1],
exp:`DREはリリース前に除去された欠陥と欠陥の総数の比率。DREが高いことは欠陥予防の実践が優れていることを意味する場合があるが、予防と検出によって発見された欠陥を区別しない（5.1節）。`,
why:['PCEは、そのフェーズで作り込まれた欠陥のうち同じフェーズ内で除去された割合。高いほど見逃しが少ない。','正解。','工数の大きさは有効性を示さない。メトリクスの例はDRE、PCE、品質コスト。','欠陥予防はチーム全体の責任であり、評価は通常テストマネージャーと相談しながら行う。']},

{lo:'TA-5.2.1',k:3,pts:2,
stem:`<p>仕様書には送料について次のように記載されている（購入金額は1円単位）。</p>
<div class="box"><p>「購入金額が0円を超え5,000円以下の場合は送料500円。5,000円以上10,000円未満の場合は送料300円。10,000円を超える場合は送料無料。」</p></div>
<p class="ask">TAがこの仕様のドメインモデル（同値パーティション）を作成した場合に検出できる仕様の欠陥はどれか。</p>`,
opts:[
 '5,000円が2つのパーティションに重複して属し、10,000円ちょうどはどのパーティションにも属さない。',
 '5,000円はどのパーティションにも属さず、10,000円が2つのパーティションに重複して属する。',
 '0円を超える購入金額はすべていずれか1つのパーティションに一意に属しており、欠陥はない。',
 '10,000円は送料無料のパーティションの閉じた境界線上にあるため、欠陥はない。'],
ans:[0],
exp:`ドメインモデルを使うと、重複するパーティション、ドメインカバレッジのギャップ、空のパーティションなどのドメインの欠陥を検出できる（5.2.1項）。「≤ 5,000」と「≥ 5,000」で5,000円が重複し、「＜ 10,000」と「＞ 10,000」で10,000円がギャップになる。`,
why:['正解。','重複とギャップの位置が逆。','重複とギャップがある。','「10,000円を超える」は開いた境界線であり、10,000円は送料無料のパーティションに属さない。']},

{lo:'TA-5.2.1',k:3,pts:2,pick:2,
stem:`<p>注文管理の仕様書から状態遷移モデルを作成している。仕様の記述は次のとおりである。</p>
<div class="box"><ol>
<li>新規注文は「受付」状態になる。</li>
<li>「受付」の注文は、支払完了で「支払済」になる。</li>
<li>「支払済」の注文は、出荷で「出荷済」になる。</li>
<li>「受付」の注文は、キャンセルで「取消」になる。</li>
<li>「支払済」の注文は、キャンセルで「返金待ち」になる。</li>
<li>「支払済」の注文は、キャンセルで「取消」になる。</li>

Q.forEach((q,i)=>{ q.no=i+1; q.ch=+q.lo.split('-')[1][0]; });
const TOTAL = Q.reduce((s,q)=>s+q.pts,0); // 78
const PASS = 51;

/* ---------------- 状態 ---------------- */
let S = null, tick = null, confirmOpen = false, filter = 'all';
const $ = s => document.querySelector(s);
const main = $('#main'), hdr = $('#hdr');
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function loadSaved(){ try{ const v = JSON.parse(localStorage.getItem(KEY)); return v && v.v===1 ? v : null; }catch(e){ return null; } }
function clearSaved(){ try{ localStorage.removeItem(KEY); }catch(e){} }
function ids(){ return S.subset || Q.map((_,i)=>i); }
function isRight(i){ const a=(S.ans[i]||[]).slice().sort().join(','); return a!=='' && a===Q[i].ans.slice().sort().join(','); }
function answered(i){ const q=Q[i], a=S.ans[i]||[]; return a.length === (q.pick||1); }
function remaining(){ return S.mins ? Math.max(0, S.start + S.mins*60000 - Date.now()) : null; }
function fmt(ms){ const t=Math.ceil(ms/1000), h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60; return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s).padStart(2,'0'); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------------- 開始画面 ---------------- */
function renderStart(){
  stopTick(); hdr.innerHTML='';
  const saved = loadSaved();
  const chRows = [1,2,3,4,5].map(c=>{
    const qs=Q.filter(q=>q.ch===c);
    const k=[2,3,4].map(n=>qs.filter(q=>q.k===n).length);
    return `<tr><td>${CH[c]}</td><td class="c mono">${qs.length}</td><td class="c mono">${k[0]||'–'}</td><td class="c mono">${k[1]||'–'}</td><td class="c mono">${k[2]||'–'}</td><td class="c mono">${qs.reduce((s,q)=>s+q.pts,0)}</td></tr>`;
  }).join('');
  main.innerHTML = `<section class="start">
    <div class="cover">
      <div class="eyebrow">CTAL-TA SYLLABUS V4.0.J01 準拠 ／ 模擬試験 第1回</div>
      <h1>Advanced Level テストアナリスト<br>本番形式 模擬試験</h1>
      <p>ISTQB Exam Structure Tables（v1.16）のLO別出題数・配点にそろえた45問です。K2は1点、K3は2点、K4は3点。「2つ選べ」の問題は両方正解で得点になります。</p>
      <dl class="specs">
        <div><dt>問題数</dt><dd>45<small>問</small></dd></div>
        <div><dt>満点</dt><dd>${TOTAL}<small>点</small></dd></div>
        <div><dt>合格点</dt><dd>${PASS}<small>点（65%）</small></dd></div>
        <div><dt>試験時間</dt><dd>120<small>分</small></dd></div>
      </dl>
      ${saved ? `<div class="resume"><p>${saved.done?'前回の採点結果が保存されています。':'解答途中の試験があります（'+(saved.mode==='exam'?'本番モード':'学習モード')+'、'+Object.keys(saved.ans).length+'問解答済み）。'}</p><button class="btn primary" data-act="resume">${saved.done?'結果を見る':'続きから再開'}</button><button class="btn ghost" data-act="discard">破棄する</button></div>`:''}
    </div>
    <div class="grid2">
      <div class="panel">
        <h2>出題範囲と配点</h2>
        <div class="tblwrap"><table class="tbl"><thead><tr><th>章</th><th class="c">問</th><th class="c">K2</th><th class="c">K3</th><th class="c">K4</th><th class="c">点</th></tr></thead><tbody>${chRows}
        <tr><th>合計</th><th class="c mono">45</th><th class="c mono">18</th><th class="c mono">21</th><th class="c mono">6</th><th class="c mono">${TOTAL}</th></tr></tbody></table></div>
        <p class="note">配分は公式の試験構造表に基づきます。各問題がどのLOに対応するかは、採点後の解説に表示されます。</p>

          <label><input type="radio" name="mode" id="m-exam" value="exam" checked><div><b>本番モード</b><span>制限時間あり。解答と解説は終了後にまとめて表示します。</span></div></label>
          <label><input type="radio" name="mode" id="m-study" value="study"><div><b>学習モード</b><span>時間制限なし。1問ごとに正誤と解説を確認できます。</span></div></label>

/* ---------------- 試験画面 ---------------- */
function begin(mode, mins, subset){
  S = {v:1, mode, mins: mode==='exam'?mins:0, start:Date.now(), ans:{}, flag:{}, rev:{}, pos:0, done:false, end:null, subset:subset||null};
  confirmOpen=false; save(); renderExam();
}
function startTick(){
  stopTick();
  if(!S.mins) return;
  tick = setInterval(()=>{
    const r=remaining();
    const el=$('#clock'); if(el){ el.textContent=fmt(r); el.parentElement.classList.toggle('warn', r<600000); }
    if(r<=0){ finish(); }
  },1000);
}
function stopTick(){ if(tick){ clearInterval(tick); tick=null; } }

function renderHeader(){
  const list=ids(), n=list.filter(answered).length;
  hdr.innerHTML = `<span class="prog">解答済み <b class="mono">${n}</b> / ${list.length}</span>`+
    (S.mins ? `<div class="timer${remaining()<600000?' warn':''}"><small>残り時間</small><span class="mono" id="clock">${fmt(remaining())}</span></div>` : `<span class="chip">学習モード</span>`);
}

function renderExam(){
  renderHeader(); startTick();
  const list=ids(), i=list[S.pos], q=Q[i], a=S.ans[i]||[];
  const study=S.mode==='study', shown=study && S.rev[i];
  const optsHtml = q.opts.map((t,k)=>{
    let cls='opt';
    if(a.includes(k)) cls+=' sel';
    if(shown){ if(q.ans.includes(k)) cls+=' right'; else if(a.includes(k)) cls+=' wrong'; }
    return `<li><button class="${cls}" data-opt="${k}" ${shown?'disabled':''} aria-pressed="${a.includes(k)}"><span class="bubble">${L[k]}</span><span class="t">${t}</span></button></li>`;
  }).join('');
  const cells = list.map((qi,p)=>{
    let c='cell'; if(answered(qi)) c+=' ans'; if(S.flag[qi]) c+=' flg'; if(p===S.pos) c+=' cur';
    if(study && S.rev[qi]) c+= isRight(qi)?' ok':' ng';
    return `<button class="${c}" data-go="${p}" aria-label="問${Q[qi].no}">${Q[qi].no}</button>`;
  }).join('');
  const unanswered = list.filter(x=>!answered(x)).length;
  main.innerHTML = `<section class="exam">
    <article class="qcard" aria-live="polite">
      <div class="qhead"><span class="qno">問${q.no}</span><span class="chip pts">${q.pts}点</span>
        ${shown?`<span class="chip lo">${q.lo}</span><span class="chip">K${q.k}</span>`:''}
        ${S.flag[i]?'<span class="chip flagc">見直し</span>':''}</div>
      <div class="stem">${q.stem}</div>
      <ul class="opts">${optsHtml}</ul>
      <p class="hint" id="hint"></p>
      ${shown?explainHtml(i):''}
      <div class="nav">
        <div class="row"><button class="btn" data-act="prev" ${S.pos===0?'disabled':''}>← 前の問題</button>
        <button class="btn ${S.flag[i]?'flagged':''}" data-act="flag">${S.flag[i]?'見直しを解除':'見直しに印'}</button></div>
        <div class="row">${study && !shown ? `<button class="btn" data-act="reveal" ${answered(i)?'':'disabled'}>解答を確認</button>`:''}
        ${S.pos<list.length-1?`<button class="btn primary" data-act="next">次の問題 →</button>`:`<button class="btn primary" data-act="ask-finish">${study?'結果を見る':'解答を終了する'}</button>`}</div>
      </div>
    </article>
    <aside class="sheet" aria-label="解答状況">
      <h3>解答状況<span>${list.length-unanswered}/${list.length}</span></h3>
      <div class="cells">${cells}</div>
      <div class="legend"><span><i class="a"></i>解答済み</span><span><i class="f"></i>見直し</span><span><i></i>未解答</span></div>
      ${confirmOpen ? `<div class="confirm"><p>${unanswered?`<b>未解答が${unanswered}問</b>あります。`:'すべて解答済みです。'}${S.flag && list.some(x=>S.flag[x])?` 見直しの印が${list.filter(x=>S.flag[x]).length}問に付いています。`:''}このまま採点しますか？</p><div class="row"><button class="btn danger" data-act="finish">採点する</button><button class="btn" data-act="cancel">戻る</button></div></div>`
        : `<button class="btn" data-act="ask-finish">${study?'結果を見る':'解答を終了して採点'}</button>`}
      <button class="btn ghost" data-act="home">トップへ戻る（中断）</button>
    </aside>
  </section>`;
}

function explainHtml(i){
  const q=Q[i], ok=isRight(i), a=S.ans[i]||[];
  return `<div class="explain">
    <div class="verdict ${ok?'ok':'ng'}">${ok?'○ 正解':'× 不正解'}<span class="chip">正解：${q.ans.map(k=>L[k]).join('、')}</span>${a.length?`<span class="chip">あなたの解答：${a.slice().sort().map(k=>L[k]).join('、')}</span>`:'<span class="chip">未解答</span>'}</div>
    <p>${q.exp}</p>
    <ul class="why">${q.why.map((w,k)=>`<li class="${q.ans.includes(k)?'ok':''}"><b>${L[k]}</b><span>${w}</span></li>`).join('')}</ul>
  </div>`;
}

function choose(k){
  const list=ids(), i=list[S.pos], q=Q[i];
  if(S.mode==='study' && S.rev[i]) return;
  let a=(S.ans[i]||[]).slice();
  if((q.pick||1)===1){ a=[k]; }
  else if(a.includes(k)){ a=a.filter(x=>x!==k); }
  else if(a.length>=q.pick){ const h=$('#hint'); if(h) h.textContent='この問題は2つまで選べます。選び直す場合は、選択済みの選択肢をもう一度押して解除してください。'; return; }
  else a.push(k);
  S.ans[i]=a; save(); renderExam();
}
function go(p){ const list=ids(); S.pos=Math.max(0,Math.min(list.length-1,p)); confirmOpen=false; save(); renderExam(); window.scrollTo({top:0}); }
function finish(){
  stopTick(); S.done=true; S.end=Date.now(); confirmOpen=false; filter='all'; save(); renderResult(); window.scrollTo({top:0});
}

/* ---------------- 結果画面 ---------------- */
function renderResult(){
  stopTick();
  const list=ids(), full=!S.subset;
  const got=list.reduce((s,i)=>s+(isRight(i)?Q[i].pts:0),0);
  const max=list.reduce((s,i)=>s+Q[i].pts,0);
  const nRight=list.filter(isRight).length;
  const pass = got>=PASS;
  const used = S.end && S.start ? S.end - S.start : 0;
  hdr.innerHTML = `<span class="chip">${full?'採点結果':'解き直し結果'}</span>`;
  const bar=(lbl,g,m)=>{ const pct=m?g/m*100:0; return `<div class="barrow"><span class="lbl">${lbl}</span><span class="num">${g} / ${m}</span><div class="track"><div class="fill${pct<65?' low':''}" style="width:${pct}%"></div></div></div>`; };
  const chBars=[1,2,3,4,5].map(c=>{ const xs=list.filter(i=>Q[i].ch===c); if(!xs.length) return ''; return bar(CH[c], xs.reduce((s,i)=>s+(isRight(i)?Q[i].pts:0),0), xs.reduce((s,i)=>s+Q[i].pts,0)); }).join('');
  const kBars=[2,3,4].map(k=>{ const xs=list.filter(i=>Q[i].k===k); if(!xs.length) return ''; return bar(`K${k}（${k===2?'理解':k===3?'適用':'分析'}・${xs[0]?Q[xs[0]].pts:''}点問題）`, xs.reduce((s,i)=>s+(isRight(i)?Q[i].pts:0),0), xs.reduce((s,i)=>s+Q[i].pts,0)); }).join('');
  const wrong=list.filter(i=>!isRight(i));
  const shownList = list.filter(i=> filter==='all' || (filter==='ng' && !isRight(i)) || (filter==='flag' && S.flag[i]));
  main.innerHTML = `<section class="result">
    <div class="scorecard">
      <div class="score">
        <span class="eyebrow">得点</span>
        <span class="big">${got}<small> / ${max}点</small></span>
        ${full?`<span class="stamp ${pass?'pass':'fail'}">${pass?'合格':'不合格'}</span>`:''}
      </div>
      <div class="meter">
        ${full?`<div class="track" style="margin-top:28px"><div class="fill" style="width:${got/max*100}%"></div><div class="cut" style="left:${PASS/max*100}%"></div><span class="cutlbl" style="left:${PASS/max*100}%">合格点 ${PASS}</span></div>`:''}
        <div class="facts"><span>正答 <b>${nRight}</b> / ${list.length}問</span><span>得点率 <b>${Math.round(got/max*100)}%</b></span>${full&&S.mode==='exam'?`<span>所要時間 <b>${fmt(used)}</b></span>`:''}${full&&!pass?`<span>合格まで <b>${PASS-got}</b>点</span>`:''}</div>
        <div class="row">${wrong.length?`<button class="btn primary" data-act="retry">間違えた${wrong.length}問を学習モードで解き直す</button>`:''}<button class="btn" data-act="home">トップへ戻る</button></div>
      </div>
    </div>
    <div class="grid2">
      <div class="panel"><h2>章別の得点</h2><div class="bars">${chBars}</div><p class="note">赤いバーは得点率65%未満の章です。</p></div>
      <div class="panel"><h2>Kレベル別の得点</h2><div class="bars">${kBars}</div><p class="note">K3・K4は配点が大きく、合否を左右します。</p></div>
    </div>
    <div class="panel">
      <div class="row" style="justify-content:space-between"><h2>解答と解説</h2>
      <div class="filters" role="group" aria-label="絞り込み">
        <button class="btn" data-filter="all" aria-pressed="${filter==='all'}">すべて（${list.length}）</button>
        <button class="btn" data-filter="ng" aria-pressed="${filter==='ng'}">不正解（${wrong.length}）</button>
        <button class="btn" data-filter="flag" aria-pressed="${filter==='flag'}">見直し印（${list.filter(i=>S.flag[i]).length}）</button></div></div>
      <div class="review">${shownList.map(i=>reviewItem(i)).join('') || '<p class="note">該当する問題はありません。</p>'}</div>
    </div>
  </section>`;
}
function reviewItem(i){
  const q=Q[i], ok=isRight(i), a=S.ans[i]||[];
  const title = q.stem.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  const opts = q.opts.map((t,k)=>{ let c='opt'; if(a.includes(k)) c+=' sel'; if(q.ans.includes(k)) c+=' right'; else if(a.includes(k)) c+=' wrong'; return `<li><div class="${c}"><span class="bubble">${L[k]}</span><span class="t">${t}</span></div></li>`; }).join('');
  return `<details class="ritem"><summary><span class="mk ${ok?'ok':'ng'}">${ok?'○':'×'}</span><span class="rno">問${q.no}</span><span class="rtitle">${esc(title)}</span><span class="chip lo">${q.lo}・K${q.k}・${q.pts}点</span></summary>
    <div class="rbody"><div class="stem">${q.stem}</div><ul class="opts">${opts}</ul>${explainHtml(i)}</div></details>`;
}

/* ---------------- イベント ---------------- */
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-act],[data-opt],[data-go],[data-filter]'); if(!t) return;
  if(t.dataset.opt!==undefined){ choose(+t.dataset.opt); return; }
  if(t.dataset.go!==undefined){ go(+t.dataset.go); return; }
  if(t.dataset.filter){ filter=t.dataset.filter; renderResult(); return; }
  const act=t.dataset.act;
  if(act==='begin'){ const mode=$('#m-study').checked?'study':'exam'; begin(mode, $('#t-150').checked?150:120); window.scrollTo({top:0}); }
  else if(act==='resume'){ S=loadSaved(); if(!S) return renderStart(); if(S.done) renderResult(); else if(S.mins && remaining()<=0) finish(); else renderExam(); }
  else if(act==='discard'){ clearSaved(); renderStart(); }
  else if(act==='prev') go(S.pos-1);
  else if(act==='next') go(S.pos+1);
  else if(act==='flag'){ const i=ids()[S.pos]; S.flag[i]=!S.flag[i]; save(); renderExam(); }
  else if(act==='reveal'){ const i=ids()[S.pos]; S.rev[i]=true; save(); renderExam(); }
  else if(act==='ask-finish'){ if(S.mode==='study' && ids().every(i=>S.rev[i])) return finish(); confirmOpen=true; renderExam(); const c=$('.confirm'); if(c) c.scrollIntoView({block:'nearest'}); }
  else if(act==='cancel'){ confirmOpen=false; renderExam(); }
  else if(act==='finish') finish();
  else if(act==='retry'){ const wrong=ids().filter(i=>!isRight(i)); begin('study',0,wrong); window.scrollTo({top:0}); }
  else if(act==='home'){ save(); renderStart(); window.scrollTo({top:0}); }
});
document.addEventListener('keydown', e=>{
  if(!S || S.done || !$('.qcard') || e.altKey || e.ctrlKey || e.metaKey) return;
  if(e.target.closest('input,textarea')) return;
  const k=e.key.toLowerCase(), idx=L.indexOf(k), q=Q[ids()[S.pos]];
  if(idx>-1 && idx<q.opts.length){ choose(idx); e.preventDefault(); }
  else if(e.key==='ArrowRight'){ go(S.pos+1); }
  else if(e.key==='ArrowLeft'){ go(S.pos-1); }
});

renderStart();
</script>
