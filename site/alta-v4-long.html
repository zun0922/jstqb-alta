<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AL-TA v4.0 長文模試</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* レイアウト: 出題設定（章別の配分表）→ 試験問題冊子（左）＋マークシート型の解答状況（右）→ 採点票。 */
:root{
  --paper:#ECEFF3; --sheet:#FFFFFF; --ink:#17202B; --muted:#5A6574; --line:#D2D9E1;
  --accent:#1D4F91; --accent-soft:#E1E9F5; --accent-ink:#FFFFFF;
  --flag:#A35F00; --flag-soft:#FAEED8;
  --good:#1F6F47; --good-soft:#DFF0E6; --bad:#B42318; --bad-soft:#FBE3E0;
  --f-display:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F141B; --sheet:#171E28; --ink:#E4E9EF; --muted:#98A4B3; --line:#2B3644;
    --accent:#86AEE6; --accent-soft:#1D2B3F; --accent-ink:#0F141B;
    --flag:#E2A94B; --flag-soft:#33281A;
    --good:#62C08F; --good-soft:#15291F; --bad:#F2857B; --bad-soft:#36191A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F141B; --sheet:#171E28; --ink:#E4E9EF; --muted:#98A4B3; --line:#2B3644;
  --accent:#86AEE6; --accent-soft:#1D2B3F; --accent-ink:#0F141B;
  --flag:#E2A94B; --flag-soft:#33281A;
  --good:#62C08F; --good-soft:#15291F; --bad:#F2857B; --bad-soft:#36191A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;line-height:1.4;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;min-height:56px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.brand b{font-family:var(--f-display);font-size:16px}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.04em}
.bar .spacer{flex:1}
.timer{display:flex;align-items:baseline;gap:8px;padding:4px 12px;border:1px solid var(--line);border-radius:var(--r)}
.timer small{font-size:11px;color:var(--muted);letter-spacing:.06em}
.timer .mono{font-size:20px;font-weight:600}
.timer.warn{border-color:var(--bad);color:var(--bad)}
.prog{font-size:13px;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--sheet);cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent}
.btn.flagged{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{border-color:var(--bad);color:var(--bad)}

/* start */
.start{padding-block:32px 56px;display:grid;gap:24px}
.cover{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:28px clamp(18px,4vw,40px);display:grid;gap:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.cover h1{font-size:clamp(24px,4vw,34px)}
.cover p{margin:0;max-width:65ch;color:var(--muted)}
.specs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.specs div{padding:14px 16px;border-right:1px solid var(--line);display:grid;gap:2px}
.specs div:last-child{border-right:0}
.specs dt{font-size:12px;color:var(--muted);letter-spacing:.06em}
.specs dd{margin:0;font-family:var(--f-mono);font-size:22px;font-weight:600}
.specs dd small{font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--muted);margin-left:4px}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px clamp(16px,3vw,28px);display:grid;gap:14px;align-content:start}
.panel h2{font-size:18px}
.tblwrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--accent-soft);font-weight:700;white-space:nowrap}
.tbl td.c,.tbl th.c{text-align:center}
.tbl .mono{font-size:13px}
.choice{display:grid;gap:10px}
.choice label{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.choice label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input{margin-top:6px;accent-color:var(--accent)}
.choice b{display:block}
.choice span{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:12.5px;color:var(--muted);margin:0}
.resume{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;border:1px dashed var(--accent);border-radius:var(--r);background:var(--accent-soft)}
.resume p{margin:0;flex:1;min-width:200px}

/* exam */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;padding-block:24px 56px;align-items:start}
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:24px clamp(16px,3.5vw,36px);display:grid;gap:18px;min-width:0}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qno{font-family:var(--f-display);font-size:22px;font-weight:700}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;font-size:12px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.pts{border-color:var(--accent);color:var(--accent);font-weight:700}
.chip.lo{font-family:var(--f-mono)}
.chip.flagc{border-color:var(--flag);color:var(--flag);background:var(--flag-soft)}
.stem{display:grid;gap:12px;min-width:0}
.stem p{margin:0}
.stem .box{border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;background:var(--paper)}
.stem .box p+p{margin-top:4px}
.stem ul,.stem ol{margin:0;padding-left:1.4em}
.ask{font-weight:700}
.pick2{display:inline-block;margin-left:6px;padding:0 6px;border:1px solid var(--ink);font-size:12px;border-radius:3px}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;background:var(--sheet);text-align:left;width:100%}
.opt:hover{border-color:var(--accent)}
.bubble{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .bubble{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .bubble{border-color:var(--good);color:var(--good)}
.opt.sel.right .bubble{background:var(--good);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bubble{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt[disabled]{cursor:default}
.opt .t{min-width:0}
.hint{font-size:13px;color:var(--flag);margin:0;min-height:1.4em}
.nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px}
.nav .row{gap:8px}
.explain{border-top:2px solid var(--ink);padding-top:16px;display:grid;gap:12px}
.verdict{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700}
.verdict.ok{color:var(--good)} .verdict.ng{color:var(--bad)}
.explain p{margin:0}
.why{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.why li{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px}
.why li b{font-family:var(--f-mono);color:var(--muted)}
.why li.ok b{color:var(--good)}

/* answer sheet */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.sheet h3{font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.sheet h3 span{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-weight:500}
.cells{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cell{position:relative;height:38px;border:1px solid var(--line);border-radius:4px;background:var(--sheet);font-family:var(--f-mono);font-size:13px;cursor:pointer;display:grid;place-items:center}
.cell.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.cell.flg::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.cell.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.cell.ng{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.legend i.a{background:var(--accent-soft);border-color:var(--accent)}
.legend i.f{background:var(--flag);border-color:var(--flag);border-radius:50%}
.sheet .btn{width:100%}

/* confirm */
.confirm{border:1px solid var(--bad);background:var(--bad-soft);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.confirm p{margin:0;font-size:14px}

/* result */
.result{padding-block:28px 64px;display:grid;gap:24px}
.scorecard{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:28px clamp(18px,4vw,40px);display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.score{display:grid;gap:4px;justify-items:start}
.score .big{font-family:var(--f-mono);font-size:clamp(44px,8vw,64px);font-weight:600;line-height:1}
.score .big small{font-size:.4em;color:var(--muted);font-weight:500}
.stamp{display:inline-block;padding:4px 14px;border:2px solid currentColor;border-radius:4px;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.2em;transform:rotate(-4deg);margin-top:8px}
.stamp.pass{color:var(--good)} .stamp.fail{color:var(--bad)}
.meter{display:grid;gap:8px}
.track{position:relative;height:14px;background:var(--paper);border:1px solid var(--line);border-radius:7px;overflow:visible}
.fill{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--accent)}
.cut{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.cutlbl{position:absolute;top:-26px;transform:translateX(-50%);font-size:11.5px;white-space:nowrap;color:var(--ink)}
.facts{display:flex;gap:8px 20px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.facts b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.bars{display:grid;gap:12px}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:4px 12px;align-items:center}
.barrow .lbl{font-size:13.5px;min-width:0}
.barrow .num{font-family:var(--f-mono);font-size:13px;text-align:right;grid-row:span 2}
.barrow .track{height:10px;grid-column:1}
.barrow .fill.low{background:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.review{display:grid;gap:10px}
.ritem{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
.ritem summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px}
.ritem summary::-webkit-details-marker{display:none}
.mk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px}
.mk.ok{background:var(--good-soft);color:var(--good)} .mk.ng{background:var(--bad-soft);color:var(--bad)}
.ritem .rno{font-family:var(--f-mono);font-weight:600}
.ritem .rtitle{font-size:13.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .rbody{padding:4px clamp(14px,3vw,28px) 22px;display:grid;gap:16px;border-top:1px solid var(--line);padding-top:18px}

@media (max-width:860px){
  .exam{grid-template-columns:minmax(0,1fr)}
  .sheet{position:static}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:620px){
  .specs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .specs div:nth-child(2){border-right:0}
  .specs div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .scorecard{grid-template-columns:minmax(0,1fr)}
  .ritem summary{grid-template-columns:auto auto minmax(0,1fr)}
  .ritem summary .chip{display:none}
  .timer .mono{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="bar">
  <div class="wrap">
    <div class="brand"><b>AL-TA v4.0 長文模試</b><span>JSTQB Advanced Level テストアナリスト</span></div>
    <div class="spacer"></div>
    <div id="hdr" class="row"></div>
  </div>
</header>
<main id="main" class="wrap"></main>

<style>
.choice label:has(input:disabled){opacity:.5;cursor:not-allowed}
.choice.inline{grid-template-columns:repeat(2,minmax(0,1fr))}
.tbl tr.dim td{color:var(--muted)}
.pool{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pool b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
@media (max-width:620px){ .choice.inline{grid-template-columns:minmax(0,1fr)} }
</style>
<script>
const KEY = 'alta-v4-long-1', HKEY = 'alta-v4-long-hist';
const CH = {
  1: '第1章 テストプロセスにおけるテストアナリストのタスク',
  2: '第2章 リスクベースドテストにおけるテストアナリストのタスク',
  3: '第3章 テスト分析とテスト設計',
  4: '第4章 品質特性のテスト',
  5: '第5章 ソフトウェア欠陥予防'
};
const L = ['a','b','c','d','e'];
/* 1回分の章別の出題数（本番45問の比率に合わせる）と、そのうちのK4の数の範囲（本番は45問中6問） */
const PLAN = {
  15: {ch:[3,1,7,1,3], k4min:2, k4:2, mins:40},
  20: {ch:[3,1,10,2,4], k4min:2, k4:3, mins:53}
};
const EXAM = {ch:[8,3,22,4,8], pts:[9,7,42,4,16]};
const PLANNED = 45;

/* ---------------- 問題バンク（長文） ---------------- */
const Q = [
/* ===== 長文 第1弾（15問 / 27点） ===== */
{id:'L-01',lo:'TA-1.2.4',k:2,pts:1,
stem:`<p>地方銀行のインターネットバンキングのシステムテストは、第3サイクルに入っている。手動テストはTAが担当し、夜間の自動リグレッションテストはテスト自動化エンジニア（TAE）が保守している。</p>
<p>今朝の時点の状況は次のとおりである。</p>
<div class="box">
<p>・夜間の自動テストで、振込予約の画面遷移を確認するAT-12が不合格になった。前日までは合格していた。</p>
<p>・今サイクルで検出した欠陥23件のうち14件が「振込予約」機能に集中している。</p>
<p>・手動テスト中、祝日の翌営業日を指定日にした振込予約で、指定日がさらに1日ずれる挙動が一度だけ見られた。テスト計画では祝日の扱いを特にリスクとして挙げていなかった。</p>
<p>・ステークホルダーからは、要件ごとのテストの合否状況を知りたいと要望されている。</p>
</div>
<p>TAは、今日行う作業として次のA〜Eを検討している。</p>
<div class="box">
<p><b>A</b>：不合格となったAT-12の手順を手動で再実行し、自動テストが偽陽性結果を出していないかを確認する。</p>
<p><b>B</b>：振込予約機能に欠陥が集中していることを示し、この機能への追加のテストを提案する。</p>
<p><b>C</b>：テスト結果に基づいてテストベースとテストウェアの間のトレーサビリティを更新し、テスト条件ごとの合否件数を示せるようにする。</p>
<p><b>D</b>：AT-12の自動テストスクリプトの故障解析と修正を、TAEに連絡せずTAが単独で行う。</p>
<p><b>E</b>：祝日の挙動は再現性が低く、テスト計画のリスクにも含まれていないので、記録せずに次のテストへ進む。</p>
</div>
<p class="ask">シラバスに照らして、テスト実行においてTAが行う作業として適切なものの組み合わせはどれか。</p>`,
opts:['A、B、C','A、B、D','B、C、E','A、D、E'],
ans:[0],
exp:`テスト実行でTAは、不合格となった自動テストを手動で再実行して偽陽性でないことを確認する、欠陥クラスターを認識して追加のテストを提案する、テストで得た情報から新たなリスクを識別する、といった評価を行う。テスト結果を考察してトレーサビリティを更新し、テスト条件ごとの合否を関係者に示す。一方、故障時に自動テストスクリプトを実行して分析するのは、開発担当者、TAE、TTAの仕事の場合がある（1.2.4項）。`,
why:[
 '正解。A・B・Cはいずれも、テスト実行の一環としてシラバスに挙げられているTAのタスクである。',
 'Dが不適切。自動テストスクリプトの故障の分析は、TAEなどの仕事の場合がある。保守担当のTAEに連絡せず単独で修正するのは適切でない。',
 'Eが不適切。テストで得た情報から新たなリスクを識別することはTAのタスクであり、観察した不正は記録すべきである。',
 'DとEが不適切である。'
]},

{id:'L-02',lo:'TA-1.3.4',k:2,pts:1,
stem:`<p>小売チェーンが発注支援システムを刷新する。TAは、次の3つの部分についてテストオラクルを検討している。</p>
<div class="box">
<p><b>(1) 需要予測モジュール</b>：機械学習で翌週の販売数を予測する。同じ入力でも出力がわずかに異なり、正しい予測値をあらかじめ決めることはできない。ただし、「全店の過去の販売実績を一律に2倍にした入力で再実行すると、予測値は元の予測値以上になるはずだ」という関係は成り立つ。</p>
<p><b>(2) 発注量計算モジュール</b>：旧システムと同じ計算仕様で再実装した。旧システムは移行完了まで並行稼働しており、同じ入力を与えることができる。</p>
<p><b>(3) 店舗スタッフ向けの発注画面</b>：探索的テストで、画面の表示や操作の流れが業務に照らして妥当かを判断したい。</p>
</div>
<p class="ask">(1)〜(3)に対するテストオラクル問題の解決策の組み合わせとして、最も適切なものはどれか。</p>`,
opts:[
 '(1) メタモルフィックテスト　(2) 疑似オラクル　(3) 人間オラクル',
 '(1) プロパティベースのテスト　(2) モデルベースドテスト　(3) 人間オラクル',
 '(1) 疑似オラクル　(2) メタモルフィックテスト　(3) プロパティベースのテスト',
 '(1) 人間オラクル　(2) 疑似オラクル　(3) メタモルフィックテスト'
],
ans:[0],
exp:`疑似オラクルは、テスト対象と同じ仕様を満たす独自に開発されたシステム（レガシーシステムなど）である。メタモルフィックテストは、入力を変換した複数の実行の出力の関係（メタモルフィック関係）を検証する。人間オラクルは期待結果を判断する人間の能力を利用し、探索的テストなどでは好まれる（1.3.4項）。`,
why:[
 '正解。',
 '(1)は、入力を変換して再実行したときの出力どうしの関係なのでメタモルフィックテストである（1回の実行の入出力の性質を検証するプロパティベースのテストではない）。(2)は並行稼働する旧システムを使えるので疑似オラクルが適する。',
 '(1)には同じ仕様を満たす別システムがない。(2)には旧システムを疑似オラクルとして使える。(3)は人の判断が必要な探索的テストである。',
 '(1)は人が予測値の正しさを判断できない。(3)は探索的テストなので人間オラクルが適する。'
]},

{id:'L-03',lo:'TA-1.3.6',k:3,pts:2,
stem:`<p>社用車予約システムのユーザーストーリーの受け入れ基準は「同じ車両がすでに予約されている時間帯には、他の社員はその車両を予約できない」である。チームは次のキーワードを定義済みである。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>分類</th><th>キーワード（パラメーター）</th></tr></thead><tbody>
<tr><td>アクション</td><td>テストデータを初期化する（データセット）／社員でログインする（社員ID）／車両を予約する（車両ID、開始、終了）／ログアウトする</td></tr>
<tr><td>検証</td><td>予約完了を確認する（車両ID）／予約拒否を確認する（理由）</td></tr>
<tr><td>テストインターフェース層</td><td>値を入力する（項目ID、値）／ボタンを押す（ボタンID）</td></tr>
</tbody></table></div>
<p class="ask">この受け入れ基準を検証するドメインレイヤーのキーワードテストケースとして、最も適切なものはどれか。</p>`,
opts:[
 '1. テストデータを初期化する（DS-01）<br>2. 社員でログインする（E1）<br>3. 車両を予約する（C-3、10:00、12:00）<br>4. 予約完了を確認する（C-3）<br>5. ログアウトする<br>6. 社員でログインする（E2）<br>7. 車両を予約する（C-3、11:00、13:00）<br>8. 予約拒否を確認する（時間帯の重複）<br>9. テストデータを初期化する（DS-01）',
 '1. テストデータを初期化する（DS-01）<br>2. 社員でログインする（E1）<br>3. 車両を予約する（C-3、10:00、12:00）<br>4. 予約完了を確認する（C-3）<br>5. ログアウトする<br>6. 社員でログインする（E2）<br>7. 車両を予約する（C-4、11:00、13:00）<br>8. 予約拒否を確認する（時間帯の重複）<br>9. テストデータを初期化する（DS-01）',
 '1. テストデータを初期化する（DS-01）<br>2. 社員でログインする（E1）<br>3. 値を入力する（vehicle、C-3）<br>4. 値を入力する（from、10:00）<br>5. ボタンを押す（btnReserve）<br>6. ログアウトする<br>7. 社員でログインする（E2）<br>8. 車両を予約する（C-3、11:00、13:00）<br>9. 予約拒否を確認する（時間帯の重複）',
 '1. テストデータを初期化する（DS-01）<br>2. 社員でログインする（E1）<br>3. 車両を予約する（C-3、10:00、12:00）<br>4. 予約完了を確認する（C-3）<br>5. ログアウトする<br>6. 社員でログインする（E2）<br>7. 車両を予約する（C-3、11:00、13:00）<br>8. ログアウトする'
],
ans:[0],
exp:`キーワードテストケースには、事前条件、検証アクション、テスト後のテスト環境のクリーンアップなどの手順もキーワードで指定する。ドメインレイヤーのキーワードはビジネス関連のアクションに対応し、インターフェースの技術的な詳細を抽象化する。検証キーワードは、実際の結果が期待と一致するかを評価するアサーションを表す（1.3.6項）。`,
why:[
 '正解。事前条件（初期化）、同じ車両の時間帯が重なる予約、拒否の検証、クリーンアップがそろっている。',
 '2件目の予約が別の車両（C-4）なので受け入れ基準の状況を再現しておらず、拒否されるという期待結果も誤っている。',
 'テストインターフェース層のキーワードが混在しており、ドメインレイヤーのテストケースになっていない。1件目の予約の完了確認と、終了時刻の入力、クリーンアップもない。',
 '2件目の予約が拒否されたことを評価する検証キーワードがない。テスト後のクリーンアップもない。'
]},

{id:'L-04',lo:'TA-2.2.1',k:4,pts:3,
stem:`<p>保険契約管理システムの次回リリースでは、次の2つの変更が行われる。</p>
<div class="box">
<p>・保険料計算エンジン（構成アイテム CI-PREM）の端数処理ロジックの修正</p>
<p>・要件R-45「契約者の住所変更時に、地域係数を再計算する」の変更。地域係数は保険料計算と更新案内の帳票でも使われている。</p>
</div>
<p>リグレッションテストの状況は次のとおりである。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th></th><th>自動テスト</th><th>手動テスト</th></tr></thead><tbody>
<tr><td>件数</td><td>1,500件（全件で9時間）</td><td>400件</td></tr>
<tr><td>今回使える時間</td><td>リリース判定前の1晩・4時間</td><td>2日間・約60件</td></tr>
<tr><td>記録されている情報</td><td>構成管理システムと連携したツールにより、各テストの実行中にアクティブになった構成アイテムを記録。CI-PREMと相互作用するテストは180件（約3.5時間）</td><td>構成アイテムとの対応は未記録。要件とのトレーサビリティを維持。R-45に直接対応するテストは25件、地域係数を使う関連機能のテストは20件</td></tr>
</tbody></table></div>
<p>また、今回の変更に伴ってリスクレジスターが更新され、「高額契約の保険料誤り」のリスクレベルが引き上げられた。</p>
<p class="ask">リグレッションテストの選択として、最も適切なものはどれか。</p>`,
opts:[
 '自動テストは、影響度分析によりCI-PREMと相互作用する180件を実行する。手動テストは、要件トレーサビリティマトリクスでR-45とその関連機能の45件を選び、残りの約15件は更新されたリスクレジスターで最もリスクの高い項目をカバーするテストに充てる。',
 '自動テストは、9時間かかる全件を2晩に分けて実行する。手動テストは、要件トレーサビリティマトリクスでR-45に直接対応する25件だけを実行する。',
 '自動テストは、運用プロファイルに基づいて主要な業務の流れをカバーするテストを選ぶ。手動テストは、影響度分析で地域係数と相互作用するテストを選ぶ。',
 '自動テストは、影響度分析によりCI-PREMと相互作用する180件を実行する。手動テストは、履歴ベースドテストにより過去に欠陥を検出した60件を実行する。'
],
ans:[0],
exp:`自動テストを選択するための最も信頼できる技法は影響度分析で、構成管理システムに基づくツールが支援する。手動テストでは決定的に優れた技法はないため、状況に応じて選ぶ。要件の変更が関連するテストに間接的に影響する場合は要件トレーサビリティマトリクスが有用で、直接影響を受ける機能と関連する機能を選ぶ。リスクベースのテスト選択では、リスクレジスターの更新に応じて最も高いリスクレベルをカバーするようにスイートを調整する。選択技法は組み合わせて使うことが多い（2.2節）。`,
why:[
 '正解。変更の性質と記録されている情報に合った技法を選び、組み合わせている。180件は約3.5時間で4時間の枠に収まる。',
 'リリース判定前の1晩しかないため、2晩に分けることはできない。手動テストも、R-45の関連機能（地域係数を使う機能）への間接的な影響をカバーしていない。',
 '自動テストには、構成アイテムの記録に基づく影響度分析が最も信頼できる。手動テストは構成アイテムとの対応が未記録なので、影響度分析を使えない。',
 '自動テストの選択は適切だが、手動テストは今回の要件変更（R-45とその関連機能）や、引き上げられたリスクをカバーしていない。'
]},

{id:'L-05',lo:'TA-3.1.1',k:3,pts:2,
stem:`<p>物流倉庫の自動仕分けシステムでは、荷物の重量 x（kg、整数）が20kgを超え、かつ配送区分コード y（整数）が5（保留）以外のとき、荷物を大型レーンへ振り分ける。すなわち、同値パーティション「大型レーン」は次の式で定義される。</p>
<div class="box"><p class="mono">x &gt; 20 AND y ≠ 5</p></div>
<p>TAは、簡易ドメインカバレッジを目標として、次のテストデータ (x, y) を作成した。</p>
<div class="box"><p class="mono">(21, 7)、(20, 7)、(30, 5)、(30, 4)</p></div>
<p class="ask">簡易ドメインカバレッジを100%にするために追加すべきテストデータとして、最も適切なものはどれか。</p>`,
opts:['(30, 6)','(19, 7)','(22, 7)','(30, 3)'],
ans:[0],
exp:`簡易ドメインカバレッジでは、＜、≤、＞、≥の境界線にONポイント1つとOFFポイント1つ、≠の境界線にOFFポイント1つと境界線の両側のONポイント2つが必要である。開いた境界線（x＞20）では、ONポイントはパーティションの内側で境界線に最も近い21、OFFポイントは境界線上の20である（3.1.1項）。x＞20：ON (21, 7)、OFF (20, 7) はそろっている。y≠5：OFF (30, 5)、ON (30, 4) はあるが、反対側のONポイント（y＝6）がない。`,
why:[
 '正解。y≠5の境界線の、もう一方の側のONポイントである。',
 'x＞20の境界線にはON (21, 7) とOFF (20, 7) がすでにある。19はOFFポイントではなく、OUTポイントである。',
 'x＞20の境界線のONポイントは21ですでにある。22はINポイントである。',
 'y＝3は、境界線y≠5に対して最も近い値ではなく、ONポイントにならない。必要なのは4の反対側の6である。'
]},

{id:'L-06',lo:'TA-3.2.2',k:3,pts:2,
stem:`<p>工作機械の制御ソフトウェアの状態遷移モデルは、次のとおりである（初期状態は「待機」）。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>遷移</th><th>遷移元</th><th>イベント</th><th>遷移先</th></tr></thead><tbody>
<tr><td class="mono">t1</td><td>待機</td><td>開始</td><td>運転</td></tr>
<tr><td class="mono">t2</td><td>運転</td><td>一時停止</td><td>停止中</td></tr>
<tr><td class="mono">t3</td><td>停止中</td><td>再開</td><td>運転</td></tr>
<tr><td class="mono">t4</td><td>運転</td><td>終了</td><td>待機</td></tr>
<tr><td class="mono">t5</td><td>停止中</td><td>終了</td><td>待機</td></tr>
<tr><td class="mono">t6</td><td>運転</td><td>異常検知</td><td>エラー</td></tr>
<tr><td class="mono">t7</td><td>エラー</td><td>リセット</td><td>待機</td></tr>
</tbody></table></div>
<p>テストスイートは次の3件のテストケースで構成される。</p>
<div class="box">
<p class="mono">TC1：t1 → t2 → t3 → t4</p>
<p class="mono">TC2：t1 → t6 → t7 → t1 → t2 → t5</p>
<p class="mono">TC3：t1 → t4 → t1 → t2 → t3 → t6 → t7</p>
</div>
<p class="ask">このテストスイートの1スイッチカバレッジと、カバーされていない1スイッチの組み合わせとして、正しいものはどれか。</p>`,
opts:[
 '約83%（10/12）。未カバーは t5→t1 と t3→t2',
 '約83%（10/12）。未カバーは t5→t1 と t7→t1',
 '約71%（10/14）。未カバーは t5→t1、t3→t2、t4→t2、t6→t3',
 '100%（12/12）'
],
ans:[0],
exp:`1スイッチは2つの連続する遷移の有効なシーケンスである。各状態について「入る遷移の数×出る遷移の数」を合計する。待機：入3（t4、t5、t7）×出1＝3、運転：入2（t1、t3）×出3＝6、停止中：入1×出2＝2、エラー：入1×出1＝1、合計12。テストスイートでカバーされるのは t1→t2、t2→t3、t3→t4、t1→t6、t6→t7、t7→t1、t2→t5、t1→t4、t4→t1、t3→t6 の10個（3.2.2項）。`,
why:[
 '正解。',
 't7→t1はTC2でカバーされている。未カバーはt5→t1とt3→t2である。',
 '有効な1スイッチは12個である。t4→t2やt6→t3は、遷移先と遷移元がつながらないため有効なシーケンスではない。',
 't5→t1（停止中→待機→運転）とt3→t2（停止中→運転→停止中）がカバーされていない。'
]},

{id:'L-07',lo:'TA-3.2.3',k:3,pts:2,
stem:`<p>経費精算システムのユースケース「経費を申請する」は次のとおりである。</p>
<div class="box">
<p><b>メインシナリオ</b></p>
<p>1. 申請者は新規申請を開始する。</p>
<p>2. 申請者は明細を1件入力する。</p>
<p>3. 申請者は必要に応じて明細を追加する（このステップは繰り返すことができ、追加は最大9回まで）。</p>
<p>4. 申請者は申請を提出し、システムは受付番号を表示する。</p>
<p><b>拡張</b>　2a. 領収書の画像がない場合、申請者は理由を入力し、ステップ3へ進む。</p>
<p><b>例外</b>　4a. 申請額が部門予算の残額を超える場合、システムは提出を拒否する。</p>
</div>
<p>TAは、ステップ3のループにシンプルループカバレッジを適用する。</p>
<p class="ask">ステップ3の追加回数として、テストケースでカバーすべき値の組み合わせとして最も適切なものはどれか。</p>`,
opts:['0回、1回、3回、9回','1回、9回','0回、1回、2回','1回、2回、3回、9回'],
ans:[0],
exp:`シンプルループカバレッジでは、各ループについて、0回実行（スキップ）、ちょうど1回の反復、2回以上の反復（典型的な反復回数）、可能であれば最大反復回数のテストを必要とする（3.2.3項）。ここでは0回、1回、典型的な回数として3回、最大の9回が該当する。`,
why:[
 '正解。スキップ、1回、典型的な回数（2回以上）、最大回数をカバーしている。',
 'ループのスキップ（0回）と、2回以上の典型的な反復回数がない。',
 '最大反復回数（9回）がない。このループは最大回数でのテストが可能である。',
 'ループのスキップ（0回）がない。ステップ3は「必要に応じて」行うものなので、0回は実行可能である。'
]},

{id:'L-08',lo:'TA-3.3.1',k:3,pts:2,
stem:`<p>ECサイトの送料無料の判定ルールについて、TAは次の完全なデシジョンテーブル（8ルール）を作成した後、最小化した表を作成した。条件はすべて Y／N の2値である。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>最小化した表</th><th class="c">M1</th><th class="c">M2</th><th class="c">M3</th><th class="c">M4</th></tr></thead><tbody>
<tr><td>C1：会員である</td><td class="c mono">Y</td><td class="c mono">-</td><td class="c mono">Y</td><td class="c mono">N</td></tr>
<tr><td>C2：購入額が5,000円以上</td><td class="c mono">Y</td><td class="c mono">-</td><td class="c mono">N</td><td class="c mono">-</td></tr>
<tr><td>C3：送料無料クーポンを持っている</td><td class="c mono">-</td><td class="c mono">Y</td><td class="c mono">N</td><td class="c mono">N</td></tr>
<tr><td>A：送料無料にする</td><td class="c mono">X</td><td class="c mono">X</td><td class="c mono">-</td><td class="c mono">-</td></tr>
</tbody></table></div>
<p>元の完全なデシジョンテーブルでは、「会員かつ5,000円以上」または「クーポンあり」の場合に送料無料となり、それ以外は送料無料にならない。</p>
<p class="ask">チェックサムプロシジャーによる確認の結果として、正しいものはどれか。</p>`,
opts:[
 'チェックサムは9で、元の表の8より大きい。M1とM2は「Y・Y・Y」で重複している（アクションは同じなので一貫性は保たれているが、ルールは重複しないことが望ましい）。',
 'チェックサムは8で、元の表と等しい。したがって、最小化した表は元の表と等価であることが保証される。',
 'チェックサムは9で、元の表の8より大きい。したがって、最小化した表は不完全である。',
 'チェックサムは7で、元の表の8より小さい。「N・N・Y」の条件の組み合わせがどのルールにも含まれていない。'
],
ans:[0],
exp:`チェックサムでは、「-」のないルールのスコアを1とし、「-」があるごとにその条件の個別値の数を乗じる。M1＝2、M2＝2×2＝4、M3＝1、M4＝2で合計9。チェックサムが元の表より大きい場合、いくつかのルールが重複しているか、追加のルールが存在する。小さい場合は不完全である。チェックサムが等しくても等価は保証されない（3.3.1項）。`,
why:[
 '正解。M1（Y・Y・-）とM2（-・-・Y）はどちらも「Y・Y・Y」を含む。',
 'チェックサムは9である。また、チェックサムが等しいだけでは等価は保証されない。',
 'チェックサムが元の表より大きい場合は、重複または追加のルールを示す。不完全を示すのは小さい場合である。',
 'チェックサムは9であり、「N・N・Y」はM2に含まれる。'
]},

{id:'L-09',lo:'TA-3.4.1',k:3,pts:2,
stem:`<p>食品宅配サービスに、毎週同じ曜日に自動で注文する「定期便」機能が追加された。配達日は、祝日や配達センターの休業日に当たると翌営業日にずれる。過去のリリースでは、月末の配達日の計算誤りと、同じ配達枠への二重注文が本番で発生している。</p>
<p>TAが作成したテストチャーターの草案は次のとおりである。</p>
<div class="box">
<p><b>ミッション</b>：定期便機能をテストする。</p>
<p><b>手順</b>：テストケースTC-101〜TC-140を順に実行する。</p>
<p><b>時間</b>：90分</p>
</div>
<p class="ask">このテストチャーターの改善として、最も適切なものはどれか。</p>`,
opts:[
 'ミッションを「定期便の配達日の計算と注文変更を探索する／祝日・休業日・月末を含む配達日データと2種類の会員アカウントを用いて／配達日の計算誤りと二重注文の欠陥を発見するために」と書き直し、手順のテストケース一覧は削除する。また、「同じ配達枠に2件の確定注文を作ってはならない」という制限と、過去の欠陥の履歴情報を加える。',
 'ミッションはそのままにして、TC-101〜TC-140の各手順と期待結果をテストチャーターに書き写し、セッション中に漏れなく実行できるようにする。',
 'ミッションを「定期便機能を自由に探索する」とし、それ以外の情報はTAの柔軟性を損なうのですべて削除する。',
 'ミッションに、使用するテスト技法と、すべてのテストデータの値を具体的に列挙し、セッション中にそれ以外の値を使わないよう指示する。'
],
ans:[0],
exp:`テストチャーターはテストセッションのミッションを示し、各セッションで実行するテストスイートを指定するものではない。ミッションの軽量フォーマットは「[target]を探索する／[resources]を用いて／[information]を発見するために」である。追加情報として、制限（プロダクトが絶対にやってはならないこと）や履歴情報（過去に発見された欠陥など）を含められる。制限などの追加情報は偽陽性結果の報告を減らせる（3.4.1項）。`,
why:[
 '正解。ミッションの3要素をそろえ、テストスイートの指定を削除し、役立つ追加情報を加えている。',
 'テストチャーターは、各セッションで実行するテストスイートを指定するものではない。',
 'ミッションの目的が曖昧になり、過去の欠陥などの役立つ情報も失われる。制限などの追加情報は偽陽性結果を減らすのに役立つ。',
 '使用する技法や値まで細かく指定すると、TAが制約され、探索的テストの柔軟性が失われる。'
]},

{id:'L-10',lo:'TA-3.1.3',k:2,pts:1,
stem:`<p>金融機関向けの金額計算ライブラリについて、テストチームは仕様への適合を検証する目的で、ランダムテストを導入することにした。入力は金額、通貨、税率、端数処理モードの組み合わせで、入力ドメインは非常に大きい。チーム内では次の意見が出ている。</p>
<div class="box">
<p>・本番の利用状況（運用プロファイル）に沿った分布で入力を生成したい。</p>
<p>・カバレッジが100%になった時点でテストを終了したい。</p>
<p>・期待結果は、テスト実行後に担当者が目視で確認すればよい。</p>
</div>
<p class="ask">シラバスに照らして、このランダムテストの進め方として最も適切なものはどれか。</p>`,
opts:[
 '検証の目的なので、バイアスを避けるために利用状況に依存しない分布を使う。広く合意されたカバレッジ基準がないため、終了基準は実行したテスト数やテスト時間で定め、期待結果の判定には自動化したテストオラクルを用意する。',
 '運用プロファイルに基づく分布で入力を生成し、ランダムテストのカバレッジが100%に達した時点で終了する。',
 'ガイドなしランダムテストを用い、これまでに選択した値に基づいて確率分布を調整しながら入力を生成する。',
 'ランダムテストは大量のデータを扱えるので、データの意味に関わる欠陥も確実に検出できる。そのため、ドメインテストは不要になる。'
],
ans:[0],
exp:`妥当性確認の目的では運用プロファイルに基づく分布が推奨されるが、検証の目的ではバイアスを避けるため、分布は利用状況に依存しないものであるべきである。ランダムテストには広く合意されたカバレッジ基準がなく、終了基準は実行したテスト数やテスト時間などに基づく。期待結果の追加には、多くの場合、自動化したテストオラクルが必要となる（3.1.3項）。`,
why:[
 '正解。',
 '運用プロファイルに基づく分布は妥当性確認の目的で推奨される。また、ランダムテストには広く合意されたカバレッジ基準がない。',
 '選択済みの値に基づいて分布を調整するのは、ガイドありランダムテスト（適応的ランダムテストなど）である。',
 'ランダムテストには、データセマンティクスの軽視やデータの意味に関わる欠陥の見逃しの可能性などの制限がある。'
]},

{id:'L-11',lo:'TA-3.2.1',k:2,pts:1,
stem:`<p>公共施設の予約システムについて、TAは次のCRUDマトリクスを作成した。施設の情報は、別の資産管理システムから連携される前提だと説明を受けているが、文書には明記されていない。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>機能 ＼ エンティティ</th><th class="c">会員</th><th class="c">予約</th><th class="c">施設</th></tr></thead><tbody>
<tr><td>会員登録</td><td class="c mono">C</td><td class="c"></td><td class="c"></td></tr>
<tr><td>予約登録</td><td class="c mono">R</td><td class="c mono">C</td><td class="c mono">R</td></tr>
<tr><td>予約変更</td><td class="c"></td><td class="c mono">R U</td><td class="c mono">R</td></tr>
<tr><td>予約キャンセル（状態を「取消」に更新）</td><td class="c"></td><td class="c mono">U</td><td class="c"></td></tr>
<tr><td>施設情報の修正</td><td class="c"></td><td class="c"></td><td class="c mono">R U</td></tr>
<tr><td>退会</td><td class="c mono">R D</td><td class="c"></td><td class="c"></td></tr>
</tbody></table></div>
<p class="ask">このCRUDマトリクスを用いたCRUDテストに関する記述として、最も適切なものはどれか。</p>`,
opts:[
 '完全性テストは静的テストであり、「予約」にDが、「施設」にCとDがないことを、調査が必要な不正として扱う。一貫性テストは動的テストであり、機能を組み合わせてエンティティごとにライフサイクルをカバーし、作成されていない予約の変更といったネガティブなテストも含める。',
 '完全性テストは動的テストであり、すべての機能を順に実行して、C・R・U・Dの各操作が正しく動作することを確認する。',
 '「予約」にDの操作がないので、欠陥として確定し、開発担当者に修正を依頼する。',
 'CRUDカバレッジは、テストスイートが実行した機能の数を、CRUDマトリクスの機能の総数で割って測定する。'
],
ans:[0],
exp:`CRUDテストは、すべての操作がすべてのエンティティに発生するかを検証する静的な完全性テストと、機能を統合してエンティティが一貫して使用されているかを確認する動的な一貫性テストからなる。ある操作が存在しないことは、調査が必要な不正である。一貫性テストでは、マトリクスのすべての操作をカバーし、ネガティブなテストも含める。CRUDカバレッジは、実行した操作の数を操作の総数で割って測定する（3.2.1項）。`,
why:[
 '正解。',
 '完全性テストは静的テストである。機能を統合して動的に確認するのは一貫性テストである。',
 '操作がないことは「調査が必要な不正」である。設計上の意図（論理削除など）の可能性もあるため、調査せずに欠陥と確定するのは適切でない。',
 'CRUDカバレッジは、実行した操作の数をマトリクスの操作の総数で割って測定する。'
]},

{id:'L-12',lo:'TA-4.1.1',k:2,pts:1,
stem:`<p>アジャイル開発で、店舗向けの在庫管理アプリを開発している。TAは、機能適合性の3つの副特性に関するプロダクトリスクに対処するため、テストの進め方を検討している。</p>
<div class="box">
<p>・<b>リスクX</b>：本部が求める業務（棚卸、発注、移動）の一部が実装から漏れる。</p>
<p>・<b>リスクY</b>：在庫数や発注点の計算結果が、有効・無効な入力に対して誤る。</p>
<p>・<b>リスクZ</b>：実装された機能が、店舗スタッフの業務をかえって煩雑にする。</p>
</div>
<p class="ask">X、Y、Zへの対処として、最も適切なものはどれか。</p>`,
opts:[
 'X：ユーザーストーリーの共同執筆時に受け入れ基準を議論し、システムテストではシナリオベースドテストとトレーサビリティで達成度を確認する。Y：コンポーネントテストとコンポーネント統合テストを中心に、詳細な期待結果を持つテストオラクルを用意する。Z：デモセッションから始め、探索的テストやコラボレーションベースのテストで確認する。',
 'X：コンポーネントテストで計算結果を詳細に確認する。Y：デモセッションで店舗スタッフに操作してもらう。Z：トレーサビリティマトリクスで要件のカバー状況を確認する。',
 'X：デモセッションで探索的テストを行う。Y：受け入れテストだけでまとめて確認する。Z：ユーザーストーリーの共同執筆時に受け入れ基準を議論する。',
 'X、Y、Zのいずれも、リリース前のシステムテストでまとめて探索的テストを行う。'
],
ans:[0],
exp:`機能完全性は、ユーザーストーリーの共同執筆時の受け入れ基準の議論などでできるだけ早く対処し、システムテストなどで動的にテストする。シナリオベースドテストが適し、トレーサビリティが達成度の判断に不可欠である。機能正確性は、シフトレフトの観点からほとんどをコンポーネントテストとコンポーネント統合テストで行い、効果的なテストオラクルが重要である。機能適切性は、アジャイル開発ではデモセッションから始め、探索的テストやコラボレーションベースのテストが最も適している（4.1節）。`,
why:[
 '正解。Xは機能完全性、Yは機能正確性、Zは機能適切性への対処として適切である。',
 'Xには完全性の、Yには正確性の、Zには適切性の進め方が必要で、対応がずれている。',
 'Yの機能正確性は、シフトレフトの観点から早いテストレベルで行うべきである。XとZの対処も入れ替わっている。',
 '副特性ごとに適したテストレベルと技法を選ぶべきで、まとめて最後に行うのはシフトレフトの考え方にも反する。'
]},

{id:'L-13',lo:'TA-5.2.1',k:3,pts:2,pick:2,
stem:`<p>会員向けアプリの仕様書に、ユースケース「ポイントを商品券に交換する」が次のように記述されている。TAはこれをシナリオモデルとして整理している。</p>
<div class="box">
<p><b>メインシナリオ</b></p>
<p>1. 会員は交換画面を開く。</p>
<p>2. 会員は商品券の種類と枚数を選ぶ。</p>
<p>3. システムはポイント残高を確認する。</p>
<p>4. システムはポイントを減算し、商品券コードを発行する。</p>
<p>5. システムは完了画面を表示する。</p>
<p><b>拡張</b>　2a. 在庫がない商品券を選んだ場合、システムは代わりの商品券を提案し、ステップ2に戻る。</p>
<p><b>拡張</b>　3a. ポイント残高が不足する場合、システムは不足ポイント数を表示する。</p>
<p><b>拡張</b>　4a. 商品券コードの発行に失敗した場合、システムは適切に処理する。</p>
</div>
<p class="ask">このモデル化によって検出できる仕様の欠陥はどれか。2つ選べ。</p>`,
opts:[
 '3aの後に、シナリオがどこへ進むのか（ステップ2に戻るのか、終了するのか）が定義されていない。',
 '4aの振る舞いが曖昧で、すでに減算したポイントをどう扱うのかが定義されていない。',
 'メインシナリオが2つ存在する。',
 '2aはメインシナリオのゴールに到達できないので、拡張ではなく例外として記述すべきである。',
 'ステップ3とステップ4の順序が逆である。'
],
ans:[0,1],
exp:`振る舞いに基づくモデル（シナリオモデルなど）により、曖昧または一貫性のないシステム動作や、欠落した例外処理を検出できる。モデリングは、欠落している情報、不完全な情報、曖昧な情報も特定できる（5.2.1項）。ユースケースは1つのメインシナリオしか持たず、拡張は最終的にメインシナリオのゴール達成につながり、例外はゴールを達成できない一連のアクションである（3.2.3項）。`,
why:[
 '正解。不足ポイントを表示した後の流れが欠落している（不完全な情報）。',
 '正解。「適切に処理する」は曖昧で、ポイントの減算とコード発行の失敗の関係が定義されていない。',
 'メインシナリオは1〜5の1つだけである。',
 '2aはステップ2に戻ってメインシナリオのゴールに到達しうるので、拡張として正しい。',
 '残高を確認してから減算するのは妥当な順序である。'
]},

{id:'L-14',lo:'TA-5.2.2',k:3,pts:2,
stem:`<p>新しい保守契約管理システムについて、次の3つのテストベースをレビューする。</p>
<div class="box">
<p><b>(1)</b> 修理受付から部品手配、作業完了報告までの業務フロー。アクティビティ図とユースケースで記述されている。業務の流れに沿って作業を模擬し、フロー上の不正を見つけたい。</p>
<p><b>(2)</b> 管理画面の要件。利用者は「入社したてのオペレーター」「熟練オペレーター」「監査担当者」で、それぞれペルソナが用意されている。各レビューアがその立場に集中し、指摘の重複を避けながら包括的にカバーしたい。</p>
<p><b>(3)</b> 外部の部品在庫APIのインターフェース仕様。前回のリリースでは、エラーコードの定義漏れがレビューで見過ごされ、結合テストで多数の故障につながった。今回は経験の浅いレビューアが担当するため、観点をそろえて客観的に確認したい。</p>
</div>
<p class="ask">(1)〜(3)に対するレビュー技法の組み合わせとして、最も適切なものはどれか。</p>`,
opts:[
 '(1) シナリオベースドレビュー　(2) ロールベースドレビュー　(3) チェックリストベースドレビュー',
 '(1) パースペクティブベースドリーディング　(2) ロールベースドレビュー　(3) アドホックレビュー',
 '(1) シナリオベースドレビュー　(2) チェックリストベースドレビュー　(3) パースペクティブベースドリーディング',
 '(1) アドホックレビュー　(2) シナリオベースドレビュー　(3) チェックリストベースドレビュー'
],
ans:[0],
exp:`シナリオベースドレビューは、テストベースがユースケースやアクティビティ図のようなシナリオベースの形式である場合に最も効果的で、予想される使用方法に基づいて「ドライラン」を行う。ロールベースドレビューは、ペルソナで記述できる役割をレビューアに割り当て、各自が特定の側面に集中して包括的なカバレッジを確保しつつ、不正の重複を避ける。チェックリストベースドレビューはレビューを客観化でき、過去に見過ごされた欠陥を用いてチェックリストを更新する（5.2.2項）。`,
why:[
 '正解。',
 '(1)はフローを模擬する（ドライラン）のでシナリオベースドレビューが適する。(3)のアドホックレビューはガイダンスがほとんどなくレビューアのスキルに大きく依存するため、経験の浅いレビューアには適さない。',
 '(2)はペルソナに基づく役割の割り当てなのでロールベースドレビューである。(3)は観点をそろえ過去の見逃しを反映したいのでチェックリストベースドレビューが適する。',
 '(1)はシナリオ形式のテストベースなのでシナリオベースドレビュー、(2)はロールベースドレビューが適する。'
]},

{id:'L-15',lo:'TA-5.3.1',k:4,pts:3,
stem:`<p>販売管理システムのリリース後3か月が経過し、TAはシステムテスト（ST）の結果を分析している。流出した欠陥は、STで検出可能だったものだけを数えることに合意している。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>重要度</th><th class="c">STで検出</th><th class="c">リリース後に流出</th></tr></thead><tbody>
<tr><td>致命的</td><td class="c mono">2</td><td class="c mono">4</td></tr>
<tr><td>重大</td><td class="c mono">30</td><td class="c mono">3</td></tr>
<tr><td>軽微</td><td class="c mono">120</td><td class="c mono">10</td></tr>
</tbody></table></div>
<p>さらに次のことがわかっている。</p>
<div class="box">
<p>・流出した致命的欠陥4件は、すべて今回のリリースで新規に変更された「月末締め処理」のコードにあった。テストギャップ分析では、月末締め処理の変更コードの約70%がどのテストでも実行されていなかった。</p>
<p>・テスト前に高リスクと予測した「顧客管理」では、STで45件の欠陥を検出した。そのうち43件は画面の文字ずれなどの外観上の欠陥だった。</p>
</div>
<p class="ask">この分析に基づく判断として、最も適切なものはどれか。</p>`,
opts:[
 '致命的欠陥のDDPは約33%と低く、流出はテストされていない新規の変更（月末締め処理）に集中している。月末締め処理の変更箇所に的を絞ったテストを追加し、STをより的を射た入念なものにする改善を優先する。',
 '流出した欠陥の数が最も多いのは軽微な欠陥（10件）なので、軽微な欠陥の検出を改善することを最優先にする。',
 '顧客管理で最も多くの欠陥が見つかり、予測した欠陥クラスターと一致したので、次回も顧客管理のテストを最も入念に行う。',
 'STの全体のDDPは約90%（152/169）と高いので、STの欠陥検出は効果的であり、改善の必要はない。'
],
ans:[0],
exp:`DDPは重要度別に分けるのが最善であり、DDPが低いテストレベルについてはTAが理由を分析し、より的を射た入念なものにする改善案を提案すべきである。テストギャップ分析により、まったくテストされていない新規の変更にテスト工数を集中できる。欠陥クラスターの判断では欠陥の重要度が重要な役割を果たし、致命的・重大な欠陥の小さなクラスターは軽微・外観上の欠陥の大きなクラスターより重要である（5.3.1項）。致命的：2÷(2＋4)≒33%、全体：152÷(152＋17)≒90%。`,
why:[
 '正解。重要度別のDDP、テストギャップ分析、欠陥の重要度を組み合わせて判断している。',
 '見逃された欠陥の削減の優先度は重要度によって異なる。件数ではなく、DDPが約33%と低い致命的欠陥を優先すべきである。',
 '顧客管理の欠陥はほとんどが外観上のもので、重要度を考慮するとより厳密なテストが必要な領域とはいえない。',
 '全体の値では、致命的欠陥の3分の2が流出しているという問題が見えなくなる。'
]},

/* ===== 長文 第2弾（15問 / 25点） ===== */
{id:'L-16',lo:'TA-1.1.1',k:2,pts:1,
stem:`<p>家庭用の空気清浄機メーカーが、本体の制御ソフトウェアとスマートフォンアプリを同時に開発している。</p>
<div class="box">
<p>・本体の制御ソフトウェアは、ハードウェアの試作スケジュールに合わせて、要件定義→設計→実装→テストのフェーズを順に進める。</p>
<p>・スマートフォンアプリは、2週間のスプリントで機能を少しずつ追加し、スプリントごとに社内のモニターへ配布する。</p>
<p>・アプリの機能の多くは、本体との通信に依存している。</p>
</div>
<p class="ask">このプロジェクトにおけるTAの関与として、最も適切なものはどれか。</p>`,
opts:[
 'SDLCの特性とその組み合わせ方に応じて関与の仕方を変える。本体側では、テストベースの作成時にテスト分析を始め、設計・実装と並行してテスト設計・実装を進める。アプリ側では、スプリントごとに新規・変更フィーチャーに焦点を当て、頻繁なリリースに合わせてリグレッションテストを継続的に保守・拡充する。どちらも初期段階から関与する。',
 'プロジェクト全体をシーケンシャル開発とみなし、本体のハードウェアが完成してから、アプリを含めたテスト分析をまとめて開始する。',
 'アプリ側は仕様の変化が多いので、テスト条件の定義は最後のスプリントでまとめて行う。',
 'TAの関与はSDLCモデルに依存しないので、本体とアプリで同じ進め方を採用する。'
],
ans:[0],
exp:`TAのテスト活動への関与は、採用するSDLCモデルによって異なる。シーケンシャル開発モデルでは、テストベースの作成時にテスト分析を始め、テスト設計とテスト実装はソフトウェアの設計・実装と並行して行う。イテレーティブ／インクリメンタルな開発では、新規・変更フィーチャーに焦点を当て、イテレーションの頻度が高いほどリグレッションテストの継続的な保守・拡充が重要になる。複数のモデルを組み合わせる場合、TAの関与はSDLCの特性と組み合わせ方に依存する。初期段階からの関与はすべてのモデルに共通するよい実践例である（1.1.1項）。`,
why:[
 '正解。',
 'アプリは2週間ごとに配布しているため、ハードウェアの完成まで待つとテストが大きく遅れる。初期段階からの関与というよい実践例にも反する。',
 'イテレーティブな開発では、ソフトウェアの進化に合わせてテスト条件を調整・修正していく。最後にまとめるのは不適切である。',
 'TAの関与は、採用するSDLCモデルによって異なる。'
]},

{id:'L-17',lo:'TA-1.2.3',k:2,pts:1,
stem:`<p>給与計算システムのシステムテストに向けて、テスト実装を進めている。次の事情がある。</p>
<div class="box">
<p>・「月次締め」のテストは、「日次勤怠集計」のテストで作られたデータを使う。</p>
<p>・リスク分析では、「残業手当の計算」と「年末調整」が高リスクとされ、テスト計画書に優先順位付けの基準が定められている。</p>
<p>・今回のバージョンでは年末調整の機能は未実装である。</p>
<p>・テストには、架空の社員300名分の勤怠データと、税率テーブルなどの環境データが必要である。</p>
</div>
<p>TAは、次のA〜Eを検討している。</p>
<div class="box">
<p><b>A</b>：日次勤怠集計と月次締めの依存関係を識別し、実行順序を考慮してテストプロシジャーを定義する。</p>
<p><b>B</b>：テスト計画書の優先順位付けの基準に基づいて、今回のバージョンで実行すべきテストプロシジャーを識別する（年末調整のテストは今回は対象外とする）。</p>
<p><b>C</b>：テスト目的に「意義に沿った」勤怠データと環境データを作成し、リポジトリに投入できるようにする。</p>
<p><b>D</b>：テストベースを分析して、テスト条件を新たに定義し、優先順位を付ける。</p>
<p><b>E</b>：リソースの割り当てを含むテスト実行スケジュールを、テストマネージャーに相談せずにTAが単独で確定する。</p>
</div>
<p class="ask">テスト実装においてTAが行う作業として適切なものの組み合わせはどれか。</p>`,
opts:['A、B、C','A、B、E','C、D、E','A、D、E'],
ans:[0],
exp:`テスト実装中、TAはテストプロシジャーを定義する際に実行順序に影響する制約や依存関係を識別し、優先順位付け基準に基づいて現行バージョンで実行すべきテストプロシジャーを識別する。また、データベースなどに投入する「意義に沿った」入力データや環境データを作成する。テスト実行スケジュールについては、TAは実行順序の定義などによってTMを支援する（1.2.3項）。`,
why:[
 '正解。A・B・Cはいずれもテスト実装のタスクである。',
 'Eが不適切。TAはテスト実行スケジュールの策定においてテストマネージャーを支援する立場である。',
 'Dはテスト分析のタスク、Eはテストマネージャーを支援すべき作業である。',
 'DとEが不適切である。'
]},

{id:'L-18',lo:'TA-1.3.2',k:2,pts:1,
stem:`<p>レビューで、次のテストケースに多くの指摘があった。</p>
<div class="box">
<p><b>TC-512 ポイント付与</b></p>
<p>事前条件：適当な会員でログインしておく。</p>
<p>手順：1. 商品を購入する。2. マイページを開く。</p>
<p>期待結果：ポイントが正しく付与されていること。</p>
<p>トレース：なし</p>
</div>
<p>なお、要件R-31は「ゴールド会員には購入額（税込）の1%のポイントを付与する（1ポイント未満切り捨て）」である。</p>
<p class="ask">品質基準を最もよく満たすように改善したテストケースはどれか。</p>`,
opts:[
 '事前条件：会員M-201（ゴールド、保有ポイント0）でログインしておく。テストデータ：商品P-10（税込3,350円）。手順：P-10を1個購入し、マイページを開く。期待結果：付与ポイントが33、保有ポイントが33と表示される。トレース：R-31、テスト条件TCD-31-2',
 '事前条件：ゴールド会員でログインしておく。手順：商品を購入し、マイページを開く。期待結果：ポイントが適切に付与されていることを必要に応じて確認する。トレース：R-31',
 '事前条件：会員M-201（ゴールド、保有ポイント0）でログインしておく。手順：会員情報の変更、パスワード変更、商品P-10の購入、レビュー投稿、退会手続きまでの40のアクションを順に行う。期待結果：各画面が正しく表示され、付与ポイントが33になる。トレース：R-31',
 '事前条件：会員M-201（ゴールド、保有ポイント0）でログインしておく。テストデータ：商品P-10（税込3,350円）。手順：P-10を1個購入し、マイページを開く。期待結果：画面にエラーが表示されないこと。トレース：なし'
],
ans:[0],
exp:`テストケースの品質基準には、正確性、実現可能性、必要性、理解容易性、トレーサビリティ、一貫性、明確性（曖昧な表現を避け、解釈は1つ）、完全性（必要なテストデータと判断に迷わない期待結果を含む）、簡潔性（少数のカバレッジアイテムに絞った小さなテストケース）がある（1.3.2項）。3,350円の1%は33.5なので、切り捨てて33ポイントとなる。`,
why:[
 '正解。テストデータと期待結果が具体的で一意に判断でき、要件とテスト条件へのトレースもある。',
 '「適切に」「必要に応じて」などの曖昧な表現が残り、明確性と完全性を満たさない。',
 '多くのアクションを1つにまとめており、簡潔性を満たさない。途中で故障すると以降がブロックされる。',
 '期待結果がテスト条件（1%のポイント付与）を検証しておらず、正確性と完全性を満たさない。トレーサビリティもない。'
]},

{id:'L-19',lo:'TA-2.1.1',k:2,pts:1,
stem:`<p>クリニック向けのオンライン診療予約アプリについて、プロダクトリスク分析のワークショップが開かれる。アプリは「予約」「問診票」「オンライン決済」「通知」の4つのフィーチャーで構成される。問診票は患者の病歴を扱い、決済は外部の決済代行サービスと連携する。問診票の要件はまだ曖昧な点が多い。</p>
<p class="ask">このワークショップでのTAの貢献として、最も適切なものはどれか。</p>`,
opts:[
 'テスト対象を4つのフィーチャーに分解し、使用頻度と深刻度合い、法的な必要（個人情報の保護）、テストベースの品質などを他のステークホルダーとともに見積もる。品質特性でリスクを分類し、問診票の要件のレビュー（静的テスト）など、最も早くリスクを軽減できるテスト活動を提案する。',
 'リスクベースドテストのアプローチを定め、各フィーチャーのリスクレベルをTAが最終決定する。',
 'リスクの識別とアセスメントは開発担当者とテストマネージャーが行うので、TAはその結果を受け取ってからテスト設計を始める。',
 'アプリ全体で1つのリスクレベルを評価し、リスクの軽減はシステムテストでの動的テストだけで行う。'
],
ans:[0],
exp:`TAはリスクアセスメントで、使用頻度と深刻度合い、ビジネス目的の深刻度合い、被害、テストベースの品質、法的・安全上の必要などを他のステークホルダーとともに見積もる。品質特性によるリスクの分類を支援し、リスクが一様でなければテストアイテムに分解して個別に評価する。さらに、静的テストと動的テストを含む軽減策を提案し、シフトレフトの精神で最も早くリスクを軽減できる活動を示す（2.1節）。`,
why:[
 '正解。',
 'リスクベースドテストの方針はテストマネージャーが定める。TAは他のステークホルダーとともにリスクレベルの決定に貢献する。',
 'TAは自らの経験と知識を活かしてリスク識別とアセスメントに貢献する、貴重なステークホルダーである。',
 'フィーチャーごとにリスクは一様でない。また、軽減策には静的テストも含め、早期に軽減できる活動を示すべきである。'
]},

{id:'L-20',lo:'TA-3.1.2',k:3,pts:2,
stem:`<p>通販サイトの注文処理について、次の3つのパラメーターの組み合わせをテストする。利用実績から、最もよく使われる値（ベースの値）は「カード」「宅配」「一般」である。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>パラメーター</th><th>値</th></tr></thead><tbody>
<tr><td>決済手段</td><td><b>カード</b>、銀行振込、コンビニ払い</td></tr>
<tr><td>受取方法</td><td><b>宅配</b>、店舗受取</td></tr>
<tr><td>会員種別</td><td><b>一般</b>、プレミアム、法人</td></tr>
</tbody></table></div>
<p>なお、コンビニ払いは法人会員では利用できない。</p>
<p class="ask">ベースチョイスカバレッジを100%達成するテストスイートとして、正しいものはどれか。</p>`,
opts:[
 'カード・宅配・一般／銀行振込・宅配・一般／コンビニ払い・宅配・一般／カード・店舗受取・一般／カード・宅配・プレミアム／カード・宅配・法人',
 'コンビニ払い・店舗受取・プレミアム／カード・店舗受取・プレミアム／銀行振込・店舗受取・プレミアム／コンビニ払い・宅配・プレミアム／コンビニ払い・店舗受取・一般／コンビニ払い・店舗受取・法人',
 'カード・宅配・一般／銀行振込・宅配・一般／コンビニ払い・宅配・一般／カード・店舗受取・一般／カード・宅配・プレミアム／銀行振込・店舗受取・法人',
 '銀行振込・宅配・一般／コンビニ払い・宅配・一般／カード・店舗受取・一般／カード・宅配・プレミアム／カード・宅配・法人'
],
ans:[0],
exp:`ベースチョイスカバレッジでは、各パラメーターのベースの値を組み合わせたベースカバレッジアイテムを作り、後続のカバレッジアイテムは、各パラメーターについてベースの値をベースではない各値で置き換えて作成する（3.1.2項）。ここではベース1件＋決済手段2件＋受取方法1件＋会員種別2件＝6件となる。コンビニ払いと法人の組み合わせは現れないので、制約に反しない。`,
why:[
 '正解。ベースの組み合わせから、1つのパラメーターだけをベース以外の値に置き換えている。',
 '最もよく使われる値ではなく「コンビニ払い・店舗受取・プレミアム」をベースにしている。また、最後の「コンビニ払い・法人」は制約で利用できない組み合わせである。',
 '最後のテストが2つのパラメーターを同時に置き換えており、「カード・宅配・法人」がカバーされていない。',
 'ベースカバレッジアイテム（カード・宅配・一般）がない。'
]},

{id:'L-21',lo:'TA-3.3.2',k:3,pts:2,
stem:`<p>ECサイトの商品検索機能をテストしている。商品の登録数や在庫は毎日変動するため、特定のキーワードで検索したときの正しい結果の件数をあらかじめ決めることができない。</p>
<p>TAは、ソーステストケースとして「キーワード『ランニングシューズ』で検索する」を用意した。</p>
<p class="ask">メタモルフィックテストのメタモルフィック関係（MR）とフォローアップテストケースの組み合わせとして、最も適切なものはどれか。</p>`,
opts:[
 'MR：同じキーワードに価格の上限の絞り込みを追加すると、結果は元の結果の部分集合になる。フォローアップテストケース：同じキーワードに「5,000円以下」を加えて検索し、ソーステストケースと合わせて、すべての結果が元の結果に含まれ、件数が元以下であることを評価する。',
 'MR：検索結果は常に100件以上になる。フォローアップテストケース：キーワード「ランニングシューズ 赤」で検索し、100件以上であることを確認する。',
 'MR：絞り込みを1つ追加すると、結果の件数はちょうど半分になる。フォローアップテストケース：「5,000円以下」を加えて検索し、件数が元の半分であることを評価する。',
 'MR：同じキーワードに価格の上限の絞り込みを追加すると、結果は元の結果の部分集合になる。フォローアップテストケース：「5,000円以下」を加えて検索し、事前に決めた件数（42件）と一致するかだけを個別に評価する。このMRを1回カバーすれば終了基準を満たす。'
],
ans:[0],
exp:`メタモルフィックテストでは、MRに基づいてソーステストケースを変更し、フォローアップテストケースを生成する。MRは、入力の変更がテストケースの期待結果にどう反映されるかを記述する。TAはソースとフォローアップをテストプロシジャーに結合して合同で評価し、MRを満たせば合格となる。テストオラクル問題がある場合にも使える。有用な終了基準となるカバレッジ尺度は認められておらず、各MRを1回カバーするだけでは不十分である（3.3.2項）。`,
why:[
 '正解。入力の変更（絞り込みの追加）と期待結果の関係が成り立ち、ソースとフォローアップを合わせて評価している。',
 'ソースとフォローアップの関係ではなく、単一の結果に対する（成り立つ保証のない）性質である。',
 '絞り込みで件数がちょうど半分になるという関係は、テストアイテムの特性として成り立たない。',
 '正しい件数は事前に決められないので、個別の評価はできない。また、各MRを1回カバーするだけでは不十分である。'
]},

{id:'L-22',lo:'TA-3.4.2',k:3,pts:2,
stem:`<p>TAは、宿泊予約サイトの入力フォームの探索的テストを支援するチェックリストを作ることになった。過去のリリースでは、電話番号の全角入力や、チェックアウト日の入力漏れに関する欠陥が本番で見つかっている。TAが最初に作った草案は次のとおりである。</p>
<div class="box">
<p>・入力チェックを十分に確認する。</p>
<p>・エラー処理が適切か見る。</p>
<p>・日付まわりをいろいろ試す。</p>
</div>
<p class="ask">チェックリストの作り方として、最も適切なものはどれか。</p>
`,
opts:[
 'まず範囲・目的・形式（例：入力フィールドごとの具体的な無効入力を含む実行チェックリスト）を決める。次に、経験豊富な担当者や欠陥ライブラリ、過去の欠陥から情報を集め、「電話番号欄に全角数字を入力すると、エラーメッセージが表示されるか」のように「はい／いいえ／該当しない」で答えられる具体的な質問として項目を書き、リスクに基づく優先度を付ける。最後に入力欄ごとにグループ化し、テストサイクルの後に見直す。',
 '項目は網羅的なハウツーガイドになるよう、各チェックに詳細な操作手順と画面遷移を書き込み、草案の包括的な表現はそのまま残す。',
 '他チームが作成した汎用のWebフォーム用チェックリストを、宿泊予約フォームとの関連を確認せずにそのまま使い、以後は変更しない。',
 '思いつく項目を先に書き出してテストを始め、チェックリストの範囲と目的はテスト終了後に決める。'
],
ans:[0],
exp:`チェックリストの作成では、まず範囲・目的・形式を決め、次にチェックリスト項目を定義するための情報（専門家、欠陥ライブラリや欠陥分類法、関連文書、リスクなど）を収集する。項目は明確・具体的で曖昧さがなく、「はい」「いいえ」「該当しない」で答えられる質問として作り、重要度やリスクレベルに基づいて優先度を付ける。最後に論理的なグループに分類する。チェックリストは包括的なハウツーガイドではなく、継続的に見直して洗練させる（3.4.2項）。`,
why:[
 '正解。シラバスに示された手順と項目の書き方に沿っている。',
 'チェックリストは包括的なハウツーガイドではない。また、草案の項目は曖昧で、「はい／いいえ」で答えられない。',
 '他者のチェックリストの再利用は、テストアイテムに関連している場合に限られる。チェックリストは決して最終的なものではなく、継続的に見直す。',
 '範囲・目的・形式はテストの深さと詳細レベルに影響するので、最初に決める。'
]},

{id:'L-23',lo:'TA-3.1.1',k:3,pts:2,
stem:`<p>ネット銀行の振込手数料は、振込金額 a（円、整数）によって次のように決まる。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>パーティション</th><th>条件</th><th>手数料</th></tr></thead><tbody>
<tr><td>P1</td><td class="mono">0 ≤ a ≤ 30,000</td><td>220円</td></tr>
<tr><td>P2</td><td class="mono">30,000 &lt; a ≤ 1,000,000</td><td>440円</td></tr>
</tbody></table></div>
<p>1,000,000円を超える金額と負の金額は、入力エラーになる。TAは、隣接するパーティションの境界線でカバレッジアイテムを共有して、テストデータの数を最小にしたい。</p>
<p class="ask">P1とP2の両方の簡易ドメインカバレッジを100%にする、最も少ないテストデータの集合はどれか。</p>`,
opts:[
 '−1、0、30,000、30,001、1,000,000、1,000,001',
 '0、30,000、30,001、1,000,000',
 '−1、0、1、29,999、30,000、30,001、30,002、999,999、1,000,000、1,000,001',
 '−1、0、30,000、30,001、30,002、1,000,000、1,000,001'
],
ans:[0],
exp:`簡易ドメインカバレッジでは、＜、≤、＞、≥の各境界線にONポイント1つとOFFポイント1つが必要である。閉じた境界線（≤、≥）ではONポイントは境界線上、OFFポイントは外側で最も近い値。開いた境界線（＜）ではONポイントは内側で最も近い値、OFFポイントは境界線上である。ある境界線のONとOFFの組は、隣接するパーティションの境界線ではOFFとONとして使える（3.1.1項）。P1：0≤a（ON 0、OFF −1）、a≤30,000（ON 30,000、OFF 30,001）。P2：30,000＜a（ON 30,001、OFF 30,000）は共有でき、a≤1,000,000（ON 1,000,000、OFF 1,000,001）。`,
why:[
 '正解。4本の境界線のON・OFFを6個の値でカバーしている。',
 'P1の下限のOFFポイント（−1）と、P2の上限のOFFポイント（1,000,001）がない。',
 '3値境界値分析の考え方で値を選んでおり、最小ではない。',
 '30,002は不要である。30,000＜a のONポイントは30,001で、OFFポイントは境界線上の30,000である。'
]},

{id:'L-24',lo:'TA-3.2.2',k:3,pts:2,
stem:`<p>スマートロックの状態遷移モデルは次のとおりである（初期状態は「施錠」）。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>遷移</th><th>遷移元</th><th>イベント</th><th>遷移先</th></tr></thead><tbody>
<tr><td class="mono">t1</td><td>施錠</td><td>正しい暗証番号</td><td>解錠</td></tr>
<tr><td class="mono">t2</td><td>解錠</td><td>施錠ボタン</td><td>施錠</td></tr>
<tr><td class="mono">t3</td><td>施錠</td><td>3回連続の誤入力</td><td>警報</td></tr>
<tr><td class="mono">t4</td><td>警報</td><td>管理者リセット</td><td>施錠</td></tr>
<tr><td class="mono">t5</td><td>解錠</td><td>ドアの開閉</td><td>解錠</td></tr>
</tbody></table></div>
<p>既存のテストケースは次の2件である。</p>
<div class="box">
<p class="mono">TC1：t1 → t5 → t2 → t1 → t2</p>
<p class="mono">TC2：t3 → t4 → t1 → t2</p>
</div>
<p class="ask">1スイッチカバレッジを100%にするために追加するテストケース（施錠から開始）として、最も適切なものはどれか。</p>`,
opts:[
 't1 → t5 → t5 → t2 → t3 → t4 → t3 → t4',
 't3 → t4 → t3 → t4 → t1 → t5 → t2',
 't1 → t5 → t5 → t2 → t1 → t2',
 't1 → t2 → t3 → t4 → t1 → t5 → t2'
],
ans:[0],
exp:`1スイッチは2つの連続する遷移の有効なシーケンスで、全部で9個ある（施錠に入る t2・t4 × 施錠から出る t1・t3 で4個、解錠に入る t1・t5 × 解錠から出る t2・t5 で4個、t3→t4 の1個）。既存のテストケースは t1→t5、t5→t2、t2→t1、t1→t2、t3→t4、t4→t1 の6個をカバーしている。未カバーは t2→t3、t4→t3、t5→t5 の3個（3.2.2項）。`,
why:[
 '正解。t5→t5、t2→t3、t4→t3 をすべてカバーする。',
 't4→t3 はカバーするが、t2→t3 と t5→t5 がカバーされない。',
 't5→t5 はカバーするが、t2→t3 と t4→t3 がカバーされない。',
 't2→t3 はカバーするが、t4→t3 と t5→t5 がカバーされない。'
]},

{id:'L-25',lo:'TA-3.4.3',k:2,pts:1,
stem:`<p>動画配信アプリの新しい再生画面について、リリース前にクラウドテストを行うことを検討している。目的は、さまざまな端末・回線での動作と、実際の視聴者に近い立場からの使い勝手の感想を集めることである。一方で、配信前の新作ドラマの映像を使う必要があり、過去の外部テストでは同じ不具合の報告が大量に重複した経験がある。</p>
<p class="ask">このクラウドテストについての判断として、最も適切なものはどれか。</p>`,
opts:[
 '多様な端末・ネットワーク条件のカバレッジと、実際のユーザー視点のフィードバックを費用対効果よく得られる。ただし、未公開映像の機密性を守る対策と、重複や偽陽性を含む大量の発見事項を管理する仕組みが必要であり、TAがテスト技法を適用する活動を置き換えるものではない。',
 'テストを毎回同じ担当者が同じ手順で行うので再現性が高く、確認テストに最も適している。',
 'クラウドテストで多様な環境を十分にカバーできるので、TAによるテスト技法の適用は不要になる。',
 '参加者のスキルに関係なくテストの品質は一定なので、参加者の選定や結果の確認は不要である。'
],
ans:[0],
exp:`クラウドテストの利点には、多様なテスト環境、高い柔軟性、費用対効果、迅速なフィードバック、実際のユーザー視点がある。制限には、テスト品質の不安定性、コミュニケーションの課題、セキュリティ（外部とソフトウェアを共有するリスク）、文書化と報告（重複や偽陽性を含む多数の発見事項の管理）がある。クラウドテストはTAがテスト技法を適用する活動に置き換わるものではない（3.4.3項）。`,
why:[
 '正解。',
 'テストは毎回さまざまな担当者が行うため、再現性は低くなる（変動性）。',
 'クラウドテストは、TAがテスト技法を適用する活動に置き換わるものではない。',
 'テスト品質は個々の担当者のスキルによって大きく変わりうる。'
]},

{id:'L-26',lo:'TA-3.5.1',k:4,pts:3,
stem:`<p>建設会社向けの業務システムに、次の4つのテストアイテムがある。プロジェクトはシーケンシャル開発で進めており、TAは技法の選択でテストマネージャーを支援する。</p>
<div class="box">
<p><b>(1) 荷重計算</b>：部材の寸法と荷重を入力し、許容範囲内かを判定する。条件は複数の変数を含む式で定義されている。高リスク。</p>
<p><b>(2) 与信審査</b>：取引先の資本金、取引年数、延滞履歴の組み合わせで「承認」「条件付き承認」「否決」を決める業務ルール。高リスク。</p>
<p><b>(3) ひび割れ検出</b>：AIが現場写真からひび割れを検出する。正しい検出結果を写真ごとに用意することは困難である。</p>
<p><b>(4) 社内向けヘルプ画面</b>：低リスク。カバレッジの定義が難しく、テストに割ける時間も短い。</p>
</div>
<p class="ask">各テストアイテムに主に適用するテスト技法の組み合わせとして、最も適切なものはどれか。</p>`,
opts:[
 '(1) ドメインテスト　(2) デシジョンテーブルテスト　(3) メタモルフィックテスト　(4) 経験ベースのテスト',
 '(1) デシジョンテーブルテスト　(2) ドメインテスト　(3) 経験ベースのテスト　(4) メタモルフィックテスト',
 '(1) ドメインテスト　(2) デシジョンテーブルテスト　(3) 仕様書から各写真の期待結果を導出するデシジョンテーブルテスト　(4) 全組み合わせの組み合わせテスト',
 '(1) 経験ベースのテスト　(2) シナリオベースドテスト　(3) メタモルフィックテスト　(4) ドメインテスト'
],
ans:[0],
exp:`テスト技法の選択は、テスト目的やシステムのタイプ（例：エンジニアリングの数値計算にはドメインに基づくテスト、与信リスクマネジメントにはデシジョンテーブルテスト）、プロダクトリスク、テストベースなどに影響される。テストベースからテストオラクルを導出することが不可能または困難な場合は、メタモルフィックテストや経験ベースのテスト技法を適用できる。経験ベースのテストは、リスクレベルが低い場合、カバレッジの定義が難しい場合、スケジュールがタイトな場合に使用できる（3.5.1項）。`,
why:[
 '正解。各テストアイテムの性質とリスクに合った技法である。',
 '(1)の多変数の式による入力ドメインはドメインテスト、(2)の条件の組み合わせによる業務ルールはデシジョンテーブルテストが適する。(4)の低リスク・短時間の対象にメタモルフィックテストを選ぶ理由はない。',
 '(3)は期待結果をあらかじめ用意できない（テストオラクル問題）ため、期待結果の導出に頼る技法は適さない。(4)の低リスク・短時間の対象に全組み合わせは工数とのトレードオフに合わない。',
 '(1)は高リスクで条件が式として定義されているので、体系的なドメインテストが適する。(2)は状態を持たない業務ルールなのでデシジョンテーブルテストが適する。'
]},

{id:'L-27',lo:'TA-4.2.1',k:2,pts:1,
stem:`<p>空港に設置する多言語の観光案内キオスク端末を開発している。主な利用者は訪日外国人旅行者で、車いす利用者や視覚に障がいのある利用者も想定している。チームには使用性の専門家が1名いる。</p>
<p class="ask">使用性テストへのTAの貢献として、最も適切なものはどれか。</p>`,
opts:[
 '使用コンテキストを解析して、求められるアクセシビリティの適合レベルとターゲットグループの具体的なニーズを識別する。使用性レビューでは一般的なチェックリストを利用者や使用コンテキストに合わせて調整し、使用性テストセッションではペルソナに従ってシナリオを設計する。',
 '使用性レビューは使用性の専門家ではなくTAが主導し、一般的な使用性チェックリストを変更せずにそのまま使う。',
 '使用性の評価はリリース後のユーザーアンケートで行えば十分なので、開発中の協力は不要である。',
 '使用性テストセッションでは、TA自身が利用者の代わりにあらかじめ定義されたタスクを実行し、評価する。'
],
ans:[0],
exp:`TAは、ターゲットユーザーグループやその使用コンテキストの知識を活用して早い段階から使用性テストに協力できる。使用性レビュー（使用性の専門家が行う）ではレビュー基準を調整し、使用性テストセッションではペルソナ、ユーザーグループ、運用プロファイルに従ってシナリオ設計に貢献する。アクセシビリティテストでは、使用コンテキストを解析して求められる適合レベルとターゲットグループの具体的なニーズを識別できる（4.2節）。`,
why:[
 '正解。',
 '使用性レビューは使用性の専門家が行う。TAはレビュー基準を利用者のニーズや使用コンテキストに適応させる。',
 'TAは早い段階から使用性テストに協力できる。アンケートは評価技法の1つにすぎない。',
 '使用性テストセッションでタスクを実行するのは、将来のユーザーまたはその代表者である。'
]},

{id:'L-28',lo:'TA-5.1.1',k:2,pts:1,
stem:`<p>前回のプロジェクトでは、要件定義で作り込まれた欠陥の多くがシステムテストまで見逃されていた。そこで今回、TAの提案により、要件のレビューでデシジョンテーブルや状態遷移モデルを作成して仕様を確認する取り組みを導入した。</p>
<p>リリース後、TAはテストマネージャーと相談しながら、この取り組みが望ましい効果をもたらしたかを評価したい。</p>
<p class="ask">評価に最も直接的に役立つメトリクスと、その理由の組み合わせとして、最も適切なものはどれか。</p>`,
opts:[
 '要件定義フェーズのフェーズ内封じ込め有効性（PCE）。要件定義で作り込まれた欠陥のうち、同じフェーズ内で除去された割合を示すので、取り組みの狙いである「同じフェーズでの検出」を直接評価できる。',
 '欠陥除去効率（DRE）。リリース前に除去された欠陥の割合が高ければ、要件のレビューの効果が高かったと断定できる。',
 'システムテストで作成したテストケースの数。テストケースが多いほど、要件の欠陥が少なかったことを示す。',
 'システムテストで不合格になったテストケースの数。不合格の数が、そのまま要件の欠陥の数を示す。'
],
ans:[0],
exp:`TAは、提案した欠陥予防の手段が望ましい効果をもたらしたかを（通常はテストマネージャーと相談しながら）評価する。PCEは、そのフェーズで作り込まれた欠陥の総数に対する、同じフェーズ内で作り込まれ、かつ除去された欠陥の割合である。DREはリリース前に除去された欠陥と欠陥の総数の比率だが、予防と検出によって発見された欠陥を区別しない（5.1節）。`,
why:[
 '正解。',
 'DREは予防と検出を区別せず、フェーズごとの封じ込めも示さないため、要件のレビューの効果だと断定することはできない。',
 'テストケースの数は欠陥予防の有効性を示すメトリクスではない。',
 '不合格のテストの数は、検出された欠陥の数と必ずしも同じではない（5.3.1項）。また、要件の欠陥かどうかもわからない。'
]},

{id:'L-29',lo:'TA-5.2.1',k:3,pts:2,pick:2,
stem:`<p>自動車保険の見積もり機能の仕様書には、次の記述がある。TAは、入力パラメーターとその値を組み合わせテストモデルとして整理している。</p>
<div class="box">
<p>・運転者の範囲は「本人のみ」「家族」「限定なし」から選択する。</p>
<p>・年齢条件は「全年齢」「26歳以上」「35歳以上」から選択する。</p>
<p>・運転者の範囲が「限定なし」の場合、年齢条件は「全年齢」のみ選択できる。</p>
<p>・（付録の料率表）運転者の範囲の列は「本人のみ」「本人・配偶者」「家族」「限定なし」の4つである。</p>
<p>・（画面例）運転者の範囲「限定なし」、年齢条件「35歳以上」の見積もり結果画面が掲載されている。</p>
</div>
<p class="ask">このモデル化によって検出できる仕様の欠陥はどれか。2つ選べ。</p>`,
opts:[
 '料率表にある「本人・配偶者」が、入力パラメーター「運転者の範囲」の値に含まれていない（パラメーター値の欠落・不整合）。',
 '画面例が、「限定なし」では「全年齢」のみという制約に反する組み合わせを示している（不正確な組み合わせ）。',
 '状態遷移にデッドロックがある。',
 '年齢条件の値「26歳以上」と「35歳以上」は範囲が重なるので、パーティションの重複という欠陥である。',
 '年齢条件の値が3つしかないので、組み合わせテストを適用できない。'
],
ans:[0,1],
exp:`データに基づくモデル（ドメインモデル、組み合わせテストモデル）により、重複するパーティション、ドメインカバレッジのギャップ、空のパーティション、パラメーターの欠落や不正確な組み合わせなどのドメインの欠陥を検出できる。モデリングは、入力や出力の不整合も検出できる（5.2.1項）。`,
why:[
 '正解。入力の値と料率表の値が一致していない。',
 '正解。仕様の制約と画面例が矛盾している。',
 'この記述は状態や遷移を扱っておらず、デッドロックは判断できない。',
 '「26歳以上」「35歳以上」は利用者が選ぶ条件の値であり、年齢を区分するパーティションではない。',
 '値の数が少なくても組み合わせテストは適用できる。'
]},

{id:'L-30',lo:'TA-5.3.1',k:4,pts:3,
stem:`<p>電力小売会社の料金システムで、システムテスト後に、テスト前に予測した欠陥クラスターと実績を比較した。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>モジュール</th><th class="c">規模</th><th class="c">予測</th><th class="c">致命的・重大</th><th class="c">軽微・外観</th><th class="c">ブランチカバレッジ</th></tr></thead><tbody>
<tr><td>A 料金計算</td><td class="c mono">8 KLOC</td><td class="c">高リスク</td><td class="c mono">6</td><td class="c mono">4</td><td class="c mono">90%</td></tr>
<tr><td>B 請求書帳票</td><td class="c mono">20 KLOC</td><td class="c">高リスク</td><td class="c mono">1</td><td class="c mono">35</td><td class="c mono">80%</td></tr>
<tr><td>C 契約変更</td><td class="c mono">10 KLOC</td><td class="c">低リスク</td><td class="c mono">7</td><td class="c mono">3</td><td class="c mono">45%</td></tr>
<tr><td>D お知らせ配信</td><td class="c mono">5 KLOC</td><td class="c">低リスク</td><td class="c mono">0</td><td class="c mono">2</td><td class="c mono">70%</td></tr>
</tbody></table></div>
<p class="ask">次のテストサイクルに向けた判断として、最も適切なものはどれか。</p>`,
opts:[
 'Cは低リスクと予測していたが、致命的・重大な欠陥が7件と多く、ブランチカバレッジも45%と低い。予測と実績の不一致があり、重要度も高いので、Cに対してより入念なテストを行う。',
 '欠陥の総数と欠陥密度が最も高いのはBなので、Bを最も入念にテストする。',
 'Aは予測どおり欠陥が多かったので、今回のテストで十分に対処できた。Aのテストを減らして、その分をDに回す。',
 'Dはカバレッジが70%でまだ低いので、Cより優先してDのカバレッジを高める。'
],
ans:[0],
exp:`予測した欠陥クラスターと実際のクラスターに不一致があった場合、予想よりも多くの欠陥が発見された領域をより入念にテストできる。クラスターの決定には測定可能な基準（欠陥密度や欠陥の重要度など）を用い、特に重要度が重要な役割を果たす。致命的・重大な欠陥の小さなクラスターは、軽微・外観上の欠陥の大きなクラスターより重要である。構造カバレッジの低い領域を識別して的を絞ることも有効だが、追加でカバーする領域はリスクレベルを考慮して選ぶ（5.3.1項）。`,
why:[
 '正解。予測との不一致、欠陥の重要度、カバレッジの低さがそろっている。',
 'Bの欠陥はほとんどが軽微・外観上のものである。重要度を考慮すると、Cのほうが厳密なテストを必要とする。',
 '致命的・重大な欠陥が多かった領域のテストを減らす根拠にはならない。',
 'Dは欠陥が少なく、低リスクで、重要な欠陥も見つかっていない。カバレッジを追加する領域はリスクレベルを考慮して選ぶ。'
]},

/* ===== 長文 第3弾（15問 / 26点） ===== */
{id:'L-31',lo:'TA-1.3.3',k:2,pts:1,
stem:`<p>自治体の電子申請システムで、システムテストが終わり、利用部門の職員が参加する受け入れテストの準備に入った。システムテスト用のテスト環境は文書化されており、スタブを多用した柔軟な構成になっている。受け入れテストでは、実際の窓口業務に近い状況で操作したいという要望が利用部門から出ている。</p>
<p class="ask">TAが受け入れテスト用のテスト環境要件を定義する方法として、最も適切なものはどれか。</p>`,
opts:[
 '既存のシステムテスト環境を参照し、受け入れテスト固有のニーズ（本番に近い構成、本番相当のマスターデータ、窓口端末からのアクセスなど）に絞って記述する。各構成要素には一意の識別子、説明、責任、必要期間、忠実度を記載し、開発担当者、TTA、プロダクトオーナーなどにレビューと承認を依頼する。',
 '受け入れテストでも柔軟性を最優先し、システムテストと同じスタブ中心の構成をそのまま使う。本番環境との類似度は考慮しない。',
 '既存の文書と重複してもよいので、すべての構成要素を一から詳細に文書化し直す。',
 'テスト環境要件はTAが作成するものなので、関係者のレビューを受けずにTAが確定する。'
],
ans:[0],
exp:`テストレベルとテストタイプは、テスト環境の柔軟性の度合いと本番環境との類似の度合いのトレードオフに影響する。各構成要素の要件には、一意の識別子、説明、責任、必要期間、忠実度を含める。冗長性や不必要な文書化を避けるため、既存のテスト環境を参照し、テストレベル固有のニーズに焦点を絞ることができる。関連するステークホルダーもテスト環境要件のレビュー、承認、更新を行うべきである（1.3.3項）。`,
why:[
 '正解。',
 '受け入れテストでは本番との類似が重視される。テストレベルに応じて、柔軟性と本番との類似度のトレードオフを考える必要がある。',
 '冗長性や不必要な文書化は避け、既存のテスト環境を参照してよい。',
 '開発担当者、TTA、テスト自動化エンジニア、プロダクトオーナーなどの関係者も、レビュー、承認、更新を行うべきである。'
]},

{id:'L-32',lo:'TA-1.3.5',k:2,pts:1,
stem:`<p>新規に立ち上げるサブスクリプション型の家電レンタルサービスのシステムテストを準備している。サービスは未開始のため本番データは存在しない。テストには次の事情がある。</p>
<div class="box">
<p>・利用者は、単身の学生、子育て世帯、高齢の夫婦など多様である。</p>
<p>・申込の審査では、外部の信用照会サービスを呼び出すが、テスト期間中は利用できない。</p>
<p>・請求データは、会員→契約→出荷の順にデータが作られていないと作成できない。</p>
<p>・契約の更新日は「契約日の1年後」で、日付によって処理が変わる。</p>
</div>
<p class="ask">テストデータ要件の考え方として、最も適切なものはどれか。</p>`,
opts:[
 '現実的な業務・技術シナリオを反映した合成データを作り、ペルソナを使って多様な利用者を表現する。信用照会サービスはサービス仮想化で代替し、請求データは作成に必要な一連のステップを定義する。日付はテスト実行日からの相対値で生成し、経年変化の影響を避ける。',
 '本番データがないので、ランダムな文字列と数値で大量のデータを作れば十分である。',
 '別の既存サービスの本番データから、個人情報を含めてそのままコピーして使う。',
 '保守を簡単にするため、テストデータの値はローレベルテストケースの手順に直接書き込む。'
],
ans:[0],
exp:`本番データがないシステムでは、合成データは現実的なビジネスおよび技術シナリオを反映しなければならず、ペルソナはデータ作成の指針として役立つ。可用性の観点では、サービス仮想化で存在しない・アクセスできないサービスを再現できる。従属データの作成には一連のステップが必要である。時間の影響を受けやすいデータは、システムの動作に予期しない影響を与える可能性がある。ハードコードされたテストデータは避け、テストロジックとテストデータを分離すべきである（1.3.5項）。`,
why:[
 '正解。',
 '合成データは現実的なビジネスおよび技術シナリオを反映しなければならない。意味のないデータでは、事前条件や期待結果を決められない。',
 '機密性の高いデータ（個人情報）は保護が必要で、データ保護規制も遵守しなければならない。',
 'ローレベルテストケースにハードコードされたテストデータは避け、テストロジックとテストデータを分離すべきである。'
]},

{id:'L-33',lo:'TA-2.2.1',k:4,pts:3,
stem:`<p>中小企業向けの会計クラウドサービスで、データベース製品を別の製品に入れ替える。機能仕様の変更はないが、影響はすべての機能に及びうる。</p>
<div class="box">
<p>・手動リグレッションテストは800件あり、割り当てられた3日間で実行できるのは約120件である。</p>
<p>・手動テストと構成アイテムとの対応は記録されていない。要件の変更はなく、リスクレジスターも更新されていない。</p>
<p>・過去のサイクルの分析では、履歴ベースで選んだテストが毎回多くのリグレッション欠陥を検出しており、特に「仕訳の一括取込」と「決算書の出力」で、データベースに関わる変更のたびに故障が出ていた。</p>
<p>・主な利用の流れは「ログイン→仕訳入力→月次集計→決算書出力」である。</p>
</div>
<p class="ask">リグレッションテストの選択として、最も適切なものはどれか。</p>`,
opts:[
 '運用プロファイルに基づくテストで、頻繁に発生する重要な業務の流れを優先してシステム全体を素早く概観し、履歴ベースドテストで、過去に欠陥を検出したテストや類似の変更で影響を受けやすかったテストを加える。',
 '要件トレーサビリティマトリクスで、変更された要件に関連するテストを選ぶ。',
 '影響度分析で、データベースと相互作用するテストを選ぶ。',
 'リスクレジスターが更新されていないので、前回のサイクルと同じ120件をそのまま実行する。'
],
ans:[0],
exp:`運用プロファイルに基づくテストは、アプリケーションを大幅に変更する場合にシステム全体の機能を素早く概観でき、テストが多すぎる場合は頻繁に発生する重要な使用パターンに優先順位を付ける。履歴ベースドテストは、欠陥を検出したテストや類似の変更で影響を受けやすかったテストを再実行することで、同様の欠陥を検出する可能性を高める。選択技法は組み合わせて使うことが多く、前回効果的だった技法は維持する（2.2節）。`,
why:[
 '正解。全体への影響と、過去の効果的な技法の両方を踏まえている。',
 '今回は要件の変更がないため、要件トレーサビリティマトリクスでは選択の手がかりがない。',
 '手動テストと構成アイテムの対応が記録されていないため、影響度分析は使えない。',
 'リグレッションテストの範囲はテストサイクルごとに見直すことが不可欠であり、変更の性質を考慮せずに前回と同じものを実行するのは適切でない。'
]},

{id:'L-34',lo:'TA-3.1.2',k:3,pts:2,
stem:`<p>社内Webアプリの互換性を確認するため、次のパラメーターでペアワイズテストを行う。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>パラメーター</th><th>値</th></tr></thead><tbody>
<tr><td>OS</td><td>Windows、macOS</td></tr>
<tr><td>ブラウザー</td><td>Chrome、Edge、Safari</td></tr>
<tr><td>表示言語</td><td>日本語、英語</td></tr>
</tbody></table></div>
<p>制約：Safari は macOS でのみ、Edge は Windows でのみ使用する（それ以外の組み合わせは実行不可能）。</p>
<p class="ask">実行可能な組み合わせだけを使って、ペアワイズカバレッジを100%にする、最もテストケースの少ないテストスイートはどれか。</p>`,
opts:[
 'Win・Chrome・日本語／Win・Edge・英語／Mac・Chrome・英語／Mac・Safari・日本語／Win・Edge・日本語／Mac・Safari・英語',
 'Win・Chrome・日本語／Win・Edge・英語／Mac・Chrome・英語／Mac・Safari・日本語',
 'Win・Chrome・日本語／Win・Edge・英語／Mac・Chrome・英語／Mac・Safari・日本語／Win・Safari・英語／Win・Edge・日本語',
 '実行可能な全組み合わせの8件（Win・Chrome、Win・Edge、Mac・Chrome、Mac・Safari のそれぞれに日本語と英語）'
],
ans:[0],
exp:`ペアワイズカバレッジのカバレッジアイテムは、任意の2つのパラメーターのパラメーター-値ペアの組み合わせである。最終的なテストケースの数は、パラメーター-値ペア間の制約や実行不可能な組み合わせの影響を受ける（3.1.2項）。ブラウザーと表示言語のペアは3×2＝6個あり、1件のテストケースでカバーできるのはそのうち1個だけなので、最低6件必要である。6件の案は、実行可能なOS×ブラウザー4ペア、OS×言語4ペア、ブラウザー×言語6ペアをすべてカバーする。`,
why:[
 '正解。実行可能な組み合わせだけで、すべてのペアを6件でカバーしている。',
 'Edge・日本語とSafari・英語のペアがカバーされていない。',
 'Win・Safari は制約により実行不可能な組み合わせである。',
 'ペアワイズカバレッジは満たすが、6件で足りるので最少ではない。'
]},

{id:'L-35',lo:'TA-3.2.3',k:3,pts:2,
stem:`<p>受注業務のアクティビティ図の内容は次のとおりである。</p>
<div class="box">
<p>開始 → 注文受付 → 判定ノード1</p>
<p>　［在庫あり］→ マージノード</p>
<p>　［在庫なし］→ 判定ノード2：［取り寄せ可］→ 取り寄せ手配 → マージノード／［取り寄せ不可］→ キャンセル通知 → 終了</p>
<p>マージノード → フォーク：「請求書発行」と「出荷準備」を並行実行 → ジョイン → 出荷 → 終了</p>
</div>
<p>「出荷」では配送区分（通常、冷蔵、冷凍）によって処理が変わる。TAは、ループのないこのモデルのすべてのシナリオをカバーしたうえで、出荷に至る各シナリオについて、配送区分の3つの同値パーティションをそれぞれテストすることにした。</p>
<p class="ask">必要なテストケースの最少数はどれか。</p>`,
opts:['7','3','4','9'],
ans:[0],
exp:`シナリオモデルにループがない場合、各シナリオを個別のテストケースでテストできる。シナリオに現れる変数に追加のEPやBVAのカバレッジが必要な場合、1つのシナリオを複数のテストケースでテストする必要がある（3.2.3項）。シナリオは「在庫あり→出荷」「在庫なし・取り寄せ可→出荷」「在庫なし・取り寄せ不可→キャンセル」の3つ（フォークからジョインまでの並行実行は1つのシナリオの中に含まれる）。出荷に至る2つのシナリオで配送区分を3つずつテストして6件、キャンセルのシナリオ1件で合計7件。`,
why:[
 '正解。2シナリオ×3パーティション＋1シナリオ＝7。',
 'シナリオの数だけを数えており、出荷に至る各シナリオで配送区分をテストする条件を満たさない。',
 '配送区分の3つを全体で1回ずつテストした場合の数であり、出荷に至る各シナリオでテストするという条件を満たさない。',
 'キャンセルのシナリオでは出荷しないため、配送区分を変える必要はない。3シナリオ×3とするのは誤り。'
]},

{id:'L-36',lo:'TA-3.3.1',k:3,pts:2,
stem:`<p>ポイント還元のルールを、次の条件で完全なデシジョンテーブルにした。</p>
<div class="box">
<p>・C1：会員ランク（一般、シルバー、ゴールド）</p>
<p>・C2：誕生月である（Y／N）</p>
<p>・C3：初回購入である（Y／N）</p>
</div>
<p>ゴールド会員になるには購入実績が必要なため、「ゴールド かつ 初回購入」の組み合わせは実現不可能である。このデシジョンテーブルはリスクレベルが高いと評価されたため、TAは最小化を行わず、完全な表でカバレッジを測定する。テストスイートは、実現可能な異なる8つの列（ルール）を実行した。</p>
<p class="ask">デシジョンテーブルカバレッジはいくつか。</p>`,
opts:['80%','約67%','100%','約83%'],
ans:[0],
exp:`デシジョンテーブルのカバレッジは、実行された列の数を実行可能な列の総数で割って測定する。リスクレベルが高い場合、TAは最小化を控え、完全なデシジョンテーブルの実行可能な列のカバレッジを測定すべきである（3.3.1項）。全組み合わせは3×2×2＝12列。「ゴールド・初回購入Y」は誕生月Y／Nの2列が実現不可能なので、実行可能な列は10列。8÷10＝80%。`,
why:[
 '正解。8÷10＝80%。',
 '実現不可能な2列を含めて12列で割っている（8÷12）。',
 '実行可能な10列のうち2列が実行されていない。',
 '実行可能な列の数（10）を全列数（12）で割った値であり、カバレッジではない。'
]},

{id:'L-37',lo:'TA-3.3.2',k:3,pts:2,
stem:`<p>配車アプリの運賃計算は、距離、時間帯、需要に応じた変動係数などを組み合わせた複雑なロジックで、個々の入力に対する正しい運賃をあらかじめ計算することが難しい。TAは、次の2つのメタモルフィック関係（MR）を定義した。</p>
<div class="box">
<p><b>MR1</b>：他の条件を変えずに走行距離を長くすると、運賃は元の運賃より安くならない。</p>
<p><b>MR2</b>：他の条件を変えずに乗車時刻を通常時間帯から深夜時間帯に変えると、運賃は元の運賃より安くならない。</p>
</div>
<p class="ask">このメタモルフィックテストの進め方として、最も適切なものはどれか。</p>`,
opts:[
 'ソーステストケースとフォローアップテストケースをテストプロシジャーに結合して合同で評価する。MR1とMR2を組み合わせたフォローアップテストケース（距離を延ばし、かつ深夜帯にする）も作れる。乱数で多くのソーステストケースを生成するなどランダムテストと組み合わせ、各MRを1回カバーするだけで終えないようにする。',
 'フォローアップテストケースの実行結果を、事前に計算した運賃と個別に比較して評価する。',
 '各MRを1回ずつカバーすれば十分なので、ソーステストケース1件とフォローアップテストケース2件で終了する。',
 'テストが不合格になった場合は、フォローアップテストケースが誤っていると判断し、ソーステストケースは調べない。'
],
ans:[0],
exp:`TAはMRのソーステストケースとフォローアップテストケースをテストプロシジャーに結合し、合同でテスト結果を評価する。テストオラクル問題がある場合は、個別には評価できない。2つ以上のMRを組み合わせてフォローアップテストケースを作成することもできる。有用な終了基準となるカバレッジ尺度は認められておらず、各MRを1回カバーするだけでは不十分である。ランダムテストと組み合わせて多くのテストケースを生成できる。故障の場合、デバッグではどのテストケースが不合格となったかを判断しなければならない（3.3.2項）。`,
why:[
 '正解。',
 '正しい運賃をあらかじめ計算できないため、個別の評価はできない。ソースとフォローアップを合わせて関係を評価する。',
 '各MRを1回カバーするだけでは、期待結果の部分的な検証しかできず不十分である。',
 '故障の場合、後続のデバッグで、関係する個々のテストケースのどれが不合格となったかを判断しなければならない。'
]},

{id:'L-38',lo:'TA-3.4.1',k:3,pts:2,
stem:`<p>倉庫管理システムの「在庫引当」機能について、前回までのセッションベースドテストで次の問題があった。</p>
<div class="box">
<p>・予約在庫の仕様上、在庫数が一時的にマイナス表示になるのは正しい動作だが、それを知らないTAが欠陥として報告した（偽陽性）。</p>
<p>・あるセッションでは、対象外の帳票出力の確認に時間の大半が使われた。</p>
<p>・セッション中に気づいた疑問やテストのアイデアが、どこにも残っていなかった。</p>
</div>
<p class="ask">次のテストチャーターとセッションの進め方の改善として、最も適切なものはどれか。</p>`,
opts:[
 'テストスコープにテストしない内容（帳票出力）を明記し、予約在庫の仕様などのプロダクト関連情報と、「引当可能数を超える確定注文を作ってはならない」という制限を加える。セッション中の質問、観察、将来のテストのアイデアはテスト結果とともにセッションシートに記録する。',
 'チャーターに、実行すべきテストケースの一覧を追加して、TAが対象外の領域を触らないようにする。',
 'TAの柔軟性を最大にするため、チャーターの情報をミッションだけに減らす。',
 'チャーターはセッションの終了後に、実際に行った内容をもとに作成する。'
],
ans:[0],
exp:`テストチャーターには、テストスコープ（テストしない内容の記述を含む）、プロダクト関連情報、制限（プロダクトが絶対にやってはならないこと）などの追加情報を含められる。システムが絶対にできないことなどの追加情報は、偽陽性結果を報告する可能性を低くできる。テストセッション中、TAはテスト結果とともに質問、観察、将来のテストに関するアイデアなどをセッションシートに記録する。テストチャーターは、各テストセッションで実行するテストスイートを指定するものではない（3.4.1項）。`,
why:[
 '正解。3つの問題それぞれに対応している。',
 'テストチャーターは、各セッションで実行するテストスイートを指定するものではない。',
 '情報を減らすと、偽陽性や対象外の領域への脱線がかえって増える。',
 'テストチャーターはテストのロードマップとして、セッションに構造を与えるものである。事後に作るのでは役に立たない。'
]},

{id:'L-39',lo:'TA-3.4.2',k:3,pts:2,
stem:`<p>TAは、ECサイトの商品検索について、探索的テストで思考を導き、さらに調査するためのアイデアを得る「確認する（タイプの）チェックリスト」を作ろうとしている。</p>
<p class="ask">このチェックリストの項目の組み合わせとして、最も適切なものはどれか。</p>`,
opts:[
 '「検索結果は検索語に関連しているか」「結果が0件のとき、代わりの候補や条件の見直しが案内されるか」「並べ替えた後も絞り込み条件が保持されているか」',
 '「検索窓に次の値を入力する：空白のみ、1,000文字の文字列、&lt;script&gt;、絵文字、全角英数字」',
 '「検索をいろいろ試す」「問題がないか見る」「使いやすいか確認する」',
 '「1. トップページを開く 2. 検索窓をクリックする 3. 『靴』と入力する 4. Enterキーを押す 5. 結果の1件目をクリックする」'
],
ans:[0],
exp:`確認するチェックリストは、思考プロセスを導く補助として機能し、アプリケーションをさらに調査するための経験ベースのテストアイデアを提供する（例：検索結果に関連性があるかを確認する）。一方、実行チェックリストには、チェックすべき入力フィールドの具体的な無効入力のような要素が含まれる。チェックリスト項目は明確・具体的で、「はい」「いいえ」「該当しない」で答えられる質問として作るべきであり、チェックリストは包括的なハウツーガイドではない（3.4.2項）。`,
why:[
 '正解。思考を導く、「はい／いいえ」で答えられる具体的な質問になっている。',
 '具体的な無効入力を並べた実行チェックリストの項目であり、求められている「確認する」タイプではない。',
 '曖昧で、「はい／いいえ」で答えられない。',
 '詳細な手順のハウツーであり、チェックリストの項目ではない。'
]},

{id:'L-40',lo:'TA-3.5.2',k:2,pts:1,
stem:`<p>保険の申込フローについて、TAが状態遷移モデルを作り、モデルベースドテストツールでテストケースを自動生成することを提案した。プロジェクトマネージャーは次のように発言した。</p>
<div class="box"><p>「モデルさえ作れば、すべてのテスト条件が自動的にカバーされるし、生成後の保守もほとんど要らないんだよね。」</p></div>
<p class="ask">この発言に対するTAの説明として、最も適切なものはどれか。</p>`,
opts:[
 'モデリング自体がテストベースの評価につながる、Nスイッチのような複雑なカバレッジ基準を適用しやすい、保守対象をモデルに集約できる、といった利点がある。一方で、モデルに表されていないテスト条件の見落とし、モデルの保守工数の過小評価、ステークホルダーがモデルを理解しにくいといったリスクもある。',
 'ツールはモデルに含まれていないテスト条件も自動的に補ってテストケースを生成するので、発言のとおりである。',
 'テスト設計を自動化すると、組み合わせテストやNスイッチカバレッジのような複雑な技法は使えなくなる。',
 '自動生成されたテストケースは手作業より欠陥が多いので、テスト設計の自動化は避けるべきである。'
],
ans:[0],
exp:`テスト設計の自動化の利点には、欠陥予防（モデリングはテストベースの品質を評価する効果的な方法）、対応能力の拡張（組み合わせテスト、ランダムテスト、Nスイッチカバレッジなどの適用）、繰り返し作業の削減、メンテナンス工数の削減（テストモデルだけを保守すればよい）、テストウェアの欠陥削減、トレーサビリティの強化などがある。リスクには、モデルに示されていないテスト条件の見落とし、テストモデルのメンテナンス工数の過小評価、ステークホルダーがモデルを理解しにくいと感じることなどがある（3.5.2項）。`,
why:[
 '正解。利点とリスクの両方を説明している。',
 'モデルに示されていないテスト条件は見落とされる。これはテスト設計の自動化のリスクである。',
 '逆である。自動化により、より複雑なテスト技法やカバレッジ基準を適用できるようになる。',
 'ツールで生成されたテストウェアは品質と一貫性が高く、手作業によるエラーを減らせるとされている。'
]},

{id:'L-41',lo:'TA-3.5.1',k:4,pts:3,
stem:`<p>オンライン証券の新システムについて、TAはテストマネージャーとテスト技法を検討している。次の3つの状況がある。</p>
<div class="box">
<p><b>(1)</b> 顧客との契約で、受け入れ基準として業務シナリオ一式（口座開設から初回取引まで）が提示されている。</p>
<p><b>(2)</b> 過去3回のリリースで、入力欄の文字種チェック漏れという同じ種類の欠陥が繰り返し本番で見つかっている。</p>
<p><b>(3)</b> 最も重要な約定処理のテストで、チームの誰も使ったことのないメタモルフィックテストを初めて試したいという意見が出ている。約定処理の期待結果は仕様書から導出できる。</p>
</div>
<p class="ask">技法の選択についての判断として、最も適切なものはどれか。</p>`,
opts:[
 '(1) シナリオベースドテストを使う。(2) その種類の欠陥の検出に焦点を当てたチェックリストベースドテストを取り入れる。(3) 重要な約定処理では不慣れな技法は避け、仕様書から期待結果を導出して、TAが精通している技法でテストする。',
 '(1) 契約の指定にかかわらず、TAが得意なドメインテストだけを使う。(2) 繰り返し発生している欠陥はすでに既知なので、特別な対応はしない。(3) メタモルフィックテストを約定処理に適用する。',
 '(1) シナリオベースドテストを使う。(2) チェックリストベースドテストを取り入れる。(3) 新しい技法の経験を積むため、最も重要な約定処理にメタモルフィックテストを適用する。',
 '(1) 探索的テストだけで受け入れ基準を確認する。(2) ランダムテストで文字種の欠陥を探す。(3) 期待結果が導出できないので、経験ベースのテストだけを使う。'
],
ans:[0],
exp:`技法の選択には、顧客および契約要件（例：顧客から提供されたシナリオによる受け入れ基準はシナリオベースドテストの使用を示唆する）、繰り返し発生する欠陥タイプに関する知識（その種の欠陥の検出に焦点を当てた技法、例えばチェックリストベースドテストを選ぶ）、テスト担当者の知識と経験（精通していない技法を重要なテスト課題で使うことは推奨されない）などが影響する。メタモルフィックテストは、テストベースからテストオラクルを導出することが不可能または困難な場合に適用できる（3.5.1項）。`,
why:[
 '正解。3つの要因それぞれに沿った判断である。',
 '契約要件と繰り返し発生する欠陥タイプの知識は、技法の選択に影響する要因である。また、(3)は期待結果を導出できるうえ、不慣れな技法を重要な課題で使うことは推奨されない。',
 '(3)が不適切。TAが精通していない技法を重要なテスト課題で使うことは推奨されない。',
 '(1)は契約のシナリオに沿う技法、(2)は繰り返す欠陥タイプに焦点を当てた技法が適する。(3)は期待結果を仕様書から導出できる。'
]},

{id:'L-42',lo:'TA-4.3.1',k:2,pts:1,
stem:`<p>店舗スタッフが使う業務用タブレットアプリについて、次の変更を予定している。</p>
<div class="box">
<p>・対応OSに新しいメジャーバージョンを追加し、画面サイズの異なる新機種2種も対象に加える。</p>
<p>・アプリをv4からv5にアップデートし、既存の設定と未送信データを引き継ぐ。</p>
<p>・テスト自動化エンジニアが、主要画面のクロスプラットフォーム自動テストを用意している。</p>
</div>
<p class="ask">柔軟性テスト（適応性テストとインストール性テスト）へのTAの貢献として、最も適切なものはどれか。</p>`,
opts:[
 '対象となるOSバージョンと機種を早期に定義し、組み合わせテストで環境の組み合わせをカバーする。プロダクトリスクに応じてスモークテストか包括的なテストスイートを選び、自動化されたクロスプラットフォームテストも活用する。アップデートについては、さまざまな環境での手順の実行、アップデート後の正しい動作（設定と未送信データの引き継ぎ）、手順のわかりやすさを確認する。',
 'インストーラーが最後までエラーなく動作することだけを確認すれば、インストール性テストとして十分である。',
 '新しい環境への適応は、テスト自動化エンジニアの自動テストがすべて担うので、TAは関与しない。',
 'アプリが他のアプリと干渉せずに同じ端末で動作できることの確認に集中する。'
],
ans:[0],
exp:`TAは、意図する対象環境を識別し、組み合わせテストなどでその組み合わせをカバーするテストを設計して適応性テストを支援し、プロダクトリスクに応じてスモークテストか包括的なテストスイートを選ぶ。自動化されたクロスプラットフォームテストもTAの作業を支援する。インストール性テストは単に手順が完了まで動くかのチェックではなく、さまざまな環境での手順の実行、インストールやアップデート後の正しい動作、操作の容易さ（文書のレビューを含む）などを目的とする（4.3節）。`,
why:[
 '正解。',
 'インストール性テストは、単にインストール手順が完了まで動くかをチェックするだけではない。',
 '自動化されたクロスプラットフォームテストはTAの作業を支援するものであり、TAは対象環境の識別とテスト設計で適応性テストに貢献する。',
 '他と干渉せずに環境を共有できるかは共存性テストであり、TTAシラバスで扱う。'
]},

{id:'L-43',lo:'TA-4.4.1',k:2,pts:1,
stem:`<p>冷凍食品の物流で、トラックの温度センサーがクラウドの監視サービスにデータを送り、監視サービスが配送管理アプリに警告を連携する。センサーは華氏とUTCの時刻で送信し、監視サービスは摂氏と日本時間に変換して保存する。設計書には連携の一部しか書かれていないが、アーキテクチャー文書にはメッセージの流れが図示されている。</p>
<p class="ask">この相互運用性テストへのTAの取り組みとして、最も適切なものはどれか。</p>`,
opts:[
 'アーキテクチャー文書や設計文書から相互作用を把握してテスト条件を定義し、単位と時刻の変換を検証する。交換されるデータにはデータに基づく技法、警告の解釈と使用には振る舞いに基づく技法、変換とエンドツーエンドの機能性にはルールに基づく技法を使い、主に統合テストで行う。',
 '設計書に書かれていない相互作用は仕様外なので、テストの対象から外す。',
 '3つのシステムが同じクラウド環境で互いに干渉せずに動作することの確認に集中する。',
 '相互運用性の問題は本番運用で監視すれば見つかるので、リリース後の監視に任せる。'
],
ans:[0],
exp:`相互運用性テストの目的は、システムが情報を交換でき、交換した情報を相互に利用できることの検証で、データ変換を伴う場合はその検証を含めなければならない。すべての相互作用が文書化されているとは限らず、TAはアーキテクチャーや設計文書から間接的に情報を取得できる。交換データにはデータに基づく技法、データの解釈や使用には振る舞いに基づく技法、データ変換やエンドツーエンドの機能性にはルールに基づく技法が適し、通常は統合テスト中に適用する（4.4節）。`,
why:[
 '正解。',
 'すべての相互作用が文書化されているとは限らない。TAはアーキテクチャーや設計文書から相互作用の情報を得て、重要な側面を確実にテストする。',
 '他と干渉せずに環境を共有できるかは共存性テストであり、相互運用性テストではない。',
 '相互運用性テストは通常、統合テスト中に適用する。本番での監視に任せるのは不適切である。'
]},

{id:'L-44',lo:'TA-5.2.2',k:3,pts:2,pick:2,
stem:`<p>TAは、プロジェクト用に調整した次のチェックリストを使って、ユーザーストーリーをレビューしている。</p>
<div class="box">
<p><b>C1</b>：受け入れ基準は、合否を判定できる具体的な表現か</p>
<p><b>C2</b>：用語は用語集と一致しているか（用語集では「発送」を使う）</p>
<p><b>C3</b>：例外時の振る舞いが定義されているか</p>
</div>
<div class="box">
<p><b>ストーリー</b>：会員として、注文をキャンセルしたい。そうすれば、不要な支払いを避けられる。</p>
<p><b>AC1</b>：発送前の注文はキャンセルできる。</p>
<p><b>AC2</b>：キャンセルが完了したら、速やかに返金される。</p>
</div>
<p class="ask">このチェックリストを適用して検出される不正はどれか。2つ選べ。</p>`,
opts:[
 'AC2の「速やかに」では、返金のタイミングの合否を判定できない（C1）。',
 '発送後の注文をキャンセルしようとした場合の振る舞いが定義されていない（C3）。',
 'AC1の「発送」が用語集と一致していない（C2）。',
 'ストーリーに、得られる価値（理由）が書かれていない。',
 'チェックリストに載っていない観点なので、AC1とAC2の関係については検討しなくてよい。'
],
ans:[0,1],
exp:`チェックリストベースドレビューでは、あらかじめ定義されたチェックリストに照らしてテストベースを評価する。TAはチェックリストをテストベースのタイプやリスクレベルに合わせて調整する。チェックリストはすべてを網羅するものではないので、TAのチェックはリストの項目に限定されない（5.2.2項）。`,
why:[
 '正解。「速やかに」は曖昧で、判定できる具体的な表現になっていない。',
 '正解。キャンセルできない場合（発送後）の振る舞いがない。',
 '用語集どおり「発送」を使っているので、不一致はない。',
 '「そうすれば、不要な支払いを避けられる」という理由が書かれている。',
 'チェックリストはすべてを網羅するものではない。TAのチェックはリストの項目に限定されない。'
]},

{id:'L-45',lo:'TA-5.3.2',k:2,pts:1,
stem:`<p>あるSaaS企業では、毎月200件前後の欠陥が報告される。現在は次のように運用している。</p>
<div class="box">
<p>・テストチームは独自の分類で、運用チームは重要度だけで欠陥を記録している。</p>
<p>・重大な欠陥が出るたびに、専門家が1件ずつ詳細に調査して予防処置計画を立てているが、件数が多く追いつかない。</p>
</div>
<p>TAは、根本原因分析（RCA）を効果的に支援するための改善を提案したい。</p>
<p class="ask">提案として、最も適切なものはどれか。</p>`,
opts:[
 '欠陥の報告時と修正時の両方で、相互に排他的な属性で分類する直交欠陥分類（ODC）のような分類法を採用し、初期のテストから本番まで統一して適用する。分類した欠陥の種類ごとにRCAを行い、組織内で分類の標準化を支援する。',
 '1件ずつの詳細な調査をさらに徹底し、すべての欠陥について個別に予防処置計画を立てる。',
 'テストチームと運用チームは目的が異なるので、それぞれの分類を今後も使い続ける。',
 'RCAには手間がかかるので、欠陥の症状を素早く修正することに集中する。'
],
ans:[0],
exp:`古典的なRCAでは欠陥ごとに専門家が詳細に調査するが、欠陥ごとに予防処置計画を立てるのは非常に非効率で時間がかかる。欠陥を分類し、発生した欠陥の種類に対してRCAを行うのが1つのアプローチである。RCAを効果的に支援するため、欠陥はSDLC全体を通して統一的に分類されるべきで、TAは組織の欠陥分類の標準化を支援すべきである。ODCは各欠陥を直交する属性に分類し、報告時と修正時の両方で収集する（5.3.2項）。`,
why:[
 '正解。',
 '欠陥ごとに予防処置計画を立てることは非常に非効率で時間がかかる。',
 '分類がばらばらだと、SDLC全体を通した欠陥の傾向を分析できない。欠陥は初期のテストから本番まで統一的に分類すべきである。',
 'RCAの一番の目的は欠陥の再発を予防することであり、症状の修正だけでは再発を防げない。'
]},

];
Q.forEach(q=>{ q.ch=+q.lo.split('-')[1][0]; });

/* ---------------- 学習履歴（回をまたいで保持） ---------------- */
let H = (()=>{ try{ const v=JSON.parse(localStorage.getItem(HKEY)); return v&&v.q?v:{n:0,q:{}}; }catch(e){ return {n:0,q:{}}; } })();
function saveH(){ try{ localStorage.setItem(HKEY, JSON.stringify(H)); }catch(e){} }

function weight(q){ const h=H.q[q.id];
  let w = !h ? 3 : h.last===0 ? 4 : 1;
  if(h && h.s===H.n) w *= 0.3;
  return w; }
function wpick(cands){ const ws=cands.map(weight), sum=ws.reduce((a,b)=>a+b,0); let r=Math.random()*sum;
  for(let i=0;i<cands.length;i++){ r-=ws[i]; if(r<=0) return cands[i]; } return cands[cands.length-1]; }
function canBuild(n){ const p=PLAN[n]; return p.ch.every((c,i)=>Q.filter(q=>q.ch===i+1).length>=c); }
function build(n){
  const p=PLAN[n], out=[];
  /* 章ごとに優先度（未出題・前回不正解）で選んでから、K4の数が範囲に入るよう同じ章の中で入れ替える */
  for(let ch=1; ch<=5; ch++){
    for(let k=0; k<p.ch[ch-1]; k++){ const c=Q.filter(q=>q.ch===ch && !out.includes(q)); if(!c.length) break; out.push(wpick(c)); }
  }
  const k4n = () => out.filter(q=>q.k===4).length;
  for(let guard=0; guard<20 && k4n()<p.k4min; guard++){
    const c=Q.filter(q=>q.k===4 && !out.includes(q) && out.some(o=>o.ch===q.ch && o.k!==4)); if(!c.length) break;
    const add=wpick(c), drop=out.filter(o=>o.ch===add.ch && o.k!==4).sort((a,b)=>weight(a)-weight(b))[0];
    out[out.indexOf(drop)]=add;
  }
  for(let guard=0; guard<20 && k4n()>p.k4; guard++){
    const c=Q.filter(q=>q.k!==4 && !out.includes(q) && out.some(o=>o.ch===q.ch && o.k===4)); if(!c.length) break;
    const add=wpick(c), drop=out.filter(o=>o.ch===add.ch && o.k===4).sort((a,b)=>weight(a)-weight(b))[0];
    out[out.indexOf(drop)]=add;
  }
  const lo = q => q.lo.slice(3).split('.').map(Number);
  out.sort((a,b)=>{ const x=lo(a), y=lo(b); for(let i=0;i<3;i++){ if(x[i]!==y[i]) return x[i]-y[i]; } return a.id<b.id?-1:1; });
  return out.map(q=>Q.indexOf(q));
}
function shuffled(n){ const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------------- 状態 ---------------- */
let S = null, tick = null, confirmOpen = false, filter = 'all';
const $ = s => document.querySelector(s);
const main = $('#main'), hdr = $('#hdr');
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function loadSaved(){ try{ const v = JSON.parse(localStorage.getItem(KEY)); return v && v.v===2 && v.list.every(i=>Q[i]) ? v : null; }catch(e){ return null; } }
function clearSaved(){ try{ localStorage.removeItem(KEY); }catch(e){} }
function ids(){ return S.list; }
function perm(i){ return S.perm[i] || Q[i].opts.map((_,k)=>k); }
function letter(i,k){ return L[perm(i).indexOf(k)]; }
function no(i){ return S.list.indexOf(i)+1; }
function isRight(i){ const a=(S.ans[i]||[]).slice().sort().join(','); return a!=='' && a===Q[i].ans.slice().sort().join(','); }
function answered(i){ const q=Q[i], a=S.ans[i]||[]; return a.length === (q.pick||1); }
function remaining(){ return S.mins ? Math.max(0, S.start + S.mins*60000 - Date.now()) : null; }
function fmt(ms){ const t=Math.ceil(ms/1000), h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60; return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s).padStart(2,'0'); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function maxPts(list){ return list.reduce((s,i)=>s+Q[i].pts,0); }
function passPts(list){ return Math.ceil(maxPts(list)*0.65); }

/* ---------------- 開始画面 ---------------- */
let pickN = 15;

  stopTick(); hdr.innerHTML='';
  const saved = loadSaved();

  }).join('');
  const seen = Q.filter(q=>H.q[q.id]).length, wrong = Q.filter(q=>H.q[q.id] && H.q[q.id].last===0).length;
  const sizeOpt = n => { const ok=canBuild(n), pl=PLAN[n];

  main.innerHTML = `<section class="start">
    <div class="cover">
      <div class="eyebrow">CTAL-TA SYLLABUS V4.0.J01 準拠 ／ 長文問題の模擬試験</div>
      <h1>長文問題で、本番の読み方と<br>時間配分を練習する</h1>
      <p>場面設定や表を読み取らせる長文問題だけを集めた模擬試験です。1回15問または20問を、本番の章別の比率に合わせて問題バンクから出題します。まだ解いていない問題と前回間違えた問題を優先し、選択肢の並びは毎回入れ替わります。</p>
      <dl class="specs">
        <div><dt>問題数</dt><dd id="sp-n">${pickN}<small>問</small></dd></div>
        <div><dt>試験時間</dt><dd id="sp-m">${p.mins}<small>分</small></dd></div>
        <div><dt>配点</dt><dd>1〜3<small>点（K2・K3・K4）</small></dd></div>
        <div><dt>合格ライン</dt><dd>65<small>%（回ごとに計算）</small></dd></div>
      </dl>
      ${saved ? `<div class="resume"><p>${saved.done?'前回の採点結果が保存されています。':'解答途中の試験があります（'+saved.list.length+'問、'+(saved.mode==='exam'?'本番モード':'学習モード')+'、'+Object.keys(saved.ans).length+'問解答済み）。'}</p><button class="btn primary" data-act="resume">${saved.done?'結果を見る':'続きから再開'}</button><button class="btn ghost" data-act="discard">破棄する</button></div>`:''}
    </div>
    <div class="grid2">
      <div class="panel">
        <h2>章別の出題数</h2>
        <div class="tblwrap"><table class="tbl"><thead><tr><th>章</th><th class="c">本番</th><th class="c">この回</th><th class="c">収録</th></tr></thead><tbody>${rows}
        <tr><th>合計</th><th class="c mono">45</th><th class="c mono">${pickN}</th><th class="c mono">${Q.length}</th></tr></tbody></table></div>
        <div class="pool"><span>収録 <b>${Q.length}</b> / ${PLANNED}問（第${Math.ceil(Q.length/15)}弾まで）</span><span>解いた問題 <b>${seen}</b></span><span>前回不正解 <b>${wrong}</b></span></div>
        <p class="note">第3章の比率が高いのは本番と同じです。収録数が増えると、毎回違う組み合わせで出題されます。</p>
      </div>
      <div class="panel">
        <h2>受験の設定</h2>
        <div class="choice inline" role="radiogroup" aria-label="問題数">${sizeOpt(15)}${sizeOpt(20)}</div>
        <div class="choice" role="radiogroup" aria-label="モード">
          <label><input type="radio" name="mode" id="m-exam" value="exam" checked><div><b>本番モード</b><span>制限時間あり。解答と解説は終了後にまとめて表示します。</span></div></label>
          <label><input type="radio" name="mode" id="m-study" value="study"><div><b>学習モード</b><span>時間制限なし。1問ごとに正誤と解説を確認できます。</span></div></label>
