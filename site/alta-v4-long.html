/* ---------------- 試験画面 ---------------- */
function begin(mode, mins, list, retry){
  const pm={}; list.forEach(i=>pm[i]=shuffled(Q[i].opts.length));
  S = {v:2, mode, mins: mode==='exam'?mins:0, start:Date.now(), list, perm:pm, ans:{}, flag:{}, rev:{}, pos:0, done:false, end:null, retry:!!retry, recorded:false};
  confirmOpen=false; save(); renderExam();
}
function startTick(){
  stopTick();
  if(!S.mins) return;
  tick = setInterval(()=>{
    const r=remaining();
    const el=$('#clock'); if(el){ el.textContent=fmt(r); el.parentElement.classList.toggle('warn', r<S.mins*60000/12); }
    if(r<=0){ finish(); }
  },1000);
}
function stopTick(){ if(tick){ clearInterval(tick); tick=null; } }

function renderHeader(){
  const list=ids(), n=list.filter(answered).length;
  hdr.innerHTML = `<span class="prog">解答済み <b class="mono">${n}</b> / ${list.length}</span>`+
    (S.mins ? `<div class="timer${remaining()<S.mins*60000/12?' warn':''}"><small>残り時間</small><span class="mono" id="clock">${fmt(remaining())}</span></div>` : `<span class="chip">学習モード</span>`);
}

function renderExam(){
  renderHeader(); startTick();
  const list=ids(), i=list[S.pos], q=Q[i], a=S.ans[i]||[];
  const study=S.mode==='study', shown=study && S.rev[i];
  const optsHtml = perm(i).map((k,d)=>{
    let cls='opt';
    if(a.includes(k)) cls+=' sel';
    if(shown){ if(q.ans.includes(k)) cls+=' right'; else if(a.includes(k)) cls+=' wrong'; }
    return `<li><button class="${cls}" data-opt="${k}" ${shown?'disabled':''} aria-pressed="${a.includes(k)}"><span class="bubble">${L[d]}</span><span class="t">${q.opts[k]}</span></button></li>`;
  }).join('');
  const cells = list.map((qi,p)=>{
    let c='cell'; if(answered(qi)) c+=' ans'; if(S.flag[qi]) c+=' flg'; if(p===S.pos) c+=' cur';
    if(study && S.rev[qi]) c+= isRight(qi)?' ok':' ng';
    return `<button class="${c}" data-go="${p}" aria-label="問${p+1}">${p+1}</button>`;
  }).join('');
  const unanswered = list.filter(x=>!answered(x)).length;
  main.innerHTML = `<section class="exam">
    <article class="qcard" aria-live="polite">
      <div class="qhead"><span class="qno">問${S.pos+1}</span><span class="chip pts">${q.pts}点</span>${q.pick?'<span class="chip">2つ選択</span>':''}
        ${shown?`<span class="chip lo">${q.lo}</span><span class="chip">K${q.k}</span>`:''}
        ${S.flag[i]?'<span class="chip flagc">見直し</span>':''}</div>
      <div class="stem">${q.stem}</div>
      <ul class="opts">${optsHtml}</ul>
      <p class="hint" id="hint"></p>
      ${shown?explainHtml(i):''}
      <div class="nav">
        <div class="row"><button class="btn" data-act="prev" ${S.pos===0?'disabled':''}>← 前の問題</button>
        <button class="btn ${S.flag[i]?'flagged':''}" data-act="flag">${S.flag[i]?'見直しを解除':'見直しに印'}</button></div>
        <div class="row">${study && !shown ? `<button class="btn" data-act="reveal" ${answered(i)?'':'disabled'}>解答を確認</button>`:''}
        ${S.pos<list.length-1?`<button class="btn primary" data-act="next">次の問題 →</button>`:`<button class="btn primary" data-act="ask-finish">${study?'結果を見る':'解答を終了する'}</button>`}</div>
      </div>
    </article>
    <aside class="sheet" aria-label="解答状況">
      <h3>解答状況<span>${list.length-unanswered}/${list.length}</span></h3>
      <div class="cells">${cells}</div>
      <div class="legend"><span><i class="a"></i>解答済み</span><span><i class="f"></i>見直し</span><span><i></i>未解答</span></div>
      ${confirmOpen ? `<div class="confirm"><p>${unanswered?`<b>未解答が${unanswered}問</b>あります。`:'すべて解答済みです。'}${list.some(x=>S.flag[x])?` 見直しの印が${list.filter(x=>S.flag[x]).length}問に付いています。`:''}このまま採点しますか？</p><div class="row"><button class="btn danger" data-act="finish">採点する</button><button class="btn" data-act="cancel">戻る</button></div></div>`
        : `<button class="btn" data-act="ask-finish">${study?'結果を見る':'解答を終了して採点'}</button>`}
      <button class="btn ghost" data-act="home">トップへ戻る（中断）</button>
    </aside>
  </section>`;
}

function explainHtml(i){
  const q=Q[i], ok=isRight(i), a=S.ans[i]||[];
  return `<div class="explain">
    <div class="verdict ${ok?'ok':'ng'}">${ok?'○ 正解':'× 不正解'}<span class="chip">正解：${q.ans.map(k=>letter(i,k)).sort().join('、')}</span>${a.length?`<span class="chip">あなたの解答：${a.map(k=>letter(i,k)).sort().join('、')}</span>`:'<span class="chip">未解答</span>'}</div>
    <p>${q.exp}</p>
    <ul class="why">${perm(i).map((k,d)=>`<li class="${q.ans.includes(k)?'ok':''}"><b>${L[d]}</b><span>${q.why[k]}</span></li>`).join('')}</ul>
  </div>`;
}

function choose(k){
  const list=ids(), i=list[S.pos], q=Q[i];
  if(S.mode==='study' && S.rev[i]) return;
  let a=(S.ans[i]||[]).slice();
  if((q.pick||1)===1){ a=[k]; }
  else if(a.includes(k)){ a=a.filter(x=>x!==k); }
  else if(a.length>=q.pick){ const h=$('#hint'); if(h) h.textContent='この問題は2つまで選べます。選び直す場合は、選択済みの選択肢をもう一度押して解除してください。'; return; }
  else a.push(k);
  S.ans[i]=a; save(); renderExam();
}
function go(p){ const list=ids(); S.pos=Math.max(0,Math.min(list.length-1,p)); confirmOpen=false; save(); renderExam(); window.scrollTo({top:0}); }
function record(){
  if(S.retry || S.recorded) return;
  H.n++;
  S.list.forEach(i=>{ const q=Q[i], h=H.q[q.id]||{seen:0,ok:0}; const r=isRight(i);
    H.q[q.id]={seen:h.seen+1, ok:h.ok+(r?1:0), last:r?1:0, s:H.n}; });
  S.recorded=true; saveH();
}
function finish(){
  stopTick(); S.done=true; S.end=Date.now(); confirmOpen=false; filter='all'; record(); save(); renderResult(); window.scrollTo({top:0});
}

/* ---------------- 結果画面 ---------------- */
function renderResult(){
  stopTick();
  const list=ids(), full=!S.retry;
  const got=list.reduce((s,i)=>s+(isRight(i)?Q[i].pts:0),0);
  const max=maxPts(list), PASS=passPts(list);
  const nRight=list.filter(isRight).length;
  const pass = got>=PASS;
  const used = S.end && S.start ? S.end - S.start : 0;
  hdr.innerHTML = `<span class="chip">${full?'採点結果':'解き直し結果'}</span>`;
  const bar=(lbl,g,m)=>{ const pct=m?g/m*100:0; return `<div class="barrow"><span class="lbl">${lbl}</span><span class="num">${g} / ${m}</span><div class="track"><div class="fill${pct<65?' low':''}" style="width:${pct}%"></div></div></div>`; };
  const chBars=[1,2,3,4,5].map(c=>{ const xs=list.filter(i=>Q[i].ch===c); if(!xs.length) return ''; return bar(CH[c], xs.reduce((s,i)=>s+(isRight(i)?Q[i].pts:0),0), xs.reduce((s,i)=>s+Q[i].pts,0)); }).join('');
  const kBars=[2,3,4].map(k=>{ const xs=list.filter(i=>Q[i].k===k); if(!xs.length) return ''; return bar(`K${k}（${k===2?'理解':k===3?'適用':'分析'}・${Q[xs[0]].pts}点問題）`, xs.reduce((s,i)=>s+(isRight(i)?Q[i].pts:0),0), xs.reduce((s,i)=>s+Q[i].pts,0)); }).join('');
  const wrong=list.filter(i=>!isRight(i));
  const shownList = list.filter(i=> filter==='all' || (filter==='ng' && !isRight(i)) || (filter==='flag' && S.flag[i]));
  const pace = full && S.mode==='exam' && used ? `<span>1問あたり <b>${fmt(used/list.length)}</b>（目安 ${fmt(S.mins*60000/list.length)}）</span>` : '';
  main.innerHTML = `<section class="result">
    <div class="scorecard">
      <div class="score">
        <span class="eyebrow">得点</span>
        <span class="big">${got}<small> / ${max}点</small></span>
        ${full?`<span class="stamp ${pass?'pass':'fail'}">${pass?'合格圏':'合格圏外'}</span>`:''}
      </div>
      <div class="meter">
        ${full?`<div class="track" style="margin-top:28px"><div class="fill" style="width:${got/max*100}%"></div><div class="cut" style="left:${PASS/max*100}%"></div><span class="cutlbl" style="left:${PASS/max*100}%">65%ライン ${PASS}点</span></div>`:''}
        <div class="facts"><span>正答 <b>${nRight}</b> / ${list.length}問</span><span>得点率 <b>${Math.round(got/max*100)}%</b></span>${full&&S.mode==='exam'?`<span>所要時間 <b>${fmt(used)}</b> / ${S.mins}分</span>`:''}${pace}${full&&!pass?`<span>65%まで <b>${PASS-got}</b>点</span>`:''}</div>
        <div class="row">${wrong.length?`<button class="btn primary" data-act="retry">間違えた${wrong.length}問を学習モードで解き直す</button>`:''}<button class="btn" data-act="home">トップへ戻る</button></div>
      </div>
    </div>
    <div class="grid2">
      <div class="panel"><h2>章別の得点</h2><div class="bars">${chBars}</div><p class="note">赤いバーは得点率65%未満の章です。1回の問題数が少ないため、章別の値は目安です。</p></div>
      <div class="panel"><h2>Kレベル別の得点</h2><div class="bars">${kBars}</div><p class="note">K3・K4は配点が大きく、合否を左右します。</p></div>
    </div>
    <div class="panel">
      <div class="row" style="justify-content:space-between"><h2>解答と解説</h2>
      <div class="filters" role="group" aria-label="絞り込み">
        <button class="btn" data-filter="all" aria-pressed="${filter==='all'}">すべて（${list.length}）</button>
        <button class="btn" data-filter="ng" aria-pressed="${filter==='ng'}">不正解（${wrong.length}）</button>
        <button class="btn" data-filter="flag" aria-pressed="${filter==='flag'}">見直し印（${list.filter(i=>S.flag[i]).length}）</button></div></div>
      <div class="review">${shownList.map(i=>reviewItem(i)).join('') || '<p class="note">該当する問題はありません。</p>'}</div>
    </div>
  </section>`;
}
function reviewItem(i){
  const q=Q[i], ok=isRight(i), a=S.ans[i]||[];
  const title = q.stem.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  const opts = perm(i).map((k,d)=>{ let c='opt'; if(a.includes(k)) c+=' sel'; if(q.ans.includes(k)) c+=' right'; else if(a.includes(k)) c+=' wrong'; return `<li><div class="${c}"><span class="bubble">${L[d]}</span><span class="t">${q.opts[k]}</span></div></li>`; }).join('');
  return `<details class="ritem"><summary><span class="mk ${ok?'ok':'ng'}">${ok?'○':'×'}</span><span class="rno">問${no(i)}</span><span class="rtitle">${esc(title)}</span><span class="chip lo">${q.lo}・K${q.k}・${q.pts}点</span></summary>
    <div class="rbody"><div class="stem">${q.stem}</div><ul class="opts">${opts}</ul>${explainHtml(i)}</div></details>`;
}

/* ---------------- イベント ---------------- */
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-act],[data-opt],[data-go],[data-filter]'); if(!t) return;
  if(t.dataset.opt!==undefined){ choose(+t.dataset.opt); return; }
  if(t.dataset.go!==undefined){ go(+t.dataset.go); return; }
  if(t.dataset.filter){ filter=t.dataset.filter; renderResult(); return; }
  const act=t.dataset.act;
  if(act==='begin'){ if(!canBuild(pickN)) return; const mode=$('#m-study').checked?'study':'exam'; const p=PLAN[pickN];
    begin(mode, Math.round(p.mins*($('#t-ext').checked?1.25:1)), build(pickN)); window.scrollTo({top:0}); }
  else if(act==='resume'){ S=loadSaved(); if(!S) return renderStart(); if(S.done) renderResult(); else if(S.mins && remaining()<=0) finish(); else renderExam(); }
  else if(act==='discard'){ clearSaved(); renderStart(); }
  else if(act==='ask-reset'){ $('#resetbox').innerHTML = `<div class="confirm"><p>${Object.keys(H.q).length}問分の学習履歴を消去します。保存中の試験も破棄されます。</p><div class="row"><button class="btn danger" data-act="do-reset">消去する</button><button class="btn" data-act="no-reset">やめる</button></div></div>`; }
  else if(act==='no-reset'){ $('#resetbox').innerHTML=''; }
  else if(act==='do-reset'){ H={n:0,q:{}}; saveH(); clearSaved(); renderStart(); }
  else if(act==='prev') go(S.pos-1);
  else if(act==='next') go(S.pos+1);
  else if(act==='flag'){ const i=ids()[S.pos]; S.flag[i]=!S.flag[i]; save(); renderExam(); }
  else if(act==='reveal'){ const i=ids()[S.pos]; S.rev[i]=true; save(); renderExam(); }
  else if(act==='ask-finish'){ if(S.mode==='study' && ids().every(i=>S.rev[i])) return finish(); confirmOpen=true; renderExam(); const c=$('.confirm'); if(c) c.scrollIntoView({block:'nearest'}); }
  else if(act==='cancel'){ confirmOpen=false; renderExam(); }
  else if(act==='finish') finish();
  else if(act==='retry'){ const wrong=ids().filter(i=>!isRight(i)); begin('study',0,wrong,true); window.scrollTo({top:0}); }
  else if(act==='home'){ save(); renderStart(); window.scrollTo({top:0}); }
});
document.addEventListener('keydown', e=>{
  if(!S || S.done || !$('.qcard') || e.altKey || e.ctrlKey || e.metaKey) return;
  if(e.target.closest('input,textarea')) return;
  const k=e.key.toLowerCase(), idx=L.indexOf(k), i=ids()[S.pos], q=Q[i];
  if(idx>-1 && idx<q.opts.length){ choose(perm(i)[idx]); e.preventDefault(); }
  else if(e.key==='ArrowRight'){ go(S.pos+1); }
  else if(e.key==='ArrowLeft'){ go(S.pos-1); }
});

renderStart();
</script>
