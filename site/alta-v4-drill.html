<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AL-TA v4.0 章別ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* レイアウト: 単元カードの一覧（学習の地図）→ 1問ずつのドリル → 小テストの採点票。模擬試験と同じ答案用紙の体裁。 */
:root{
  --paper:#ECEFF3; --sheet:#FFFFFF; --ink:#17202B; --muted:#5A6574; --line:#D2D9E1;
  --accent:#1D4F91; --accent-soft:#E1E9F5; --accent-ink:#FFFFFF;
  --flag:#A35F00; --flag-soft:#FAEED8;
  --good:#1F6F47; --good-soft:#DFF0E6; --bad:#B42318; --bad-soft:#FBE3E0;
  --f-display:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F141B; --sheet:#171E28; --ink:#E4E9EF; --muted:#98A4B3; --line:#2B3644;
    --accent:#86AEE6; --accent-soft:#1D2B3F; --accent-ink:#0F141B;
    --flag:#E2A94B; --flag-soft:#33281A;
    --good:#62C08F; --good-soft:#15291F; --bad:#F2857B; --bad-soft:#36191A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F141B; --sheet:#171E28; --ink:#E4E9EF; --muted:#98A4B3; --line:#2B3644;
  --accent:#86AEE6; --accent-soft:#1D2B3F; --accent-ink:#0F141B;
  --flag:#E2A94B; --flag-soft:#33281A;
  --good:#62C08F; --good-soft:#15291F; --bad:#F2857B; --bad-soft:#36191A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;line-height:1.4;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;min-height:56px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.brand b{font-family:var(--f-display);font-size:16px}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.04em}
.bar .spacer{flex:1}
.prog{font-size:13px;color:var(--muted)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);background:var(--sheet)}
.dot.cur{border-color:var(--ink);border-width:2px}
.dot.ok{background:var(--good);border-color:var(--good)}
.dot.ng{background:var(--bad);border-color:var(--bad)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--sheet);cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent}
.btn.small{min-height:34px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:12.5px;color:var(--muted);margin:0}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;font-size:12px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.lo{font-family:var(--f-mono)}
.chip.k{border-color:var(--accent);color:var(--accent);font-weight:700}

/* menu */
.menu{padding-block:28px 56px;display:grid;gap:22px}
.intro{display:grid;gap:8px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.intro h1{font-size:clamp(22px,3.6vw,30px)}
.intro p{margin:0;max-width:68ch;color:var(--muted)}
.sum{display:flex;gap:8px 22px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sum b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.group{display:grid;gap:10px}
.group h2{font-size:15px;color:var(--muted);font-family:var(--f-body);letter-spacing:.06em}
.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.unit{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px;align-content:start}
.unit.wide{grid-column:1/-1}
.unit.off{background:transparent;border-style:dashed}
.unit.off h3,.unit.off .meta{color:var(--muted)}
.unit h3{font-size:16px}
.unit .meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap}
.unit .meta b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.mastery{display:grid;gap:4px}
.track{position:relative;height:8px;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex}
.seg{height:100%}
.seg.m{background:var(--good)} .seg.s{background:var(--accent);opacity:.55} .seg.w{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.legend i.m{background:var(--good)} .legend i.s{background:var(--accent);opacity:.55} .legend i.w{background:var(--bad)} .legend i.u{border:1px solid var(--line)}
.resume{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;border:1px dashed var(--accent);border-radius:var(--r);background:var(--accent-soft)}
.resume p{margin:0;flex:1;min-width:200px}
.danger-zone{display:grid;gap:10px;justify-items:start}
.confirm{border:1px solid var(--bad);background:var(--bad-soft);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.confirm p{margin:0;font-size:14px}

/* question */
.drill{padding-block:24px 56px;display:grid;gap:16px}
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:24px clamp(16px,3.5vw,36px);display:grid;gap:18px;min-width:0}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qno{font-family:var(--f-display);font-size:20px;font-weight:700}
.stem{display:grid;gap:12px;min-width:0}
.stem p{margin:0}
.stem .box{border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;background:var(--paper)}
.stem .box p+p{margin-top:4px}
.stem ul,.stem ol{margin:0;padding-left:1.4em}
.ask{font-weight:700}
.pick2{display:inline-block;margin-left:6px;padding:0 6px;border:1px solid var(--ink);font-size:12px;border-radius:3px}
.tblwrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--accent-soft);font-weight:700;white-space:nowrap}
.tbl td.c,.tbl th.c{text-align:center}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;background:var(--sheet);text-align:left;width:100%}
.opt:hover{border-color:var(--accent)}
.bubble{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .bubble{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .bubble{border-color:var(--good);color:var(--good)}
.opt.sel.right .bubble{background:var(--good);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bubble{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt[disabled]{cursor:default}
.opt .t{min-width:0}
.hint{font-size:13px;color:var(--flag);margin:0;min-height:1.4em}
.nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px}
.explain{border-top:2px solid var(--ink);padding-top:16px;display:grid;gap:12px}
.verdict{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700}
.verdict.ok{color:var(--good)} .verdict.ng{color:var(--bad)}
.explain p{margin:0}
.why{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.why li{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px}
.why li b{font-family:var(--f-mono);color:var(--muted)}
.why li.ok b{color:var(--good)}

/* result */
.result{padding-block:28px 64px;display:grid;gap:20px}
.scorecard{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:24px clamp(18px,4vw,36px);display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.big{font-family:var(--f-mono);font-size:clamp(40px,8vw,56px);font-weight:600;line-height:1}
.big small{font-size:.42em;color:var(--muted);font-weight:500}
.scorecard .side{display:grid;gap:12px}
.scorecard h2{font-size:18px}
.review{display:grid;gap:10px}
.ritem{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
.ritem summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px}
.ritem summary::-webkit-details-marker{display:none}
.mk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px}
.mk.ok{background:var(--good-soft);color:var(--good)} .mk.ng{background:var(--bad-soft);color:var(--bad)}
.rno{font-family:var(--f-mono);font-weight:600}
.rtitle{font-size:13.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbody{padding:18px clamp(14px,3vw,28px) 22px;display:grid;gap:16px;border-top:1px solid var(--line)}

@media (max-width:720px){
  .units{grid-template-columns:minmax(0,1fr)}
  .scorecard{grid-template-columns:minmax(0,1fr)}
  .ritem summary{grid-template-columns:auto auto minmax(0,1fr)}
  .ritem summary .chip{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="bar">
  <div class="wrap">
    <div class="brand"><b>AL-TA v4.0 章別ドリル</b><span>JSTQB Advanced Level テストアナリスト</span></div>
    <div class="spacer"></div>
    <div id="hdr" class="row"></div>
  </div>
</header>
<main id="main" class="wrap"></main>

<script>
const KEY = 'alta-v4-drill-1';
const L = ['a','b','c','d','e'];

/* 単元。問題がまだない単元は「準備中」として表示する */
const UNITS = [
  {id:'1',   group:'第1章', name:'テストプロセスにおけるテストアナリストのタスク', size:10, los:'SDLCごとの関与・テスト活動のタスク・テストケースの品質基準・テストオラクル・テストデータ・キーワード駆動テスト'},
  {id:'2',   group:'第2章', name:'リスクベースドテストにおけるテストアナリストのタスク', size:5, los:'プロダクトリスク分析への貢献・リグレッションテストの範囲の決定（影響度分析）'},
  {id:'3.1', group:'第3章', name:'3.1 データに基づくテスト技法', size:5, los:'ドメインテスト・組み合わせテスト・ランダムテスト'},
  {id:'3.2', group:'第3章', name:'3.2 振る舞いに基づくテスト技法', size:5, los:'CRUDテスト・状態遷移テスト・シナリオベースドテスト'},
  {id:'3.3', group:'第3章', name:'3.3 ルールに基づくテスト技法', size:5, los:'デシジョンテーブルテスト・メタモルフィックテスト'},
  {id:'3.4', group:'第3章', name:'3.4 経験ベースのテスト', size:5, los:'テストチャーター・チェックリスト・クラウドテスト'},
  {id:'3.5', group:'第3章', name:'3.5 最も適切なテスト技法の適用', size:5, los:'プロダクトリスクに応じた技法選択・テスト設計の自動化'},
  {id:'3',   group:'第3章', name:'第3章まとめ（3.1〜3.5から出題）', size:10, wide:true, los:'第3章の全50問から、苦手な問題を優先して出題'},
  {id:'4',   group:'第4章', name:'品質特性のテスト', size:5, los:'機能適合性の副特性・使用性・適応性とインストール性・相互運用性'},
  {id:'5',   group:'第5章', name:'ソフトウェア欠陥予防', size:10, los:'欠陥予防のメトリクス・モデルによる欠陥検出・レビュー技法・テスト結果の分析・欠陥分類'}
];

/* ---------------- 問題バンク ---------------- */
const BANK = [
/* ===== 第1章 テストプロセスにおけるテストアナリストのタスク ===== */
{id:'D1-01',unit:'1',lo:'TA-1.1.1',k:2,
stem:`<p>医療機器メーカーのプロジェクトでは、シーケンシャル開発モデル（要件定義→設計→実装→テスト）を採用している。各フェーズは前のフェーズが完了してから開始し、フェーズ間の重複はほとんどない。</p>
<p class="ask">このプロジェクトにおけるテストアナリスト（TA）の関与として、最も適切なものはどれか。</p>`,
opts:[
 '初期のフェーズではテスト計画を支援し、テストベースが作成された時点でテスト分析を開始する。テスト設計とテスト実装はソフトウェアの設計・実装と並行して行う。',
 'フェーズ間の重複がないため、TAは実装フェーズが完了するまで関与せず、テストフェーズでテスト分析からテスト実行までをまとめて行う。',
 '各インクリメントに対して同じテスト活動を繰り返し、リファクタリングとリグレッションテストスイートの組み立てに特に注意を払う。',
 'プロトタイピング、テスト、洗練、デプロイのサイクルごとに、開発担当者やビジネス担当者と協力してテスト条件とテストケースを調整する。'
],
ans:[0],
exp:`シーケンシャル開発モデルでは、TAのタスクは時間の経過とともに変化する。初期のフェーズではテスト計画を支援し、テストベースが作成されるときにテスト分析を開始し、テスト設計とテスト実装はソフトウェアの設計・実装と並行して行う。最後にテストを実行し、後期のフェーズでテスト完了を支援する（1.1.1項）。`,
why:[
 '正解。シーケンシャル開発モデルにおけるTAの関与の記述どおり。',
 'TAがSDLCの初期段階から関与することは、すべてのSDLCモデルに共通するよい実践例である。シーケンシャルでもテスト分析はテストベースの作成時に始まる。',
 'インクリメンタル開発モデルでのTAの関与である。',
 'イテレーティブ開発モデルでのTAの関与である。'
]},

{id:'D1-02',unit:'1',lo:'TA-1.1.1',k:2,
stem:`<p>あるアジャイルチームは、スプリントの期間を4週間から1週間に短縮し、毎週リリースすることにした。</p>
<p class="ask">この変更を受けて、TAが特に重視すべきこととして、最も適切なものはどれか。</p>`,
opts:[
 'リグレッションテストの継続的なメンテナンスと拡充',
 'テスト設計とテスト実装をソフトウェアの設計・実装と並行させ、テスト実行は最後のスプリントにまとめること',
 '初回のスプリントで作成したテストケースを固定し、以降のスプリントでは変更しないこと',
 '新規フィーチャーのテストに集中し、リグレッションテストはリリース前の最終スプリントだけで行うこと'
],
ans:[0],
exp:`イテレーションの頻度が高ければ高いほど、TAによるリグレッションテストの継続的なメンテナンスと拡充がより重要になる。アジャイルソフトウェア開発はイテレーティブモデルとインクリメンタルモデルの両方の側面を組み合わせており、TAの関与はSDLCの特性とその組み合わせ方に依存する（1.1.1項）。`,
why:[
 '正解。イテレーションの頻度が高いほど、リグレッションテストの継続的なメンテナンスと拡充が重要になる。',
 'シーケンシャル開発モデルの考え方であり、毎週リリースするチームには合わない。',
 'イテレーティブな開発では、ソフトウェアの進化に合わせてテスト条件やテストケースを調整・修正する。',
 '毎週リリースするのでリグレッションのリスクは高まる。リグレッションテストを最後に回すのは不適切である。'
]},

{id:'D1-03',unit:'1',lo:'TA-1.2.1',k:2,pick:2,
stem:`<p>TAがテスト分析を効果的に進めるために確認する開始基準として、シラバスに挙げられているものはどれか。</p>
<p class="ask">2つ選べ。</p>`,
opts:[
 'テスト計画が行われており、テスト範囲、テスト目的、テストアプローチが明確になっている。',
 'すでに識別したプロダクトリスクについて、必要に応じて評価および文書化をしている。',
 'テスト環境が完全にセットアップされ、スモークテストに合格している。',
 'すべてのテストケースがローレベルテストケースとして設計されている。',
 'テストデータがデータベースに投入されている。'
],
ans:[0,1],
exp:`テスト分析の開始基準として、シラバスは①テスト計画が行われ、テスト範囲・テスト目的・テストアプローチが明確になっている、②テストベースを定義している、③識別済みのプロダクトリスクを必要に応じて評価・文書化している、の3つを挙げている（1.2.1項）。`,
why:[
 '正解。テスト分析の開始基準の1つ。',
 '正解。テスト分析の開始基準の1つ。',
 'テスト環境の準備の検証（スモークテスト）はテスト実装のタスクであり、テスト分析より後に行う。',
 'テストケースの設計はテスト分析の後のテスト設計で行う。',
 'テストデータの投入はテスト実装のタスクである。'
]},

{id:'D1-04',unit:'1',lo:'TA-1.2.1',k:2,
stem:`<p>新しい会員登録機能のユーザーストーリーはまだ洗練されておらず、詳細な受け入れ基準が確定していない。それでも、テスト設計をできるだけ早く開始したい。</p>
<p class="ask">TAのテスト分析の進め方として、最も適切なものはどれか。</p>`,
opts:[
 '「会員登録画面の機能性」のようなハイレベルのテスト条件から始め、ストーリーの洗練に合わせて「会員登録画面は、8文字未満のパスワードを拒否する」のような詳細なテスト条件を段階的に定義する。',
 'テストベースが不完全な状態でテスト条件を定義すると手戻りが発生するので、ストーリーが洗練されるまでテスト分析を開始しない。',
 'テスト条件を定義する代わりに、想定される入力値を使ったローレベルテストケースを直接作成する。',
 'テスト条件はTAだけで定義し、ステークホルダーによるレビューはテスト実行が完了してから行う。'
],
ans:[0],
exp:`TAは、「画面Xの機能性」のようなハイレベルのテスト条件から始めて段階的に詳細なテスト条件を定義できる。このアプローチは十分なカバレッジを支援し、ユーザーストーリーがまだ洗練されていない場合などにテスト設計の早期開始を可能にする。また、TAはステークホルダーを巻き込んでテスト条件をレビューする（1.2.1項）。`,
why:[
 '正解。ハイレベルから詳細へ段階的にテスト条件を定義するアプローチであり、テスト設計の早期開始を可能にする。',
 'シラバスは、ストーリーが洗練されていない段階でもハイレベルのテスト条件から始めることで早期に進められるとしている。',
 'テスト条件はテスト目的に対応し、テストベースにトレーサビリティを持たせて定義する。テスト条件を飛ばすとトレーサビリティとカバレッジの確認ができない。',
 'テスト条件のレビューは、テストベースを理解し、テストがテスト目的に沿っていることを確認するために行う。テスト実行後では遅い。'
]},

{id:'D1-05',unit:'1',lo:'TA-1.2.2',k:2,
stem:`<p>今回のリリースでは、ポイント交換機能が新規に追加され、既存の会員管理機能は変更されていない。</p>
<p class="ask">テスト設計中のTAの判断として、最も適切なものはどれか。</p>`,
opts:[
 'ポイント交換機能の新規テスト条件には品質基準に従ってテストケースを設計し、会員管理機能のリグレッションテストには既存のテストケースを選択または優先順位付けに基づいて調整して対応する。',
 '十分なテストケースが設計されたかどうかは、テストケース数が要件数の2倍に達したかどうかで判断する。',
 '組織が導入しているテスト設計ツールで扱える範囲にテスト設計を限定する。',
 '探索的テストで確認する部分も含め、すべてのテストケースをローレベルで文書化してからテスト設計を終える。'
],
ans:[0],
exp:`TAは新規または変更したテスト条件のためのテストケースを品質基準に従って設計する。リグレッションテストの場合は、既存のハイレベルテストケースの選択、または優先順位付けに基づく既存のローレベルテストケースの調整で通常は十分である（1.2.2項）。`,
why:[
 '正解。新規部分は新たに設計し、リグレッションテストは既存テストケースの選択・調整で対応する。',
 '十分なテストケースが設計されたかどうかは、テスト計画書で定義された終了基準や、残存リスクレベル、プロジェクト制約で判断する。',
 'テスト設計はツールに縛られないよう、特定のツールや技術に依存しない形で行うべきである。',
 '経験ベースのテストでは、テストケースを必ずしも文書化しない。テスト条件などがテスト実行の指針となる。'
]},

{id:'D1-06',unit:'1',lo:'TA-1.2.2',k:2,
stem:`<p>TAの佐藤さんは「このテストケースは自分で実行するので、手順は自分がわかる程度のメモで十分だ」と考えている。</p>
<p class="ask">シラバスに照らして、この考え方への指摘として最も適切なものはどれか。</p>`,
opts:[
 'テストケースは伝達的な役割を持つ。他のテスト担当者、故障時にテストを再実行する開発担当者、テストを承認する監査担当者も理解できなければならない。',
 '自分で実行するテストケースであれば問題ない。詳細に書く必要があるのは、自動化するテストケースに限られる。',
 'テストケースは監査担当者のための成果物なので、規制のあるプロジェクトの場合に限って詳細に記述すればよい。',
 '理解容易性はテスト実行時の口頭説明で補えるので、テスト条件へのトレーサビリティだけを確保すればよい。'
],
ans:[0],
exp:`テストケースは伝達的な役割を持ち、関連するステークホルダーが理解できるものでなければならない。テストケースは作成者が実行するとは限らず、他のテスト担当者はその実行方法、テスト目的、重要性を理解する必要がある。テストを実装したり故障時に再実行したりする開発担当者や、テストを承認する監査担当者にも理解可能でなければならない（1.2.2項）。`,
why:[
 '正解。テストケースの伝達的な役割の説明どおり。',
 'テストケースは作成者が実行するとは限らない。自動化の有無に関係なく、関係者が理解できる必要がある。',
 '監査担当者は理解すべき関係者の一例にすぎない。他のテスト担当者や開発担当者も含まれる。',
 '口頭での補足に頼る形では伝達的な役割を果たせない。理解容易性はテストケースの品質基準の1つでもある。'
]},

{id:'D1-07',unit:'1',lo:'TA-1.2.3',k:2,
stem:`<p>TAがテスト実装中に作成した「月次締め処理」のテストプロシジャーの草案は次のとおりである。</p>
<div class="box"><p>1. TC-31（売上の集計）を実行する</p><p>2. TC-32（請求書の発行）を実行する</p><p>3. TC-33（入金の消込）を実行する</p></div>
<p>各テストケースは、前のテストケースで生成されたデータを使用する。</p>
<p class="ask">シラバスに照らして、このテストプロシジャーに追加すべき要素の組み合わせとして、最も適切なものはどれか。</p>`,
opts:[
 '初期の事前条件の設定（例：データリポジトリからのテストデータの投入）、期待結果と事後条件の検証、実行後のリセット手順（例：データベースのリセット）',
 'テストチャーター、セッションの時間枠、デブリーフィングの記録',
 '欠陥レポートのテンプレート、欠陥の優先度、修正担当者',
 'テスト計画書のテスト範囲、テストアプローチ、終了基準'
],
ans:[0],
exp:`テストプロシジャーには、一連のテストケースに含まれるステップに加え、初期の事前条件の設定、期待結果と事後条件の検証、実行後のリセット手順を含める。テストプロシジャーを定義するには、テスト実行順序に影響する制約や依存関係を注意深く識別する必要がある（1.2.3項）。`,
why:[
 '正解。テストプロシジャーに含める要素としてシラバスに挙げられている。',
 'セッションベースドテストの要素であり、テストプロシジャーの要素ではない。',
 '欠陥マネジメントの情報であり、テストプロシジャーの要素ではない。',
 'テスト計画書の内容であり、テストプロシジャーに含めるものではない。'
]},

{id:'D1-08',unit:'1',lo:'TA-1.2.3',k:2,
stem:`<p>テスト実装の終盤、システムテスト用のテスト環境が構築されたと連絡があった。翌日からテスト実行を開始する予定である。</p>
<p class="ask">この時点でTAが行うこととして、最も適切なものはどれか。</p>`,
opts:[
 'スモークテストを設計・実行して、テスト環境が完全にセットアップされ、テスト実行の準備が整っていることを検証する。',
 'テスト環境の検証はテスト実行中に故障が発生した時点で行えば十分なので、予定どおりテスト実行を開始する。',
 'テスト環境が本番環境と完全に同一であることを確認できるまで、テスト実行を開始しない。',
 'テスト環境の構築を担当した技術者に任せ、TAはテストプロシジャーの優先順位付けだけを行う。'
],
ans:[0],
exp:`TAは、テスト環境が完全にセットアップされ、テスト実行の準備が整っていることを検証すべきである。この検証は、スモークテストを設計し実行することで実施するのが最適である。テスト環境は、必要に応じて本番環境またはエンドユーザー環境を適切に再現すべきである（1.2.3項）。`,
why:[
 '正解。テスト環境の準備状況はスモークテストで検証するのが最適である。',
 '故障が発生してから調べると、テスト環境の不備とテスト対象の欠陥の切り分けに時間がかかる。実行前に検証すべきである。',
 'テスト環境は「必要に応じて」本番環境を適切に再現すべきとされており、完全な同一性は必須ではない。',
 'テスト環境の準備状況の検証は、テスト実装中のTAのタスクとして挙げられている。'
]},

{id:'D1-09',unit:'1',lo:'TA-1.2.4',k:2,
stem:`<p>手動テストで、請求書の消費税額が期待結果より1円少なく表示された。開発担当者は「コードは仕様どおりに実装している」と言っている。</p>
<p class="ask">TAの対応として、最も適切なものはどれか。</p>`,
opts:[
 'テスト対象の欠陥だけでなく、テストデータの誤り、テスト環境の設定、仕様の誤解（端数処理の解釈など）も推定原因として分析する。',
 '期待結果と一致しなかったので、テスト対象の欠陥として直ちに報告する。',
 '開発担当者が仕様どおりと言っているので、テスト結果を合格に変更する。',
 '原因の分析は開発担当者の仕事なので、TAは実際の結果を記録するだけにする。'
],
ans:[0],
exp:`TAは、テスト実行で発覚した不正を分析し、その推定原因を特定する。不正はテスト対象の欠陥に起因する場合もあるが、事前条件の欠如、テストデータの誤り、テストスクリプトやテスト環境の欠陥、仕様の誤解なども原因として考えられる（1.2.4項）。`,
why:[
 '正解。不正の推定原因には、テスト対象の欠陥以外のものも含まれる。',
 '不正の原因はテスト対象の欠陥とは限らない。原因を分析せずに報告すると、誤った欠陥レポートになるおそれがある。',
 '開発担当者の発言だけで合否を変えるのは不適切である。仕様の解釈自体が誤っている可能性もある。',
 '手動テストで発覚した不正の分析と推定原因の特定は、TAのタスクである。'
]},

{id:'D1-10',unit:'1',lo:'TA-1.2.4',k:2,
stem:`<p>システムテストの第2サイクルが終わった。欠陥の記録を整理すると、検出した欠陥48件のうち31件が「ポイント計算」機能に集中していた。</p>
<p class="ask">テスト結果の評価として、TAが行うこととして最も適切なものはどれか。</p>`,
opts:[
 '欠陥クラスターとして認識し、ポイント計算機能にはより多くのテストが必要であることを示して、追加のテストを提案する。',
 '欠陥が多く見つかった機能はすでに十分にテストされたとみなし、テストの重点を他の機能に移す。',
 '欠陥の集中はテスト担当者の偏りによるものとみなし、評価の対象から除外する。',
 '欠陥クラスターの分析はテストマネージャーの責務なので、TAは個々の欠陥を報告するだけにとどめる。'
],
ans:[0],
exp:`TAはテスト結果を評価するタスクとして、欠陥クラスターを認識してテスト対象の特定の部分により多くのテストが必要であることを示したり、前回のテストで学んだことに基づいて追加のテストを提案したりする（1.2.4項）。`,
why:[
 '正解。欠陥クラスターの認識と追加テストの提案は、テスト結果の評価タスクとして挙げられている。',
 '欠陥クラスターは、その部分にさらに欠陥が潜んでいる可能性を示す。テストを減らすのは逆効果である。',
 '根拠なく除外するのは不適切である。欠陥の集中は重要な情報である。',
 '欠陥クラスターの認識は、テスト結果を評価するTAのタスクとしてシラバスに挙げられている。'
]},

{id:'D1-22',unit:'1',lo:'TA-1.3.1',k:2,
stem:`<p>旅行予約サイトのテストで、TAは次の2つのテストケースを作成した。</p>
<div class="box">
<p><b>TC-A</b>：連泊割引の対象となる日程で予約する。期待結果：連泊割引が適用される。</p>
<p><b>TC-B</b>：会員M-310で、12/10〜12/13（3泊）、1泊12,000円の部屋を予約する。期待結果：合計36,000円に10%の割引が適用され、32,400円と表示される。</p>
</div>
<p>TAは、TC-Aを探索的テストのテストチャーターでテスト目的を作るときの指針として使い、TC-Bはリグレッションテストで繰り返し実行する予定である。</p>
<p class="ask">TC-AとTC-Bに関する記述として、最も適切なものはどれか。</p>`,
opts:[
 'TC-Aはハイレベルテストケースで、関連するテスト条件をカバーしているかの確認に適しており、具体的な値はテスト実行中に決めることもできる。TC-BはTC-Aを詳細化したローレベルテストケースで、準備するデータと具体的な期待結果を含む。',
 'TC-Aは期待結果が抽象的なので品質基準を満たさず、ハイレベルテストケースとしても使えない。',
 'TC-Bはローレベルテストケースなので、テスト条件へのトレーサビリティを持たせる必要はない。',
 'TC-AからTC-Bへの移行は具体的な値を埋めるだけの作業なので、テスト設計の中で必ず済ませなければならない。'
],
ans:[0],
exp:`ハイレベルテストケースは、どのテスト条件がカバーされるかを示して状況を記述し、具体的な事前条件や入力データ、期待される出力は抽象的なレベルで表現する。関連するすべてのテスト条件をカバーしているかの確認に適し、セッションベースドテストのテストチャーターでテスト目的を作る際の指針にもでき、具体的な情報はテスト実行中に決めることもある。ローレベルテストケースはハイレベルテストケースを詳細化したもので、特定の事前条件、入力データ、期待結果、事後条件を含む。ハイレベルからローレベルへの移行は値の記入だけでなく、概念的なものから技術的なものへのステップであり、具体的なテストデータはテスト実装へ先送りすることが多い（1.3.1項）。`,
why:[
 '正解。',
 'ハイレベルテストケースの期待結果は、もともと抽象的なレベルで表現するものである（例：「割引を適用する」）。',
 'テストケースは、テスト条件、要件、リスクへのトレーサビリティを持たなければならない（1.3.2項）。',
 '移行は単に値を記入するだけでなく、概念的なものから技術的なものへのステップでもある。具体的なテストデータはテスト実装へ先送りされることが多い。'
]},

{id:'D1-12',unit:'1',lo:'TA-1.3.2',k:2,
stem:`<p>レビュー対象のテストケースは次のとおりである。</p>
<div class="box"><p><b>TC-210 会員機能一式</b></p><p>手順：会員登録、プロフィール変更、メールアドレス変更、パスワード変更、退会までの42のテストアクションを、1つの流れで順に実行する。</p></div>
<p>テスト実行中、プロフィール変更で故障が発生し、それ以降のテストアクションが実行できなくなった。</p>
<p class="ask">このテストケースが最も満たしていない品質基準はどれか。</p>`,
opts:['簡潔性','正確性','一貫性','トレーサビリティ'],
ans:[0],
exp:`簡潔性：テストケースの粒度はテストベースとテスト条件に整合しているべきであり、少数のカバレッジアイテムに焦点を絞った小さなテストケースが望ましい。故障原因の特定が容易で、柔軟に組み合わせることができ、故障が発生しても以降のテストがブロックされないためである（1.3.2項）。`,
why:[
 '正解。多くのテストアクションを持つ大きなテストケースのため、故障で以降のテストがブロックされた。',
 '正確性は、ベースとなるテスト条件を正確に検証できるかという基準である。この事例の問題は粒度にある。',
 '一貫性は、言語・書式・構造の一貫性に関する基準である。',
 'トレーサビリティは、テスト条件・要件・リスクへの追跡可能性に関する基準である。'
]},

{id:'D1-13',unit:'1',lo:'TA-1.3.2',k:2,
stem:`<p>テストケースのレビューで、次の3つの指摘があった。</p>
<div class="box"><p><b>X</b>：同じテスト目的のテストケースが3件ある。また、今回のテスト範囲外の旧決済画面のテストケースも含まれている。</p>
<p><b>Y</b>：テストケースによって「ユーザー」「会員」「顧客」と用語がばらばらで、書式も作成者ごとに異なる。</p>
<p><b>Z</b>：テスト環境では用意できない専用端末を使う手順が含まれている。</p></div>
<p class="ask">X、Y、Zが指摘している品質基準の組み合わせとして、正しいものはどれか。</p>`,
opts:[
 'X：必要性　Y：一貫性　Z：実現可能性',
 'X：簡潔性　Y：明確性　Z：完全性',
 'X：必要性　Y：理解容易性　Z：正確性',
 'X：正確性　Y：一貫性　Z：実現可能性'
],
ans:[0],
exp:`必要性：明確なテスト目的をカバーし、重複を避け、テストすべきでないものにはテストケースを設計しない。一貫性：言語・書式・構造の一貫性（用語集を使用できる）。実現可能性：テストケースの実行が可能でなければならない（1.3.2項）。`,
why:[
 '正解。',
 'Xは重複とテスト範囲外のテストなので必要性、Yは用語と書式の不統一なので一貫性、Zは実行できない手順なので実現可能性である。',
 'Yは用語と書式の不統一なので一貫性、Zは実行できない手順なので実現可能性である。',
 'Xは重複とテスト範囲外のテストなので、正確性ではなく必要性である。'
]},

{id:'D1-14',unit:'1',lo:'TA-1.3.3',k:2,
stem:`<p>ローン審査システムのシステムテストでは、外部の信用情報機関のシステムとの連携が必要である。しかし、システムテストの期間中、信用情報機関のシステムは先方の改修作業のため接続できない。</p>
<p class="ask">TAがテスト環境要件を定義する際の考え方として、最も適切なものはどれか。</p>`,
opts:[
 'コンポーネントやシステムの可用性を考慮して、信用情報機関のシステムを代替するテストダブルを要件に含め、本番環境からどの程度逸脱しているか（忠実度）を記述する。',
 'テスト環境で合格したテストが本番で同じ結果にならないおそれがあるので、信用情報機関のシステムに接続できるまでテスト環境要件の定義を保留する。',
 'テスト環境要件の定義はテクニカルテストアナリストの責務なので、TAは関与しない。',
 '既存のテスト環境を参照せず、すべての構成要素を一から詳細に文書化する。'
],
ans:[0],
exp:`コンポーネントやシステムの可用性と独立性は、テストダブル（スタブやドライバーなど）を使用する必要があるかを示す場合がある。各構成要素の要件には、一意の識別子、説明、責任、必要期間、忠実度（本番環境をどの程度再現しているか、逸脱しているか）を含める（1.3.3項）。`,
why:[
 '正解。可用性の分析からテストダブルの必要性を判断し、忠実度を記述する。',
 '要件定義を保留するとテストの開始が遅れる。テストダブルを使って対応できる。',
 'TAはテスト設計中にテスト環境要件を定義できる。TTAなどの関係者はレビュー・承認に関わる。',
 '冗長性や不必要な文書化を避けるため、既存のテスト環境を参照し、テストレベル固有のニーズに焦点を絞ることができる。'
]},

{id:'D1-15',unit:'1',lo:'TA-1.3.4',k:2,
stem:`<p>配送計画システムは、数百件の配達先から配送ルートを自動生成する。最適なルートを事前に計算することは現実的ではなく、テストの入力データもツールで大量に自動生成している。一方、「生成されたルートは、すべての配達先をちょうど1回ずつ訪問する」「各車両の積載量は上限を超えない」といった、どの入力に対しても成り立つべき性質は明確である。</p>
<p class="ask">このテストオラクル問題に対する解決策として、最も適切なものはどれか。</p>`,
opts:['プロパティベースのテスト','人間オラクル','疑似オラクル','要件仕様書から期待結果を手作業で導出する'],
ans:[0],
exp:`プロパティベースのテストでは、テスト対象の定義したプロパティを使用して、入力と個々のテストケースの期待結果との関係を検証する。関係が満たされない場合、テストケースは不合格となる。テスト自動化に適しているが、有効性は関係に依存する（1.3.4項）。`,
why:[
 '正解。どの入力でも成り立つべき性質（プロパティ）が明確で、自動生成した大量の入力に適用できる。',
 '入力が自動生成され大量にあるため、人間による判断は高コストで現実的でない。',
 '疑似オラクルは同じ仕様を満たす独自のシステム（レガシーシステムなど）であり、この状況では存在しない。専用に開発するのは高価である。',
 '最適なルートを事前に計算するのは現実的でないため、期待結果の手作業での導出はコスト効率が悪い。'
]},

{id:'D1-16',unit:'1',lo:'TA-1.3.5',k:2,
stem:`<p>病院の予約システムのテストに本番データを利用する。TAは、患者の氏名と診察券番号を「P-000123」のような人工的な識別子に置き換え、元の値との対応表はアクセス制限をかけて別に保管する方針とした。</p>
<p class="ask">この方針に関する記述として、正しいものはどれか。</p>`,
opts:[
 'この処理は仮名化であり、個人を識別できる情報を削除する匿名化とは異なる。',
 'この処理は匿名化であり、対応表を保管していても、識別子を置き換えれば匿名化データとなる。',
 '本番データは十分なばらつきを持つので、外れ値などを補う合成データを加える必要はない。',
 'データ保護規制の遵守はテストマネージャーの責務なので、TAは考慮しなくてよい。'
],
ans:[0],
exp:`仮名化データは、個人情報を人工的な識別子で置換したものである。匿名化データは、個人を識別できる情報を削除する。必要に応じてTAはGDPRやHIPAAのようなデータ保護規制を遵守しなければならない。また、本番データは実世界のデータを反映するが、ばらつきに乏しい可能性がある（1.3.5項）。`,
why:[
 '正解。人工的な識別子への置換は仮名化である。',
 '個人情報を人工的な識別子で置き換えるのは仮名化である。匿名化は個人を識別できる情報を削除する。',
 'シラバスは、本番データはばらつきに乏しい可能性があるとしている。',
 'TAは必要に応じてデータ保護規制を遵守しなければならない。'
]},

{id:'D1-17',unit:'1',lo:'TA-1.3.5',k:2,
stem:`<p>テスト実行中に次の2つの問題が起きた。</p>
<div class="box"><p><b>(1)</b> 昨年作成したテストデータの「有効期限 2026/03/31」のクーポンが期限切れになっていたため、クーポン適用のテストが想定外の結果で不合格になった。</p>
<p><b>(2)</b> ローレベルテストケースの手順に商品価格が直接書き込まれているため、価格改定のたびに200件のテストケースを修正している。</p></div>
<p class="ask">(1)と(2)に最も関係するテストデータ要件の観点の組み合わせはどれか。</p>`,
opts:[
 '(1) 時間感度とデータの経年変化　(2) 保守性',
 '(1) 可用性　(2) トレーサビリティ',
 '(1) 本番データとの類似性　(2) データ形式',
 '(1) 目的　(2) 依存関係'
],
ans:[0],
exp:`時間感度とデータの経年変化：古いデータや時間の影響を受けやすいデータを含むテストケースは、システムの動作に予期しない形で影響を与える可能性がある。保守性：ローレベルテストケースにハードコードされたテストデータは避け、テストロジックとテストデータを分離すべきである（1.3.5項）。`,
why:[
 '正解。',
 '可用性はサービス仮想化などでデータの欠落に対処する観点、トレーサビリティはテストケース変更時のテストデータの保守性を確保する観点である。',
 '本番データとの類似性はデータのばらつきや現実性の観点、データ形式は構造化データ（CSV、JSONなど）の観点である。',
 '目的は事前条件や期待結果の決定に関する観点、依存関係は従属データを作成する一連のステップの観点である。'
]},

{id:'D1-18',unit:'1',lo:'TA-1.3.6',k:3,
stem:`<p>ホテル予約システムのユーザーストーリーの受け入れ基準は「チェックアウト日がチェックイン日より前の場合、予約できない」である。</p>
<p class="ask">この受け入れ基準を検証するキーワードテストケースを、ドメインレイヤーのキーワードで作成したい。最も適切なものはどれか。</p>`,
opts:[
 '1. 宿泊日程を指定する（チェックイン=12/10、チェックアウト=12/08）<br>2. 予約を確定する<br>3. 予約拒否を確認する（理由=日程エラー）',
 '1. テキストボックスに入力する（id=ci、値=12/10）<br>2. テキストボックスに入力する（id=co、値=12/08）<br>3. ボタンをクリックする（id=btnReserve）<br>4. ラベルを確認する（id=msg、値=E102）',
 '1. 宿泊日程を指定する（チェックイン=12/10、チェックアウト=12/08）<br>2. 予約を確定する',
 '1. 日程エラー（12/10、12/08）<br>2. 予約不可'
],
ans:[0],
exp:`キーワードはアクションと検証に分類できる。ドメインレイヤーのキーワードはビジネス関連のアクションに対応し、アプリケーションドメインの用語を反映して、インターフェースの技術的な詳細を抽象化する。キーワードは動詞（＋名詞）の命令形を使い、意味が一意で再利用可能でなければならない（1.3.6項）。`,
why:[
 '正解。ドメインの用語によるアクションキーワードと検証キーワードで構成されている。',
 '画面部品のIDを使うキーワードはテストインターフェースレイヤーのものであり、ドメインレイヤーではない。',
 '検証キーワードがないため、予約できないことを評価するアサーションがない。',
 '動詞（＋名詞）の命令形になっておらず、アクションと検証の区別もない。'
]},

{id:'D1-19',unit:'1',lo:'TA-1.3.6',k:3,
stem:`<p>TAは、ECサイトのテストベースを分析して、次のキーワード候補を洗い出した。</p>
<div class="box"><p><b>K1</b>：ログイン処理</p><p><b>K2</b>：商品をカートに入れる</p><p><b>K3</b>：チェック</p><p><b>K4</b>：btnAdd_Click</p></div>
<p class="ask">シラバスに示されたキーワードの指定の要件に最も適合しているものはどれか。</p>`,
opts:['K2','K1','K3','K4'],
ans:[0],
exp:`TAは、キーワードが①動詞（＋名詞）を含む、②動詞（＋名詞）の命令形を使う、③意味が一意である、④適切に文書化されている、⑤アプリケーションドメインの語彙を反映している、⑥再利用可能である、を満たすように指定しなければならない（1.3.6項）。`,
why:[
 '正解。動詞＋名詞の命令形で、ドメインの語彙を反映し、意味が一意で再利用可能である。',
 '名詞の形であり、動詞（＋名詞）の命令形になっていない。',
 '何をチェックするのかが不明で、意味が一意ではない。名詞（対象）も含んでいない。',
 '画面部品のイベント名であり、アプリケーションドメインの語彙を反映していない。'
]},

{id:'D1-20',unit:'1',lo:'TA-1.3.6',k:3,
stem:`<p>受け入れ基準「最終利用日から365日が経過したポイントは失効する」を検証するため、TAはキーワードテストケースの草案を作成した。</p>
<div class="box"><p>1. 会員を登録する（会員ID=M-7）</p><p>2. ポイントを付与する（会員ID=M-7、ポイント=500）</p><p>3. ポイント残高を確認する（会員ID=M-7、期待値=0）</p></div>
<p class="ask">この草案の改善として、最も適切なものはどれか。</p>`,
opts:[
 '2と3の間に、テスト環境と相互作用するアクションキーワード「システム日付を進める（日数=365）」を追加し、最後にテスト後のクリーンアップとして「システム日付を戻す」を追加する。',
 '3の検証キーワードを削除し、テスト実行者が画面を目視で確認する手順に置き換える。',
 '1〜3を1つのキーワード「ポイント失効を確認する」に統合し、手順を短くする。',
 '3を「ラベルlblPointの値が0であることを確認する」に変更し、テストインターフェースレイヤーのキーワードに揃える。'
],
ans:[0],
exp:`アクションキーワードは、テスト対象だけでなくテスト環境（設定やシミュレーターの起動など）とも相互作用する。TAのタスクには、事前条件、検証アクション、テスト後のテスト環境のクリーンアップなどの追加手順をキーワードで指定することが含まれる（1.3.6項）。草案には365日の経過を再現する手順がなく、受け入れ基準を検証できない。`,
why:[
 '正解。時間の経過を再現するテスト環境へのアクションと、テスト後のクリーンアップを追加している。',
 '検証キーワードはアサーションを表す。削除すると自動化も難しくなり、改善にならない。',
 '1つにまとめると、再利用性が下がり、テストで何を操作・検証しているかもわからなくなる。また、365日の経過を再現する手順が欠けたままである。',
 'ドメインレイヤーのテストケースに技術的な詳細を持ち込むことになり、改善にならない。365日の経過を再現する手順も欠けたままである。'
]},

{id:'D1-21',unit:'1',lo:'TA-1.3.7',k:2,
stem:`<p>勤怠管理システムでは、保守中のバージョン3.2と開発中のバージョン4.0を並行してテストしている。テストケースはテストマネジメントツールで管理している。</p>
<p class="ask">テストウェアのマネジメントを支援するTAの活動として、最も適切なものはどれか。</p>`,
opts:[
 'テスト対象のバージョンに合わせて、バージョンで識別される仕様とテストウェアの適切なサブセットを選択し、古くなったテストケースを識別して構成管理を行う。',
 '両バージョンのテストケースを1つのフォルダーにまとめ、常に最新の内容で上書きする。',
 'テスト実行の工数や必要なテスト環境といったメタデータは、テストケースを複雑にするので付けない。',
 '欠陥の記録、優先順位付け、モニタリングを要件マネジメントツールで行う。'
],
ans:[0],
exp:`TAは、プロジェクトとリリースを分析してテストウェアの適切なサブセットを選択する（例：SUTのバージョンに合わせて、バージョンで識別される仕様を選ぶ）。また、テストケースへのメタデータの追加、トレーサビリティの確保、リグレッションテスト用のテストスイートの選択、古くなったテストケースの識別を含むテストケースの構成管理を行う（1.3.7項）。`,
why:[
 '正解。',
 '上書きすると、保守中のバージョン3.2に対応するテストケースが失われる。テストケースは構成管理し、バージョンに合わせて選択する。',
 'テスト実行に関わる工数情報や必要なテスト環境の情報をメタデータとして追加することは、TAの支援活動として挙げられている。',
 '欠陥の記録・優先順位付け・モニタリングは欠陥マネジメントツールの役割である。'
]},

/* ===== 第2章 リスクベースドテストにおけるテストアナリストのタスク ===== */
{id:'D2-01',unit:'2',lo:'TA-2.1.1',k:2,
stem:`<p>新しく開発する電子カルテ連携機能について、プロダクトリスクの識別を始める。</p>
<p class="ask">リスク識別におけるTAの貢献として、最も適切なものはどれか。</p>`,
opts:[
 'どのような問題が発生しやすいかという経験的な知識を活かしてリスクワークショップやブレーンストーミングに参加し、ステークホルダーへのインタビューで最も重大なリスクについての理解を深める。',
 'リスクベースドテストの方針を定め、プロジェクトで用いるリスク識別の手法を決定する。',
 '開発担当者がリスクを識別し終えた後に、テスト技法の選択にだけ関与する。',
 'リスクは客観的なデータだけで識別すべきなので、経験や直感に基づく意見は出さない。'
],
ans:[0],
exp:`TAは、どのような問題が発生しやすいか、その影響、テストによる軽減方法について経験的かつ直感的な知識を持つため、プロダクトリスク分析の貴重なステークホルダーである。リスク識別では、ふりかえり、リスクワークショップ、ブレーンストーミング、チェックリストの作成に貢献し、ステークホルダーへのインタビューも実施できる（2.1節）。`,
why:[
 '正解。',
 'リスクベースドテストの方針を定めるのはテストマネージャーである。TAはその実装で積極的な役割を果たす。',
 'TAはリスク識別そのものに貢献する、貴重なステークホルダーである。',
 'シラバスは、TAの経験的かつ直感的な知識をリスク分析にとって価値あるものとしている。'
]},

{id:'D2-02',unit:'2',lo:'TA-2.1.1',k:2,
stem:`<p>会計パッケージのリスクアセスメントを行っている。税額計算は法令に関わり影響が大きい一方、帳票の印刷レイアウトは影響が小さく、外部の銀行APIとの連携はその中間と考えられている。</p>
<p class="ask">TAの対応として、最も適切なものはどれか。</p>`,
opts:[
 'テスト対象をテストアイテム（コンポーネント、インターフェース、フィーチャーなど）に分解し、テストアイテムごとにリスクを個別に評価する。',
 'システム全体で1つのリスクレベルを決め、すべての機能を同じ徹底度でテストする。',
 '最もリスクの高い税額計算のリスクレベルをシステム全体に適用する。',
 '品質特性で分類できないリスクは、評価の対象から除外する。'
],
ans:[0],
exp:`リスクレベルはテスト対象に一様に分布していないことが多い。このようなケースでは、TAはテスト対象をテストアイテム（コンポーネント、インターフェース、フィーチャーなど）に分解し、テストアイテムごとにリスクを個別に評価する（2.1節）。`,
why:[
 '正解。',
 'リスクが一様でないのに同じ徹底度でテストすると、リスクの低い部分に工数を使いすぎ、高い部分が不足する。',
 '全体を最高レベルにすると優先順位付けができず、リスクベースドテストの目的に反する。',
 '品質特性による分類はリスク分類を支援する手段であり、分類できないリスクを除外する根拠にはならない。'
]},

{id:'D2-03',unit:'2',lo:'TA-2.1.1',k:2,
stem:`<p>リスクアセスメントで「料金計算ルールの要件が曖昧なため、顧客に誤った料金を請求する」というリスクのレベルが「高」と評価された。現在、プロジェクトは要件定義の段階である。</p>
<p class="ask">このリスクを軽減するテスト活動としてTAが提案する内容として、最も適切なものはどれか。</p>`,
opts:[
 '要件定義の段階でテストベースのレビューを行い、料金ルールをデシジョンテーブルでモデル化して曖昧さを早期に指摘する。そのうえで、システムテストでデシジョンテーブルテストを行う。',
 'システムテストの段階で探索的テストを集中的に行い、誤った料金を検出する。',
 '受け入れテストで、ユーザーに料金計算の結果を確認してもらう。',
 'リスク軽減の方法はテストマネージャーが決めるので、TAは提案しない。'
],
ans:[0],
exp:`プロダクトリスクアセスメントの一環として、TAは各プロダクトリスクを軽減するための適切なテスト活動（静的テストと動的テストを含む）を提案し、テストレベル、テストタイプ、テスト技法などを示す。シフトレフトの精神に基づき、どのテスト活動が最も早くリスクを軽減できるかも示す（2.1節）。`,
why:[
 '正解。静的テストで早期に軽減し（シフトレフト）、動的テストの技法も示している。',
 'リスクの原因は要件の曖昧さであり、システムテストまで待つと修正コストが大きくなる。最も早く軽減できる活動を示していない。',
 'さらに後の段階であり、シフトレフトの考え方に反する。',
 'TAは、識別した各プロダクトリスクを軽減するための適切なテスト活動を提案する。'
]},

{id:'D2-04',unit:'2',lo:'TA-2.1.1',k:2,
stem:`<p class="ask">リスクベースドテストにおけるリスクモニタリングに関する記述として、正しいものはどれか。</p>`,
opts:[
 'イテレーティブ型ライフサイクルでは、チームが決めた頻度（例えばイテレーションごとに1回）でリスクモニタリングを行い、TAは変更に基づいてリスクレジスターを更新し、リスク軽減アクションを調整する。',
 'リスクとそのレベルはリスク分析の時点で確定するため、リスクモニタリングはプロジェクトの終了時に1回行えば十分である。',
 'リスクモニタリングの頻度は、どのライフサイクルでもTAが単独で決める。',
 'リスクレジスターの更新はテストマネージャーだけが行い、TAは関与しない。'
],
ans:[0],
exp:`リスクとそのレベルは静的ではなく時間とともに変化するため、リスクベースドテストには定期的なリスクモニタリングが含まれる。イテレーティブ型ではチームが決めた頻度（おそらくイテレーションごとに1回）で行い、その他のライフサイクルではプロダクトリスクマネジメントの責任者（多くの場合テストマネージャー）が頻度を設定する。TAは、変更に基づいてリスクレジスターを更新し、リスク軽減アクションを調整することで貢献する（第2章の冒頭）。`,
why:[
 '正解。',
 'リスクとそのレベルは時間の経過とともに変化するため、定期的なモニタリングが必要である。',
 'イテレーティブ型ではチームが、その他のライフサイクルではプロダクトリスクマネジメントの責任者が頻度を決める。',
 'TAは変更に基づいてリスクレジスターを更新することで貢献する。'
]},

{id:'D2-05',unit:'2',lo:'TA-2.2.1',k:4,
stem:`<p>通販サイトの自動リグレッションテストスイートでは、構成管理システムと連携したツールが、各テストケースの実行中にアクティブになった構成アイテム（CI）を記録している。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>テスト</th><th>アクティブになったCI</th></tr></thead><tbody>
<tr><td class="mono">RT-01</td><td>ログイン、商品検索</td></tr>
<tr><td class="mono">RT-02</td><td>商品検索、在庫照会</td></tr>
<tr><td class="mono">RT-03</td><td>カート、在庫引当、決済</td></tr>
<tr><td class="mono">RT-04</td><td>在庫引当、出荷指示</td></tr>
<tr><td class="mono">RT-05</td><td>会員情報、ポイント</td></tr>
<tr><td class="mono">RT-06</td><td>出荷指示、配送追跡</td></tr>
</tbody></table></div>
<p>今回のリリースでは「在庫引当」と「配送追跡」のCIが修正された。</p>
<p class="ask">影響度分析に基づいて選択すべきリグレッションテストの組み合わせとして、最も適切なものはどれか。</p>`,
opts:[
 'RT-03、RT-04、RT-06',
 'RT-03、RT-04',
 'RT-02、RT-03、RT-04、RT-06',
 'RT-03、RT-04、RT-05、RT-06'
],
ans:[0],
exp:`影響度分析のツールは、変更が発生すると修正された構成アイテムを追跡し、その構成アイテムと相互作用するリグレッションテストを選択する。これにより、故障を発見する可能性が最も高い部分にテストが集中する（2.2節）。在庫引当→RT-03・RT-04、配送追跡→RT-06。`,
why:[
 '正解。修正されたCI（在庫引当、配送追跡）をアクティブにしたテストを選択している。',
 '配送追跡をアクティブにしたRT-06が漏れている。',
 'RT-02は「在庫照会」をアクティブにしたが、修正された「在庫引当」とは別のCIである。名前が似ているだけで選択するのは誤り。',
 'RT-05は修正されたCIと相互作用していない。'
]},

{id:'D2-06',unit:'2',lo:'TA-2.2.1',k:4,
stem:`<p>手動のリグレッションテストについて、TAは要件トレーサビリティマトリクスを維持している。今回、要件R-12「送料計算に離島料金を追加する」が変更された。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>要件</th><th>内容</th><th>テスト</th></tr></thead><tbody>
<tr><td class="mono">R-12</td><td>送料を計算する（今回変更）</td><td class="mono">T-40、T-41</td></tr>
<tr><td class="mono">R-15</td><td>注文確認メールに送料を表示する（R-12の計算結果を使用）</td><td class="mono">T-50</td></tr>
<tr><td class="mono">R-20</td><td>返品時に送料を返金する（R-12の計算結果を使用）</td><td class="mono">T-60</td></tr>
<tr><td class="mono">R-30</td><td>会員のパスワードを変更する</td><td class="mono">T-70</td></tr>
</tbody></table></div>
<p class="ask">要件トレーサビリティマトリクスを用いたリグレッションテストの選択として、最も適切なものはどれか。</p>`,
opts:[
 'T-40、T-41、T-50、T-60',
 'T-40、T-41',
 'T-40、T-41、T-50、T-60、T-70',
 'T-50、T-60'
],
ans:[0],
exp:`要件トレーサビリティマトリクスは、要件の変更が関連するテストに与える影響を評価するために使用する。変更された要件が間接的にテストに影響する場合に特に有用で、TAは意図しない副作用の可能性をカバーするために、直接影響を受ける機能と関連する機能のリグレッションテストを選択する（2.2節）。`,
why:[
 '正解。直接影響を受けるR-12と、その計算結果を使う関連機能（R-15、R-20）のテストを選択している。',
 'R-12の計算結果を使うR-15、R-20への間接的な影響（意図しない副作用）をカバーしていない。',
 'R-30は送料と関連がなく、選択の根拠がない。テストスイートのサイズとのバランスも悪くなる。',
 '直接影響を受けるR-12のテストが含まれていない。'
]},

{id:'D2-07',unit:'2',lo:'TA-2.2.1',k:4,
stem:`<p>ネット銀行のシステムで、法改正に対応して本人確認の要件が厳格化された。その結果、リスクレジスター上で「本人確認」と「口座開設」のリスクレベルが「中」から「高」に引き上げられた。</p>
<p>手動リグレッションテストは600件あり、割り当て期間内に実行できるのは約120件である。TAはリグレッションテストスイートとリスクレジスターのトレーサビリティを維持している。手動テストと構成アイテムとの対応は記録されていない。</p>
<p class="ask">今回のリグレッションテストの選択技法として、最も適切なものはどれか。</p>`,
opts:[
 'リスクベースのテスト選択',
 '運用プロファイルに基づくテスト',
 '影響度分析',
 'カバレッジベースドテスト'
],
ans:[0],
exp:`リスクベースのテスト選択では、TAはリグレッションテストスイートとリスクレジスターとのトレーサビリティを維持し、変更に応じてリスクレジスターを更新した場合、最も高いリスクレベルをカバーするようにリグレッションテストスイートを調整する（2.2節）。`,
why:[
 '正解。リスクレジスターの更新とトレーサビリティがそろっており、高まったリスクに集中できる。',
 'システム全体を素早く概観する技法である。今回は特定のリスクの高まりに集中するのが目的であり、最適ではない。',
 '手動テストでは、変更された構成アイテムと相互作用するテストがわかっていれば使えるが、今回はその対応が記録されていない。',
 '少ないテストで高いカバレッジを得る技法であり、高まったリスクへの集中という今回の目的に直接対応しない。'
]},

{id:'D2-08',unit:'2',lo:'TA-2.2.1',k:4,
stem:`<p>状態遷移モデルの遷移 t1〜t6 について、既存の手動リグレッションテスト T1〜T6 がカバーする遷移は次のとおりである。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>テスト</th><th>カバーする遷移</th></tr></thead><tbody>
<tr><td class="mono">T1</td><td class="mono">t1, t2, t3</td></tr>
<tr><td class="mono">T2</td><td class="mono">t1, t4</td></tr>
<tr><td class="mono">T3</td><td class="mono">t2, t5</td></tr>
<tr><td class="mono">T4</td><td class="mono">t3, t4, t6</td></tr>
<tr><td class="mono">T5</td><td class="mono">t5, t6</td></tr>
<tr><td class="mono">T6</td><td class="mono">t4, t5</td></tr>
</tbody></table></div>
<p>カバレッジベースドテストにより、0スイッチカバレッジ100%をできるだけ少ないテストで達成したい。</p>
<p class="ask">選択肢のうち、最も適切なテストの組み合わせはどれか。</p>`,
opts:[
 'T1、T4、T5',
 'T2、T3、T4、T5',
 'T1、T2、T6',
 'T2、T3、T5'
],
ans:[0],
exp:`カバレッジベースドテストでは、選択したテスト技法に基づき、できるだけ少ないテストで高いカバレッジを達成するようにテストを選択する（2.2節）。T1（t1,t2,t3）＋T4（t3,t4,t6）＋T5（t5,t6）で t1〜t6 をすべてカバーできる。なお、2件ではどの組み合わせでも100%に届かない。`,
why:[
 '正解。3件で t1〜t6 をすべてカバーする。',
 '100%を達成するが4件必要で、テスト数が多い。',
 't6 がカバーされない（t1,t2,t3,t4,t5）。',
 't3 がカバーされない（t1,t2,t4,t5,t6）。'
]},

{id:'D2-09',unit:'2',lo:'TA-2.2.1',k:4,
stem:`<p>今回のリリースでは、請求モジュールに変更が加えられた。手動リグレッションテストの候補と実行履歴は次のとおりである。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>テスト</th><th>実行履歴</th></tr></thead><tbody>
<tr><td class="mono">RT-A</td><td>直近5サイクルで3回欠陥を検出</td></tr>
<tr><td class="mono">RT-B</td><td>毎サイクル実行、欠陥の検出なし</td></tr>
<tr><td class="mono">RT-C</td><td>14サイクル前から実行されていない</td></tr>
<tr><td class="mono">RT-D</td><td>過去に請求モジュールが変更されたとき、影響を受けて不合格になった</td></tr>
<tr><td class="mono">RT-E</td><td>毎サイクル実行、欠陥の検出なし</td></tr>
</tbody></table></div>
<p class="ask">履歴ベースドテストの考え方で3件を選ぶとき、最も適切な組み合わせはどれか。</p>`,
opts:[
 'RT-A、RT-C、RT-D',
 'RT-A、RT-B、RT-E',
 'RT-A、RT-D、RT-E',
 'RT-B、RT-C、RT-E'
],
ans:[0],
exp:`履歴ベースドテストでは、過去のテスト実行を評価し、欠陥を検出したもの、または前回以降の変更と類似の変更で影響を受けやすかったものを選んで再実行する。また、長い間実行していないテストを含め、それらが引き続き合格するかを確認することもできる（2.2節）。`,
why:[
 '正解。欠陥検出の多いRT-A、類似の変更で影響を受けたRT-D、長く実行されていないRT-Cを選んでいる。',
 'RT-BとRT-Eは毎サイクル実行され欠陥も検出していないため、履歴ベースで優先する根拠がない。',
 '類似の変更で影響を受けたRT-Dは適切だが、RT-Eを選ぶ根拠がなく、長く実行されていないRT-Cが漏れている。',
 '欠陥検出の多いRT-Aと、類似の変更で影響を受けたRT-Dが漏れている。'
]},

{id:'D2-10',unit:'2',lo:'TA-2.2.1',k:4,
stem:`<p>受発注システムのリグレッションテストの状況は次のとおりである。</p>
<div class="box"><p><b>自動テスト</b>：1,200件。全件の実行には8時間かかるが、毎晩のテスト枠は3時間しかない。構成管理システムと連携したツールで、各テストの実行中にアクティブになった構成アイテムが記録されている。</p>
<p><b>手動テスト</b>：300件。構成アイテムとの対応は記録されていないが、要件とのトレーサビリティは維持されている。今回、要件が2件変更され、その計算結果を使う関連機能もある。</p></div>
<p class="ask">リグレッションテストの選択技法の組み合わせとして、最も適切なものはどれか。</p>`,
opts:[
 '自動テスト：影響度分析　手動テスト：要件トレーサビリティマトリクス',
 '自動テスト：全件を実行する　手動テスト：要件トレーサビリティマトリクス',
 '自動テスト：運用プロファイルに基づくテスト　手動テスト：影響度分析',
 '自動テスト：影響度分析　手動テスト：運用プロファイルに基づくテスト'
],
ans:[0],
exp:`自動テストを選択するための最も信頼できる技法は影響度分析であり、構成管理システムに基づくツールが支援する。手動テストでは決定的に優れた技法はないため状況に応じて選ぶ。要件の変更が間接的にテストに影響する場合は、要件トレーサビリティマトリクスが特に有用である（2.2節）。`,
why:[
 '正解。自動テストはツールによる影響度分析、手動テストは要件の変更と関連機能への影響を評価できる要件トレーサビリティマトリクスが適する。',
 '全件の実行には8時間かかり、3時間の枠に収まらない。',
 '手動テストは構成アイテムとの対応が記録されていないため、影響度分析を使えない。また、自動テストには影響度分析が最も信頼できる。',
 '今回は要件の変更が明確で、関連機能への影響も評価したい。システム全体を概観する運用プロファイルよりも、要件トレーサビリティマトリクスが適する。'
]},

/* ===== 3.1 データに基づくテスト技法 ===== */
{id:'D31-01',unit:'3.1',lo:'TA-3.1.1',k:3,
stem:`<p>空調制御で、温度センサーの補正値 t（精度0.1）が「<b>t ≠ 0.0</b>」のときだけ補正処理を行う。</p>
<p class="ask">この境界線に対して簡易ドメインカバレッジを100%達成するテストデータの集合はどれか。</p>`,
opts:['−0.1、0.0、0.1','0.0、0.1','−1.0、0.0、1.0','−0.1、0.1'],
ans:[0],
exp:`簡易ドメインカバレッジでは、≠の境界線についてOFFポイントを1つ、境界線の両側に位置するONポイントを2つ選ぶ。各OFFポイントは、与えられた精度に従って対応するONポイントに可能な限り近くなければならない（3.1.1項）。OFF：0.0、ON：−0.1と0.1。`,
why:['正解。','ONポイントが片側（0.1）にしかない。','ONポイント（−1.0、1.0）がOFFポイントに最も近い値になっていない。精度0.1では−0.1と0.1を選ぶ。','OFFポイント（0.0）がない。']},

{id:'D31-02',unit:'3.1',lo:'TA-3.1.1',k:3,
stem:`<p>倉庫の積載判定で、同値パーティション「積載可」は「<b>x + y ≤ 10 AND x ≥ 0</b>」（x、yは整数）で定義される。</p>
<p class="ask">簡易ドメインカバレッジを100%達成するテストデータ（x, y）の集合として、最も適切なものはどれか。</p>`,
opts:[
 '(3, 7)、(3, 6)、(0, 5)、(−1, 5)',
 '(3, 7)、(3, 8)、(0, 5)、(−1, 5)',
 '(3, 8)、(3, 7)、(1, 5)、(0, 5)',
 '(3, 7)、(5, 9)、(0, 5)、(−1, 5)'],
ans:[1],
exp:`ドメインテストでは、相互作用する複数の変数を含む式でパーティションを定義できる。閉じた境界線（x + y ≤ 10）のONポイントは境界線上（x + y = 10）、OFFポイントはパーティションの外側で最も近い点（x + y = 11）。x ≥ 0 はON 0、OFF −1（3.1.1項）。`,
why:['(3, 6) はパーティション内側のINポイントであり、OFFポイントではない。','正解。','x ≥ 0 の境界線では、ONポイントは0、OFFポイントは−1。(1, 5) はINポイント。','(5, 9) は x + y = 14 で、ONポイントに最も近いOFFポイントではない（OUTポイント）。']},

{id:'D31-03',unit:'3.1',lo:'TA-3.1.1',k:3,
stem:`<p>年齢 x（整数）で料金区分を分ける。パーティションP1は「<b>x &lt; 18</b>」、隣接するパーティションP2は「<b>x ≥ 18</b>」である（ほかの条件は考えない）。</p>
<p class="ask">P1とP2の両方について簡易ドメインカバレッジを100%達成するとき、テストデータの最小数はいくつか。</p>`,
opts:['2','3','4','6'],
ans:[0],
exp:`ある境界線のONポイントとOFFポイントの組は、隣接するパーティションの境界線に対してOFFポイントとONポイントとして用いることができる（3.1.1項）。P1（開いた境界線）：ON 17、OFF 18。P2（閉じた境界線）：ON 18、OFF 17。同じ2つの値で両方を満たす。`,
why:['正解。','最適化の余地を見落としている。','各パーティションのON・OFFを別々に数えた値。隣接パーティション間で共有できる。','誤り。']},

{id:'D31-04',unit:'3.1',lo:'TA-3.1.1',k:3,
stem:`<p>仕様は「購入金額が <b>5,000円を超える</b> 場合は送料無料」（金額は1円単位）。実装では誤って「5,000円以上」と判定している。</p>
<p class="ask">この演算子の欠陥を検出できるテストデータと、そのポイントタイプの組み合わせはどれか。</p>`,
opts:['5,001円（ONポイント）','5,000円（OFFポイント）','4,999円（OUTポイント）','10,000円（INポイント）'],
ans:[1],
exp:`ドメインテストは、演算子や定数の誤りといった同値パーティション実装の欠陥を、それを明らかにできるカバレッジアイテムを選ぶことで識別しようとする（3.1.1項）。開いた境界線（＞5,000）ではOFFポイントは境界線上の5,000円。仕様では送料ありだが、誤った実装では送料無料になるため欠陥が現れる。`,
why:['仕様でも実装でも送料無料となり、結果に差が出ない。','正解。','仕様でも実装でも送料ありとなり、差が出ない。','仕様でも実装でも送料無料となり、差が出ない。']},

{id:'D31-05',unit:'3.1',lo:'TA-3.1.2',k:3,
stem:`<p>印刷機能の設定に、ベースチョイスカバレッジを適用する（［ ］がベース値）。</p>
<div class="box"><p>用紙：［A4］、A3、B5、Letter</p><p>向き：［縦］、横</p><p>カラー：［白黒］、カラー</p><p>両面：［片面］、両面、冊子</p></div>
<p class="ask">パラメーター間の制約は考えないものとする。必要なカバレッジアイテムの数はいくつか。</p>`,
opts:['7','8','12','48'],
ans:[1],
exp:`ベースカバレッジアイテム1つに、各パラメーターのベース以外の値の数を加える（3.1.2項）。1＋(4−1)＋(2−1)＋(2−1)＋(3−1)＝8。`,
why:['ベースカバレッジアイテムを数え忘れている。','正解。','誤り。','全組み合わせ（4×2×2×3）の数。']},

{id:'D31-06',unit:'3.1',lo:'TA-3.1.2',k:3,
stem:`<p>動画配信アプリの再生テストで、次の6件のテストケースを設計した。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th></th><th>端末</th><th>回線</th><th>言語</th></tr></thead><tbody>
<tr><td class="mono">T1</td><td>PC</td><td>光回線</td><td>日本語</td></tr>
<tr><td class="mono">T2</td><td>PC</td><td>5G</td><td>英語</td></tr>
<tr><td class="mono">T3</td><td>タブレット</td><td>光回線</td><td>英語</td></tr>
<tr><td class="mono">T4</td><td>タブレット</td><td>5G</td><td>日本語</td></tr>
<tr><td class="mono">T5</td><td>スマホ</td><td>光回線</td><td>日本語</td></tr>
<tr><td class="mono">T6</td><td>スマホ</td><td>5G</td><td>日本語</td></tr>
</tbody></table></div>
<p class="ask">このテストスイートでカバーされていない、ペアワイズカバレッジのカバレッジアイテムはどれか。</p>`,
opts:['（端末＝スマホ, 言語＝英語）','（端末＝タブレット, 言語＝日本語）','（回線＝光回線, 言語＝英語）','（回線＝5G, 言語＝日本語）'],
ans:[0],
exp:`ペアワイズカバレッジのカバレッジアイテムは、任意の2つのパラメーターに関するパラメーター - 値ペアの組み合わせ（3.1.2項）。端末×言語では、スマホはT5・T6とも日本語で、（スマホ, 英語）がカバーされていない。T6を「スマホ／5G／英語」に変えると、（5G, 日本語）はT4で維持したまま100%になる。`,
why:['正解。','T4でカバーされている。','T3でカバーされている。','T4とT6でカバーされている。']},

{id:'D31-07',unit:'3.1',lo:'TA-3.1.2',k:3,
stem:`<p>業務システムを複数の環境に提供している。DBMS（3種）、OS（2種）、アプリケーションサーバー（3種）の構成の組み合わせを選び、選んだ各構成で、同じリグレッションテストスイートを実行する計画である。</p>
<p class="ask">この計画が採用している組み合わせテストのアプローチとして、正しいものはどれか。</p>`,
opts:[
 '入力データ値の組み合わせを、完全なテストケースの一部として使うアプローチ',
 '構成パラメーターの組み合わせを使い、それぞれの組み合わせを同じテストケースでテストするアプローチ',
 '指定された確率分布に基づき、入力ドメインからランダムに構成を選ぶアプローチ',
 '状態遷移のシーケンスを、Nスイッチカバレッジで網羅するアプローチ'],
ans:[1],
exp:`組み合わせテストには主に2つのアプローチがある。第一は構成パラメーターの組み合わせを使い、それぞれの組み合わせを同じテストケースでテストするもの。第二は入力データ値の組み合わせを使い、それらを完全なテストケースの一部とするもの（3.1.2項）。`,
why:['第二のアプローチ。この計画は構成ごとに同じテストを実行している。','正解。','ランダムテストの説明。','状態遷移テストの説明。']},

{id:'D31-08',unit:'3.1',lo:'TA-3.1.2',k:3,
stem:`<p class="ask">ペアワイズテストが効果的なテスト技法であることの根拠として、シラバスで示されているものはどれか。</p>`,
opts:[
 'すべてのパラメーターが等しく故障に寄与するため、2つずつの組み合わせを網羅すれば全組み合わせと同等の効果が得られる。',
 'ペアワイズカバレッジを達成する最小のテストケース集合は、どのような場合でも容易に求められる。',
 '限られた範囲の調査では、故障の約97%が1つか2つの相互作用する条件によってのみ引き起こされることが示されている。',
 'ペアワイズカバレッジを達成すれば、相互作用の故障はすべて検出できることが証明されている。'],
ans:[2],
exp:`すべてのパラメーターが故障に寄与するわけではなく、ほとんどの故障は単一のパラメーター値または比較的少数のパラメーター間の相互作用によって引き起こされる。限られた範囲の調査では、故障の約97%が1つか2つの相互作用する条件だけで引き起こされることが示されている（3.1.2項）。`,
why:['すべてのパラメーターが故障に寄与するわけではない。','ペアワイズカバレッジを達成する最小のテストケース集合を見つけることは、一般に困難。','正解。','約97%であり、すべてではない。']},

{id:'D31-09',unit:'3.1',lo:'TA-3.1.3',k:2,
stem:`<p class="ask">適応的ランダムテストの説明として、正しいものはどれか。</p>`,
opts:[
 '確率分布をプロセス全体を通して一定に保つ、ガイドなしランダムテストの一種である。',
 'これまでに選択した値に基づいて分布を調整し、欠陥が入力ドメインの特定領域に集中しやすいことを考慮して、ドメインを効果的にカバーしようとするガイドありランダムテストである。',
 '運用プロファイルに基づく分布だけを用いる、妥当性確認専用の技法である。',
 'テストオラクルを必要としないため、期待結果の判定は不要である。'],
ans:[1],
exp:`適応的ランダムテストに代表されるガイドありランダムテストは、これまでに選択した値に基づいて分布を時間とともに調整する。欠陥がドメインの特定領域に集中することが多い点を考慮し、入力ドメインを効果的にカバーすることを目的とする（3.1.3項）。`,
why:['分布が一定なのはガイドなしランダムテスト。','正解。','適応的ランダムテストの定義ではない。','期待結果を付けるにはテストオラクルが必要で、多くの場合は自動化したテストオラクルが必要。']},

{id:'D31-10',unit:'3.1',lo:'TA-3.1.3',k:2,
stem:`<p class="ask">ランダムテストの終了基準として、最も適切なものはどれか。</p>`,
opts:[
 'すべての境界線について、ONポイントとOFFポイントをカバーしたとき',
 '実行したテスト数やテスト時間など、完了度を示す尺度が目標に達したとき',
 'ペアワイズカバレッジが100%に達したとき',
 'すべてのメタモルフィック関係を1回ずつカバーしたとき'],
ans:[1],
exp:`ランダムテストには広く合意されたカバレッジ基準がない。したがって、終了基準は、実行したテスト数、テスト時間、または同様の完了度を示す尺度に基づくしかない（3.1.3項）。`,
why:['ドメインテストのカバレッジ基準。','正解。','組み合わせテストのカバレッジ基準。','MTには有用な終了基準となるカバレッジ尺度が認められておらず、各MRを1回ずつカバーするだけでは不十分。']},

/* ===== 3.2 振る舞いに基づくテスト技法 ===== */
{id:'D32-01',unit:'3.2',lo:'TA-3.2.1',k:2,
stem:`<p>在庫管理システムのCRUDマトリクスは次のとおりである。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>機能 ＼ エンティティ</th><th class="c">商品</th><th class="c">在庫</th></tr></thead><tbody>
<tr><td>商品登録</td><td class="c mono">C</td><td class="c mono">C</td></tr>
<tr><td>商品検索</td><td class="c mono">R</td><td class="c mono">R</td></tr>
<tr><td>価格改定</td><td class="c mono">R U</td><td class="c"></td></tr>
<tr><td>入荷</td><td class="c"></td><td class="c mono">R U</td></tr>
<tr><td>商品廃止</td><td class="c mono">D</td><td class="c mono">D</td></tr>
</tbody></table></div>
<p class="ask">テストスイートがマトリクス上の操作のうち7つを実行した。CRUDカバレッジはいくつか。</p>`,
opts:['35%','70%','87.5%','100%'],
ans:[1],
exp:`CRUDカバレッジは、テストスイートが実行した操作の数を、CRUDマトリクスの操作の総数で割って測定する（3.2.1項）。操作の総数は 2＋2＋2＋2＋2＝10 なので、7 ÷ 10 ＝ 70%。`,
why:['分母を「機能数×4」（20）にした誤り。','正解。','分母を「エンティティ数×4」（8）にした誤り。','3つの操作が未実行。']},

{id:'D32-02',unit:'3.2',lo:'TA-3.2.1',k:2,
stem:`<p class="ask">CRUDテストが主に焦点を当てる欠陥として、最も適切なものはどれか。</p>`,
opts:[
 '高負荷時の応答時間の劣化',
 '画面レイアウトの崩れ',
 'データ整合性違反、アクセスコントロールの欠陥、データの不整合など、エンティティの扱いに関する欠陥',
 '長時間稼働によるメモリーリーク'],
ans:[2],
exp:`CRUDテストは主にシステムレベルで用いられ、データ整合性違反、アクセスコントロールの欠陥、データの不整合など、エンティティの扱いにおけるテストアイテムの振る舞いに関する欠陥に焦点を当てる（3.2.1項）。`,
why:['性能効率性のテストの対象。','使用性などのテストの対象。','正解。','信頼性や資源効率性などのテストの対象。']},

{id:'D32-03',unit:'3.2',lo:'TA-3.2.2',k:3,
stem:`<p>次の状態遷移モデルがある。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>遷移</th><th>遷移元</th><th>遷移先</th></tr></thead><tbody>
<tr><td class="mono">t1</td><td>A</td><td>B</td></tr>
<tr><td class="mono">t2</td><td>B</td><td>C</td></tr>
<tr><td class="mono">t3</td><td>C</td><td>A</td></tr>
<tr><td class="mono">t4</td><td>B</td><td>A</td></tr>
</tbody></table></div>
<p class="ask">有効な2スイッチ（3つの連続する遷移の有効なシーケンス）の数はいくつか。</p>`,
opts:['5','6','7','8'],
ans:[2],
exp:`Nスイッチは N+1 個の連続する遷移の有効なシーケンス。N-スイッチをその末端で有効な次の遷移に拡張するとN+1スイッチになる（3.2.2項）。1スイッチは t3t1、t4t1、t1t2、t1t4、t2t3 の5つ。それぞれを拡張すると、t3t1→t2/t4（2）、t4t1→t2/t4（2）、t1t2→t3（1）、t1t4→t1（1）、t2t3→t1（1）で合計7。`,
why:['1スイッチの数。','誤り。','正解。','誤り。']},

{id:'D32-04',unit:'3.2',lo:'TA-3.2.2',k:3,
stem:`<p>音楽プレーヤーの状態遷移は次のとおりである。</p>
<div class="box"><p>停止 →（再生）→ 再生中</p><p>再生中 →（一時停止）→ 一時停止中</p><p>一時停止中 →（再開）→ 再生中</p><p>再生中 →（停止）→ 停止</p><p>一時停止中 →（停止）→ 停止</p></div>
<p class="ask">次のうち、ラウンドトリップに<b>該当しない</b>ものはどれか。</p>`,
opts:[
 '停止 → 再生中 → 停止',
 '再生中 → 一時停止中 → 再生中',
 '停止 → 再生中 → 一時停止中 → 停止',
 '停止 → 再生中 → 一時停止中 → 再生中 → 停止'],
ans:[3],
exp:`ラウンドトリップとは、開始状態と終了状態が同じで、このループ内の他の状態が2回発生しないループのこと（3.2.2項）。最後の選択肢は「再生中」が2回現れるため該当しない。`,
why:['ラウンドトリップに該当する。','ラウンドトリップに該当する。','ラウンドトリップに該当する。','正解（「再生中」が2回現れる）。']},

{id:'D32-05',unit:'3.2',lo:'TA-3.2.2',k:3,
stem:`<p>音楽プレーヤーの状態遷移は次のとおりである。</p>
<div class="box"><p>停止 →（再生）→ 再生中</p><p>再生中 →（一時停止）→ 一時停止中</p><p>一時停止中 →（再開）→ 再生中</p><p>再生中 →（停止）→ 停止</p><p>一時停止中 →（停止）→ 停止</p></div>
<p>次の1件のテストを実行した：停止 → 再生中 → 一時停止中 → 再生中 → 停止</p>
<p class="ask">達成した0スイッチカバレッジと1スイッチカバレッジの組み合わせはどれか。</p>`,
opts:['0スイッチ：80%　1スイッチ：37.5%','0スイッチ：100%　1スイッチ：50%','0スイッチ：80%　1スイッチ：50%','0スイッチ：60%　1スイッチ：37.5%'],
ans:[0],
exp:`0スイッチカバレッジは有効遷移カバレッジと等しい。遷移は5つで、テストは4つ（再生、一時停止、再開、再生中からの停止）を通るので80%。1スイッチは「入る遷移数×出る遷移数」の合計で、停止 2×1、再生中 2×2、一時停止中 1×2 の計8。テストが通る1スイッチは「再生→一時停止」「一時停止→再開」「再開→停止」の3つで、3 ÷ 8 ＝ 37.5%（3.2.2項）。`,
why:['正解。','「一時停止中からの停止」が未実行なので0スイッチは100%ではない。','1スイッチの総数を6とした誤り。','遷移数の数え誤り。']},

{id:'D32-06',unit:'3.2',lo:'TA-3.2.2',k:3,
stem:`<p>テストベースには会員アプリの状態遷移図が含まれている。テスト分析中、TAはテスト条件「画面ロック中に30分操作がなければ自動的にログアウトする」を識別したが、状態遷移図には「ロック中」からのタイムアウトによる遷移が描かれていない。</p>
<p class="ask">TAの対応として、最も適切なものはどれか。</p>`,
opts:[
 '状態遷移図に描かれている遷移だけをテストし、このテスト条件はテスト対象外とする。',
 'モデルにテスト条件が含まれていないことを確認したので、必要に応じてモデルを調整するか新しいモデルを設計し、不足を関係者にフィードバックする。',
 'モデルは開発担当者の成果物なので変更せず、テスト条件だけを別の文書に記録してテストケースは作らない。',
 '状態遷移テストをやめ、このフィーチャーはランダムテストだけで確認する。'],
ans:[1],
exp:`テストベースにすでに状態に基づくモデルが含まれている場合、TAはそのモデルにテスト条件が含まれているかを確認し、必要であればモデルを調整するか新しいモデルを設計しなければならない（3.2.2項）。モデリング中に仕様書の欠陥を検出することは欠陥予防にも貢献する。`,
why:['テスト条件の漏れを放置している。','正解。','モデルの調整はTAの責務として明記されている。','状態に依存する振る舞いを体系的に確認できなくなる。']},

{id:'D32-07',unit:'3.2',lo:'TA-3.2.3',k:3,
stem:`<p>データ送信のアクティビティ図に「送信に失敗したら再送する」ループがある。再送回数に上限はなく、1回目で成功すれば再送は行われない。典型的な再送回数は3回程度である。</p>
<p class="ask">このループにシンプルループカバレッジを適用する場合、テストする再送回数の集合として最も適切なものはどれか。</p>`,
opts:['1回、3回','0回、3回','0回、1回','0回、1回、3回'],
ans:[3],
exp:`シンプルループカバレッジでは、各ループを0回（スキップ）、ちょうど1回、2回以上（典型的な反復回数）、および可能であれば最大反復回数で実行するテストが必要（3.2.3項）。上限がないため最大反復回数は適用できない。`,
why:['0回（スキップ）が漏れている。','ちょうど1回が漏れている。','2回以上（典型的な反復回数）が漏れている。','正解。']},

{id:'D32-08',unit:'3.2',lo:'TA-3.2.3',k:3,
stem:`<p>ユースケース「ローンを申し込む」には、メインシナリオ1つ、拡張2つ、例外1つがある。メインシナリオでは、入力された年収によって融資上限額の計算が変わる（300万円未満／300万円以上800万円未満／800万円以上の3つの同値パーティション）。</p>
<p>カバレッジ基準として、各シナリオを少なくとも1回カバーし、さらにメインシナリオでは年収の3つのパーティションをすべてカバーすることにした。</p>
<p class="ask">必要なテストケースの最小数はいくつか。</p>`,
opts:['4','5','6','9'],
ans:[2],
exp:`カバレッジ基準によっては、各シナリオを複数回テストすることを求める。シナリオ内の変数に追加のEPやBVAのカバレッジが必要な場合、1つのシナリオを複数のテストケースでテストする必要がある（3.2.3項）。メインシナリオ3件＋拡張2件＋例外1件＝6。`,
why:['各シナリオを1回ずつカバーした数。パーティションの追加カバレッジが反映されていない。','誤り。','正解。','すべてのシナリオに3つのパーティションを掛けた誤り。']},

{id:'D32-09',unit:'3.2',lo:'TA-3.2.3',k:3,
stem:`<p class="ask">シナリオベースドテストの適用に関する記述として、正しいものはどれか。</p>`,
opts:[
 'シナリオベースドテストは受け入れテストでしか使えない。',
 '1つのユースケースは、複数のメインシナリオを持つことができる。',
 'シナリオモデルにループがある場合はカバレッジを測れないため、ループを含むシナリオはテストしない。',
 'さまざまなメソッドを呼び出すシナリオによる状態を持つクラスのコンポーネントテストや、信頼性テストなどで使う運用プロファイルの要素としても使える。'],
ans:[3],
exp:`シナリオベースドテストはシステムテストや受け入れテストで実施することが多いが、ほかのテストレベル（相互作用プロトコルに基づくコンポーネント統合テスト、状態を持つクラスのコンポーネントテスト）や非機能テスト（運用プロファイルの要素）でも使える（3.2.3項）。`,
why:['ほかのテストレベルや非機能テストでも使える。','ユースケースはメインシナリオを1つしか持てない。','ループがある場合はシンプルループカバレッジを適用できる。','正解。']},

{id:'D32-10',unit:'3.2',lo:'TA-3.2.3',k:3,
stem:`<p>ユースケース「会議室を予約する」のメインシナリオは「日時を選ぶ → 会議室を選ぶ → 内容を確認する → 予約が完了する」である。ほかに次のシナリオを識別した。</p>
<div class="box"><ol>
<li>希望の会議室が埋まっていたため、システムが提示した別の会議室を選び、予約を完了する。</li>
<li>参加者数が定員を超えたため、システムが提案した広い会議室を選び、予約を完了する。</li>
<li>予約権限のない利用者のため、予約できずに終了する。</li>
<li>過去の日時を入力したため、エラーとなり予約できずに終了する。</li>
<li>毎週の繰り返し予約を指定し、まとめて予約を完了する。</li></ol></div>
<p class="ask">拡張と例外の数の組み合わせとして正しいものはどれか。</p>`,
opts:['拡張：3　例外：2','拡張：2　例外：3','拡張：4　例外：1','拡張：5　例外：0'],
ans:[0],
exp:`拡張（代替シナリオ）はメインシナリオ以外の一連のアクションで、最終的にメインシナリオのゴール達成につながる。例外は予期せぬアクションにより、メインシナリオのゴールを達成できない一連のアクション（3.2.3項）。1・2・5は予約が完了するので拡張、3・4は完了しないので例外。`,
why:['正解。','拡張と例外の数が逆。','4（過去日時）は予約できないので例外。','3と4はゴールを達成できないので例外。']},

/* ===== 3.3 ルールに基づくテスト技法 ===== */
{id:'D33-01',unit:'3.3',lo:'TA-3.3.1',k:3,
stem:`<p>デシジョンテーブルの条件は「会員（Y/N）」「クーポン使用（Y/N）」「初回購入（Y/N）」「配送方法（通常／速達／店舗受取）」の4つである。</p>
<p class="ask">完全なデシジョンテーブルのルール数はいくつか。</p>`,
opts:['9','12','24','48'],
ans:[2],
exp:`完全なデシジョンテーブルのルール数は、その条件の値の数の積である（3.3.1項）。2×2×2×3＝24。この数は条件と値の数とともに指数関数的に増え、デシジョンテーブルを最小化する動機となる。`,
why:['値の数を足した誤り。','誤り。','正解。','誤り。']},

{id:'D33-02',unit:'3.3',lo:'TA-3.3.1',k:3,
stem:`<p>条件C1（Y/N）、C2（Y/N）、C3（A/B/C）を持つデシジョンテーブルの一部は次のとおりである。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th></th><th class="c">R1</th><th class="c">R2</th><th class="c">R3</th><th class="c">R4</th></tr></thead><tbody>
<tr><th>C1</th><td class="c">Y</td><td class="c">Y</td><td class="c">Y</td><td class="c">N</td></tr>
<tr><th>C2</th><td class="c">Y</td><td class="c">N</td><td class="c">Y</td><td class="c">Y</td></tr>
<tr><th>C3</th><td class="c">A</td><td class="c">A</td><td class="c">B</td><td class="c">A</td></tr>
<tr><th>アクション</th><td class="c">X</td><td class="c">X</td><td class="c">X</td><td class="c">Z</td></tr>
</tbody></table></div>
<p class="ask">体系的な最小化の規則に従って、正しくマージできるルールの組とその結果はどれか。</p>`,
opts:['R1とR3 →（Y, Y, -）','R1とR2 →（Y, -, A）','R1とR4 →（-, Y, A）','R2とR3 →（Y, -, -）'],
ans:[1],
exp:`体系的な最小化では、アクションが等価で、ある1つの条件だけが異なり、その条件の取りうる値をすべてカバーしているルールをマージし、異なる条件値を「-」で置き換える（3.3.1項）。R1とR2はC2だけが異なり、C2の値Y/Nをすべてカバーしている。`,
why:['C3は3値（A/B/C）で、R1とR3はCをカバーしていない。','正解。','アクションが異なる（XとZ）。','2つの条件（C2とC3）が異なる。']},

{id:'D33-03',unit:'3.3',lo:'TA-3.3.1',k:3,
stem:`<p>条件C1、C2、C3（すべてY/N）を持つ完全なデシジョンテーブル（8ルール）を、次のように最小化した。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th></th><th class="c">R1</th><th class="c">R2</th><th class="c">R3</th></tr></thead><tbody>
<tr><th>C1</th><td class="c">Y</td><td class="c">N</td><td class="c">N</td></tr>
<tr><th>C2</th><td class="c">-</td><td class="c">Y</td><td class="c">N</td></tr>
<tr><th>C3</th><td class="c">-</td><td class="c">-</td><td class="c">Y</td></tr>
</tbody></table></div>
<p class="ask">チェックサムプロシジャーを適用した結果として正しいものはどれか。</p>`,
opts:[
 'チェックサムは7で元の表より小さく、最小化した表は不完全である。',
 'チェックサムは8で元の表と等しく、最小化した表は元の表と等価である。',
 'チェックサムは9で元の表より大きく、ルールが重複している。',
 'チェックサムは7で元の表より小さく、ルールが重複している。'],
ans:[0],
exp:`「-」がないルールのスコアは1で、「-」があるごとにその条件の値の数を掛ける。R1：2×2＝4、R2：2、R3：1 でチェックサムは7。元の表（8）より小さいので、最小化した表は不完全である（3.3.1項）。（N, N, N）に該当するルールがない。`,
why:['正解。','チェックサムの計算誤り。','チェックサムの計算誤り。','チェックサムが小さい場合は不完全であり、重複ではない。']},

{id:'D33-04',unit:'3.3',lo:'TA-3.3.1',k:3,
stem:`<p>与信判定のデシジョンテーブルについて、最小化した表（4ルール）と、元の完全な表（8ルール、うち1ルールは実行不可能）がある。この与信判定に関連するリスクレベルは高い。</p>
<p class="ask">デシジョンテーブルカバレッジの測定方法として、最も適切なものはどれか。</p>`,
opts:[
 '最小化した4ルールを分母とし、4件のテストで100%とする。',
 '完全な表の8ルールすべてを分母とする。',
 '完全な表の実行可能な7列を分母として測定する。',
 '「-」を含むルールはテスト不要なので、「-」を含まないルールだけを分母とする。'],
ans:[2],
exp:`デシジョンテーブルのカバレッジは、実行された列の数を実行可能な列の総数で割って測定する。リスクレベルが高い場合、TAは最小化を控え、完全なデシジョンテーブルの実行可能な列でカバレッジを測定すべきである（3.3.1項）。`,
why:['高リスクの場合は最小化した表でのカバレッジ測定は控える。','実行不可能な列は分母に含めない。','正解。','「-」は少なくとも2つの値を表し、TAはその実装方法を決めてテストする。']},

{id:'D33-05',unit:'3.3',lo:'TA-3.3.1',k:3,
stem:`<p>運賃区分のデシジョンテーブルをレビューしている。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th></th><th class="c">R1</th><th class="c">R2</th><th class="c">R3</th><th class="c">R4</th><th class="c">R5</th></tr></thead><tbody>
<tr><th>C1 年齢 &lt; 20</th><td class="c">Y</td><td class="c">Y</td><td class="c">N</td><td class="c">N</td><td class="c">Y</td></tr>
<tr><th>C2 年齢 ≥ 65</th><td class="c">N</td><td class="c">N</td><td class="c">Y</td><td class="c">N</td><td class="c">Y</td></tr>
<tr><th>C3 学生</th><td class="c">Y</td><td class="c">N</td><td class="c">-</td><td class="c">-</td><td class="c">N</td></tr>
<tr><th>アクション</th><td class="c">学割</td><td class="c">小児</td><td class="c">シニア</td><td class="c">一般</td><td class="c">一般</td></tr>
</tbody></table></div>
<p class="ask">このデシジョンテーブルが満たしていないレビュー基準はどれか。</p>`,
opts:['一貫性','実現可能性','完全性','簡潔性'],
ans:[1],
exp:`TAはデシジョンテーブルを、一貫性、実現可能性（実現不可能なルールを含まない）、完全性、正確性の基準でレビューする（3.3.1項）。R5は「20歳未満」かつ「65歳以上」で、実現不可能なルールである。実現可能な6つの組み合わせはR1〜R4で重複なくカバーされている。`,
why:['実現可能な組み合わせについて、矛盾するアクションの重複はない。','正解。','実現可能な組み合わせはすべてカバーされている。','デシジョンテーブルのレビュー基準として挙げられていない。']},

{id:'D33-06',unit:'3.3',lo:'TA-3.3.2',k:3,
stem:`<p>数値リストを昇順に並べ替える関数にメタモルフィックテストを適用する。</p>
<p class="ask">メタモルフィック関係として正しいものはどれか。</p>`,
opts:[
 '入力リストの要素の順序を入れ替えても、出力は同じになる。',
 '入力リストを逆順にすると、出力も逆順になる。',
 '入力リストに要素を1つ追加すると、出力の先頭要素は必ず変わる。',
 '入力リストのすべての要素の符号を反転しても、出力は同じになる。'],
ans:[0],
exp:`MRはテストアイテムの特性を定義し、入力の変更が期待結果にどう反映されるかを記述する（3.3.2項）。昇順ソートの結果は入力の並び順に依存しない。`,
why:['正解。','入力を逆順にしても、昇順ソートの出力は同じ。','追加した要素が最小値でなければ先頭は変わらない。','符号を反転すると、出力は元の結果の各要素を反転して逆順に並べたものになる。']},

{id:'D33-07',unit:'3.3',lo:'TA-3.3.2',k:3,
stem:`<p>画像分類AIのテストで、猫の写真を入力して「猫」と分類されることをソーステストケースとした。</p>
<p class="ask">メタモルフィック関係に基づくフォローアップテストケースとして、最も適切なものはどれか。</p>`,
opts:[
 '同じ写真を左右反転すると、分類結果は「犬」になる。',
 '同じ写真の明るさをわずかに上げても、分類結果は「猫」のままである。',
 '同じ写真を縮小すると、分類の確信度は必ず上がる。',
 '別の猫の写真を入力すると、確信度はソースと同じ値になる。'],
ans:[1],
exp:`MRに基づいてソーステストケースを変更し、フォローアップテストケースを生成する。期待結果は、入力の変更がどのように反映されるかで決まる（3.3.2項）。わずかな明るさの変化では分類は変わらないはず、という関係は妥当なMRである。MTはAIベースのシステムで推奨される技法でもある。`,
why:['左右反転で被写体の種類は変わらないので、妥当な関係ではない。','正解。','縮小で確信度が上がる根拠はない。','別の写真の確信度が同じになる根拠はない。']},

{id:'D33-08',unit:'3.3',lo:'TA-3.3.2',k:3,
stem:`<p>AIによる需要予測システムには、テストオラクル問題がある。MR「他の条件が同じなら、広告費を増やしても予測売上は減らない」を使い、ソーステストケース（広告費100万円）で予測売上1,000個、フォローアップテストケース（広告費150万円）で予測売上950個という結果を得た。</p>
<p class="ask">テスト結果の判断として、最も適切なものはどれか。</p>`,
opts:[
 'ソーステストケースは合格しているので、フォローアップテストケースの入力処理に欠陥があると断定する。',
 '個々のテストケースの期待結果がわからないので、このテストは合格とする。',
 'メタモルフィック関係を満たしていないのでテストは不合格とし、関係する個々のテストケースのどれが誤っているかはデバッグで判断する。',
 '予測売上が減ったのはMRが誤っているためなので、結果を無視してMRを削除する。'],
ans:[2],
exp:`TAはソーステストケースとフォローアップテストケースをテストプロシジャーに結合し、合同でテスト結果を評価する。MRを満たせば合格、満たさなければ不合格。故障の場合、後続のデバッグは関係する個々のテストケースのどれが不合格となったかを判断しなければならない（3.3.2項）。`,
why:['オラクル問題があるため、ソース単独の正しさは確認できない。','MRを満たさない以上、不合格。','正解。','根拠なくMRを捨てるのは不適切。MRの妥当性を見直すことはあっても、まず故障として扱う。']},

{id:'D33-09',unit:'3.3',lo:'TA-3.3.2',k:3,
stem:`<p class="ask">メタモルフィックテストの適用範囲に関する記述として、正しいものはどれか。</p>`,
opts:[
 '期待結果が明確に得られる場合にしか使えない。',
 '機能テスト専用の技法であり、非機能テストには適用できない。',
 '各メタモルフィック関係を1回ずつカバーすることが、広く認められた終了基準である。',
 '機能テストだけでなく、負荷テストやインストール性テストなどの非機能テストにも適用でき、AIベースのシステムで推奨されるテスト技法である。'],
ans:[3],
exp:`MTはほとんどのテストアイテムに使用でき、機能テストと非機能テスト（例：MRを用いたフォローアップテストケースによる負荷生成、複数のシーケンスで選べるインストールパラメーターを使ったインストール性テスト）に適用できる。AIベースのシステムで推奨される技法である（3.3.2項）。`,
why:['テストオラクル問題がある場合にも使える。','非機能テストにも適用できる。','有用な終了基準となるカバレッジ尺度は認められておらず、各MRを1回ずつでは不十分。','正解。']},

{id:'D33-10',unit:'3.3',lo:'TA-3.3.2',k:3,
stem:`<p>平均値を求める関数に、次の2つのメタモルフィック関係を定義した。</p>
<div class="box"><p>MR1：数値の並び順を入れ替えても、平均値は変わらない。</p><p>MR2：すべての数値をk倍すると、平均値もk倍になる。</p></div>
<p>ソーステストケースの入力は [3, 5, 10]、実行結果は6だった。</p>
<p class="ask">MR1とMR2を組み合わせたフォローアップテストケースとその期待結果として、正しいものはどれか。</p>`,
opts:['入力 [10, 3, 5]、期待結果 6','入力 [6, 10, 20]、期待結果 6','入力 [20, 6, 10]、期待結果 12','入力 [4, 6, 11]、期待結果 7'],
ans:[2],
exp:`TAは2つ以上のMRを組み合わせてフォローアップテストケースを作成できる（例：順列を付けて2倍にする）（3.3.2項）。各値を2倍して並べ替えた [20, 6, 10] の平均は、ソースの結果の2倍の12になるはずである。`,
why:['MR1だけを適用したもの。','2倍しているのに期待結果を変えていない。','正解。','「各値に1を加える」という、定義していない関係を使っている。']},

/* ===== 3.4 経験ベースのテスト ===== */
{id:'D34-01',unit:'3.4',lo:'TA-3.4.1',k:3,
stem:`<p>テストチャーターのミッションは次のとおりである。</p>
<div class="box"><p>「会員ポイントの失効処理を探索する／失効日の前日・当日・翌日の会員データとバッチ実行ツールを用いて／失効漏れや二重失効を発見するために」</p></div>
<p class="ask">このミッションの [target]、[resources]、[information] の組み合わせとして正しいものはどれか。</p>`,
opts:[
 'target：失効漏れや二重失効　resources：会員データとバッチ実行ツール　information：会員ポイントの失効処理',
 'target：会員ポイントの失効処理　resources：失効漏れや二重失効　information：会員データとバッチ実行ツール',
 'target：会員データとバッチ実行ツール　resources：会員ポイントの失効処理　information：失効漏れや二重失効',
 'target：会員ポイントの失効処理　resources：会員データとバッチ実行ツール　information：失効漏れや二重失効'],
ans:[3],
exp:`ミッションの軽量フォーマットは「[target]を探索する／[resources]を用いて／[information]を発見するために」。[target]は何を探索するか、[resources]はTAが使用するもの（テストデータ、ツールなど）、[information]は発見を狙う情報のタイプ（予想される欠陥のタイプなど）（3.4.1項）。`,
why:['targetとinformationが逆。','resourcesとinformationが逆。','targetとresourcesが逆。','正解。']},

{id:'D34-02',unit:'3.4',lo:'TA-3.4.1',k:3,
stem:`<p>テストチャーターに次の3つの追加情報を記載する。</p>
<div class="box"><p><b>X</b>：セッションは60分。開始日時と担当者名。</p>
<p><b>Y</b>：このセッションでは、決済のリトライ処理はテストしない。</p>
<p><b>Z</b>：テスト用のクレジットカード番号の発行が完了していること。</p></div>
<p class="ask">X、Y、Zに対応する追加情報の項目の組み合わせとして正しいものはどれか。</p>`,
opts:[
 'X：運営情報　Y：テストスコープ　Z：開始基準',
 'X：テスト目的　Y：制限　Z：開始基準',
 'X：運営情報　Y：制限　Z：テスト環境の記述',
 'X：履歴情報　Y：テストスコープ　Z：制約とリスク'],
ans:[0],
exp:`運営情報はセッションの所要時間、開始日時、担当者名など。テストスコープにはテストしない内容の記述も含まれる。開始基準はテストセッションを開始するために満たすべき事前条件。制限は「プロダクトが絶対にやってはならないこと」（3.4.1項）。`,
why:['正解。','Xはテスト目的ではない。Yはプロダクトの制限ではなくテストしない範囲。','Yは制限ではない。Zは開始前に満たすべき事前条件なので開始基準。','Xは履歴情報ではない。Zは制約とリスクではない。']},

{id:'D34-03',unit:'3.4',lo:'TA-3.4.1',k:3,
stem:`<p class="ask">セッションベースドテストとテストチャーターに関する記述として、正しいものはどれか。</p>`,
opts:[
 'テストチャーターは、各テストセッションで実行するテストスイートを指定する。',
 'テストセッション中、TAはテスト結果とともに、質問、観察、将来のテストに関するアイデアなどをセッションシートに記録する。',
 'テストチャーターに「システムが絶対にしてはならないこと」を書くと、偽陽性結果の報告が増える。',
 'ハイレベルテストケースは抽象的なので、テストチャーターのテスト目的を作る指針には使えない。'],
ans:[1],
exp:`テストセッション中、TAはテスト結果とともに、質問、観察、将来のテストに関するアイデアなどのテスト結果記録作業を行い、セッションシートに記録する（3.4.1項）。`,
why:['テストチャーターは各セッションで実行するテストスイートを指定するものではない。','正解。','そのような追加情報は、偽陽性結果を報告する可能性を低くできる。','TAはハイレベルテストケースを指針としてテストチャーター内のテスト目的を作成できる（1.3.1項）。']},

{id:'D34-04',unit:'3.4',lo:'TA-3.4.1',k:3,
stem:`<p>ログインにSMSによる二要素認証が追加された。リスクとして「認証コードのSMSが遅延すると、利用者がロックアウトされる」ことが懸念されている。セッションに使える時間は90分である。</p>
<p class="ask">テストチャーターとして、最も適切なものはどれか。</p>`,
opts:[
 'ミッション「ログイン画面のテストケースTC-201〜TC-260をすべて実行する」、運営情報：90分',
 'ミッション「アプリ全体を探索する」のみ',
 'ミッション「SMS二要素認証を探索する／SMS遅延シミュレーターと複数の通信事業者の端末を用いて／コード遅延時のロックアウトや再送の不具合を発見するために」、運営情報：90分、制限：認証コードは5分を超えて有効であってはならない',
 'ミッション「SMS二要素認証を探索する」、テストスコープ：境界値分析とデシジョンテーブルテストを必ず用い、すべての操作手順を事前に記述する'],
ans:[2],
exp:`テストチャーターはテスト目的と追加情報を記述したミッションから構成され、「[target]を探索する／[resources]を用いて／[information]を発見するために」の形式が一般的。運営情報や制限などの追加情報を含められる（3.4.1項）。`,
why:['テストチャーターはテストスイートを指定するものではない。','リスクに焦点がなく、構造を提供していない。','正解。','技法と全手順を事前に固定すると、TAの柔軟性を大きく制約する。']},

{id:'D34-05',unit:'3.4',lo:'TA-3.4.2',k:3,
stem:`<p>TAが経験ベースのテストのためにチェックリストを準備する。次の作業がある。</p>
<div class="box"><p>P：チェックリスト項目を、機能エリアやユーザーの役割などで論理的なグループに分類して構造化する。</p>
<p>Q：チェックリストの範囲、目的、形式を決める。</p>
<p>R：新しい発見事項や前のテストサイクルの教訓を反映して、継続的にレビューし洗練させる。</p>
<p>S：専門家や欠陥分類法などから情報を集め、チェックリスト項目を定義して優先度を割り当てる。</p></div>
<p class="ask">シラバスのガイドラインに沿った順序はどれか。</p>`,
opts:['S → Q → P → R','Q → P → S → R','Q → S → P → R','P → Q → S → R'],
ans:[2],
exp:`ガイドライン：まず範囲・目的・形式を決める（Q）。次に情報を収集して項目を定義し、優先度を割り当てる（S）。最後に論理的なグループに分類して構造化・整理する（P）。チェックリストは決して最終的なものではなく、継続的にレビューして洗練させる（R）（3.4.2項）。`,
why:['範囲・目的・形式の決定が最初にくる。','項目を定義する前に構造化はできない。','正解。','範囲・目的・形式の決定が最初にくる。']},

{id:'D34-06',unit:'3.4',lo:'TA-3.4.2',k:3,
stem:`<p>チェックリストに「エラー処理は適切か」という項目がある。</p>
<p class="ask">シラバスが求める品質を満たすように書き直した項目として、最も適切なものはどれか。</p>`,
opts:[
 '「エラー処理を十分に確認すること」',
 '「通信が切断されたとき、入力中のデータが失われず、再接続後に送信できるか」',
 '「エラー処理は適切か。必要に応じて確認する」',
 '「エラー処理の全パターンについて、手順書を作成する」'],
ans:[1],
exp:`チェックリスト項目は、明確で具体的で曖昧さがなく、実行可能かつ測定可能でなければならず、「はい」「いいえ」「該当しない」で答えられる質問として作成する（3.4.2項）。`,
why:['質問形式でなく、「十分に」が曖昧。','正解。','「適切か」「必要に応じて」が曖昧なまま。','チェックリストは包括的なハウツーガイドではない。']},

{id:'D34-07',unit:'3.4',lo:'TA-3.4.2',k:3,pick:2,
stem:`<p class="ask">チェックリスト項目を定義するために集める情報源として、シラバスに挙げられているものはどれか。<span class="pick2">2つ選べ</span></p>`,
opts:['欠陥ライブラリや欠陥分類法','開発担当者の勤怠記録','経験豊富な専門家からの情報収集','競合製品の販売価格','テスト担当者の人事評価'],
ans:[0,2],
exp:`TAはチェックリスト項目を定義するために、経験豊富な専門家からの情報収集、欠陥ライブラリや欠陥分類法の閲覧、関連文書のレビュー、リスク・テストケース・潜在的なシナリオの解析などを行う（3.4.2項）。`,
why:['正解。','挙げられていない。','正解。','挙げられていない。','挙げられていない。']},

{id:'D34-08',unit:'3.4',lo:'TA-3.4.2',k:3,
stem:`<p>プロジェクトで使っているチェックリストが120項目まで増え、テスト担当者から「どこから確認すればよいかわからない」という声が出ている。</p>
<p class="ask">TAの対応として、最も適切なものはどれか。</p>`,
opts:[
 '項目を機能エリアやユーザーの役割などで論理的なグループに分類し、重要度や潜在的影響、リスクレベルに基づいて優先度を割り当てる。',
 '項目を無作為に4つのリストに分け、担当者ごとに配る。',
 '優先度の表示をやめ、すべての項目を同じ重みで扱う。',
 '各項目に詳細な操作手順を追記し、包括的なハウツーガイドにする。'],
ans:[0],
exp:`TAはチェックリスト項目を、機能エリア、ユーザーの役割、テストレベルなどの基準で論理的なグループに分類して構造化・整理する。別々のカテゴリーを作ることは長いチェックリストに特に有効である。項目には重要度、潜在的影響、リスクレベルに基づいて優先度を割り当てる（3.4.2項）。`,
why:['正解。','無作為な分割では構造化にならない。','優先度は重要度、潜在的影響、リスクレベルに基づいて割り当てる。','チェックリストは包括的なハウツーガイドではない。']},

{id:'D34-09',unit:'3.4',lo:'TA-3.4.3',k:2,
stem:`<p class="ask">クラウドテストの活用が特に適している状況として、最も適切なものはどれか。</p>`,
opts:[
 '未発表の金融商品の価格算出アルゴリズムを、外部に一切情報を出さずに検証したい。',
 '毎回同じ手順で実行し、再現性の高いテスト結果を得たい。',
 'さまざまなデバイス、ブラウザー、ネットワーク条件での使用性を、実際のユーザーに近い視点で、短期間に確認したい。',
 'テスト技法を適用する活動を不要にしたい。'],
ans:[2],
exp:`クラウドテストは使用性の妥当性確認のコスト効率の高い方法になりうる。利点には、多様なテスト環境、高い柔軟性、費用対効果、迅速なフィードバック、実際のユーザー視点などがある（3.4.3項）。`,
why:['ソフトウェアを外部と共有することはセキュリティや機密性のリスクをもたらす。','テスト担当者が毎回異なるため、再現性は低くなる。','正解。','クラウドテストはTAがテスト技法を適用する活動に置き換わるものではない。']},

{id:'D34-10',unit:'3.4',lo:'TA-3.4.3',k:2,
stem:`<p class="ask">クラウドテストの「利点」の例として、最も適切なものはどれか。</p>`,
opts:[
 'テスト品質が個々のテスト担当者のスキルに左右されない。',
 'テスト担当者のタイムゾーンや文化が異なるため、調整が容易である。',
 '大規模で多様な社内テストチームを維持するより通常は低コストで、テスト担当者から素早くフィードバックが得られる。',
 '発見事項に重複や偽陽性が含まれない。'],
ans:[2],
exp:`クラウドテストの利点には、多様なテスト環境、高い柔軟性、費用対効果（大規模で多様な社内チームの維持や外部サービスより通常は低コスト）、迅速なフィードバック、実際のユーザー視点、変動性がある（3.4.3項）。`,
why:['逆。テスト品質の不安定性は制限の一つ。','逆。コミュニケーションの課題は制限の一つ。','正解。','逆。重複や偽陽性を含む多数の発見事項のマネジメントは制限の一つ。']},

/* ===== 3.5 最も適切なテスト技法の適用 ===== */
{id:'D35-01',unit:'3.5',lo:'TA-3.5.1',k:4,
stem:`<p>建築用の構造計算ソフトウェアでは、梁の幅・高さ・荷重などの数値の範囲と、それらの相互関係（例：「幅＋高さ ≤ 3,000mm」「荷重 &gt; 0」）によって、計算の可否と適用する計算式が変わる。プロダクトリスクは、この範囲判定の演算子や定数の誤りによって誤った計算式が適用されることである。</p>
<p class="ask">このリスクを軽減するテスト技法として、最も適切なものはどれか。</p>`,
opts:['ドメインテスト（信頼性の高いドメインカバレッジ）','CRUDテスト','クラウドテスト','状態遷移テスト（ラウンドトリップカバレッジ）'],
ans:[0],
exp:`テスト目的とシステムのタイプはテスト技法選択の指針となる（例：エンジニアリングにおける数値計算にはドメインに基づくテスト）。データに基づくテスト技法は、入力ドメインの実装や計算の欠陥を検出できる（3.5.1項）。信頼性の高いドメインカバレッジは、簡易ドメインカバレッジよりかなり多くのドメイン欠陥を検出できる（3.1.1項）。`,
why:['正解。','エンティティのライフサイクルの検証であり、数値範囲の判定には向かない。','体系的に境界を狙う技法ではない。','状態に依存する振る舞いの技法であり、このリスクに合わない。']},

{id:'D35-02',unit:'3.5',lo:'TA-3.5.1',k:4,
stem:`<p>医療機器の設定画面には、4つのパラメーター（各3値、全81通り）がある。特定の設定の組み合わせで誤った動作が起きると患者に危害が及ぶおそれがあり、リスクレベルは非常に高い。テスト実行は自動化されており、81通りを1晩で実行できる。</p>
<p class="ask">適用する組み合わせカバレッジとして、最も適切なものはどれか。</p>`,
opts:[
 'ペアワイズカバレッジ（約9件）',
 'ベースチョイスカバレッジ（9件）',
 '全組み合わせ（81件）',
 'ガイドなしランダムテストで10件を選ぶ'],
ans:[2],
exp:`リスクレベルが高いほど、より厳密なカバレッジが必要となる場合がある（例：ペアワイズカバレッジではなく、組み合わせカバレッジにおける全組み合わせ）。ただし、TAは常にカバレッジの強さと必要なテスト工数のトレードオフを考慮する（3.5.1項）。この状況では自動化により工数の問題も小さい。`,
why:['リスクが非常に高く、3つ以上のパラメーターの相互作用による故障も見逃せない。','重要な値を基準にした弱いカバレッジで、相互作用を十分に網羅しない。','正解。','カバレッジ基準がなく、高リスクの組み合わせを体系的に網羅できない。']},

{id:'D35-03',unit:'3.5',lo:'TA-3.5.1',k:4,
stem:`<p>社内向けの備品貸出ツールに小さな機能を追加する。リスクレベルは低く、スケジュールはタイトで、仕様書からカバレッジを定義するのは難しい。担当のTAはこの業務ドメインの知識をほとんど持っていないが、チームには類似ツールのテストで蓄積したチェックリストがある。</p>
<p class="ask">テスト技法として、最も適切なものはどれか。</p>`,
opts:[
 'ドメイン知識がなくても効果が高い探索的テストだけを行う。',
 '類似ツールのチェックリストを、このツールに合わせて調整したうえでのチェックリストベースドテスト',
 '信頼性の高いドメインカバレッジによるドメインテスト',
 '3スイッチカバレッジによる状態遷移テスト'],
ans:[1],
exp:`経験ベースのテストは、リスクレベルが低い場合、カバレッジの定義が難しい場合、スケジュールがタイトな場合に使える。ただしドメイン知識がほとんどない場合、探索的テストのような技法は効果がないかもしれない（3.5.1項）。既存のチェックリストは、テストアイテムに関連していれば再利用して時間を節約できる（3.4.2項）。`,
why:['ドメイン知識がほとんどない場合、探索的テストは効果がないかもしれない。','正解。','低リスク・短納期に対して過剰。','低リスク・短納期に対して過剰（2スイッチ以上は高リスクの場合に限って適切）。']},

{id:'D35-04',unit:'3.5',lo:'TA-3.5.1',k:4,
stem:`<p>2週間スプリントのアジャイル開発で、注文ステータス（受付、確認中、出荷準備、出荷済、キャンセルなど）が複雑に変化するフィーチャーを開発している。チームはモデルベースドテストツールを導入済みである。</p>
<p class="ask">テスト技法の選択として、最も適切なものはどれか。</p>`,
opts:[
 'シーケンシャル開発と同じく、全テストケースを手作業で詳細に文書化し、2スイッチカバレッジを手作業で設計する。',
 '状態が多く複雑なので、テストは行わずに本番で監視する。',
 'クラウドテストだけで状態の組み合わせを確認する。',
 '状態遷移モデルを作成し、モデルベースドテストツールで0スイッチ・1スイッチカバレッジのテストケースを生成して、テスト設計を自動化する。'],
ans:[3],
exp:`イテレーティブ開発モデルは、軽量なテスト技法を採用する場合や、テスト設計を自動化できる場合に適している（3.5.1項）。状態遷移テストはモデルベースドテストツールを使った自動化に適しており、0スイッチと1スイッチのカバレッジは実際に頻繁に使われる（3.2.2項）。`,
why:['短いイテレーションで、手作業の詳細な文書化と2スイッチの手設計は負担が大きすぎる。','リスクを軽減するテストを放棄している。','状態に依存する振る舞いを体系的にカバーできない。','正解。']},

{id:'D35-05',unit:'3.5',lo:'TA-3.5.1',k:4,
stem:`<p>過去3回のリリースで本番に流出した欠陥の大半は、「入力フィールドの桁数・文字種チェックの漏れ」という同じタイプだった。次のリリースでも同様の入力フィールドが多数追加される。</p>
<p class="ask">テスト技法の選択に関する判断として、最も適切なものはどれか。</p>`,
opts:[
 '繰り返し発生する欠陥タイプの知識に基づき、その種の欠陥の検出に焦点を当てた技法（入力チェックの観点をまとめたチェックリストベースドテストなど）を選択する。',
 '欠陥タイプにかかわらず、メタモルフィックテストを最優先で適用する。',
 'CRUDテストで、すべてのエンティティのライフサイクルを検証する。',
 'シナリオベースドテストとラウンドトリップカバレッジの組み合わせを適用する。'],
ans:[0],
exp:`繰り返し発生する欠陥タイプに関する知識があれば、その種の欠陥の検出に焦点を当てたテスト技法（例：チェックリストベースドテスト）を選択すべきだと判断できる（3.5.1項）。`,
why:['正解。','MTはオラクル問題がある場合などに有効だが、この欠陥タイプに焦点を当てていない。','エンティティのライフサイクルの欠陥に焦点を当てる技法で、入力チェックの漏れには向かない。','周期的な業務プロセスのリスクへの対応であり、この欠陥タイプには合わない。']},

{id:'D35-06',unit:'3.5',lo:'TA-3.5.1',k:4,
stem:`<p>保険金請求の業務プロセスをテストする。プロダクトリスクは「査定額に応じて承認ルートが分岐するプロセス内の判定が、網羅的にテストされずに残る」ことである。プロセスは周期的ではなく、請求1件ごとに完結する。</p>
<p class="ask">テスト技法の組み合わせとして、最も適切なものはどれか。</p>`,
opts:[
 'シナリオベースドテストとラウンドトリップカバレッジの組み合わせ',
 'シナリオベースドテストとデシジョンカバレッジの組み合わせ（プロセスサイクルテスト）',
 'ランダムテストとクラウドテストの組み合わせ',
 'メタモルフィックテストと全状態カバレッジの組み合わせ'],
ans:[1],
exp:`シナリオベースドテストは、ホワイトボックステスト技法であるデシジョンカバレッジと組み合わせることで、ビジネスプロセスにおける判定を厳密にカバーできる（例：プロセスサイクルテスト）。ラウンドトリップカバレッジとの組み合わせは周期的なビジネスプロセス活動のリスクへの対応である（3.5.1項）。`,
why:['プロセスは周期的ではないので、ラウンドトリップは主眼にならない。','正解。','判定を体系的にカバーできない。','このリスクに合わない組み合わせ。']},

{id:'D35-07',unit:'3.5',lo:'TA-3.5.1',k:4,
stem:`<p>ECサイトで次の3つのプロダクトリスクが識別された。</p>
<div class="box"><p><b>R1</b>：割引適用ロジックの条件判定に誤りがある。</p>
<p><b>R2</b>：返品後に再配送を依頼するといった、業務フロー上必要な機能が欠落している。</p>
<p><b>R3</b>：数量や金額の入力値の範囲チェックや、合計金額の計算に誤りがある。</p></div>
<p class="ask">各リスクの軽減に最も適したテスト技法のカテゴリーの組み合わせはどれか。</p>`,
opts:[
 'R1：データに基づく　R2：ルールに基づく　R3：振る舞いに基づく',
 'R1：振る舞いに基づく　R2：データに基づく　R3：ルールに基づく',
 'R1：ルールに基づく　R2：振る舞いに基づく　R3：データに基づく',
 'R1：ルールに基づく　R2：データに基づく　R3：振る舞いに基づく'],
ans:[2],
exp:`データに基づくテスト技法はデータ処理、入力ドメインの実装、UI、計算、パラメーターの組み合わせの欠陥を、振る舞いに基づくテスト技法は機能の欠落、コミュニケーション上の欠陥、処理の欠陥などユーザー要件の欠陥を、ルールに基づくテスト技法はロジックやコントロールフローの欠陥を検出できる（3.5.1項）。`,
why:['3つとも対応が誤っている。','3つとも対応が誤っている。','正解。','R2とR3が逆。']},

{id:'D35-08',unit:'3.5',lo:'TA-3.5.2',k:2,
stem:`<p class="ask">テスト設計を自動化する利点の説明として、正しいものはどれか。</p>`,
opts:[
 'テストモデルの保守は不要になる。',
 '手作業はエラーを起こしやすいが、ツールで生成したテストウェアは品質と一貫性が高い。',
 'どのようなテストモデルでも、すべてのステークホルダーが容易に理解できる。',
 'テスト自動化の一般的なリスクはなくなる。'],
ans:[1],
exp:`テスト設計自動化の利点の一つは「テストウェアの欠陥削減」で、手作業はエラーを起こしやすく、ツールによって生成されたテストウェアは品質と一貫性が高い（3.5.2項）。`,
why:['保守対象がテストモデルだけになるが、保守は必要。保守工数の過小評価はリスク。','正解。','ステークホルダーがモデルを理解しにくいと感じることはリスク。','テスト自動化の一般的なリスクも考慮しなければならない。']},

{id:'D35-09',unit:'3.5',lo:'TA-3.5.2',k:2,pick:2,
stem:`<p>チームはモデルベースドテストを導入して、テスト設計を自動化した。3か月後、テストモデルの保守に計画の2倍の工数がかかっていることがわかった。また、業務部門のステークホルダーはモデルを読み解けず、レビューに参加できなかった。</p>
<p class="ask">顕在化したテスト設計自動化のリスクはどれか。<span class="pick2">2つ選べ</span></p>`,
opts:[
 'テストモデルのメンテナンス工数の過小評価',
 'テストウェアの欠陥削減',
 'ステークホルダーがモデルを理解しにくいと感じること',
 'トレーサビリティの強化',
 '多様な出力形式'],
ans:[0,2],
exp:`テスト設計自動化のリスクには、モデルに示されていないテスト条件の見落とし、テストモデルのメンテナンス工数の過小評価、ステークホルダーがモデルを理解しにくいと感じること、テスト自動化の一般的なリスクがある（3.5.2項）。`,
why:['正解。','利点として挙げられている。','正解。','利点として挙げられている。','利点として挙げられている。']},

{id:'D35-10',unit:'3.5',lo:'TA-3.5.2',k:2,
stem:`<p>要件の変更に対応するため、TAはテストモデルの1か所を修正し、そこから200件のテストケースを再生成した。個々のテストケースを手で修正する必要はなかった。</p>
<p class="ask">この状況に最も当てはまるテスト設計自動化の利点はどれか。</p>`,
opts:['欠陥予防','対応能力の拡張','メンテナンス工数の削減','チームコラボレーションの強化'],
ans:[2],
exp:`テストモデルは、テストウェアを導出するために使われる信頼できる唯一の情報源である。その結果、テストモデルだけを保守すればよい（メンテナンス工数の削減）（3.5.2項）。`,
why:['モデリングによってテストベースの品質を評価できることを指す利点。','複雑なテスト技法やカバレッジ基準を適用できるようになることを指す利点。','正解。','ステークホルダーがテストモデルをレビューできることを指す利点。']},

/* ===== 第4章 品質特性のテスト ===== */
{id:'D4-01',unit:'4',lo:'TA-4.1.1',k:2,
stem:`<p>機能適合性の副特性のうち、ある副特性のテストについて次の説明がある。</p>
<div class="box"><p>・有効な入力に対しても無効な入力に対しても、実際の結果が正しい（正確、精密、一貫性がある）かを確認する。</p><p>・期待結果を詳細に提供する効果的なテストオラクルを見つけることが極めて重要である。</p><p>・シフトレフトの観点から、ほとんどのテストはコンポーネントテストとコンポーネント統合テストで行うべきである。</p></div>
<p class="ask">この説明に該当する副特性はどれか。</p>`,
opts:['機能正確性','機能完全性','機能適切性','相互運用性'],
ans:[0],
exp:`機能正確性テストは、実際の結果が有効な入力に対しても無効な入力に対しても正しいかという疑問に答える。期待結果を詳細に提供する効果的なテストオラクルの発見が極めて重要である。どのテストレベルでもテストできるが、シフトレフトの観点からほとんどはコンポーネントテストとコンポーネント統合テストで行うべきである（4.1節）。`,
why:[
 '正解。',
 '機能完全性は、指定されたすべてのタスクとユーザーの目的がカバーされているか（求められていることがすべて実装されているか）を扱う。',
 '機能適切性は、機能が指定されたタスクや目的の達成を容易にするかを扱う。',
 '相互運用性は互換性の副特性であり、機能適合性の副特性ではない。'
]},

{id:'D4-02',unit:'4',lo:'TA-4.1.1',k:2,
stem:`<p>アジャイル開発のチームが、スプリントレビューのデモセッションで、新しい在庫補充機能が店舗スタッフの発注業務を実際に容易にしているかどうかを確認したい。</p>
<p class="ask">このテストが主に対象とする副特性と、最も適したテストの組み合わせはどれか。</p>`,
opts:[
 '機能適切性 ― 探索的テストやコラボレーションベースのテスト',
 '機能完全性 ― テストベースとのトレーサビリティに基づくシナリオベースドテスト',
 '機能正確性 ― ドメインテストや境界値分析',
 '機能正確性 ― コラボレーションベースのテスト'
],
ans:[0],
exp:`機能適切性テストは、機能が指定されたタスクや目的の達成を容易にするものであることを検証し、実装されているものがユーザーのニーズを満たしているかに焦点を当てる。アジャイル開発ではデモセッションから動的テストを始める。探索的テストやコラボレーションベースのテストが最も適している（4.1節）。`,
why:[
 '正解。',
 '機能完全性は「求められていることがすべて実装されているか」を扱う。業務を容易にしているかは機能適切性である。',
 '業務を容易にするかを確認するテストであり、結果の正しさ（機能正確性）を対象とするものではない。',
 '業務を容易にするかを確認するのは機能適切性である。'
]},

{id:'D4-03',unit:'4',lo:'TA-4.1.1',k:2,
stem:`<p>シーケンシャル開発モデルの基幹システム刷新プロジェクトで、「旧システムで行っていた業務がすべて新システムで実施できるか」が最大のプロダクトリスクとされた。</p>
<p class="ask">このリスクに対するTAの取り組みとして、最も適切なものはどれか。</p>`,
opts:[
 '要件仕様のレビューで早い段階から対処し、システムテストや受け入れテストではシナリオベースドテストで業務を動的にテストする。達成度はテストベース・テスト条件・テストケース間のトレーサビリティで判断する。',
 'ほとんどのテストをコンポーネントテストで行い、各機能の計算結果が精密であることを確認する。',
 '有効な入力と無効な入力の両方に対する出力が、旧システムと一致するかをドメインテストで確認する。',
 'デモセッションで利用者に操作してもらい、操作が容易かどうかの意見を集める。'
],
ans:[0],
exp:`機能完全性テストは、指定されたすべてのタスクと想定されるユーザーの目的をカバーしなければならない。シーケンシャル開発モデルでは要件仕様のレビューによって早期に対処し、システムテスト、システム統合テスト、受け入れテストで動的にテストする。シナリオベースドテストのような振る舞いに基づく技法が適しており、トレーサビリティは達成された機能完全性のレベルの判断に不可欠である（4.1節）。`,
why:[
 '正解。機能完全性に対する取り組み方の記述どおり。',
 'コンポーネントテストで結果の精密さを確認するのは機能正確性の取り組みである。',
 '入力に対する結果の正しさの確認は機能正確性の取り組みである。',
 '操作の容易さへの意見収集は機能適切性（あるいは使用性）の取り組みであり、業務がすべて実施できるかの確認にはならない。'
]},

{id:'D4-04',unit:'4',lo:'TA-4.2.1',k:2,
stem:`<p>図書館の蔵書予約サイトの使用性テストで、次の3つの評価観点を設定した。</p>
<div class="box"><p><b>X</b>：視覚に障がいのある利用者が、スクリーンリーダーを使って予約を完了できるか。</p>
<p><b>Y</b>：初めての利用者が、迷わず短時間で予約を完了できるか。</p>
<p><b>Z</b>：利用前に抱いていた期待と、利用後の印象がどう変わったか。</p></div>
<p class="ask">X、Y、Zと、使用性テストで評価する点の組み合わせとして、正しいものはどれか。</p>`,
opts:[
 'X：アクセシビリティ　Y：インタラクション容易性　Z：ユーザーエクスペリエンス',
 'X：インタラクション容易性　Y：アクセシビリティ　Z：ユーザーエクスペリエンス',
 'X：アクセシビリティ　Y：ユーザーエクスペリエンス　Z：インタラクション容易性',
 'X：ユーザーエクスペリエンス　Y：インタラクション容易性　Z：アクセシビリティ'
],
ans:[0],
exp:`使用性テストは通常、①インタラクション容易性（特定の使用コンテキストで効果的、効率的、満足にタスクを完了できる）、②ユーザーエクスペリエンス（やりとりの前、最中、その後のユーザーの知覚）、③アクセシビリティ（障がいのあるユーザーなどが効果的かつ効率的に利用できる）を中心に評価する（4.2節）。`,
why:[
 '正解。',
 'Xは障がいのある利用者が利用できるかなのでアクセシビリティ、Yは効果的・効率的にタスクを完了できるかなのでインタラクション容易性である。',
 'Yはタスクを効率的に完了できるかなのでインタラクション容易性、Zはやりとりの前後の知覚なのでユーザーエクスペリエンスである。',
 'Xはアクセシビリティ、Zはユーザーエクスペリエンスである。'
]},

{id:'D4-05',unit:'4',lo:'TA-4.2.1',k:2,
stem:`<p>使用性評価技法と、それに対するTAの貢献を対応づけたい。</p>
<div class="box"><p><b>(1)</b> 使用性レビュー　<b>(2)</b> 使用性テストセッション　<b>(3)</b> ユーザーアンケート</p>
<p><b>P</b>：ペルソナ、ユーザーグループ、運用プロファイルに従ってシナリオを設計する。</p>
<p><b>Q</b>：一般的な使用性チェックリストを、ユーザーグループのニーズ、ビジネス目標、使用コンテキストに合わせて調整する。</p>
<p><b>R</b>：対象ユーザーの特定のゴールに対応するよう、質問の設計と回答の評価を支援する。</p></div>
<p class="ask">正しい組み合わせはどれか。</p>`,
opts:[
 '(1)-Q　(2)-P　(3)-R',
 '(1)-P　(2)-Q　(3)-R',
 '(1)-Q　(2)-R　(3)-P',
 '(1)-R　(2)-P　(3)-Q'
],
ans:[0],
exp:`使用性レビュー：TAはレビュー基準をユーザーグループの特定のニーズ、ビジネス目標、優先度、使用コンテキストに適応させる（一般的な使用性チェックリストの調整など）。使用性テストセッション：ペルソナ、ユーザーグループ、運用プロファイルに従ってシナリオ設計に貢献する。ユーザーアンケート：対象ユーザーの特定のゴールに対応するため、アンケートの設計と回答の評価を支援する（4.2節）。`,
why:[
 '正解。',
 'シナリオの設計は使用性テストセッション、チェックリストの調整は使用性レビューへの貢献である。',
 '質問の設計と回答の評価はユーザーアンケート、シナリオの設計は使用性テストセッションへの貢献である。',
 'チェックリストの調整は使用性レビュー、質問の設計はユーザーアンケートへの貢献である。'
]},

{id:'D4-06',unit:'4',lo:'TA-4.2.1',k:2,
stem:`<p class="ask">TAが使用性テストに早い段階から協力できる理由として、シラバスの記述に最も合うものはどれか。</p>`,
opts:[
 'ターゲットユーザーグループ、彼らのゴール、使用時のコンテキスト、システムを使用する際の潜在的な困難や否定的なユーザーエクスペリエンスに関する知識を持っているから。',
 'TAは使用性の専門家として、使用性レビューを主導する責任を負っているから。',
 '使用性はリリース後のユーザーアンケートでしか評価できないため、TAが早期にアンケートを準備する必要があるから。',
 '使用性テストの目的はWCAGの適合レベルの検証に限られ、TAはその判定基準を熟知しているから。'
],
ans:[0],
exp:`TAは、ターゲットユーザーグループ、彼らのゴール、使用時のコンテキスト、システムを使用する際の潜在的な困難、否定的なユーザーエクスペリエンスに関する知識を活用することで、早い段階から使用性テストに協力できる（4.2節）。`,
why:[
 '正解。',
 '使用性レビューは使用性の専門家が行う。TAはレビュー基準の調整などで貢献する。',
 '使用性はレビューや使用性テストセッションなど、リリース前にもさまざまな技法で評価できる。',
 'アクセシビリティの標準への適合は使用性テストの観点の一部にすぎない。インタラクション容易性やユーザーエクスペリエンスも評価する。'
]},

{id:'D4-07',unit:'4',lo:'TA-4.3.1',k:2,
stem:`<p>社内向け業務Webアプリは、OS 3種類、ブラウザー4種類、画面サイズ3種類での動作をサポートする予定である。すべての組み合わせは36通りあり、今後もブラウザーの新バージョンが定期的にリリースされる。</p>
<p class="ask">適応性テストへのTAの貢献として、最も適切なものはどれか。</p>`,
opts:[
 '対象環境を早期に定義し、組み合わせテストで環境の組み合わせをカバーするテストを設計する。新しいブラウザーバージョンが出たらスモークテストを行い、環境固有の欠陥をモニタリングする。',
 '開発担当者が使っている環境で十分にテストし、他の環境はリリース後の問い合わせで対応する。',
 'プロダクトリスクにかかわらず、36通りすべての組み合わせで毎回すべてのテストスイートを実行する。',
 '適応性テストはテスト自動化エンジニアの責務なので、TAは関与しない。'
],
ans:[0],
exp:`TAは意図する対象環境を識別し、その組み合わせをカバーするテストを設計して適応性テストを支援する。環境パラメーターの構成を表すテストデータが必要なため、組み合わせテストが適用されることが多い。よい実践例として、早期に対象環境を定義する、組み合わせテストを使用する、新しい環境でスモークテストを行う、環境固有の欠陥をモニタリングする、がある（4.3節）。`,
why:[
 '正解。適応性テストのよい実践例に沿っている。',
 '環境固有の欠陥がデプロイ後に見つかると、頻繁なアップデートや再設計が必要になりメンテナンスコストが増える。',
 'プロダクトリスクに応じて、スモークテストか包括的なテストスイートかを選ぶ。常に全件実行するのは効率的でない。',
 'TAは対象環境の識別とテスト設計で適応性テストを支援する。自動化されたクロスプラットフォームテストはTAの作業を支援するものである。'
]},

{id:'D4-08',unit:'4',lo:'TA-4.3.1',k:2,pick:2,
stem:`<p>会計ソフトをバージョン5から6へアップデートする。TAがインストール性テストの計画を立てている。</p>
<p class="ask">TAの焦点となるインストール性テストの目的として、シラバスに挙げられているものはどれか。2つ選べ。</p>`,
opts:[
 'さまざまな環境パラメーターの設定の下で、アップデート手順が正しく実行されることを検証する。',
 'ユーザーがどれだけ簡単にアップデートやアンインストールを行えるかを、インストール文書のレビューも含めて確認する。',
 'インストール後に、同じPC上の他のソフトウェアと干渉せずに環境を共有できることを検証する。',
 'インストール処理中のCPU使用率とメモリ使用量を測定する。',
 'インストーラーが最後までエラーなく動作することだけを確認する。'
],
ans:[0,1],
exp:`インストール性テストは、指定した環境で正しくインストール、アンインストール、更新、再設定できることを検証するもので、単にインストール手順が完了まで動くかのチェックではない。TAの焦点は、①さまざまな環境パラメーターの下で手順が正しく実行されること、②インストールやアップデート後に正しく動作すること、③インストール・アンインストール・アップデートの容易さ（文書のレビューを含む）、④特にモバイルでの権限関連の動作、である（4.3節）。`,
why:[
 '正解。',
 '正解。',
 '他のソフトウェアと干渉せずに環境を共有できるかは共存性テストであり、TTAシラバスで扱う技術的なテストタイプである。',
 '資源の使用状況は性能効率性の観点であり、TAの焦点となるインストール性テストの目的には挙げられていない。',
 'シラバスは、インストール性テストは単に手順が完了まで動くかをチェックするだけではないとしている。'
]},

{id:'D4-09',unit:'4',lo:'TA-4.4.1',k:2,
stem:`<p>病院の検査システムは、検査結果を電子カルテシステムに送信する。送信時には、検査値の単位が検査システムの形式から電子カルテの形式に変換される。電子カルテ側は受け取った値が基準範囲外の場合に警告を表示する。</p>
<p class="ask">この連携の相互運用性テストにおけるTAのテスト設計として、最も適切なものはどれか。</p>`,
opts:[
 '交換される検査値にはデータに基づく技法（境界値など）を、単位変換のルールにはルールに基づく技法を、電子カルテ側での警告表示（受け取ったデータの使用）には振る舞いに基づく技法を適用する。既存の機能テストのテストケースも再利用する。',
 '両システムが同じサーバー上で互いに干渉せずに動作することを検証する。',
 '通信が確立できることを確認すれば、交換したデータの解釈や使用は各システムの機能テストで確認済みなので十分である。',
 '相互運用性テストはホワイトボックステストなので、テクニカルテストアナリストに任せる。'
],
ans:[0],
exp:`相互運用性テストの目的は、システムが情報を交換でき、交換した情報を相互に利用できることの検証であり、データ変換を伴う場合はその検証を含めなければならない。交換されたデータにはデータに基づく技法、データの解釈や使用には振る舞いに基づく技法、データ変換やエンドツーエンドの機能性にはルールに基づく技法などが適している。機能テストのテストケースを再利用することもできる（4.4節）。`,
why:[
 '正解。',
 '他システムと干渉せずに環境を共有できるかは共存性テストであり、相互運用性テストではない。',
 '相互運用性テストでは、交換した情報を相互に利用できること（解釈や使用）とデータ変換を検証しなければならない。',
 '相互運用性テストは通常ブラックボックスの機能テストであり、TAが責任を負う。'
]},

{id:'D4-10',unit:'4',lo:'TA-4.4.1',k:2,
stem:`<p>マイクロサービスで構成されたECサイトで、次の2つのテストを計画している。</p>
<div class="box"><p><b>X</b>：注文サービスが在庫サービスに送った数量が正しく解釈され、在庫が引き当てられることを確認する。</p>
<p><b>Y</b>：同じコンテナホスト上で動く別のサービスと、メモリなどの資源を奪い合わずに動作することを確認する。</p></div>
<p class="ask">X、Yのテストタイプと、主に責任を負う役割の組み合わせとして、最も適切なものはどれか。</p>`,
opts:[
 'X：相互運用性テスト（TA）　Y：共存性テスト（TTA）',
 'X：共存性テスト（TA）　Y：相互運用性テスト（TTA）',
 'X：相互運用性テスト（TTA）　Y：共存性テスト（TA）',
 'X：相互運用性テスト（TA）　Y：共存性テスト（TA）'
],
ans:[0],
exp:`互換性テストは、相互運用性テストと共存性テストに細分化できる。相互運用性テストは相互運用するコンポーネントやシステムとの互換性を検証し、通常ブラックボックスの機能テストであるためTAが責任を負う。共存性テストは他と干渉せずに対象環境を共有できることを検証する技術的なテストタイプで、TTAシラバスで説明されている（4.4節）。`,
why:[
 '正解。',
 'Xは情報の交換と利用なので相互運用性テスト、Yは環境の共有なので共存性テストである。',
 '相互運用性テストはブラックボックスの機能テストなのでTA、共存性テストは技術的なテストタイプなのでTTAが扱う。',
 '共存性テストは技術的なテストタイプであり、TTAシラバスで扱われる。'
]},

/* ===== 第5章 ソフトウェア欠陥予防 ===== */
{id:'D5-01',unit:'5',lo:'TA-5.1.1',k:2,
stem:`<p>あるリリースでは、リリース前に180件の欠陥を除去した。リリース後6か月間に、さらに20件の欠陥が発見された。欠陥の総数はリリース後6か月までに発見された欠陥の総数で置き換えることにしている。</p>
<p class="ask">欠陥除去効率（DRE）とその解釈として、最も適切なものはどれか。</p>`,
opts:[
 'DREは90%である。ただし、DREは予防と検出によって発見された欠陥を区別しないため、欠陥予防の効果だけを示すものではない。',
 'DREは90%である。DREが高いので、欠陥予防の実践が優れていることが証明された。',
 'DREは10%である。本番環境に見逃された欠陥の割合が高い。',
 'DREは約89%（160÷180）である。'
],
ans:[0],
exp:`DREは、リリース前に除去された欠陥と欠陥の総数の比率である。（未知の）分母は、ある時点まで（例：リリース後6か月まで）に発見された欠陥の総数で置き換えられる。180÷(180＋20)＝90%。DREが高いことは欠陥予防の実践が優れていることを意味する「ことがある」が、DREは予防と検出によって発見された欠陥を区別しない（5.1節）。`,
why:[
 '正解。',
 'DREは予防と検出を区別しないため、DREが高いことだけで欠陥予防の実践が優れていると証明することはできない。',
 '10%は見逃された欠陥の割合（20÷200）であり、DREではない。',
 '計算が誤っている。DRE＝180÷(180＋20)＝90%。'
]},

{id:'D5-02',unit:'5',lo:'TA-5.1.1',k:2,
stem:`<p>欠陥を、作り込まれたフェーズと除去されたフェーズで集計した。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>作り込まれたフェーズ</th><th class="c">作り込まれた欠陥</th><th class="c">同じフェーズ内で除去</th></tr></thead><tbody>
<tr><td>要件定義</td><td class="c mono">40</td><td class="c mono">30</td></tr>
<tr><td>設計</td><td class="c mono">50</td><td class="c mono">20</td></tr>
</tbody></table></div>
<p class="ask">フェーズ内封じ込め有効性（PCE）に基づく判断として、最も適切なものはどれか。</p>`,
opts:[
 '要件定義のPCEは75%、設計のPCEは40%である。設計フェーズで作り込まれた欠陥がより多く後のフェーズに見逃されているので、設計フェーズでの封じ込めの改善を優先する。',
 '要件定義のPCEは25%、設計のPCEは60%である。要件定義フェーズでの封じ込めの改善を優先する。',
 '要件定義のPCEは75%、設計のPCEは40%である。PCEが低いほど後のフェーズへの見逃しが少ないので、設計フェーズのやり方を要件定義にも広げる。',
 '両フェーズを合わせたPCEは50%（50÷100）である。フェーズごとに分けて評価する必要はない。'
],
ans:[0],
exp:`PCEは、そのフェーズで作り込まれた欠陥の総数に対する、同じフェーズ内で作り込まれ、かつ除去された欠陥の割合である。PCEが高いほど、後のフェーズに見逃された欠陥が少ない（5.1節）。要件定義：30÷40＝75%、設計：20÷50＝40%。`,
why:[
 '正解。',
 '計算が逆である。25%と60%は、後のフェーズに見逃された欠陥の割合を表している。',
 'PCEが高いほど見逃しが少ない。解釈が逆である。',
 '両フェーズの合計は (30＋20)÷(40＋50)≒56%であり、計算も誤っている。また、フェーズごとに評価しないと、どこを改善すべきかがわからない。'
]},

{id:'D5-03',unit:'5',lo:'TA-5.1.1',k:2,
stem:`<p>スプリントのふりかえりで、自動テストの不合格のうち多くが、複数のテストが共有しているテストデータが他のテストに上書きされたことによるものだったと報告された。そのたびに調査に時間を取られ、本当の故障の見落としも懸念されている。</p>
<p class="ask">欠陥予防の観点から、このふりかえりでTAが貢献できることとして最も適切なものはどれか。</p>`,
opts:[
 '偽陽性結果と偽陰性結果の両方を減らすために、テストデータとテスト環境の改善（テストごとのデータ分離など）を改善の可能性として識別し提案する。',
 '欠陥予防はテストマネージャーの責任なので、TAは事実の報告にとどめる。',
 '不合格になりやすい自動テストを無効化して、テスト結果を安定させる。',
 '不合格の件数を減らすため、期待結果の判定を緩める。'
],
ans:[0],
exp:`TAはふりかえりに参加し、テスト分析、テスト設計、テスト実装、テスト実行における改善の可能性（より効果的なテスト技法の使用、特定のリスク領域への集中、偽陽性結果と偽陰性結果の両方を低減するためのテストデータとテスト環境の改善など）を識別して、欠陥の流出をより確実に予防する。欠陥予防はチーム全体の責任である（5.1節）。`,
why:[
 '正解。',
 '欠陥予防はチーム全体の責任であり、TAは特定の知識と経験を活用して貢献できる。',
 'テストを無効化すると、本当の故障を検出できなくなり（偽陰性）、欠陥の流出を招く。',
 '判定を緩めると偽陰性結果が増え、欠陥の流出を招く。'
]},

{id:'D5-04',unit:'5',lo:'TA-5.2.1',k:3,pick:2,
stem:`<p>ECサイトの仕様書には、割引について次のように記載されている。</p>
<div class="box"><p>・ゴールド会員で購入金額が1万円以上の場合は、10%割引とする。</p><p>・ゴールド会員の場合は、5%割引とする。</p><p>・一般会員で購入金額が1万円以上の場合は、3%割引とする。</p></div>
<p>TAは、条件「ゴールド会員か」「購入金額が1万円以上か」でデシジョンテーブルを作成した。</p>
