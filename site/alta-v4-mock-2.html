<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AL-TA v4.0 模擬試験 第2回</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* レイアウト: 試験問題冊子（左）＋マークシート型の解答状況（右）。結果は採点票の体裁。 */
:root{
  --paper:#ECEFF3; --sheet:#FFFFFF; --ink:#17202B; --muted:#5A6574; --line:#D2D9E1;
  --accent:#1D4F91; --accent-soft:#E1E9F5; --accent-ink:#FFFFFF;
  --flag:#A35F00; --flag-soft:#FAEED8;
  --good:#1F6F47; --good-soft:#DFF0E6; --bad:#B42318; --bad-soft:#FBE3E0;
  --f-display:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F141B; --sheet:#171E28; --ink:#E4E9EF; --muted:#98A4B3; --line:#2B3644;
    --accent:#86AEE6; --accent-soft:#1D2B3F; --accent-ink:#0F141B;
    --flag:#E2A94B; --flag-soft:#33281A;
    --good:#62C08F; --good-soft:#15291F; --bad:#F2857B; --bad-soft:#36191A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F141B; --sheet:#171E28; --ink:#E4E9EF; --muted:#98A4B3; --line:#2B3644;
  --accent:#86AEE6; --accent-soft:#1D2B3F; --accent-ink:#0F141B;
  --flag:#E2A94B; --flag-soft:#33281A;
  --good:#62C08F; --good-soft:#15291F; --bad:#F2857B; --bad-soft:#36191A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;line-height:1.4;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;min-height:56px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.brand b{font-family:var(--f-display);font-size:16px}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.04em}
.bar .spacer{flex:1}
.timer{display:flex;align-items:baseline;gap:8px;padding:4px 12px;border:1px solid var(--line);border-radius:var(--r)}
.timer small{font-size:11px;color:var(--muted);letter-spacing:.06em}
.timer .mono{font-size:20px;font-weight:600}
.timer.warn{border-color:var(--bad);color:var(--bad)}
.prog{font-size:13px;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--sheet);cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent}
.btn.flagged{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{border-color:var(--bad);color:var(--bad)}

/* start */
.start{padding-block:32px 56px;display:grid;gap:24px}
.cover{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:28px clamp(18px,4vw,40px);display:grid;gap:20px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.cover h1{font-size:clamp(24px,4vw,34px)}
.cover p{margin:0;max-width:65ch;color:var(--muted)}
.specs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.specs div{padding:14px 16px;border-right:1px solid var(--line);display:grid;gap:2px}
.specs div:last-child{border-right:0}
.specs dt{font-size:12px;color:var(--muted);letter-spacing:.06em}
.specs dd{margin:0;font-family:var(--f-mono);font-size:22px;font-weight:600}
.specs dd small{font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--muted);margin-left:4px}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px clamp(16px,3vw,28px);display:grid;gap:14px;align-content:start}
.panel h2{font-size:18px}
.tblwrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--accent-soft);font-weight:700;white-space:nowrap}
.tbl td.c,.tbl th.c{text-align:center}
.tbl .mono{font-size:13px}
.choice{display:grid;gap:10px}
.choice label{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.choice label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input{margin-top:6px;accent-color:var(--accent)}
.choice b{display:block}
.choice span{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:12.5px;color:var(--muted);margin:0}
.resume{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;border:1px dashed var(--accent);border-radius:var(--r);background:var(--accent-soft)}
.resume p{margin:0;flex:1;min-width:200px}

/* exam */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;padding-block:24px 56px;align-items:start}
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:24px clamp(16px,3.5vw,36px);display:grid;gap:18px;min-width:0}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qno{font-family:var(--f-display);font-size:22px;font-weight:700}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;font-size:12px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.pts{border-color:var(--accent);color:var(--accent);font-weight:700}
.chip.lo{font-family:var(--f-mono)}
.chip.flagc{border-color:var(--flag);color:var(--flag);background:var(--flag-soft)}
.stem{display:grid;gap:12px;min-width:0}
.stem p{margin:0}
.stem .box{border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;background:var(--paper)}
.stem .box p+p{margin-top:4px}
.stem ul,.stem ol{margin:0;padding-left:1.4em}
.ask{font-weight:700}
.pick2{display:inline-block;margin-left:6px;padding:0 6px;border:1px solid var(--ink);font-size:12px;border-radius:3px}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;background:var(--sheet);text-align:left;width:100%}
.opt:hover{border-color:var(--accent)}
.bubble{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .bubble{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .bubble{border-color:var(--good);color:var(--good)}
.opt.sel.right .bubble{background:var(--good);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bubble{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt[disabled]{cursor:default}
.opt .t{min-width:0}
.hint{font-size:13px;color:var(--flag);margin:0;min-height:1.4em}
.nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px}
.nav .row{gap:8px}
.explain{border-top:2px solid var(--ink);padding-top:16px;display:grid;gap:12px}
.verdict{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700}
.verdict.ok{color:var(--good)} .verdict.ng{color:var(--bad)}
.explain p{margin:0}
.why{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.why li{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px}
.why li b{font-family:var(--f-mono);color:var(--muted)}
.why li.ok b{color:var(--good)}

/* answer sheet */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.sheet h3{font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.sheet h3 span{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-weight:500}
.cells{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cell{position:relative;height:38px;border:1px solid var(--line);border-radius:4px;background:var(--sheet);font-family:var(--f-mono);font-size:13px;cursor:pointer;display:grid;place-items:center}
.cell.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.cell.flg::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.cell.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.cell.ng{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.legend i.a{background:var(--accent-soft);border-color:var(--accent)}
.legend i.f{background:var(--flag);border-color:var(--flag);border-radius:50%}
.sheet .btn{width:100%}

/* confirm */
.confirm{border:1px solid var(--bad);background:var(--bad-soft);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.confirm p{margin:0;font-size:14px}

/* result */
.result{padding-block:28px 64px;display:grid;gap:24px}
.scorecard{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:28px clamp(18px,4vw,40px);display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.score{display:grid;gap:4px;justify-items:start}
.score .big{font-family:var(--f-mono);font-size:clamp(44px,8vw,64px);font-weight:600;line-height:1}
.score .big small{font-size:.4em;color:var(--muted);font-weight:500}
.stamp{display:inline-block;padding:4px 14px;border:2px solid currentColor;border-radius:4px;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.2em;transform:rotate(-4deg);margin-top:8px}
.stamp.pass{color:var(--good)} .stamp.fail{color:var(--bad)}
.meter{display:grid;gap:8px}
.track{position:relative;height:14px;background:var(--paper);border:1px solid var(--line);border-radius:7px;overflow:visible}
.fill{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--accent)}
.cut{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.cutlbl{position:absolute;top:-26px;transform:translateX(-50%);font-size:11.5px;white-space:nowrap;color:var(--ink)}
.facts{display:flex;gap:8px 20px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.facts b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.bars{display:grid;gap:12px}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:4px 12px;align-items:center}
.barrow .lbl{font-size:13.5px;min-width:0}
.barrow .num{font-family:var(--f-mono);font-size:13px;text-align:right;grid-row:span 2}
.barrow .track{height:10px;grid-column:1}
.barrow .fill.low{background:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.review{display:grid;gap:10px}
.ritem{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
.ritem summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px}
.ritem summary::-webkit-details-marker{display:none}
.mk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px}
.mk.ok{background:var(--good-soft);color:var(--good)} .mk.ng{background:var(--bad-soft);color:var(--bad)}
.ritem .rno{font-family:var(--f-mono);font-weight:600}
.ritem .rtitle{font-size:13.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .rbody{padding:4px clamp(14px,3vw,28px) 22px;display:grid;gap:16px;border-top:1px solid var(--line);padding-top:18px}

@media (max-width:860px){
  .exam{grid-template-columns:minmax(0,1fr)}
  .sheet{position:static}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:620px){
  .specs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .specs div:nth-child(2){border-right:0}
  .specs div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .scorecard{grid-template-columns:minmax(0,1fr)}
  .ritem summary{grid-template-columns:auto auto minmax(0,1fr)}
  .ritem summary .chip{display:none}
  .timer .mono{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="bar">
  <div class="wrap">
    <div class="brand"><b>AL-TA v4.0 模擬試験 第2回</b><span>JSTQB Advanced Level テストアナリスト</span></div>
    <div class="spacer"></div>
    <div id="hdr" class="row"></div>
  </div>
</header>
<main id="main" class="wrap"></main>

<script>
const KEY = 'alta-v4-mock-2';
const CH = {
  1: '第1章 テストプロセスにおけるテストアナリストのタスク',
  2: '第2章 リスクベースドテストにおけるテストアナリストのタスク',
  3: '第3章 テスト分析とテスト設計',
  4: '第4章 品質特性のテスト',
  5: '第5章 ソフトウェア欠陥予防'
};
const L = ['a','b','c','d','e'];

/* ---------------- 問題データ（45問 / 78点） ---------------- */
const Q = [
/* ===== 第1章 ===== */
{lo:'TA-1.1.1',k:2,pts:1,
stem:`<p>あるチームは、イテレーティブ開発モデルを採用し、2週間ごとにプロトタイピング、テスト、洗練、デプロイのサイクルを繰り返している。</p>
<p class="ask">このチームにおけるTAの関与として、最も適切なものはどれか。</p>`,
opts:[
 'テスト条件はプロジェクト開始時に確定させて変更せず、各イテレーションの終了時にまとめてテストを実行する。',
 '開発担当者やビジネス担当者と密接に協力し、進化するプロダクトに合わせてテスト条件やテストケースを調整・修正する。イテレーションの頻度が高いほど、リグレッションテストの継続的なメンテナンスと拡充を重視する。',
 'イテレーションが短いため、TAはSDLCの後期フェーズからだけ関与し、テスト完了の支援に集中する。',
 'テスト設計とテスト実装をソフトウェアの設計・実装と並行して一度だけ行い、最後のイテレーションでまとめてテストを実行する。'],
ans:[1],
exp:`イテレーティブ開発モデルでは、TAの役割はダイナミックで適応的である。開発担当者やビジネス担当者と密接に協力し、ソフトウェアの進化に合わせてテスト条件やテストケースを調整・修正し、各イテレーションでテストプロセスを改善するフィードバックを提供する。イテレーションの頻度が高いほど、リグレッションテストの継続的なメンテナンスと拡充が重要になる（1.1.1項）。`,
why:['進化するプロダクトに合わせてテスト条件を調整するのがイテレーティブ開発モデルでのTAの関与。','正解。','SDLCの初期段階からの関与は、すべてのSDLCモデルに共通するよい実践例。','シーケンシャル開発モデルの説明に近い。']},

{lo:'TA-1.2.2',k:2,pts:1,
stem:`<p class="ask">TAがテスト設計の一環として行うタスクとして、最も適切なものはどれか。</p>`,
opts:[
 'テストデータをデータベースに投入し、スモークテストを実行してテスト環境の準備が整っていることを検証する。',
 'テスト実行中に発覚した不正を分析し、テスト対象の欠陥なのか、テストデータの誤りなのかといった推定原因を特定する。',
 'テストベース、テスト条件、テストケースの間のトレーサビリティを確立し、テスト環境要件を定義して、テストデータの要件を識別・作成・明確化する。',
 'テストベースのテスト可能性を評定し、テストベースに含まれる欠陥についてプロダクトオーナーに早期にフィードバックする。'],
ans:[2],
exp:`テスト設計では、TAはローレベル・ハイレベルどちらのテストケースが適切かを決め、品質基準に従ってテストケースを設計し、テストベース・テスト条件・テストケース間のトレーサビリティを確立する。加えて、テスト環境要件を定義し、テストデータの要件を識別・作成・明確化する（1.2.2項）。`,
why:['テスト実装のタスク（1.2.3項）。','テスト実行のタスク（1.2.4項）。','正解。','テスト分析のタスク（1.2.1項）。']},

{lo:'TA-1.2.3',k:2,pts:1,
stem:`<p class="ask">テスト実装中にTAが行うタスクに関する記述として、正しいものはどれか。</p>`,
opts:[
 'テストプロシジャーの優先順位はテスト実行中の気付きだけで決め、リスク分析やテスト計画書で識別した優先順位付け基準は使わない。',
 'テストベースと、テストプロシジャー・テストスクリプト・テストスイートとの間のトレーサビリティは、テスト実行がすべて終わってからまとめて更新する。',
 'テスト環境の準備状況は、テスト実行中に最初の不合格が発生した時点で確認するのが最適である。',
 'テストプロシジャーには、テストケースのステップに加えて、初期の事前条件の設定、期待結果と事後条件の検証、実行後のリセット手順を含める。'],
ans:[3],
exp:`テストプロシジャーには、一連のテストケースのステップに加え、初期の事前条件の設定（例：データリポジトリからのテストデータ投入）、期待結果および事後条件の検証、実行後のリセット手順（例：データベースや環境のリセット）を含める（1.2.3項）。`,
why:['TAは、リスク分析とテスト計画書作成時に識別した優先順位付け基準に基づいて優先順位を付ける。','トレーサビリティの更新はテスト実装中のタスク。','テスト環境の準備状況は、テスト実装中にスモークテストを設計・実行して検証するのが最適。','正解。']},

{lo:'TA-1.3.3',k:2,pts:1,
stem:`<p>TAがシステムテスト用に作成したテスト環境要件の1件は次のとおりである。</p>
<div class="box"><p><b>ENV-07</b>　決済代行サービスのスタブ</p>
<p>説明：決済の承認・拒否・タイムアウト応答を、テストケースのパラメーターに応じて返す。</p>
<p>責任：テクニカルテストアナリストの山田が用意する。</p>
<p>必要期間：システムテスト開始（1月10日）から終了（2月28日）まで。</p></div>
<p class="ask">シラバスに照らすと、このテスト環境要件に不足している情報はどれか。</p>`,
opts:['一意の識別子','責任','必要期間','忠実度'],
ans:[3],
exp:`テスト環境の各構成要素の要件には、一意の識別子、説明、責任、必要期間、忠実度（構成要素が本番環境をどの程度再現しているか、またはどの程度逸脱しているか）を含めるべきである（1.3.3項）。スタブは本番の決済代行サービスとの差異が大きいため、忠実度の記述は特に重要である。`,
why:['「ENV-07」が一意の識別子として記載されている。','「山田が用意する」と記載されている。','「1月10日から2月28日まで」と記載されている。','正解。']},

{lo:'TA-1.3.7',k:2,pts:1,
stem:`<p>TAは、テストウェアのマネジメントについて次の3つのニーズを挙げた。</p>
<div class="box"><p><b>X</b>：テスト条件、テストケース、テストランを一元管理し、トレーサビリティマトリクスで要件のカバー状況を確認したい。</p>
<p><b>Y</b>：個人情報を保護しながら、システムテスト用のテストデータを作成・保守したい。</p>
<p><b>Z</b>：テスト環境の構成と可用性をマネジメントしたい。</p></div>
<p class="ask">X、Y、Zに最も適したツールの種類の組み合わせはどれか。</p>`,
opts:[
 'X：テストマネジメントツール　Y：テストデータマネジメントツール　Z：構成管理ツール',
 'X：要件マネジメントツール　Y：テストデータマネジメントツール　Z：欠陥マネジメントツール',
 'X：テストマネジメントツール　Y：構成管理ツール　Z：テストデータマネジメントツール',
 'X：欠陥マネジメントツール　Y：要件マネジメントツール　Z：構成管理ツール'],
ans:[0],
exp:`テストマネジメントツールはテストウェアのリポジトリを提供し、トレーサビリティ、テストランのスケジュール、テスト結果の記録を容易にする。テストデータマネジメントツールは、機密データの保護を含めてテストデータを作成・保守する。構成管理ツールは、テスト環境の構成や可用性のマネジメントなどを促進する（1.3.7項）。`,
why:['正解。','要件マネジメントツールはハイレベルの要件の格納・追跡が中心。欠陥マネジメントツールは欠陥解決のプロセスを扱う。','YとZが逆。','欠陥マネジメントツールはテストケースやテストランのリポジトリではない。']},

{lo:'TA-1.3.4',k:2,pts:1,
stem:`<p class="ask">テストオラクルとその解決策に関する記述として、正しいものはどれか。</p>`,
opts:[
 'プロパティベースのテストはテスト自動化に適しており、その有効性は定義した関係に左右されない。',
 'アサーションはテスト自動化コードまたはテスト対象自体に組み込むことができ、テスト対象に組み込む場合は、通常、タスクの継続に必要なものだけを検証する。',
 '疑似オラクルは常に安価に開発できるため、クリティカルなシステムでは使われない。',
 '探索的テストでは人間オラクルを使うべきではなく、自動化されたテストオラクルが好まれる。'],
ans:[1],
exp:`アサーションは自動テストオラクルを実装するために、テスト自動化コードまたはテスト対象自体に組み込むことができる。テスト対象に組み込む場合は、通常、タスクの継続に必要なものだけを検証する（1.3.4項）。`,
why:['プロパティベースのテストの有効性は関係に依存し、その関係を判断するのは難しいことがある。','正解。','専用の疑似オラクルの開発は高価になる可能性があるが、クリティカルなシステムでは一般的。','探索的テストなど一部のテストアプローチでは人間オラクルが好まれる。']},

{lo:'TA-1.3.1',k:2,pts:1,
stem:`<p class="ask">次のテストケースのうち、ハイレベルテストケースはどれか。</p>`,
opts:[
 '顧客C-1021（ゴールド会員）で書籍B1（6,000円）とB2（5,000円）を注文する。期待結果：送料0円、合計11,000円が表示される。',
 '事前条件：顧客マスターにC-1021（ゴールド会員）が登録済み。入力：B1×1、B2×1。期待結果：送料欄に「0円」。事後条件：注文テーブルに1件追加される。',
 'ゴールド会員が1万円以上の商品を注文する。期待結果：送料無料が適用される。',
 'テストデータファイル orders_gold.csv の3行目を入力し、送料欄に「0円」と表示されることを確認する。'],
ans:[2],
exp:`ハイレベルテストケースは、どのテスト条件がカバーされるかを示すことで、テスト対象が検査される状況を記述する。事前条件、入力データ、期待される出力、事後条件などの具体的な情報は含まず、抽象的なレベルで表現する（1.3.1項）。`,
why:['具体的な顧客・商品・金額を含むローレベルテストケース。','具体的な事前条件・入力・期待結果・事後条件を含むローレベルテストケース。','正解。','特定のテストデータと具体的な期待結果を含むローレベルテストケース。']},

{lo:'TA-1.3.6',k:3,pts:2,
stem:`<p>ユーザーストーリー「管理者として、退会した会員のアカウントを無効化したい」の受け入れ基準は「無効化されたアカウントではログインできない」である。TAが作成したキーワードテストケースの草案は次のとおり。</p>
<div class="box"><p>1. 管理者でログインする（管理者ID=admin01）</p><p>2. 会員を無効化する（会員ID=M-100）</p><p>3. ログアウトする</p><p>4. 会員でログインする（会員ID=M-100、正しいパスワード）</p></div>
<p class="ask">このキーワードテストケースの改善として、最も適切なものはどれか。</p>`,
opts:[
 '手順2を「［無効化］ボタンをクリックする」と「確認ダイアログで［OK］を押す」に分解する。',
 '手順4の後に、検証キーワード「ログイン拒否を確認する（会員ID=M-100）」を追加する。',
 '「会員を無効化する」を、より短い「会員無効化処理」に名称変更する。',
 '手順1〜4を1つのキーワード「無効化テスト」にまとめ、再利用しやすくする。'],
ans:[1],
exp:`キーワードはアクションと検証の2つに分類でき、検証キーワードは実際の結果が期待と一致するかを評価するアサーションを表す。草案にはアクションしかなく、受け入れ基準を検証する検証キーワードが欠けている。キーワードは動詞（＋名詞）の命令形で、意味が一意で、再利用可能でなければならない（1.3.6項）。`,
why:['UI操作に分解するとテストインターフェースレイヤーのキーワードになり、ドメインレイヤーの抽象度が失われる。','正解。','動詞の命令形でなくなり、キーワードの命名ルールに反する。','意味が曖昧で、他のテストケースで再利用できない。']},

/* ===== 第2章 ===== */
{lo:'TA-2.1.1',k:2,pts:1,pick:2,
stem:`<p class="ask">リスクアセスメントでTAが他のステークホルダーとともに見積もり、リスクレベルの決定に貢献する要素として、シラバスに挙げられているものはどれか。<span class="pick2">2つ選べ</span></p>`,
opts:['開発担当者の人数','テストベースの品質','テストツールのライセンス費用','法的または安全上の必要','テスト担当者の経験年数'],
ans:[1,3],
exp:`リスクアセスメントの際、TAは他のステークホルダーとともに、影響を受ける機能の使用頻度と深刻度合い、影響を受けるビジネス目的の深刻度合い、金銭的・環境的・評判上の被害、テストベースの品質、法的または安全上の必要などを見積もる（2.1節）。`,
why:['挙げられていない。','正解。','挙げられていない。','正解。','挙げられていない。']},

{lo:'TA-2.2.1',k:4,pts:3,
stem:`<p>アジャイル開発のECサイトで、ユーザーストーリーUS-21の受け入れ基準AC21-2が変更された（プレミアム会員のポイント付与率を1%から2%へ）。TAは受け入れ基準とリグレッションテストのトレーサビリティを維持している。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>受け入れ基準</th><th>内容</th><th>テスト</th><th>前回の結果</th></tr></thead><tbody>
<tr><td class="mono">AC10-1</td><td>会員登録ができる</td><td class="mono">RT-11</td><td>不合格（欠陥検出・修正済み）</td></tr>
<tr><td class="mono">AC21-2</td><td>プレミアム会員にポイントを付与する</td><td class="mono">RT-12、RT-13</td><td>合格</td></tr>
<tr><td class="mono">AC30-1</td><td>ポイント残高を支払いに使える</td><td class="mono">RT-20</td><td>合格</td></tr>
<tr><td class="mono">AC40-1</td><td>購入金額に応じて会員ランクを表示する</td><td class="mono">RT-31</td><td>合格</td></tr>
</tbody></table></div>
<p>ポイント利用（AC30-1）は付与されたポイント残高を参照する。会員ランクはポイントではなく購入金額だけで決まる。</p>
<p class="ask">要件トレーサビリティマトリクスを用いてリグレッションテストを選択する場合、最も適切な集合はどれか。</p>`,
opts:['RT-12、RT-13','RT-11、RT-12、RT-13','RT-12、RT-13、RT-20','RT-12、RT-13、RT-20、RT-31'],
ans:[2],
exp:`要件トレーサビリティマトリクスは、要件の変更が関連するテストに与える影響の評価に使う。TAは意図しない副作用の可能性をカバーするため、直接影響を受ける機能と、関連する機能のリグレッションテストを選択する。アジャイルでは、変更されたユーザーストーリーの影響を受ける受け入れ基準をカバーするテストを選択する（2.2節）。ポイント残高を参照するAC30-1は関連する機能である。`,
why:['関連する機能（ポイント利用）の副作用をカバーしていない。','RT-11は前回欠陥を検出したという履歴だけが理由で、今回の変更とは関連しない。','正解。','会員ランクはポイントに依存しないため、RT-31は関連しない。']},

{lo:'TA-2.2.1',k:4,pts:3,
stem:`<p>手動リグレッションテストで、直近3サイクルに2つの選択技法を併用した結果は次のとおりである。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>技法</th><th class="c">選択したテスト数</th><th class="c">検出したリグレッション欠陥</th></tr></thead><tbody>
<tr><td>カバレッジベースドテスト</td><td class="c mono">200</td><td class="c mono">2</td></tr>
<tr><td>履歴ベースドテスト</td><td class="c mono">80</td><td class="c mono">9</td></tr>
</tbody></table></div>
<p>本番で見つかったリグレッション欠陥は、過去に欠陥が頻発したモジュールに集中していた。次のサイクルで実行できるのは約200件である。</p>
<p class="ask">次のサイクルに向けたTAの判断として、最も適切なものはどれか。</p>`,
opts:[
 '効果的だった履歴ベースドテストを維持し、効果の低かったカバレッジベースドテストの選択は縮小するか他の技法に置き換える。必要に応じて技法を組み合わせ、カバレッジの必要性とスイートのサイズのバランスを取る。',
 '欠陥の見逃しを防ぐため、制約を無視して手動リグレッションテストの全件を実行する。',
 'カバレッジベースドテストの方が多くのテストを選択しており網羅的なので、次回はカバレッジベースドテストだけで200件を選ぶ。',
 '前回のテストで欠陥を検出しなかったテストケースはすべて削除し、以後は履歴ベースドテストだけを使う。'],
ans:[0],
exp:`各テストサイクル終了後、TAはテスト結果を分析して適用した技法の有効性を判断し、次回は効果的な技法を維持して効果的でない技法を置き換える。包括的なスイートのため選択技法を組み合わせることが多いが、カバレッジの必要性とスイートのマネジメント可能なサイズのバランスを注意深く取る（2.2節）。`,
why:['正解。','制約により全件実行できないことが前提であり、選択技法の継続的改善になっていない。','結果データと逆の判断。選択数の多さは有効性を示さない。','極端な判断。履歴ベースドテストでも、長く実行していないテストが引き続き合格するかの確認は有用であり、技法の組み合わせも必要となることが多い。']},

/* ===== 第3章 ===== */
{lo:'TA-3.1.1',k:3,pts:2,
stem:`<p>割引の適用条件は「<b>会員種別コード c = 3 AND 年齢 a ≥ 65</b>」である（c、aは整数）。</p>
<p class="ask">この式で定義される同値パーティションに対し、簡易ドメインカバレッジを100%達成するテストデータ（c, a）の集合はどれか。</p>`,
opts:[
 '(3, 70)、(2, 70)、(3, 65)、(3, 64)',
 '(3, 70)、(2, 70)、(4, 70)、(3, 66)、(3, 64)',
 '(3, 70)、(1, 70)、(5, 70)、(3, 65)、(3, 64)',
 '(3, 70)、(2, 70)、(4, 70)、(3, 65)、(3, 64)'],
ans:[3],
exp:`簡易ドメインカバレッジでは、＝の境界線にONポイント1つと境界線の両側に位置するOFFポイント2つ、≥の境界線にONポイント1つとOFFポイント1つが必要。各OFFポイントは対応するONポイントに可能な限り近くなければならない（3.1.1項）。c = 3：ON (3,70)、OFF (2,70)・(4,70)。a ≥ 65：ON (3,65)、OFF (3,64)。`,
why:['＝の境界線のOFFポイントが片側（c = 2）にしかない。','66は閉じた境界線上にないため、ONポイントではなくINポイント。','OFFポイント（1と5）がONポイントに最も近い値になっていない。','正解。']},

{lo:'TA-3.1.1',k:3,pts:2,
stem:`<p>同値パーティションが「<b>10 &lt; x AND x ≤ 20</b>」（xは整数）で定義されている。</p>
<p class="ask">信頼性の高いドメインカバレッジを適用するとき、境界線「x ≤ 20」に対する値15、20、21、30のポイントタイプの組み合わせとして正しいものはどれか。</p>`,
opts:[
 '15：INポイント　20：ONポイント　21：OFFポイント　30：OUTポイント',
 '15：ONポイント　20：INポイント　21：OUTポイント　30：OFFポイント',
 '15：INポイント　20：OFFポイント　21：ONポイント　30：OUTポイント',
 '15：INポイント　20：ONポイント　21：OUTポイント　30：OFFポイント'],
ans:[0],
exp:`閉じた境界線（≤）では、ONポイントは境界線上（20）、OFFポイントはパーティションの外側で精度に従って境界線に最も近い値（21）。INポイントはパーティションに属するONポイント以外の値（15）、OUTポイントはパーティション外側のOFFポイント以外の値（30）（3.1.1項）。`,
why:['正解。','ONとIN、OFFとOUTを取り違えている。','開いた境界線のときの考え方（OFFが境界線上）を誤って適用している。','21はパーティション外側で境界線に最も近いためOFFポイント、30はOUTポイント。']},

{lo:'TA-3.1.2',k:3,pts:2,
stem:`<p>スマートフォンアプリの互換性テストで、次の3つのパラメーターにペアワイズカバレッジを適用する。</p>
<div class="box"><p>OS：iOS、Android、HarmonyOS（3値）</p><p>画面サイズ：小、中、大（3値）</p><p>通信：Wi-Fi、モバイル回線（2値）</p></div>
<p class="ask">ペアワイズカバレッジのカバレッジアイテムの総数はいくつか。</p>`,
opts:['9','18','21','27'],
ans:[2],
exp:`ペアワイズカバレッジのカバレッジアイテムは、任意の2つのパラメーターに関するパラメーター - 値ペアの組み合わせ（3.1.2項）。OS×画面サイズ：3×3＝9、OS×通信：3×2＝6、画面サイズ×通信：3×2＝6 で、合計21。これをカバーするテストケース数（最小9件）とは別物である点に注意する。`,
why:['ペアワイズカバレッジを達成するテストケース数の下限であり、カバレッジアイテムの数ではない。','全組み合わせ（3×3×2）の数であり、ペアワイズのカバレッジアイテムの数ではない。','正解。','誤り。']},

{lo:'TA-3.1.2',k:3,pts:2,
stem:`<p>旅行予約システムの料金計算に組み合わせテストを適用する。パラメーターは「搭乗者の年齢（0〜120歳の整数）」「座席クラス（エコノミー、プレミアムエコノミー、ビジネス）」「支払方法（カード、銀行振込、ポイント、請求書払い）」である。業務ルール上、「請求書払い」は法人契約でのみ選べるため、個人予約の本テストでは実行不可能である。また、過去に「0〜2歳×ビジネス」の組み合わせで故障が発生している。</p>
<p class="ask">組み合わせテストの適用方法として、最も適切なものはどれか。</p>`,
opts:[
 '年齢の121個の値をそのまま使い、全組み合わせを生成してから実行可能なものだけを残す。',
 'ペアワイズカバレッジを達成すれば故障はすべて検出できるため、過去に故障した組み合わせを追加する必要はない。',
 'まず年齢に同値分割法を適用して値の数を減らし（例：0〜2歳、3〜11歳、12〜64歳、65歳以上）、パラメーターをクラシフィケーションツリーにまとめる。実行不可能な「請求書払い」は制約として除外し、問題が既知の「0〜2歳×ビジネス」の組み合わせは手動で追加する。',
 'ベースチョイスカバレッジは、すべてのパラメーター値が同等に重要であると仮定するので、ベース値は無作為に選ぶ。'],
ans:[2],
exp:`多くの値を持つパラメーターには、まずEPを適用して値の数と組み合わせの集合を減らせる。クラシフィケーションツリーなどにまとめるとこの活動を支援できる。最終的なテストケース数は、制約、問題が既知のため手動で追加した組み合わせ、無効または実行不可能な組み合わせによって影響を受ける（3.1.2項）。`,
why:['組み合わせ数が爆発し、非効率。','約97%の故障は1つか2つの条件で引き起こされるという調査はあるが、すべての故障を検出できる保証はない。既知の問題の組み合わせは手動で追加する。','正解。','ベースチョイスカバレッジは、いくつかのパラメーター - 値ペアが他よりも重要であると仮定する。']},

{lo:'TA-3.1.3',k:2,pts:1,
stem:`<p class="ask">ランダムテストが特に有用となる状況として、最も適切なものはどれか。</p>`,
opts:[
 '自動化したテストオラクルを用意できず、期待結果をすべて人手で判断する必要がある場合',
 'ドメイン知識が限られている場合や、大量のテストデータが必要な場合',
 'データの意味（セマンティクス）に関わる欠陥を重点的に検出したい場合',
 'カバレッジに基づく厳密な終了基準が契約で求められている場合'],
ans:[1],
exp:`ランダムテストは、ドメイン知識が限られている場合や大量のテストデータが必要な場合に特に有用で、コスト効率が高く、確率的な観点から信頼性に関する示唆を与える。一方で、自動化したテストオラクルへの依存、データセマンティクスの軽視などの制限がある（3.1.3項）。`,
why:['ランダムテストは多くの場合、自動化したテストオラクルを必要とする。','正解。','データの意味に関わる欠陥の見逃しは、制限として挙げられている。','ランダムテストには広く合意されたカバレッジ基準がない。']},

{lo:'TA-3.2.1',k:2,pts:1,
stem:`<p class="ask">CRUDテストに関する説明として、正しいものはどれか。</p>`,
opts:[
 'CRUDマトリクスでは、行がエンティティ、列が機能を表す。',
 '完全性テストは動的テストであり、機能を統合してエンティティが一貫して使用されているかを確認する。',
 'CRUDテストは主にコンポーネントテストで用いられ、コード内の変数の初期化漏れの検出に焦点を当てる。',
 '一貫性テストのテストケースはCRUDマトリクスのすべての操作をカバーし、まだ作成されていないエンティティの読み込みのようなネガティブなテストも含め、エンティティごとに機能を組み合わせてライフサイクル全体をカバーする。'],
ans:[3],
exp:`一貫性テストは動的テストで、テストケースはCRUDマトリクスのすべての操作をカバーし、ネガティブなテストも含める。テストケースはライフサイクル全体をカバーするように機能を組み合わせ、エンティティごとに設計する（3.2.1項）。`,
why:['列がエンティティ、行が機能。','説明しているのは一貫性テスト。完全性テストは静的テスト。','CRUDテストは主にシステムレベルで用いられ、データ整合性違反やアクセスコントロールの欠陥などに焦点を当てる。','正解。']},

{lo:'TA-3.2.2',k:3,pts:2,
stem:`<p>端末の状態遷移は次のとおりである。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th>遷移</th><th>遷移元</th><th>イベント</th><th>遷移先</th></tr></thead><tbody>
<tr><td class="mono">t1</td><td>待機</td><td>カード挿入</td><td>認証</td></tr>
<tr><td class="mono">t2</td><td>認証</td><td>認証成功</td><td>メニュー</td></tr>
<tr><td class="mono">t3</td><td>認証</td><td>取消</td><td>待機</td></tr>
<tr><td class="mono">t4</td><td>メニュー</td><td>終了</td><td>待機</td></tr>
<tr><td class="mono">t5</td><td>メニュー</td><td>再認証要求</td><td>認証</td></tr>
</tbody></table></div>
<p>次の2つのテストを実行した。</p>
<div class="box"><p>TS1：t1 → t2 → t4 → t1 → t3</p><p>TS2：t1 → t2 → t5 → t2 → t4</p></div>
<p class="ask">達成した1スイッチカバレッジはいくつか。</p>`,
opts:['50%','62.5%','75%','100%'],
ans:[2],
exp:`有効な1スイッチは「入る遷移数 × 出る遷移数」の合計。待機：2×1＝2、認証：2×2＝4、メニュー：1×2＝2 で合計8。TS1は t1t2、t2t4、t4t1、t1t3、TS2は新たに t2t5、t5t2 をカバーし、重複を除くと6。6 ÷ 8 ＝ 75%（未カバーは t3t1、t5t3）（3.2.2項）。`,
why:['誤り。','重複を除かずに数えるなど、計算の誤り。','正解。','t3t1とt5t3がカバーされていない。']},

{lo:'TA-3.2.2',k:3,pts:2,
stem:`<p>病院で使う輸液ポンプの制御ソフトウェアを状態遷移テストでテストする。過去の重大インシデントでは、アラーム発生中に「一時停止」と「再開」が想定外の順序で連続して操作されたときに故障が起きていた。モデルベースドテストツールを利用でき、テストケースの自動生成が可能である。</p>
<p class="ask">適用する状態遷移のカバレッジ基準として、最も適切なものはどれか。</p>`,
opts:['全状態カバレッジ','有効遷移カバレッジ（0スイッチカバレッジ）','全遷移カバレッジ','2スイッチカバレッジ'],
ans:[3],
exp:`Nスイッチの数はNに比例して指数関数的に増加するため、2スイッチ以上での100%カバレッジは、イベントの予期しないシーケンスによって故障が起こるリスクが高い場合に限って適切である（3.2.2項）。この状況はまさにそれに当たり、テスト設計の自動化によって複雑なカバレッジ基準の適用も可能になる（3.5.2項）。`,
why:['各状態を1回訪れるだけで、イベントの連続による故障を狙えない。','個々の遷移を1回ずつカバーするだけで、遷移の連続をカバーしない。','無効遷移も含めて確認できるが、遷移の連続（シーケンス）はカバーしない。','正解。']},

{lo:'TA-3.2.3',k:3,pts:2,
stem:`<p>ユースケース「ATMで現金を引き出す」のメインシナリオは「カード挿入 → 暗証番号入力 → 金額入力 → 現金受け取り → カード返却」である。メインシナリオ以外に次の4つのシナリオを識別した。</p>
<div class="box"><p>(i) 暗証番号を1回誤り、再入力して成功し、現金を受け取る。</p>
<p>(ii) 残高不足のため別の金額を入力し直し、現金を受け取る。</p>
<p>(iii) 暗証番号を3回誤り、カードが保持されて取引が終了する。</p>
<p>(iv) 紙幣切れのため、取引が中止される。</p></div>
<p class="ask">各シナリオのタイプの組み合わせとして正しいものはどれか。</p>`,
opts:[
 '(i) 拡張　(ii) 拡張　(iii) 例外　(iv) 例外',
 '(i) 例外　(ii) 例外　(iii) 拡張　(iv) 拡張',
 '(i) 拡張　(ii) 例外　(iii) 例外　(iv) 拡張',
 '(i) メインシナリオ　(ii) 拡張　(iii) 例外　(iv) 例外'],
ans:[0],
exp:`拡張（代替シナリオ）は、メインシナリオ以外の一連のアクションで、最終的にメインシナリオのゴール達成につながる。例外は、予期せぬアクション（異常な使用や無効な入力など）により、メインシナリオのゴールを達成できない一連のアクション。ユースケースのメインシナリオは1つだけである（3.2.3項）。`,
why:['正解。(i)(ii)はゴール（現金受け取り）を達成し、(iii)(iv)は達成できない。','拡張と例外の定義が逆。','(ii)はゴールを達成するので拡張、(iv)は達成できないので例外。','ユースケースはメインシナリオを1つしか持てない。(i)は拡張。']},

{lo:'TA-3.2.3',k:3,pts:2,
stem:`<p>経費申請業務のアクティビティ図（ループなし）は次のとおりである。</p>
<div class="box"><p>開始 → 申請入力 → 判定ノード1：［金額 ≥ 10万円］部長承認／［金額 &lt; 10万円］課長承認 → マージ</p>
<p>→ 判定ノード2：［海外出張］経理確認／［国内］（何もしない） → マージ → 支払処理 → 終了</p></div>
<p class="ask">モデル内のすべての可能なシナリオをテストスイートで実行する場合、必要なテストケースの最小数はいくつか。</p>`,
opts:['2','3','4','6'],
ans:[2],
exp:`シナリオモデルにループがない場合、各シナリオを個別のテストケースでテストでき、モデル内のすべての可能なシナリオを実行できる（3.2.3項）。判定ノード1の2分岐と判定ノード2の2分岐の組み合わせで、シナリオ（パス）は 2 × 2 ＝ 4。`,
why:['各分岐を1回ずつ通るだけ（デシジョンカバレッジ相当）で、すべてのシナリオにはならない。','誤り。','正解。','誤り。']},

{lo:'TA-3.3.1',k:3,pts:2,
stem:`<p>入場料のデシジョンテーブルをレビューしている（条件C1とC2が同時にYになることはない）。</p>
<div class="tblwrap"><table class="tbl"><thead><tr><th></th><th class="c">R1</th><th class="c">R2</th><th class="c">R3</th><th class="c">R4</th><th class="c">R5</th></tr></thead><tbody>
<tr><th>C1 年齢 &lt; 13</th><td class="c">Y</td><td class="c">N</td><td class="c">N</td><td class="c">N</td><td class="c">-</td></tr>
<tr><th>C2 年齢 ≥ 65</th><td class="c">-</td><td class="c">Y</td><td class="c">N</td><td class="c">N</td><td class="c">Y</td></tr>
<tr><th>C3 会員</th><td class="c">-</td><td class="c">-</td><td class="c">Y</td><td class="c">N</td><td class="c">Y</td></tr>
<tr><th>アクション</th><td class="c">子ども料金</td><td class="c">シニア料金</td><td class="c">会員料金</td><td class="c">一般料金</td><td class="c">会員料金</td></tr>
</tbody></table></div>
<p class="ask">レビューで指摘すべき事項として、最も適切なものはどれか。</p>`,
opts:[
 '条件値の組み合わせ（N, N, N）に適用されるルールがなく、完全性に欠ける。',
 'R2とR5は条件値の組み合わせ（N, Y, Y）に重複して適用され、アクションが異なるため一貫性がない。',
 'R4は実現不可能なルールである。',
 '指摘事項はない。'],
ans:[1],
exp:`TAはデシジョンテーブルを一貫性（同じ条件値の組み合わせに適用される2つのルールのアクションが等価）、実現可能性、完全性、正確性の基準でレビューする。ルールは重複しないことが望ましい（3.3.1項）。（N, Y, Y）にはR2（シニア料金）とR5（会員料金）が適用され、アクションが異なる。`,
why:['（N, N, N）にはR4が適用される。','正解。','R4（13歳以上65歳未満の非会員）は実現可能。','一貫性の欠陥がある。']},

{lo:'TA-3.3.1',k:3,pts:2,
stem:`<p>通販サイトの配送料ルールを、リスクが高いため最小化せずに完全なデシジョンテーブルでテストしている。条件は「支払方法（カード／銀行振込／代引き）」と「配送先（国内／海外）」で、代引きは海外に対応していない。</p>
<p>次の4件のテストを実行した：カード×国内、カード×海外、銀行振込×国内、代引き×国内。</p>
<p class="ask">達成したデシジョンテーブルカバレッジはいくつか。</p>`,
opts:['約67%','75%','80%','100%'],
ans:[2],
exp:`デシジョンテーブルカバレッジは、実行された列の数を実行可能な列の総数で割って測定する（3.3.1項）。完全なテーブルは3×2＝6列で、そのうち「代引き×海外」は実行不可能なので実行可能な列は5。4 ÷ 5 ＝ 80%（未実行は「銀行振込×海外」）。`,
why:['実行不可能な列を分母に含めた値（4/6）。','誤り。','正解。','「銀行振込×海外」が未実行。']},

{lo:'TA-3.3.2',k:3,pts:2,
stem:`<p>地図アプリの最短経路検索機能（道路は双方向通行、距離はすべて正の値）にメタモルフィックテストを適用する。</p>
<p class="ask">メタモルフィック関係として正しいものはどれか。</p>`,
opts:[
 '出発地と目的地を入れ替えても、最短距離は変わらない。',
 '経由地を1つ追加すると、最短距離は必ず増える。',
 '道路を1本削除すると、最短距離は必ず減る。',
 'すべての道路の距離を2倍にすると、最短距離は4倍になる。'],
ans:[0],
exp:`MRはテストアイテムの特性を定義し、テストケースの入力の変更が期待結果にどう反映されるかを記述する（3.3.2項）。道路が双方向で距離が対称なら、出発地と目的地を入れ替えても最短距離は等しい。`,
why:['正解。','経由地がもともと最短経路上にあれば、距離は変わらない。','削除によって最短距離は増えるか変わらないかのどちらかであり、減ることはない。','すべての距離を2倍にすると最短距離は2倍になる。']},

{lo:'TA-3.3.2',k:3,pts:2,
stem:`<p>税額計算APIにはテストオラクル問題があるため、TAは3つのメタモルフィック関係（MR）を定義した。</p>
<p class="ask">メタモルフィックテストの進め方として、最も適切なものはどれか。</p>`,
opts:[
 '各MRを1回ずつカバーした時点で、十分なテストができたと判断して終了する。',
 'MRのカバレッジ100%を終了基準として、テスト計画書に記載する。',
 'フォローアップテストケースが不合格になった場合、ソーステストケースは常に正しいとみなし、フォローアップ側の入力に関わる欠陥と判断する。',
 'MTをランダムテストと組み合わせ、同じMRに対して多数のローレベルのソーステストケースとフォローアップテストケースを生成する。'],
ans:[3],
exp:`現在のところ、有用な終了基準となるMTのカバレッジ尺度は認められていない。各MRを1回ずつカバーするだけでは期待結果の部分的な検証しかできず不十分である。TAはMTをランダムテストと組み合わせて、同じMRに対して多くのソース・フォローアップテストケースを生成できる。故障時は、どのテストケースが不合格となったかをデバッグで判断する（3.3.2項）。`,
why:['各MRを1回ずつカバーするだけでは不十分。','有用な終了基準となるMTのカバレッジ尺度は認められていない。','後続のデバッグで、関係する個々のテストケースのどれが不合格かを判断しなければならない。','正解。']},

{lo:'TA-3.4.1',k:3,pts:2,
stem:`<p>TAはセッションベースドテストのテストチャーターを設計するために、次の情報を集めた。</p>
<div class="box"><p><b>X</b>：時系列で見た利用者と予約システムとのやりとりを示すユーザージャーニーマップ</p>
<p><b>Y</b>：予約システムの外部インターフェースとソフトウェア設計</p>
<p><b>Z</b>：見積もり工数と、このフィーチャーのビジネス価値</p></div>
<p class="ask">X、Y、Zが該当する、テストチャーターの設計に影響する要素の組み合わせとして正しいものはどれか。</p>`,
opts:[
 'X：プロダクト要素　Y：顧客および要件の要素　Z：プロジェクトマネジメント要素',
 'X：顧客および要件の要素　Y：プロダクト要素　Z：プロジェクトマネジメント要素',
 'X：顧客および要件の要素　Y：プロジェクトマネジメント要素　Z：プロダクト要素',
 'X：プロジェクトマネジメント要素　Y：プロダクト要素　Z：顧客および要件の要素'],
ans:[1],
exp:`テストチャーターの設計に影響する要素：顧客および要件の要素（顧客から引き出した要件、ビジネスユースケース、品質要件、ユーザージャーニーマップ）、プロダクト要素（機能フロー、プロダクトのゴール、フィーチャー、ソフトウェア設計、インターフェース）、プロジェクトマネジメント要素（時間的制約、プロジェクトの意義、見積もり工数、ビジネス価値）（3.4.1項）。`,
why:['XとYが逆。','正解。','YとZが逆。','XとZが逆。']},

{lo:'TA-3.4.1',k:3,pts:2,
stem:`<p>前回の探索的テストのセッションでは、仕様上許容されている動作（在庫が0の商品を「入荷待ち」として予約できる）を欠陥として報告する偽陽性が多発した。テストチャーターには、ミッションと運営情報しか記載していなかった。</p>
<p class="ask">次回のテストチャーターの改善として、最も適切なものはどれか。</p>`,
opts:[
 '使用するテスト技法と詳細な操作手順をすべて指定し、TAが判断する余地をなくす。',
 'ミッションを「システム全体を探索する」に広げ、より多くの不正を報告できるようにする。',
 'セッションシートへの記録をやめ、発見事項は口頭で開発担当者に伝える。',
 'プロダクト関連情報（入荷待ち予約などの定義やワークフロー）と制限（システムが絶対にしてはならないこと）を追加情報として記載し、テスト目的には探索の柔軟性を残す。'],
ans:[3],
exp:`テストチャーターに含める情報の範囲と詳細はTAの柔軟性に影響する。一般的なテスト目的だけなら検討の余地は大きいが、使用するテスト技法を追加するとTAを制約しうる。一方、システムが絶対にできないことなどの追加情報は、偽陽性結果を報告する可能性を低くできる（3.4.1項）。`,
why:['探索の柔軟性が失われ、スクリプトテストと変わらなくなる。','焦点がぼやけ、偽陽性の原因（仕様理解の不足）を解消しない。','テストセッション中の質問・観察・アイデアなどはセッションシートに記録する。','正解。']},

{lo:'TA-3.4.2',k:3,pts:2,
stem:`<p>TAは経験ベースのテストを支援するため、次の2つのチェックリスト項目を作成した。</p>
<div class="box"><p><b>X</b>：郵便番号欄に「123-456」「ABC-DEFG」「全角の数字」を入力したとき、いずれも拒否されるか。</p>
<p><b>Y</b>：検索結果は、利用者の検索意図に対して関連性があるか。</p></div>
<p class="ask">X、Yが属するチェックリストの種類の組み合わせとして正しいものはどれか。</p>`,
opts:[
 'X：確認するチェックリスト　Y：実行チェックリスト',
 'X：実行チェックリスト　Y：実行チェックリスト',
 'X：確認するチェックリスト　Y：確認するチェックリスト',
 'X：実行チェックリスト　Y：確認するチェックリスト'],
ans:[3],
exp:`実行チェックリストには、あるプロセスについて考慮すべき主要な要素が含まれる（例：チェックすべき入力フィールドの具体的な無効入力）。確認するチェックリストは思考プロセスを導く補助として機能し、さらに調査するための経験ベースのテストアイデアを提供する（例：検索結果に関連性があるかの確認）（3.4.2項）。`,
why:['XとYが逆。','Yは思考を導く確認の項目。','Xは具体的な無効入力を列挙した実行の項目。','正解。']},

{lo:'TA-3.4.2',k:3,pts:2,
stem:`<p>チェックリストを使った探索的テストを経てリリースした後、本番で「全角スペースだけの入力を検索語として受け付けてしまう」欠陥が見つかった。この観点はチェックリストに含まれていなかった。</p>
<p class="ask">チェックリストへの対応として、最も適切なものはどれか。</p>`,
opts:[
 '見逃した欠陥から得た教訓を反映して項目を追加し、重要度や潜在的影響、リスクレベルに基づいて優先度を見直したうえで、他のテスト担当者と共有する。',
 'チェックリストはテスト計画時に確定した最終版なので変更せず、次回のテストでは担当者の注意力に頼る。',
 '見逃しはチェックリストの不足が原因なので、全機能のテスト手順を網羅する包括的なハウツーガイドに作り直す。',
 '担当者ごとに独自のチェックリストを持たせ、他のテスト担当者とは共有しない。'],
ans:[0],
exp:`チェックリストは決して最終的なものではない。TAは新しい発見事項、優先度の変更、他のテスト担当者からのフィードバック、以前のテストサイクルの教訓などを反映して継続的に洗練させる。共有することで一貫性と協調性が促進される（3.4.2項）。`,
why:['正解。','チェックリストは継続的に見直す。','チェックリストは包括的なハウツーガイドではない。','共有によって一貫性と協調性が促進される。']},

{lo:'TA-3.4.3',k:2,pts:1,
stem:`<p class="ask">クラウドテストに関する記述として、正しいものはどれか。</p>`,
opts:[
 'クラウドテストを導入すれば、TAがテスト技法を適用する活動は不要になる。',
 'テストは毎回異なるテスト担当者によって実行されるため再現性は低くなるが、カバレッジが広がり、欠陥の発見が増えることもある。',
 '外部のテスト担当者とソフトウェアを共有しても、データセキュリティや機密性のリスクは生じない。',
 'テスト担当者のスキルのばらつきは、ユーザーエクスペリエンスに関するフィードバックが目的の場合でも常に致命的な問題となる。'],
ans:[1],
exp:`変動性（テストは毎回さまざまなテスト担当者によって実行され再現性が低くなる）は制限とも言えるが、カバレッジが広くなり欠陥の発見を増やすことにもなる。クラウドテストは、TAがテスト技法を適用する活動に置き換わるものではない（3.4.3項）。`,
why:['クラウドテストはTAがテスト技法を適用する活動に置き換わるものではない。','正解。','セキュリティは制限の一つで、適切な対策が必要。','UXに関するフィードバックが目的の場合、スキルのばらつきは関係ないこともある。']},

{lo:'TA-3.5.1',k:4,pts:3,
stem:`<p>請求管理システムについて、次の2つのプロダクトリスクが識別された。</p>
<div class="box"><p><b>R1</b>：請求 → 入金確認 →（未入金なら）督促 → 再請求 … と周期的に繰り返す業務プロセスで、2周目以降に前の周の状態が正しく引き継がれない。</p>
<p><b>R2</b>：「入金額 ≥ 請求額」というガード条件で「完済」状態へ遷移する判定に誤りがある。</p></div>
<p class="ask">リスクを軽減するテスト技法の組み合わせとして、最も適切なものはどれか。</p>`,
opts:[
 'R1：ランダムテスト（ガイドなし）　R2：CRUDテスト',
 'R1：デシジョンテーブルテスト　R2：メタモルフィックテスト',
 'R1：クラウドテスト　R2：組み合わせテスト（ペアワイズカバレッジ）',
 'R1：シナリオベースドテストとラウンドトリップカバレッジの組み合わせ　R2：状態遷移テストのガード条件への境界値分析の適用'],
ans:[3],
exp:`欠陥検出の効率性と有効性を高めるため、テスト技法はよく組み合わされる。シナリオベースドテストをラウンドトリップカバレッジと組み合わせると、周期的なビジネスプロセス活動特有のリスクに対応できる。BVAは状態遷移テストにおけるガード条件に使用できる（3.5.1項）。`,
why:['ランダムテストは周期的なプロセスの状態引き継ぎを体系的に狙えない。CRUDはエンティティのライフサイクルの検証で、ガード条件の境界には不向き。','R1は状態に依存する周期的な振る舞いで、状態を持たないルールの技法は合わない。','クラウドテストは体系的にループを狙う技法ではない。R2は単一条件の境界の問題。','正解。']},

{lo:'TA-3.5.1',k:4,pts:3,
stem:`<p>自動車の電子制御ユニット（ECU）向けソフトウェアのテストを計画している。テスト対象にはISO 26262のASIL Cが割り当てられており、標準はASILに応じて同値分割法、境界値分析、エラー推測などの使用を要求している。顧客との契約では、顧客が提供する走行シナリオ一式による受け入れ基準が定められている。TAチームはドメインテストを学び始めたばかりで、まだ習熟していない。</p>
<p class="ask">テスト技法の選択として、最も適切なものはどれか。</p>`,
opts:[
 'スケジュールが厳しいため、経験ベースのテスト技法だけを適用する。',
 '大量のテストデータを素早く用意できるランダムテストだけを適用する。',
 '標準の要求に従って同値分割法・境界値分析・エラー推測を適用し、受け入れには顧客提供のシナリオによるシナリオベースドテストを用いる。ドメインテストは習熟するまで重要なテスト課題には使わない。',
 '効果が高いので、習熟していなくてもドメインテストを最も重要な制御ロジックに適用する。'],
ans:[2],
exp:`テスト技法の選択には、規制要件（例：ISO 26262はASILに応じて特定の技法を要件とする）、顧客および契約要件（顧客提供のシナリオによる受け入れ基準はシナリオベースドテストを示唆する）、テスト担当者の知識と経験（精通していない技法を重要なテスト課題に使うことは推奨されない）などが影響する（3.5.1項）。`,
why:['規制要件で求められる技法を満たさない。','規制要件も契約要件も満たさない。','正解。','精通していない技法を重要なテスト課題に使うことは推奨されない。']},

{lo:'TA-3.5.2',k:2,pts:1,
stem:`<p class="ask">テスト設計を自動化する利点として、シラバスに挙げられているものはどれか。</p>`,
opts:[
 'テストモデルの保守工数がゼロになる。',
 'テストのためのモデリングによってテストベースの品質を評価でき、欠陥予防に役立つ。',
 'モデルに示されていないテスト条件も、ツールが自動的に補ってカバーする。',
 'ステークホルダーは、どのようなテストモデルでも必ず容易に理解できる。'],
ans:[1],
exp:`テスト設計自動化の利点には、欠陥予防（テストのためのモデリングはテストベースの品質を評価する効果的な方法）、対応能力の拡張、わかりやすさの向上、繰り返し作業の削減、メンテナンス工数の削減、テストウェアの欠陥削減、コラボレーションやトレーサビリティの強化などがある（3.5.2項）。`,
why:['保守対象がテストモデルだけになるという利点はあるが、ゼロにはならない。モデルの保守工数の過小評価はリスク。','正解。','モデルに示されていないテスト条件の見落としはリスクとして挙げられている。','ステークホルダーがモデルを理解しにくいと感じることはリスクとして挙げられている。']},

/* ===== 第4章 ===== */
{lo:'TA-4.1.1',k:2,pts:1,
stem:`<p class="ask">機能適合性の副特性のテストに関する記述として、正しいものはどれか。</p>`,
opts:[
 '機能完全性はシステムテスト以降でしか扱えないため、要件仕様のレビューやユーザーストーリーの議論では対処しない。',
 '機能適切性テストに最も適しているのは、デシジョンテーブルテストのようなルールに基づくテスト技法である。',
 '機能完全性の達成度合いを決めるうえで、テストベース・テスト条件・テストケース間のトレーサビリティは関係しない。',
 '機能正確性テストは、シフトレフトの観点から、その多くをコンポーネントテストとコンポーネント統合テストで行うべきである。'],
ans:[3],
exp:`機能正確性はどのテストレベルでもテストできるが、シフトレフトの観点からは、ほとんどの機能正確性テストはコンポーネントテストとコンポーネント統合テストで行うべきである。TAはそれらのテストレベルに責任を持たない場合でも貢献すべきである（4.1節）。`,
why:['機能完全性は、要件仕様のレビューやユーザーストーリーの共同執筆時の議論で、できるだけ早い段階で対処すべき。','機能適切性テストには探索的テストやコラボレーションベースのテストが最も適している。','トレーサビリティは、達成された機能完全性のレベルを決定する際に不可欠。','正解。']},

{lo:'TA-4.2.1',k:2,pts:1,
stem:`<p>自治体が、高齢者を主な利用者とする行政手続きのWebサービスを開発している。</p>
<p class="ask">アクセシビリティテストへのTAの貢献として、最も適切なものはどれか。</p>`,
opts:[
 '使用コンテキストを解析し、求められるWCAGの適合レベル（A、AA、AAA）と、意図するターゲットグループの具体的なニーズを識別する。',
 'アクセシビリティは使用性に含まれないため、TAの貢献範囲外とする。',
 '適合レベルはどのサービスでも常にAで十分なので、レベルの検討は省略する。',
 'WCAGは特定の国の国内法なので、自治体のサービスには適用できない。'],
ans:[0],
exp:`アクセシビリティテストの一般的なテスト目的は標準への適合の検証である。WCAGはA、AA、AAAの3つの適合レベルを定義する国際標準である。TAは使用コンテキストを解析することで、求められる適合レベルとターゲットグループの具体的なニーズを識別できる（4.2節）。`,
why:['正解。','アクセシビリティは使用性テストで評価する点の一つ。','求められる適合レベルは使用コンテキストによって異なる。','WCAGは国際標準。']},

{lo:'TA-4.3.1',k:2,pts:1,
stem:`<p>モバイルアプリをv2からv3へアップデートする。v3では新たにカメラの利用権限を要求する。</p>
<p class="ask">TAが焦点を当てるインストール性テストの目的として、最も適切なものはどれか。</p>`,
opts:[
 'アプリのソースコードの拡張性を評価する。',
 'アップデート後にアプリが正しく動作するか、および新たに要求するカメラ権限を許可した場合・拒否した場合の振る舞いを確認する。',
 '同じ端末上で動作する他のアプリとのメモリ競合を検証する。',
 'アップデートのインストーラーがエラーなく最後まで動作することだけを確認する。'],
ans:[1],
exp:`TAが焦点を当てるインストール性テストの目的には、さまざまな環境パラメーター下でのインストール手順の検証、インストールまたはアップデート後にテスト対象が正しく動作するかを判断するテスト、インストールのしやすさのチェック、特にモバイルアプリケーションの権限関連の動作のテストがある（4.3節）。`,
why:['拡張性は技術的側面に関連し、TAの焦点ではない。','正解。','共存性テストであり、TTAシラバスで扱われる。','インストール性テストは単にインストール手順が完了まで動くかをチェックするだけではない。']},

{lo:'TA-4.4.1',k:2,pts:1,
stem:`<p class="ask">相互運用性テストで検出できる欠陥の例として、最も適切なものはどれか。</p>`,
opts:[
 '同じホスト上で動作する他のシステムとのリソース競合',
 '交換されたデータの解釈や使用の誤り、通信フローやプロトコルの誤り',
 '高負荷時の応答時間の劣化',
 'ソースコードの命名規約違反'],
ans:[1],
exp:`相互運用性テストは、データ交換のためのデータ変換、交換されたデータの解釈または使用、通信フローとプロトコル、標準への準拠、エンドツーエンドの機能性、設計文書の欠陥を検出できる（4.4節）。`,
why:['共存性テストで扱う欠陥。','正解。','性能効率性のテストで扱う欠陥。','静的解析などで扱う欠陥。']},

/* ===== 第5章 ===== */
{lo:'TA-5.1.1',k:2,pts:1,
stem:`<p class="ask">TAが欠陥予防に貢献する方法として、最も適切なものはどれか。</p>`,
opts:[
 'ふりかえりに参加し、より効果的なテスト技法の使用や、偽陽性・偽陰性の結果を減らすためのテストデータとテスト環境の改善など、改善の可能性を識別する。',
 '欠陥の再発を防ぐため、欠陥の修正を開発担当者に代わって自ら行う。',
 '欠陥データは統計分析に向かないため、詳細な欠陥データは収集しない。',
 '根本原因分析は開発担当者だけが行うもので、TAは是正措置を提案しない。'],
ans:[0],
exp:`TAは、リスク分析への参加、要件・モデル・仕様書のレビュー、ふりかえりへの参加、欠陥データの収集と評価、根本原因分析への参加と是正措置の提案などで欠陥予防に貢献できる（5.1節）。`,
why:['正解。','欠陥の修正はTAの貢献として挙げられていない。','詳細な欠陥データの収集は、欠陥の分類と統計分析を可能にし、根本原因分析とプロセス改善を支援する。','TAは根本原因分析に参加し、是正措置を提案する。']},

{lo:'TA-5.2.1',k:3,pts:2,
stem:`<p>クーポン機能の仕様書には次の記述がある。</p>
<div class="box"><p>・管理者は管理画面でクーポンを発行する。</p><p>・会員はマイページで保有クーポンの一覧と内容を閲覧できる。</p><p>・会員が決済でクーポンを使うと、クーポンの状態は「使用済」に更新される。</p><p>・管理者は管理画面でクーポンの割引率を変更できる。</p></div>
<p class="ask">TAがこの仕様からCRUDマトリクスを作成した場合に検出できる仕様の不正として、最も適切なものはどれか。</p>`,
opts:[
 'クーポンエンティティを削除（失効）する操作が記述されておらず、エンティティのライフサイクルが不完全である。',
 '「使用済」状態への遷移が非決定的である。',
 '割引率の境界値で同値パーティションが重複している。',
 'クーポンエンティティにはC、R、U、Dのすべての操作がそろっており、不正はない。'],
ans:[0],
exp:`CRUDマトリクスなどの振る舞いに基づくモデルにより、TAは不完全または一貫性のないエンティティのライフサイクルなどを検出できる（5.2.1項）。仕様にはC（発行）、R（閲覧）、U（使用済への更新、割引率変更）はあるが、D（削除・失効）がない。`,
why:['正解。','CRUDマトリクスからは状態遷移の非決定性は判断できず、記述上も非決定的な遷移はない。','割引率の範囲は仕様に記述されておらず、CRUDマトリクスで検出する種類の欠陥でもない。','D操作が欠落している。']},

{lo:'TA-5.2.1',k:3,pts:2,pick:2,
stem:`<p>テストベースに含まれる、経費支払業務のアクティビティ図の内容は次のとおりである。</p>
<div class="box"><p>開始 → 申請 → 判定ノード：［金額 &gt; 100,000円］部長承認／［金額 &lt; 100,000円］課長承認 → マージ</p>
<p>→ フォーク：「会計システム登録」と「予算残高更新」を並行実行</p>
<p>→「会計システム登録」の完了後、ジョインを経ずに「支払処理」を実行 → 終了</p>
<p>（「予算残高更新」の完了後は、そのまま終了ノードへ進む）</p></div>
<p class="ask">このモデルを分析して検出できる欠陥はどれか。<span class="pick2">2つ選べ</span></p>`,
opts:[
 '金額がちょうど100,000円の場合のガード条件がなく、判定ノードのガード条件が不完全である。',
 '「予算残高更新」の完了を待たずに「支払処理」が実行されうるため、並列フローの同期が欠落している。',
 '判定ノードが2つの分岐を持つこと自体が欠陥である。',
 'スイムレーンが使われていないこと自体が欠陥である。',
 'フォークノードを使って並行性を表現していること自体が欠陥である。'],
ans:[0,1],
exp:`アクティビティ図の欠陥の例には、アクションの欠落・到達不能・行き止まり、アクションの順序の誤り、判定ノードにおける誤った・排他的でない・不完全なガード条件、意図しない動作につながる同期ポイントの欠落や並列フローの不適切な同期がある（5.2.1項）。`,
why:['正解。','正解。','分岐を持つのは判定ノードの通常の使い方。','スイムレーンは要素の一つだが、使わないこと自体は欠陥ではない。','アクティビティ図はフローチャートの記法を拡張して並行性をモデリングできる。']},

{lo:'TA-5.2.2',k:3,pts:2,
stem:`<p>高齢者向け健康管理アプリの要件仕様をレビューする。レビューアには「75歳のシニアユーザー」「家族の介護者」「システム管理者」をそれぞれペルソナで記述して割り当て、各自がその立場に基づいてテストベースの特定の側面に集中することで、包括的なカバレッジを確保しつつ指摘の重複を避けたい。派生する作業成果物の作成までは求めない。</p>
<p class="ask">最も適切なレビュー技法はどれか。</p>`,
opts:['ロールベースドレビュー','パースペクティブベースドリーディング','シナリオベースドレビュー','アドホックレビュー'],
ans:[0],
exp:`ロールベースドレビューでは、レビューアに特定の役割や責任を割り当てる。典型的な役割は特定のエンドユーザーのタイプや組織内の役割に基づき、ペルソナで記述できる。役割に基づいて責任を分担することで、各自が特定の側面に集中し、包括的なカバレッジを確保しながら不正の重複を避けられる（5.2.2項）。`,
why:['正解。','重複は減らせるが、レビュー対象から派生する作業成果物を作ろうとすることが求められる点が特徴であり、この状況と合わない。','ユースケースなどのシナリオ形式のテストベースで「ドライラン」を行う技法。','構造化されたプロセスがなく、重複が大量に発生しうる。']},

{lo:'TA-5.2.2',k:3,pts:2,

{lo:'TA-5.3.2',k:2,pts:1,
stem:`<p class="ask">欠陥分類法に関する記述として、正しいものはどれか。</p>`,
opts:[

exp:`IEEE 1044はソフトウェア不正を分類するための標準で、故障と欠陥の分類のためのコア属性を提供する。ODCは欠陥の報告時と修正時の両方で属性を収集する。欠陥は品質モデル（ISO/IEC 25010、FURPSなど）にマッピングすることもできる。TAは欠陥分類の標準化について所属組織を支援すべきである（5.3.2項）。`,

];
Q.forEach((q,i)=>{ q.no=i+1; q.ch=+q.lo.split('-')[1][0]; });
const TOTAL = Q.reduce((s,q)=>s+q.pts,0); // 78
const PASS = 51;

/* ---------------- 状態 ---------------- */
let S = null, tick = null, confirmOpen = false, filter = 'all';
const $ = s => document.querySelector(s);
const main = $('#main'), hdr = $('#hdr');
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function loadSaved(){ try{ const v = JSON.parse(localStorage.getItem(KEY)); return v && v.v===1 ? v : null; }catch(e){ return null; } }
function clearSaved(){ try{ localStorage.removeItem(KEY); }catch(e){} }
function ids(){ return S.subset || Q.map((_,i)=>i); }
function isRight(i){ const a=(S.ans[i]||[]).slice().sort().join(','); return a!=='' && a===Q[i].ans.slice().sort().join(','); }
function answered(i){ const q=Q[i], a=S.ans[i]||[]; return a.length === (q.pick||1); }
function remaining(){ return S.mins ? Math.max(0, S.start + S.mins*60000 - Date.now()) : null; }
function fmt(ms){ const t=Math.ceil(ms/1000), h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60; return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s).padStart(2,'0'); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------------- 開始画面 ---------------- */
function renderStart(){
  stopTick(); hdr.innerHTML='';
  const saved = loadSaved();
  const chRows = [1,2,3,4,5].map(c=>{
    const qs=Q.filter(q=>q.ch===c);
    const k=[2,3,4].map(n=>qs.filter(q=>q.k===n).length);
    return `<tr><td>${CH[c]}</td><td class="c mono">${qs.length}</td><td class="c mono">${k[0]||'–'}</td><td class="c mono">${k[1]||'–'}</td><td class="c mono">${k[2]||'–'}</td><td class="c mono">${qs.reduce((s,q)=>s+q.pts,0)}</td></tr>`;
  }).join('');
  main.innerHTML = `<section class="start">
    <div class="cover">
      <div class="eyebrow">CTAL-TA SYLLABUS V4.0.J01 準拠 ／ 模擬試験 第2回</div>
      <h1>Advanced Level テストアナリスト<br>本番形式 模擬試験 第2回</h1>
      <p>ISTQB Exam Structure Tables（v1.16）のLO別出題数・配点にそろえた45問です。K2は1点、K3は2点、K4は3点。「2つ選べ」の問題は両方正解で得点になります。</p>
      <dl class="specs">
        <div><dt>問題数</dt><dd>45<small>問</small></dd></div>
        <div><dt>満点</dt><dd>${TOTAL}<small>点</small></dd></div>
        <div><dt>合格点</dt><dd>${PASS}<small>点（65%）</small></dd></div>
        <div><dt>試験時間</dt><dd>120<small>分</small></dd></div>
      </dl>
      ${saved ? `<div class="resume"><p>${saved.done?'前回の採点結果が保存されています。':'解答途中の試験があります（'+(saved.mode==='exam'?'本番モード':'学習モード')+'、'+Object.keys(saved.ans).length+'問解答済み）。'}</p><button class="btn primary" data-act="resume">${saved.done?'結果を見る':'続きから再開'}</button><button class="btn ghost" data-act="discard">破棄する</button></div>`:''}
    </div>
    <div class="grid2">
      <div class="panel">
        <h2>出題範囲と配点</h2>
        <div class="tblwrap"><table class="tbl"><thead><tr><th>章</th><th class="c">問</th><th class="c">K2</th><th class="c">K3</th><th class="c">K4</th><th class="c">点</th></tr></thead><tbody>${chRows}
        <tr><th>合計</th><th class="c mono">45</th><th class="c mono">18</th><th class="c mono">21</th><th class="c mono">6</th><th class="c mono">${TOTAL}</th></tr></tbody></table></div>
        <p class="note">配分は公式の試験構造表に基づきます。各問題がどのLOに対応するかは、採点後の解説に表示されます。</p>
      </div>
      <div class="panel">
        <h2>受験の設定</h2>
        <div class="choice" role="radiogroup" aria-label="モード">
          <label><input type="radio" name="mode" id="m-exam" value="exam" checked><div><b>本番モード</b><span>制限時間あり。解答と解説は終了後にまとめて表示します。</span></div></label>
          <label><input type="radio" name="mode" id="m-study" value="study"><div><b>学習モード</b><span>時間制限なし。1問ごとに正誤と解説を確認できます。</span></div></label>
        </div>
        <div class="choice" id="timeopt" role="radiogroup" aria-label="試験時間">
          <label><input type="radio" name="mins" id="t-120" value="120" checked><div><b>120分（標準）</b><span>母国語での受験時間</span></div></label>
          <label><input type="radio" name="mins" id="t-150" value="150"><div><b>150分（＋25%）</b><span>非母国語で受験する場合の延長時間</span></div></label>
        </div>
        <div class="row"><button class="btn primary" data-act="begin">試験を開始する</button></div>
        <p class="note">非公式の模擬問題です。解答状況はこのブラウザーにだけ保存されます。</p>
      </div>
    </div>
  </section>`;
  const sync=()=>{ $('#timeopt').hidden = $('#m-study').checked; };
  main.querySelectorAll('input[name=mode]').forEach(r=>r.addEventListener('change',sync));
}

/* ---------------- 試験画面 ---------------- */
function begin(mode, mins, subset){
  S = {v:1, mode, mins: mode==='exam'?mins:0, start:Date.now(), ans:{}, flag:{}, rev:{}, pos:0, done:false, end:null, subset:subset||null};
  confirmOpen=false; save(); renderExam();
}
function startTick(){
  stopTick();
  if(!S.mins) return;
  tick = setInterval(()=>{
    const r=remaining();
    const el=$('#clock'); if(el){ el.textContent=fmt(r); el.parentElement.classList.toggle('warn', r<600000); }
    if(r<=0){ finish(); }
  },1000);
}
function stopTick(){ if(tick){ clearInterval(tick); tick=null; } }

function renderHeader(){
  const list=ids(), n=list.filter(answered).length;
  hdr.innerHTML = `<span class="prog">解答済み <b class="mono">${n}</b> / ${list.length}</span>`+
    (S.mins ? `<div class="timer${remaining()<600000?' warn':''}"><small>残り時間</small><span class="mono" id="clock">${fmt(remaining())}</span></div>` : `<span class="chip">学習モード</span>`);
}

function renderExam(){
  renderHeader(); startTick();
  const list=ids(), i=list[S.pos], q=Q[i], a=S.ans[i]||[];
  const study=S.mode==='study', shown=study && S.rev[i];
  const optsHtml = q.opts.map((t,k)=>{
    let cls='opt';
    if(a.includes(k)) cls+=' sel';
    if(shown){ if(q.ans.includes(k)) cls+=' right'; else if(a.includes(k)) cls+=' wrong'; }
    return `<li><button class="${cls}" data-opt="${k}" ${shown?'disabled':''} aria-pressed="${a.includes(k)}"><span class="bubble">${L[k]}</span><span class="t">${t}</span></button></li>`;
  }).join('');
  const cells = list.map((qi,p)=>{
    let c='cell'; if(answered(qi)) c+=' ans'; if(S.flag[qi]) c+=' flg'; if(p===S.pos) c+=' cur';
    if(study && S.rev[qi]) c+= isRight(qi)?' ok':' ng';
    return `<button class="${c}" data-go="${p}" aria-label="問${Q[qi].no}">${Q[qi].no}</button>`;
  }).join('');
  const unanswered = list.filter(x=>!answered(x)).length;
  main.innerHTML = `<section class="exam">
    <article class="qcard" aria-live="polite">
      <div class="qhead"><span class="qno">問${q.no}</span><span class="chip pts">${q.pts}点</span>
        ${shown?`<span class="chip lo">${q.lo}</span><span class="chip">K${q.k}</span>`:''}
        ${S.flag[i]?'<span class="chip flagc">見直し</span>':''}</div>
      <div class="stem">${q.stem}</div>
      <ul class="opts">${optsHtml}</ul>
      <p class="hint" id="hint"></p>
      ${shown?explainHtml(i):''}
      <div class="nav">
        <div class="row"><button class="btn" data-act="prev" ${S.pos===0?'disabled':''}>← 前の問題</button>
        <button class="btn ${S.flag[i]?'flagged':''}" data-act="flag">${S.flag[i]?'見直しを解除':'見直しに印'}</button></div>
        <div class="row">${study && !shown ? `<button class="btn" data-act="reveal" ${answered(i)?'':'disabled'}>解答を確認</button>`:''}
        ${S.pos<list.length-1?`<button class="btn primary" data-act="next">次の問題 →</button>`:`<button class="btn primary" data-act="ask-finish">${study?'結果を見る':'解答を終了する'}</button>`}</div>
      </div>
    </article>
    <aside class="sheet" aria-label="解答状況">
      <h3>解答状況<span>${list.length-unanswered}/${list.length}</span></h3>
      <div class="cells">${cells}</div>
      <div class="legend"><span><i class="a"></i>解答済み</span><span><i class="f"></i>見直し</span><span><i></i>未解答</span></div>
      ${confirmOpen ? `<div class="confirm"><p>${unanswered?`<b>未解答が${unanswered}問</b>あります。`:'すべて解答済みです。'}${S.flag && list.some(x=>S.flag[x])?` 見直しの印が${list.filter(x=>S.flag[x]).length}問に付いています。`:''}このまま採点しますか？</p><div class="row"><button class="btn danger" data-act="finish">採点する</button><button class="btn" data-act="cancel">戻る</button></div></div>`
        : `<button class="btn" data-act="ask-finish">${study?'結果を見る':'解答を終了して採点'}</button>`}
      <button class="btn ghost" data-act="home">トップへ戻る（中断）</button>
    </aside>
  </section>`;
}

function explainHtml(i){
  const q=Q[i], ok=isRight(i), a=S.ans[i]||[];
  return `<div class="explain">
    <div class="verdict ${ok?'ok':'ng'}">${ok?'○ 正解':'× 不正解'}<span class="chip">正解：${q.ans.map(k=>L[k]).join('、')}</span>${a.length?`<span class="chip">あなたの解答：${a.slice().sort().map(k=>L[k]).join('、')}</span>`:'<span class="chip">未解答</span>'}</div>
    <p>${q.exp}</p>
    <ul class="why">${q.why.map((w,k)=>`<li class="${q.ans.includes(k)?'ok':''}"><b>${L[k]}</b><span>${w}</span></li>`).join('')}</ul>
  </div>`;
}

function choose(k){
  const list=ids(), i=list[S.pos], q=Q[i];
  if(S.mode==='study' && S.rev[i]) return;
  let a=(S.ans[i]||[]).slice();
  if((q.pick||1)===1){ a=[k]; }
  else if(a.includes(k)){ a=a.filter(x=>x!==k); }
  else if(a.length>=q.pick){ const h=$('#hint'); if(h) h.textContent='この問題は2つまで選べます。選び直す場合は、選択済みの選択肢をもう一度押して解除してください。'; return; }
  else a.push(k);
  S.ans[i]=a; save(); renderExam();
}
function go(p){ const list=ids(); S.pos=Math.max(0,Math.min(list.length-1,p)); confirmOpen=false; save(); renderExam(); window.scrollTo({top:0}); }
function finish(){
  stopTick(); S.done=true; S.end=Date.now(); confirmOpen=false; filter='all'; save(); renderResult(); window.scrollTo({top:0});
}

/* ---------------- 結果画面 ---------------- */
function renderResult(){
  stopTick();
  const list=ids(), full=!S.subset;
  const got=list.reduce((s,i)=>s+(isRight(i)?Q[i].pts:0),0);
  const max=list.reduce((s,i)=>s+Q[i].pts,0);
  const nRight=list.filter(isRight).length;
  const pass = got>=PASS;
  const used = S.end && S.start ? S.end - S.start : 0;
  hdr.innerHTML = `<span class="chip">${full?'採点結果':'解き直し結果'}</span>`;
  const bar=(lbl,g,m)=>{ const pct=m?g/m*100:0; return `<div class="barrow"><span class="lbl">${lbl}</span><span class="num">${g} / ${m}</span><div class="track"><div class="fill${pct<65?' low':''}" style="width:${pct}%"></div></div></div>`; };
  const chBars=[1,2,3,4,5].map(c=>{ const xs=list.filter(i=>Q[i].ch===c); if(!xs.length) return ''; return bar(CH[c], xs.reduce((s,i)=>s+(isRight(i)?Q[i].pts:0),0), xs.reduce((s,i)=>s+Q[i].pts,0)); }).join('');
  const kBars=[2,3,4].map(k=>{ const xs=list.filter(i=>Q[i].k===k); if(!xs.length) return ''; return bar(`K${k}（${k===2?'理解':k===3?'適用':'分析'}・${xs[0]?Q[xs[0]].pts:''}点問題）`, xs.reduce((s,i)=>s+(isRight(i)?Q[i].pts:0),0), xs.reduce((s,i)=>s+Q[i].pts,0)); }).join('');
  const wrong=list.filter(i=>!isRight(i));
  const shownList = list.filter(i=> filter==='all' || (filter==='ng' && !isRight(i)) || (filter==='flag' && S.flag[i]));
  main.innerHTML = `<section class="result">
    <div class="scorecard">
      <div class="score">
        <span class="eyebrow">得点</span>
        <span class="big">${got}<small> / ${max}点</small></span>
        ${full?`<span class="stamp ${pass?'pass':'fail'}">${pass?'合格':'不合格'}</span>`:''}
      </div>
      <div class="meter">
        ${full?`<div class="track" style="margin-top:28px"><div class="fill" style="width:${got/max*100}%"></div><div class="cut" style="left:${PASS/max*100}%"></div><span class="cutlbl" style="left:${PASS/max*100}%">合格点 ${PASS}</span></div>`:''}
        <div class="facts"><span>正答 <b>${nRight}</b> / ${list.length}問</span><span>得点率 <b>${Math.round(got/max*100)}%</b></span>${full&&S.mode==='exam'?`<span>所要時間 <b>${fmt(used)}</b></span>`:''}${full&&!pass?`<span>合格まで <b>${PASS-got}</b>点</span>`:''}</div>
        <div class="row">${wrong.length?`<button class="btn primary" data-act="retry">間違えた${wrong.length}問を学習モードで解き直す</button>`:''}<button class="btn" data-act="home">トップへ戻る</button></div>
      </div>
    </div>
    <div class="grid2">
      <div class="panel"><h2>章別の得点</h2><div class="bars">${chBars}</div><p class="note">赤いバーは得点率65%未満の章です。</p></div>
      <div class="panel"><h2>Kレベル別の得点</h2><div class="bars">${kBars}</div><p class="note">K3・K4は配点が大きく、合否を左右します。</p></div>
    </div>
    <div class="panel">
      <div class="row" style="justify-content:space-between"><h2>解答と解説</h2>
      <div class="filters" role="group" aria-label="絞り込み">
        <button class="btn" data-filter="all" aria-pressed="${filter==='all'}">すべて（${list.length}）</button>
        <button class="btn" data-filter="ng" aria-pressed="${filter==='ng'}">不正解（${wrong.length}）</button>
        <button class="btn" data-filter="flag" aria-pressed="${filter==='flag'}">見直し印（${list.filter(i=>S.flag[i]).length}）</button></div></div>
      <div class="review">${shownList.map(i=>reviewItem(i)).join('') || '<p class="note">該当する問題はありません。</p>'}</div>
    </div>
  </section>`;
}
function reviewItem(i){
  const q=Q[i], ok=isRight(i), a=S.ans[i]||[];
  const title = q.stem.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  const opts = q.opts.map((t,k)=>{ let c='opt'; if(a.includes(k)) c+=' sel'; if(q.ans.includes(k)) c+=' right'; else if(a.includes(k)) c+=' wrong'; return `<li><div class="${c}"><span class="bubble">${L[k]}</span><span class="t">${t}</span></div></li>`; }).join('');
  return `<details class="ritem"><summary><span class="mk ${ok?'ok':'ng'}">${ok?'○':'×'}</span><span class="rno">問${q.no}</span><span class="rtitle">${esc(title)}</span><span class="chip lo">${q.lo}・K${q.k}・${q.pts}点</span></summary>
    <div class="rbody"><div class="stem">${q.stem}</div><ul class="opts">${opts}</ul>${explainHtml(i)}</div></details>`;
}

/* ---------------- イベント ---------------- */
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-act],[data-opt],[data-go],[data-filter]'); if(!t) return;
  if(t.dataset.opt!==undefined){ choose(+t.dataset.opt); return; }
  if(t.dataset.go!==undefined){ go(+t.dataset.go); return; }
  if(t.dataset.filter){ filter=t.dataset.filter; renderResult(); return; }
  const act=t.dataset.act;
  if(act==='begin'){ const mode=$('#m-study').checked?'study':'exam'; begin(mode, $('#t-150').checked?150:120); window.scrollTo({top:0}); }
  else if(act==='resume'){ S=loadSaved(); if(!S) return renderStart(); if(S.done) renderResult(); else if(S.mins && remaining()<=0) finish(); else renderExam(); }
  else if(act==='discard'){ clearSaved(); renderStart(); }
  else if(act==='prev') go(S.pos-1);
  else if(act==='next') go(S.pos+1);
  else if(act==='flag'){ const i=ids()[S.pos]; S.flag[i]=!S.flag[i]; save(); renderExam(); }
  else if(act==='reveal'){ const i=ids()[S.pos]; S.rev[i]=true; save(); renderExam(); }
  else if(act==='ask-finish'){ if(S.mode==='study' && ids().every(i=>S.rev[i])) return finish(); confirmOpen=true; renderExam(); const c=$('.confirm'); if(c) c.scrollIntoView({block:'nearest'}); }
  else if(act==='cancel'){ confirmOpen=false; renderExam(); }
  else if(act==='finish') finish();
  else if(act==='retry'){ const wrong=ids().filter(i=>!isRight(i)); begin('study',0,wrong); window.scrollTo({top:0}); }
  else if(act==='home'){ save(); renderStart(); window.scrollTo({top:0}); }
});
document.addEventListener('keydown', e=>{
  if(!S || S.done || !$('.qcard') || e.altKey || e.ctrlKey || e.metaKey) return;
  if(e.target.closest('input,textarea')) return;
  const k=e.key.toLowerCase(), idx=L.indexOf(k), q=Q[ids()[S.pos]];
  if(idx>-1 && idx<q.opts.length){ choose(idx); e.preventDefault(); }
  else if(e.key==='ArrowRight'){ go(S.pos+1); }
  else if(e.key==='ArrowLeft'){ go(S.pos-1); }
});

renderStart();
</script>
